-6-B02-A04","t":"يفحص المعلم مهمة عددية أخرى في المهارة نفسها مع تفسير مستقل، ويقارن معنى الحل وصحته ومعقوليته والمساعدة. يقرر ما يعاد تعليمه وما يمكن توسيعه ويتابع بقاء المهارة في درس لاحق.","o":"عملان مناسبان ومحك تفسير وقرار تعليم لاحق؛ لا قياس بالسرعة وحدها."}],"2-1-1-7":[{"id":"2-1-1-7-B01-A01","t":"يعد المعلم سؤالًا من مادته يحتاج إلى تحليل أو استنتاج أو تقويم أو حل مشكلة، ويحدد المعرفة اللازمة وما يجعل الإجابة مقنعة من رأي ودليل وتفسير للعلاقة بينهما. ويتيح أكثر من حل إذا سمحت المسألة بذلك.","o":"مهمة ومحك يكشفان التفكير المطلوب، مع تهيئة المعرفة اللازمة."},{"id":"2-1-1-7-B01-A02","t":"ينمذج المعلم كيف يختار الدليل ويبرر الصلة، ثم يفحص الطلاب مصدرًا أو بيانات أو تمثيلًا ويحلون ويشرحون. يقارنون تفسيرين ويبين كل طالب سبب ترجيحه دون اكتفاء بموافقة المجموعة.","o":"حل وتبرير فردي واستعمال دليل، مع بيان مقدار التوجيه."},{"id":"2-1-1-7-B01-A03","t":"يفحص المعلم تفسير الطالب ودليله والعلاقة بينهما، ويقدم سؤالًا يساعده على تعديل نقطة واضحة. ثم يفحص عملًا آخر ليرى جودة التبرير واختيار الحل والحاجة إلى التلميح.","o":"حجة أولى ومعدلة وتفسير لاحق مستقل مع حدود المقارنة."},{"id":"2-1-1-7-B02-A01","t":"يختار المعلم تحديًا يستطيع الطلاب التعامل معه بما يعرفونه، ويدعوهم لأفكار تختلف في معناها لا في كلماتها فقط. ويناقش فائدتها وإمكان تطويرها وما تضيفه في هذا الموقف، دون اختراع معيار رسمي للأصالة.","o":"أفكار متنوعة ومحكات ملاءمة وتطوير مفهومة للطلاب."},{"id":"2-1-1-7-B02-A02","t":"يجرب الطلاب فكرة بنموذج أو تمثيل آمن ويلاحظون ما نفع وما يحتاج تعديلًا. يتيح المعلم إثراءً صفيًا وغير صفي ضمن الموارد القائمة، ويحفظ أثر مساهمة كل طالب ولا يشترط مسابقة.","o":"فكرة أولى ومحاولة اختبار وتعديل سببه ملاحظة أو دليل."},{"id":"2-1-1-7-B02-A03","t":"يراجع المعلم والطلاب جودة الفكرة وفائدتها لمن صممت له، ويطلبون بيان ما تغير ولماذا. يقارن الطالب بديلًا أو يختبر تحسينًا ويبين حدود ما حققه؛ يتابع المعلم التنفيذ المتاح.","o":"نسختا فكرة أو نموذج وسبب تحسين ودليل فائدة وحدود."},{"id":"2-1-1-7-B03-A01","t":"يختار الطلاب بتوجيه المعلم سؤالًا محددًا يناسب العمر والمادة ويمكن الإجابة عنه بمعلومات متاحة أو ملاحظة آمنة. يحددون نوع الدليل وخطوات جمعه دون بيانات شخصية.","o":"سؤال وخطة مختصرة ومصدر أو طريقة ملاحظة تخدمه."},{"id":"2-1-1-7-B03-A02","t":"يعلم المعلم الطلاب فحص صاحب المصدر وتاريخه وصلته بالسؤال، والتمييز بين المعلومة والرأي. وينظم الطلاب ما يجمعونه ويذكرون مصدره، ويفحصون اختلاف المعلومات بدل نسخ النص أو قبول أول نتيجة بحث.","o":"ملاحظات منظمة ونسبة المعلومات لمصادرها وسبب قبولها أو التحفظ عليها."},{"id":"2-1-1-7-B03-A03","t":"يعرض الطالب جوابًا يربطه بالدليل ويشرح كيف جمعه وما لا يسمح باستنتاجه. يناقش المعلم الطريقة والنتيجة ويطلب تصحيحًا عند تجاوز الدليل، ويحفظ الطلاب ما بقي سؤالًا.","o":"نتيجة وتفسير للطريقة وإحالات وحدود؛ عمل فردي يظهر مساهمة الطالب."}],"2-1-1-8":[{"id":"2-1-1-8-B01-A02","t":"يعرض المعلم استجابة لشخصية افتراضية: تسمية الشعور واختيار فعل آمن وطلب مساعدة عند الحاجة. يتدرب الطلاب بوسيلة تواصل مناسبة، ثم يناقشون أثر الخيار دون كشف قصص خاصة.","o":"ممارسة فعل محدد وتغذية راجعة وصفية مع مقدار التذكير."},{"id":"2-1-1-8-B02-A02","t":"ينظم المعلم مهمة جماعية تحتاج إلى مساهمة الطلاب، مع أدوار يتبادلونها. ويوضح الإصغاء والطلب والاختلاف باحترام، ويتابع ممارسة كل طالب ويتيح له وسيلة مناسبة للمساهمة.","o":"عمل تعاوني وملاحظة مساهمة وتواصل لكل طالب بالوسيلة الملائمة."},{"id":"2-1-1-8-B02-A03","t":"يراجع الطلاب مع المعلم موقف التعاون: ما الذي ساعد على الفهم وما الذي سيغيرونه في المحاولة المقبلة. يقدم المعلم ملاحظة محددة ويتيح ممارسة لاحقة، ويلاحظ جودة الحوار وتقليل التذكير.","o":"ملاحظة أولى ومراجعة وممارسة لاحقة مع أثر تعديل في التواصل."}],"2-1-1-9":[{"id":"2-1-1-9-B01-A03","t":"ينفذ الطلاب المهمة ويختارون ضمن حدودها ويجربون، ويقدم المعلم تغذية تصف ما تحقق وخطوة التحسين. يتيح إعادة المحاولة ويلاحظ الجهد والفهم وطلب المساعدة دون ترتيب علني أو مدح صفة ثابتة.","o":"محاولة وتعديل من التغذية الراجعة وملاحظة مثابرة، مع تفسير الطالب لعمله."},{"id":"2-1-1-9-B01-A04","t":"يقارن المعلم خبرة الطلاب ومشاركتهم وأعمالهم واستمرار محاولتهم في تعلم لاحق، ويتابع من لم يستفد. يعدل التحدي أو معنى المهمة أو الدعم وفق الأدلة، مع إبقاء العوامل الأخرى واحتمال عدم وضوح السبب.","o":"رأي اختياري وعمل لاحق وملاحظة استجابة لدى فئات مختلفة وقرار تعديل."}],"2-2-1-1":[{"id":"2-2-1-1-B02-A02","t":"يختار المعلم أداة تكشف الحاجة أثناء التعلم ويحدد سبب ملاءمتها. يوظف تقويمًا ذاتيًا أو أقرانًا أو أداءً أو مشروعًا أو ملفًا بحسب الحاجة؛ لا يفرضها كلها. يجمع أداءً وملاحظة يبينان ما يعرفه المتعلم وما يحتاجه.","o":"نتيجة مفيدة عن الحاجة؛ تنوع الأسماء أو جمع ملف أعمال دون تفسير ليس دليلًا كافيًا."},{"id":"2-2-1-1-B03-A02","t":"يطبق المعلم الأداة في ظروف تساعد على قراءة الأداء المطلوب، ويحفظ الأعمال وتاريخها. ويقوّمها بالمعايير المحددة، ويناقش ما يختلف في تقديره ليتحقق من اتساق التطبيق، دون افتراض مراجع مستقل أو درجة رسمية جديدة.","o":"نتائج ختامية يمكن تفسيرها ومحك يطبق باتساق؛ اختلاف المصححين يعالج من الأداء لا من المتوسط فقط."}],"2-2-1-2":[{"id":"2-2-1-2-B01-A03","t":"يطبق المعلم الأدوات المناسبة ويجمع أعمالًا يعرف أصحابها وما تقيسه من تعلم. وإذا بقي ناتج بلا أداء يكشفه، يستكمل فحصه في مهمة قائمة تصلح لذلك أو يبين ما يتعذر، دون إنشاء اختبار مكرر تلقائيًا.","o":"لكل ناتج مفحوص أداء قابل للفحص أو فجوة معلنة؛ الخطة أو المهمة غير المنفذة لا تثبت التقويم."}],"2-2-1-3":[{"id":"2-2-1-3-B02-A02","t":"ينفذ المعلم التدخل في مهمات المادة والطلاب الذين يتولى تعليمهم ويوثق الأداء الفعلي أو تعذر التنفيذ. يفحص إن كان الخلل في التعليم أو الأداة أو التطبيق ويعدل ما تؤيده الأدلة. يحفظ علاقة التعديل بالسبب ولا يسجل التغيير الشكلي نجاحًا أو تقويمًا وظيفيًا.","o":"تعديل أو دعم منفذ مرتبط بالحاجة والسبب المدعوم، مع مخرج يمكن متابعته."},{"id":"2-2-1-3-B02-A03","t":"يعيد المعلم فحص الناتج المستهدف بقدر مناسب من المقارنة ويسجل المساعدة والظروف. يقارن الاستجابة أو عدمها، ولا يستدل من حضور البرنامج على التحسن. يقرر الاستمرار أو تعديل الدعم أو إعادة التشخيص، ويربطه بدورة المتابعة التالية دون إنشاء مهمة تشغيلية.","o":"أداء لاحق وقرار مسند؛ عدم التحسن وتعذر المقارنة يبقيان ظاهرين دون نسبة سببية مؤكدة."}],"2-2-1-4":[{"id":"2-2-1-4-B01-A01","t":"يفحص معلم كل مادة أعمال طلابه على أساس التعلم المطلوب ومعايير تقويمه، ويحدد ما يتقنه الطالب وما يحتاج إلى تحسينه في عمله نفسه. ويقدم ملاحظة يفهمها ويكيف لغتها أو وسيلتها، ويتحقق من الفهم ويحفظ العمل في موضعه بدل تكرار نسخه.","o":"تربط الملاحظة بسطر أو خطوة في عمل الطالب وبمحك معلوم، ويشرح الطالب موضع الإتقان والتحسين؛ إن عجز يُعاد التوضيح ويسجل التعثر."},{"id":"2-2-1-4-B01-A02","t":"يقدم معلم المادة تغذية راجعة منتظمة بعد فرص التقويم المناسبة، ويختار تعليقًا أو شرحًا أو تصحيحًا موجهًا بحسب الحاجة. يحدد خطوة تحسين واضحة يستطيع المتعلم تطبيقها في مادته، مع بيان فرصة التطبيق المتاحة. يطلب من المتعلم توضيح ما سيفعله بعدها، ويعيد التفسير أو يغير الوسيلة إذا لم يفهم الخطوة.","o":"تتضمن التغذية وصف الأداء والخطوة التالية، ويستطيع الطالب ذكر ما سيفعله؛ يحفظ سبب القناة أو الصيغة المختارة."},{"id":"2-2-1-4-B01-A03","t":"يتيح المعلم تعديل العمل أو محاولة أو مهمة لاحقة، ويقارن الأداء الأول واللاحق بمعايير واضحة. ويبين التحسن أو استمرار التعثر أو ما يمنع المقارنة. وعند عدم التحسن يفحص فهم التوجيه والوقت والوصول والمهمة، ويعدل ما تدعمه المعلومات ثم يعيد المتابعة.","o":"أداء أول وتعليق وأداء لاحق منسوبان للطالب والفترة؛ المقارنة معللة، وعدم التحسن محفوظ ويستدعي متابعة مناسبة."}],"3-2-1-1":[{"id":"3-2-1-1-B01-A01","t":"يقوم المعلم بإتاحة موقف يفسر فيه المتعلم معنى قيمة مناسبة وصلتها بتعامل أو قرار، ويتحقق من فهم المعنى بلغته ووسيلته الملائمة.","o":"مواقف فحص ناتج"},{"id":"3-2-1-1-B01-A02","t":"يتيح المعنيون ممارسة واختيارًا يظهران تمثل القيمة، ويحددون دور المتعلم والمساعدة التي يتلقاها، مع فصل تنفيذ البرنامج عن ناتجه.","o":"أدلة أداء طلاب"},{"id":"3-2-1-1-B01-A03","t":"يراجع المعلم فهم الطلاب للقيم والهوية الوطنية وكيف يعبرون عنه في موقف لاحق. فإذا ظهر فهم غير صحيح يوضحه ويناقشه، وإذا فهم الطالب القيمة ولم يلتزم بها في ممارسته يوجهه إلى السلوك المطلوب ويتابع ممارسته؛ فلا يكتفي بإعادة النشاط نفسه.","o":"تحسن ممارسة وفهم"},{"id":"3-2-1-1-B02-A01","t":"يقوم المعلم وصاحب النشاط بإتاحة تعلم مناسب عن الهوية الوطنية، ويطلبان تفسيرًا أو عملًا يبين ما يدركه المتعلم منها.","o":"مهمة تعبير أو ممارسة"},{"id":"3-2-1-1-B02-A02","t":"يشارك المتعلم في مواقف مناسبة ويبين دوره ومعنى ما يمارسه، ويلاحظ المعنيون ما يكشف الاعتزاز في حدود السياق والعمر.","o":"ناتج فردي أو جماعي موثق"},{"id":"3-2-1-1-B02-A03","t":"تراجع المدرسة ظهور الناتج عبر الفئات والمواقف، وتعدل فرص التعلم والتعزيز مع بيان ما لم يشمله الفحص وحدود الحكم.","o":"نتيجة دعم لاحقة"}],"3-2-1-2":[{"id":"3-2-1-2-B01-A01","t":"يقوم المعلم بإتاحة موقف يصف فيه المتعلم ما يستطيع فعله وما يحتاج فيه إلى مساندة، دون مطالبة بإفصاح شخصي خارج غرض التعلم.","o":"مواقف فحص تربوي"},{"id":"3-2-1-2-B01-A02","t":"يتيح المعلم للمتعلم اتخاذ اختيار ومراجعة أدائه وتقبل توجيه مناسب، ويلاحظ ما يظهر من اتجاه نحو ذاته في هذا السياق.","o":"أدلة اتجاه ومشاركة"},{"id":"3-2-1-2-B01-A03","t":"يراجع المعنيون استمرار القرائن ويحددون الدعم المناسب، مع عدم تحويل تعثر مهمة أو استجابة عارضة إلى صفة ثابتة.","o":"استجابة وتقدم"},{"id":"3-2-1-2-B02-A01","t":"يتيح المعلم موقف تعاون أو تعامل يبين فيه المتعلم احترامه للآخرين وطريقة الاستجابة للاختلاف ضمن العمر والفرصة المتاحة.","o":"فرص ملاحظة تعامل"},{"id":"3-2-1-2-B02-A02","t":"يلاحظ صاحب العمل التفاعل ومساهمة المتعلم وتفسيره، ويميز العائق في اللغة أو تنظيم المهمة عن افتراض اتجاه سلبي.","o":"أدلة تعامل متكررة"},{"id":"3-2-1-2-B02-A03","t":"تراجع المدرسة قرائن المواقف وتعدل الدعم أو التنظيم، وتحيل ما يحتاج إلى اختصاص عبر مساره مع حفظ الخصوصية.","o":"ممارسة اجتماعية محسنة"}],"3-2-1-3":[{"id":"3-2-1-3-B01-A01","t":"يحدد المعلم ومسؤول الخدمة الصحية الممارسة التي تتطلبها مرحلة الطلاب وبيئتهم بالرجوع إلى التوجيه الصحي المختص، ويوضحان معناها وطريقة أدائها المناسبة.","o":"ممارسات ومواقف فحص"},{"id":"3-2-1-3-B01-A02","t":"تتيح المدرسة مورد الممارسة وفرصتها وتلاحظ أداء المتعلم، مع تحديد العائق الذي تستطيع معالجته أو رفعه إلى المختص.","o":"ملاحظات ممارسة وعوائق"},{"id":"3-2-1-3-B01-A03","t":"يتابع مسؤول الخدمة الممارسة والدعم وطلب المساعدة المتخصصة، ويتعاون مع الأسرة في خطوة ممكنة، دون تشخيص محلي.","o":"دعم وتهيئة مناسبة"},{"id":"3-2-1-3-B01-A04","t":"تراجع المدرسة قرائن الأداء والاستجابة وتحمي بيانات الحالات، وتفصل الالتزام الفعلي عن حضور برنامج أو توافر ملف.","o":"استمرار ممارسة"}],"3-2-1-4":[{"id":"3-2-1-4-B01-A01","t":"يحدد مسؤول النشاط فرصة مجتمعية أو تطوعية ذات غرض واضح، ويتحقق المدير من الموافقات والموارد وشروط المشاركة قبل التنفيذ.","o":"حاجات وفرص مشاركة مقترحة"},{"id":"3-2-1-4-B01-A04","t":"يوضح المعنيون الأدوار والفئات والإتاحة ومقدار المساندة، ويعالجون ما يمنع وصول المستهدفين قبل التنفيذ المأذون.","o":"فرص مخولة ومخرجات متفق عليها"},{"id":"3-2-1-4-B01-A02","t":"ينسق مسؤول النشاط التنفيذ ويراجع تنظيمه، ويحفظ ما يبين إتاحة المدرسة للفرصة مستقلًا عما يبين أداء الطالب فيها، مع الرجوع إلى العمل نفسه.","o":"فرص متاحة وبرامج تحفيز"},{"id":"3-2-1-4-B02-A04","t":"يؤدي المتعلم دوره في العمل الفعلي ويبين ما ينجزه، ويلاحظ صاحب النشاط مساهمته الفردية في المنتج أو الخدمة المشتركة.","o":"تعريف مشاركة ونطاق رصد"},{"id":"3-2-1-4-B02-A02","t":"يشرح المتعلم ما يتعلمه وما يفيد به غيره في حدود المهمة، ويفحص المعنيون الصلة بين المشاركة والنتاج دون نسب عمل الآخرين إليه.","o":"سجل مشاركة بأدوار ونطاق"},{"id":"3-2-1-4-B02-A03","t":"يراجع أصحاب الاختصاص الفائدة والعوائق وإمكان تحسين المشاركة، ويستمعون إلى المستفيد عند ملاءمة ذلك وإمكانه.","o":"نتيجة تنوع واتساع"},{"id":"3-2-1-4-B02-A05","t":"تحدد المدرسة الفرصة أو الدعم التالي وتتابع أثر التعديل، مع بقاء الشواهد في أصولها وأغراض الحكم مستقلة.","o":"نتيجة مساهمة وتعلم وقرار تطوير"}],"3-2-1-6":[{"id":"3-2-1-6-B01-A01","t":"يقوم المعلم بإتاحة اختيار هدف وخطة تعلم مناسبة، ويطلب من المتعلم بيان المطلوب وخطوات العمل والوقت والمساعدة التي قد يحتاجها.","o":"هدف وخطة طالب"},{"id":"3-2-1-6-B01-A02","t":"ينفذ المتعلم خطته وينظم وقته ويطلب دعمًا مناسبًا، ويلاحظ المعلم ما يديره بنفسه وما يحتاج فيه إلى مساندة فعلية.","o":"إنجاز يقوده الطالب"},{"id":"3-2-1-6-B01-A03","t":"يراجع المتعلم أداءه واستراتيجيته مع توجيه ملائم، ويحدد ما يعدله في المهمة التالية وما يستمر عليه.","o":"تقويم ذاتي وخطة لاحقة"},{"id":"3-2-1-6-B02-A01","t":"يساند المعلم المتعلم في صياغة سؤال تعلم واختيار مصادر مناسبة، ويحدد ما يستطيع الوصول إليه وكيف يراجع فهمه.","o":"سؤال ومصادر تعلم"},{"id":"3-2-1-6-B02-A02","t":"يجمع المتعلم المعلومات ويستعملها في مهمة أو منتج ويبين مصادره ودوره، ويُفحص الفهم بدل النقل أو اكتمال الشكل.","o":"ملاحظات ومنتج تعلم"},{"id":"3-2-1-6-B02-A03","t":"يتيح المعلم أداءً لاحقًا يكشف نقل التعلم والاستقلال بدرجة مساعدة معلومة، ويعدل الدعم على أساس ما يظهر.","o":"أداء لاحق مستقل"}],"3-2-1-7":[{"id":"3-2-1-7-B01-A01","t":"يقوم المعلم بإتاحة معرفة مناسبة بعناصر الثقافة ومناقشة صلتها بحياة المتعلم، مع مراعاة العمر والخبرة واللغة.","o":"مهمة تعبير ثقافي"},{"id":"3-2-1-7-B01-A02","t":"يقدم المتعلم تفسيرًا أو اختيارًا أو أداءً يبين الاعتزاز بثقافته، ويلاحظ المعلم دوره وما يستند إليه من فهم.","o":"أعمال وتفسير فردي"},{"id":"3-2-1-7-B01-A03","t":"يراجع المعنيون القرائن في موقف لاحق ويحددون التعليم أو الدعم المناسب، دون الاكتفاء بمظهر أو مناسبة.","o":"فهم وتعبير أفضل"},{"id":"3-2-1-7-B02-A01","t":"يهيئ المعلم موقف تفاعل وحوار يتيح معرفة التنوع الثقافي في المجتمع واحترام الاختلاف ضمن إطار التعامل المناسب.","o":"فرص تفاعل وفحص"},{"id":"3-2-1-7-B02-A02","t":"يمارس المتعلم الاحترام في الحوار والعمل والتعاون، ويبين المعنيون ما تكشفه الممارسة وما يحتاج إلى توجيه.","o":"أدلة احترام في مواقف فعلية"},{"id":"3-2-1-7-B02-A03","t":"تراجع المدرسة الاعتزاز والاحترام عبر السياقات والفئات، وتعدل الفرص والتوجيه وتحفظ حدود الحكم والخصوصية.","o":"ممارسة لاحقة"}]},"TLD-04":{"2-1-1-1":[{"id":"2-1-1-1-B01-A02","t":"يختار المعلم تكييفًا يزيل العائق: نصًا أوضح أو طريقة عرض أو تعبير ميسرة أو تجزئة للمهمة أو وقتًا مناسبًا؛ ويحدد ما يبقى ثابتًا من ناتج التعلم. يرجع للخطة الفردية المعتمدة عند وجودها ويعد تحديًا أعمق للمتقن.","o":"المهمة قبل التكييف وبعده مع سبب التعديل؛ هدف محفوظ أو إحالة إلى هدف مخول تغييره."},{"id":"2-1-1-1-B01-A03","t":"يتيح المعلم فرصة تفكير وإجابة لكل طالب، وينظم تبادل الأدوار واستخدام المصدر. يتابع مشاركة من حددت حاجته، ويطلب عملًا فرديًا يبين ما أنجزه داخل النشاط المشترك.","o":"أعمال فردية وملاحظة مشاركة موزعة، مع وسيلة الاستجابة ومقدار الدعم."}],"2-1-1-2":[{"id":"2-1-1-2-B01-A02","t":"ينتقي المعلم مصدرًا صحيحًا ومقروءًا ومهمة تعلم لكل ناتج؛ ينمذج ما يحتاج شرحًا ويتيح ممارسة وتفسيرًا. يطلب المورد المتعذر عبر الإدارة ويعد بديلًا مكافئًا متاحًا داخل المدرسة.","o":"مصدر ومهمة مرتبطان بالناتج وأعمال ناتجة عنهما، مع وصف بديل المورد عند الحاجة."},{"id":"2-1-1-2-B01-A03","t":"يراجع المعلم عمل الطالب وتفسيره ومحاولته المستقلة في ضوء الناتج. يميز المعرفة التي تعلمها والأداء الذي أتقنه والممارسة الدالة على القيمة في سياقها، ثم يعيد تعليم موضع الحاجة ويتيح إثراءً للمتقن.","o":"عمل مفسر وملاحظة ممارسة مناسبة وقرار تدريس لاحق؛ لا اكتمال مبني على تسليم الواجب وحده."}],"2-1-1-3":[{"id":"2-1-1-3-B01-A02","t":"اختر استراتيجيات متنوعة تلائم الحاجة وصمم مشاركة الطلاب","o":"درس يبين لماذا اختيرت الطريقة وما الذي سيفعله كل طالب وكيف سيظهر فهمه."},{"id":"2-1-1-3-B01-A03","t":"نفذ الاستراتيجيات وافحص أعمال الطلاب والمشاركة","o":"ملاحظة تنفيذ وعمل فردي وتفسير، مع نوع المساعدة."}],"2-1-1-4":[{"id":"2-1-1-4-B01-A02","t":"ينفذ المعلم مهمة يستخدم فيها الطالب التقنية للفهم أو التمثيل أو الممارسة أو الاستجابة للتغذية الراجعة. يصل العمل الرقمي بالنقاش الصفي حين يخدم الهدف، ويتيح البديل لمن تعذر وصوله مع بقاء الناتج.","o":"منتج وتفسير أو تعديل من الطالب، وربطه بناتج المادة؛ والبديل المكافئ عند الحاجة."}],"2-1-1-5":[{"id":"2-1-1-5-B01-A01","t":"يحدد المعلم ناتجًا من مقرر الصف وموقفًا حياتيًا يفهمه الطلاب أو يقدمه لهم داخل الدرس. يوضح أين ستستخدم المعرفة ولماذا، ويتأكد أن السياق لا يشترط موردًا منزليًا أو خبرة لا تتاح للجميع.","o":"ناتج وسياق وتفسير للصلة بينهما وحدود المرحلة."},{"id":"2-1-1-5-B01-A02","t":"يعد المعلم مهمة تتطلب أداءً ومنتجًا وتفسيرًا، ويحدد ما يدل على صحة التطبيق ومعقوليته وما يحتاجه من أدوات وأمان ومساعدة للمشاركة. ويعلم المتطلب الجديد ويوفر موارد التنفيذ داخل المدرسة.","o":"وصف مهمة وموارد ومحك يفرق إتمام المنتج من فهم التطبيق."},{"id":"2-1-1-5-B01-A03","t":"ينفذ الطلاب المهمة ويشرحون ما اختاروه وكيف تحققوا من النتيجة. يتابع المعلم خطواتهم ويقدم دعمًا محددًا، ثم يطلب من كل طالب تفسيرًا أو جزءًا مستقلًا يظهر تعلمه.","o":"منتج وأداء وتفسير فردي، مع الخطأ والتعديل والمساعدة."},{"id":"2-1-1-5-B01-A04","t":"يعرض المعلم موقفًا مشابهًا يغير البيانات أو القيد بما يحتاج اختيارًا من الفكرة نفسها. يفحص تفسير الطالب ومعقولية حله وما احتاجه من تلميح، ويعيد تعليم الصلة التي لم تنتقل.","o":"تطبيق لاحق وتفسير يبين ما انتقل وحدود الموقف الجديد."}],"2-1-1-6":[{"id":"2-1-1-6-B01-A02","t":"ينتقي معلم العربية نصًا وكلمات وتراكيب من المنهج تناسب الحاجة، وينمذج القراءة أو بناء المعنى والكتابة. يتيح قراءة وفهمًا وتعبيرًا قصيرًا مترابطًا، ويجعل نصوص المواد مجال تطبيق بإسناد معلميها.","o":"مهام قراءة وكتابة وأعمال وتفسير يبين الصلة بالحاجة."},{"id":"2-1-1-6-B02-A02","t":"يعلم معلم الرياضيات المعنى بتمثيل ملائم، ويصل بين الأداة أو الرسم والرمز واللغة الرياضية. يعرض مثالًا واضحًا ويتيح ممارسة موجهة ثم مسألة فردية مع تفسير.","o":"تمثيل متصل بالرمز وحل مفسر؛ أدوات مختارة للفكرة من منهج الصف."}],"2-1-1-7":[{"id":"2-1-1-7-B01-A01","t":"يعد المعلم سؤالًا من مادته يحتاج إلى تحليل أو استنتاج أو تقويم أو حل مشكلة، ويحدد المعرفة اللازمة وما يجعل الإجابة مقنعة من رأي ودليل وتفسير للعلاقة بينهما. ويتيح أكثر من حل إذا سمحت المسألة بذلك.","o":"مهمة ومحك يكشفان التفكير المطلوب، مع تهيئة المعرفة اللازمة."},{"id":"2-1-1-7-B01-A02","t":"ينمذج المعلم كيف يختار الدليل ويبرر الصلة، ثم يفحص الطلاب مصدرًا أو بيانات أو تمثيلًا ويحلون ويشرحون. يقارنون تفسيرين ويبين كل طالب سبب ترجيحه دون اكتفاء بموافقة المجموعة.","o":"حل وتبرير فردي واستعمال دليل، مع بيان مقدار التوجيه."},{"id":"2-1-1-7-B01-A03","t":"يفحص المعلم تفسير الطالب ودليله والعلاقة بينهما، ويقدم سؤالًا يساعده على تعديل نقطة واضحة. ثم يفحص عملًا آخر ليرى جودة التبرير واختيار الحل والحاجة إلى التلميح.","o":"حجة أولى ومعدلة وتفسير لاحق مستقل مع حدود المقارنة."},{"id":"2-1-1-7-B02-A01","t":"يختار المعلم تحديًا يستطيع الطلاب التعامل معه بما يعرفونه، ويدعوهم لأفكار تختلف في معناها لا في كلماتها فقط. ويناقش فائدتها وإمكان تطويرها وما تضيفه في هذا الموقف، دون اختراع معيار رسمي للأصالة.","o":"أفكار متنوعة ومحكات ملاءمة وتطوير مفهومة للطلاب."},{"id":"2-1-1-7-B02-A02","t":"يجرب الطلاب فكرة بنموذج أو تمثيل آمن ويلاحظون ما نفع وما يحتاج تعديلًا. يتيح المعلم إثراءً صفيًا وغير صفي ضمن الموارد القائمة، ويحفظ أثر مساهمة كل طالب ولا يشترط مسابقة.","o":"فكرة أولى ومحاولة اختبار وتعديل سببه ملاحظة أو دليل."},{"id":"2-1-1-7-B02-A03","t":"يراجع المعلم والطلاب جودة الفكرة وفائدتها لمن صممت له، ويطلبون بيان ما تغير ولماذا. يقارن الطالب بديلًا أو يختبر تحسينًا ويبين حدود ما حققه؛ يتابع المعلم التنفيذ المتاح.","o":"نسختا فكرة أو نموذج وسبب تحسين ودليل فائدة وحدود."},{"id":"2-1-1-7-B03-A01","t":"يختار الطلاب بتوجيه المعلم سؤالًا محددًا يناسب العمر والمادة ويمكن الإجابة عنه بمعلومات متاحة أو ملاحظة آمنة. يحددون نوع الدليل وخطوات جمعه دون بيانات شخصية.","o":"سؤال وخطة مختصرة ومصدر أو طريقة ملاحظة تخدمه."},{"id":"2-1-1-7-B03-A02","t":"يعلم المعلم الطلاب فحص صاحب المصدر وتاريخه وصلته بالسؤال، والتمييز بين المعلومة والرأي. وينظم الطلاب ما يجمعونه ويذكرون مصدره، ويفحصون اختلاف المعلومات بدل نسخ النص أو قبول أول نتيجة بحث.","o":"ملاحظات منظمة ونسبة المعلومات لمصادرها وسبب قبولها أو التحفظ عليها."},{"id":"2-1-1-7-B03-A03","t":"يعرض الطالب جوابًا يربطه بالدليل ويشرح كيف جمعه وما لا يسمح باستنتاجه. يناقش المعلم الطريقة والنتيجة ويطلب تصحيحًا عند تجاوز الدليل، ويحفظ الطلاب ما بقي سؤالًا.","o":"نتيجة وتفسير للطريقة وإحالات وحدود؛ عمل فردي يظهر مساهمة الطالب."}],"2-1-1-8":[{"id":"2-1-1-8-B01-A02","t":"يعرض المعلم استجابة لشخصية افتراضية: تسمية الشعور واختيار فعل آمن وطلب مساعدة عند الحاجة. يتدرب الطلاب بوسيلة تواصل مناسبة، ثم يناقشون أثر الخيار دون كشف قصص خاصة.","o":"ممارسة فعل محدد وتغذية راجعة وصفية مع مقدار التذكير."},{"id":"2-1-1-8-B02-A02","t":"ينظم المعلم مهمة جماعية تحتاج إلى مساهمة الطلاب، مع أدوار يتبادلونها. ويوضح الإصغاء والطلب والاختلاف باحترام، ويتابع ممارسة كل طالب ويتيح له وسيلة مناسبة للمساهمة.","o":"عمل تعاوني وملاحظة مساهمة وتواصل لكل طالب بالوسيلة الملائمة."}],"2-1-1-9":[{"id":"2-1-1-9-B01-A02","t":"يعد المعلم مهمة ذات غرض مفهوم وتحد يمكن بلوغه مع دعم، ويتيح خيارًا محدودًا يخدم الناتج. يوضح معنى النجاح ويهيئ بدء المحاولة، ويختار سياقًا لا يتطلب موارد منزلية.","o":"مهمة وغرض وخيارات متكافئة ودعم مرتبط بالعائق المؤيد."},{"id":"2-1-1-9-B01-A03","t":"ينفذ الطلاب المهمة ويختارون ضمن حدودها ويجربون، ويقدم المعلم تغذية تصف ما تحقق وخطوة التحسين. يتيح إعادة المحاولة ويلاحظ الجهد والفهم وطلب المساعدة دون ترتيب علني أو مدح صفة ثابتة.","o":"محاولة وتعديل من التغذية الراجعة وملاحظة مثابرة، مع تفسير الطالب لعمله."}],"2-2-1-1":[{"id":"2-2-1-1-B02-A02","t":"يختار المعلم أداة تكشف الحاجة أثناء التعلم ويحدد سبب ملاءمتها. يوظف تقويمًا ذاتيًا أو أقرانًا أو أداءً أو مشروعًا أو ملفًا بحسب الحاجة؛ لا يفرضها كلها. يجمع أداءً وملاحظة يبينان ما يعرفه المتعلم وما يحتاجه.","o":"نتيجة مفيدة عن الحاجة؛ تنوع الأسماء أو جمع ملف أعمال دون تفسير ليس دليلًا كافيًا."}],"2-2-1-2":[{"id":"2-2-1-2-B01-A03","t":"يطبق المعلم الأدوات المناسبة ويجمع أعمالًا يعرف أصحابها وما تقيسه من تعلم. وإذا بقي ناتج بلا أداء يكشفه، يستكمل فحصه في مهمة قائمة تصلح لذلك أو يبين ما يتعذر، دون إنشاء اختبار مكرر تلقائيًا.","o":"لكل ناتج مفحوص أداء قابل للفحص أو فجوة معلنة؛ الخطة أو المهمة غير المنفذة لا تثبت التقويم."}],"2-2-1-3":[{"id":"2-2-1-3-B02-A02","t":"ينفذ المعلم التدخل في مهمات المادة والطلاب الذين يتولى تعليمهم ويوثق الأداء الفعلي أو تعذر التنفيذ. يفحص إن كان الخلل في التعليم أو الأداة أو التطبيق ويعدل ما تؤيده الأدلة. يحفظ علاقة التعديل بالسبب ولا يسجل التغيير الشكلي نجاحًا أو تقويمًا وظيفيًا.","o":"تعديل أو دعم منفذ مرتبط بالحاجة والسبب المدعوم، مع مخرج يمكن متابعته."}],"2-2-1-4":[{"id":"2-2-1-4-B01-A03","t":"يتيح المعلم تعديل العمل أو محاولة أو مهمة لاحقة، ويقارن الأداء الأول واللاحق بمعايير واضحة. ويبين التحسن أو استمرار التعثر أو ما يمنع المقارنة. وعند عدم التحسن يفحص فهم التوجيه والوقت والوصول والمهمة، ويعدل ما تدعمه المعلومات ثم يعيد المتابعة.","o":"أداء أول وتعليق وأداء لاحق منسوبان للطالب والفترة؛ المقارنة معللة، وعدم التحسن محفوظ ويستدعي متابعة مناسبة."}],"4-1-1-3":[{"id":"4-1-1-3-B01-A01","t":"يختار المعلم مهمة من منهج الصف، ويلاحظ من يستطيع رؤية العرض وفهم التواصل وبلوغ الأداة وإنتاج العمل. يميز عائق الوصول من عدم فهم الفكرة. يقترح للمختص تهيئة تحتاج تجهيزًا أو قرارًا فرديًا خارج صلاحية المعلم.","o":"مهمة محددة وحاجة بيئية وفئة وظيفية وأثر على المشاركة."},{"id":"4-1-1-3-B01-A03","t":"يعيد المعلم مهمة مناسبة بعد التهيئة، ويسجل ما رآه أو استعمله الطالب وما أنتجه، ومقدار المساعدة المعتادة. إذا بقي التعثر يفحص الفهم وطريقة العرض كلًا على حدة. يرفع للمختص ما استمر من حاجة إتاحة؛ ويعالج تعثر المفهوم بالتعليم المناسب.","o":"ملاحظة مهمة وعمل طالب أو وصف أداء، مع الدعم والعائق الباقي."},{"id":"4-1-1-3-B02-A01","t":"يحدد المعلم من المنهج سؤال ملاحظة أو قياس، والفعل الذي سيؤديه الطالب والأداة والتسجيل والتفسير المطلوبين، ثم يقارنها بالموجود. يقترح استكمالًا أو بديلًا مخولًا عند تعذر الأداة أو المعمل، ويحدد المهارة التي لن يغطيها البديل.","o":"حاجة نشاط ومستخدمين وفجوات؛ البديل المقترح وحدود ما يغطيه."},{"id":"4-1-1-3-B02-A03","t":"يوزع المعلم الأدوار بحيث يؤدي المستهدف فعل التعلم المقصود، ثم يطلب منه تسجيل ملاحظته وشرح دلالتها. يراجع أن الزميل لا ينفذ المهمة عنه. يقترح تكييف الأداة أو طريقة التسجيل بمساعدة المختص إذا حالت حاجة فردية دون المشاركة.","o":"ملاحظة مشاركة وعمل عملي وتفسير، مع الفرق بين الفعلي والمحاكاة."}],"4-1-1-4":[{"id":"4-1-1-4-B02-A03","t":"يطلب المعلم من المستهدف قراءة أو تسجيلًا أو تواصلًا أو مناولة تناسب هدف المهمة، ويتابع كيفية استعمال التجهيز وما بقي من عائق واجهة أو تحكم. يقترح للمختص تكييفًا يحتاجه المستهدف مع وصف الوظيفة بدل الاكتفاء بطلب جهاز آخر.","o":"مهمة وأداء يربطان منفعة التجهيز بالحاجة الأصلية."}],"3-2-1-1":[{"id":"3-2-1-1-B01-A01","t":"يقوم المعلم بإتاحة موقف يفسر فيه المتعلم معنى قيمة مناسبة وصلتها بتعامل أو قرار، ويتحقق من فهم المعنى بلغته ووسيلته الملائمة.","o":"مواقف فحص ناتج"},{"id":"3-2-1-1-B01-A02","t":"يتيح المعنيون ممارسة واختيارًا يظهران تمثل القيمة، ويحددون دور المتعلم والمساعدة التي يتلقاها، مع فصل تنفيذ البرنامج عن ناتجه.","o":"أدلة أداء طلاب"},{"id":"3-2-1-1-B01-A03","t":"يراجع المعلم فهم الطلاب للقيم والهوية الوطنية وكيف يعبرون عنه في موقف لاحق. فإذا ظهر فهم غير صحيح يوضحه ويناقشه، وإذا فهم الطالب القيمة ولم يلتزم بها في ممارسته يوجهه إلى السلوك المطلوب ويتابع ممارسته؛ فلا يكتفي بإعادة النشاط نفسه.","o":"تحسن ممارسة وفهم"},{"id":"3-2-1-1-B02-A01","t":"يقوم المعلم وصاحب النشاط بإتاحة تعلم مناسب عن الهوية الوطنية، ويطلبان تفسيرًا أو عملًا يبين ما يدركه المتعلم منها.","o":"مهمة تعبير أو ممارسة"},{"id":"3-2-1-1-B02-A02","t":"يشارك المتعلم في مواقف مناسبة ويبين دوره ومعنى ما يمارسه، ويلاحظ المعنيون ما يكشف الاعتزاز في حدود السياق والعمر.","o":"ناتج فردي أو جماعي موثق"},{"id":"3-2-1-1-B02-A03","t":"تراجع المدرسة ظهور الناتج عبر الفئات والمواقف، وتعدل فرص التعلم والتعزيز مع بيان ما لم يشمله الفحص وحدود الحكم.","o":"نتيجة دعم لاحقة"}],"3-2-1-2":[{"id":"3-2-1-2-B01-A01","t":"يقوم المعلم بإتاحة موقف يصف فيه المتعلم ما يستطيع فعله وما يحتاج فيه إلى مساندة، دون مطالبة بإفصاح شخصي خارج غرض التعلم.","o":"مواقف فحص تربوي"},{"id":"3-2-1-2-B01-A02","t":"يتيح المعلم للمتعلم اتخاذ اختيار ومراجعة أدائه وتقبل توجيه مناسب، ويلاحظ ما يظهر من اتجاه نحو ذاته في هذا السياق.","o":"أدلة اتجاه ومشاركة"},{"id":"3-2-1-2-B01-A03","t":"يراجع المعنيون استمرار القرائن ويحددون الدعم المناسب، مع عدم تحويل تعثر مهمة أو استجابة عارضة إلى صفة ثابتة.","o":"استجابة وتقدم"},{"id":"3-2-1-2-B02-A01","t":"يتيح المعلم موقف تعاون أو تعامل يبين فيه المتعلم احترامه للآخرين وطريقة الاستجابة للاختلاف ضمن العمر والفرصة المتاحة.","o":"فرص ملاحظة تعامل"},{"id":"3-2-1-2-B02-A02","t":"يلاحظ صاحب العمل التفاعل ومساهمة المتعلم وتفسيره، ويميز العائق في اللغة أو تنظيم المهمة عن افتراض اتجاه سلبي.","o":"أدلة تعامل متكررة"},{"id":"3-2-1-2-B02-A03","t":"تراجع المدرسة قرائن المواقف وتعدل الدعم أو التنظيم، وتحيل ما يحتاج إلى اختصاص عبر مساره مع حفظ الخصوصية.","o":"ممارسة اجتماعية محسنة"}],"3-2-1-6":[{"id":"3-2-1-6-B01-A01","t":"يقوم المعلم بإتاحة اختيار هدف وخطة تعلم مناسبة، ويطلب من المتعلم بيان المطلوب وخطوات العمل والوقت والمساعدة التي قد يحتاجها.","o":"هدف وخطة طالب"},{"id":"3-2-1-6-B01-A02","t":"ينفذ المتعلم خطته وينظم وقته ويطلب دعمًا مناسبًا، ويلاحظ المعلم ما يديره بنفسه وما يحتاج فيه إلى مساندة فعلية.","o":"إنجاز يقوده الطالب"},{"id":"3-2-1-6-B01-A03","t":"يراجع المتعلم أداءه واستراتيجيته مع توجيه ملائم، ويحدد ما يعدله في المهمة التالية وما يستمر عليه.","o":"تقويم ذاتي وخطة لاحقة"},{"id":"3-2-1-6-B02-A01","t":"يساند المعلم المتعلم في صياغة سؤال تعلم واختيار مصادر مناسبة، ويحدد ما يستطيع الوصول إليه وكيف يراجع فهمه.","o":"سؤال ومصادر تعلم"},{"id":"3-2-1-6-B02-A02","t":"يجمع المتعلم المعلومات ويستعملها في مهمة أو منتج ويبين مصادره ودوره، ويُفحص الفهم بدل النقل أو اكتمال الشكل.","o":"ملاحظات ومنتج تعلم"},{"id":"3-2-1-6-B02-A03","t":"يتيح المعلم أداءً لاحقًا يكشف نقل التعلم والاستقلال بدرجة مساعدة معلومة، ويعدل الدعم على أساس ما يظهر.","o":"أداء لاحق مستقل"}],"3-2-1-7":[{"id":"3-2-1-7-B01-A01","t":"يقوم المعلم بإتاحة معرفة مناسبة بعناصر الثقافة ومناقشة صلتها بحياة المتعلم، مع مراعاة العمر والخبرة واللغة.","o":"مهمة تعبير ثقافي"},{"id":"3-2-1-7-B01-A02","t":"يقدم المتعلم تفسيرًا أو اختيارًا أو أداءً يبين الاعتزاز بثقافته، ويلاحظ المعلم دوره وما يستند إليه من فهم.","o":"أعمال وتفسير فردي"},{"id":"3-2-1-7-B01-A03","t":"يراجع المعنيون القرائن في موقف لاحق ويحددون التعليم أو الدعم المناسب، دون الاكتفاء بمظهر أو مناسبة.","o":"فهم وتعبير أفضل"},{"id":"3-2-1-7-B02-A01","t":"يهيئ المعلم موقف تفاعل وحوار يتيح معرفة التنوع الثقافي في المجتمع واحترام الاختلاف ضمن إطار التعامل المناسب.","o":"فرص تفاعل وفحص"},{"id":"3-2-1-7-B02-A02","t":"يمارس المتعلم الاحترام في الحوار والعمل والتعاون، ويبين المعنيون ما تكشفه الممارسة وما يحتاج إلى توجيه.","o":"أدلة احترام في مواقف فعلية"},{"id":"3-2-1-7-B02-A03","t":"تراجع المدرسة الاعتزاز والاحترام عبر السياقات والفئات، وتعدل الفرص والتوجيه وتحفظ حدود الحكم والخصوصية.","o":"ممارسة لاحقة"}]},"TLD-05":{"2-1-1-1":[{"id":"2-1-1-1-B01-A01","t":"يعرض المعلم مهمة قصيرة من هدف الدرس، ويسمع تفسير الطلاب ويرصد من تعوقه التعليمات أو المصدر أو وسيلة الإجابة. يراجع معلومات الدعم المسموح بها ويسأل الطالب عما يساعده دون وصم.","o":"عمل أول مع وصف العائق وسياقه؛ تمييز حاجة الوصول من فجوة المهارة، وبيان ما يحتاجه المتقدم."},{"id":"2-1-1-1-B01-A02","t":"يختار المعلم تكييفًا يزيل العائق: نصًا أوضح أو طريقة عرض أو تعبير ميسرة أو تجزئة للمهمة أو وقتًا مناسبًا؛ ويحدد ما يبقى ثابتًا من ناتج التعلم. يرجع للخطة الفردية المعتمدة عند وجودها ويعد تحديًا أعمق للمتقن.","o":"المهمة قبل التكييف وبعده مع سبب التعديل؛ هدف محفوظ أو إحالة إلى هدف مخول تغييره."},{"id":"2-1-1-1-B01-A04","t":"يفحص المعلم أداءً لاحقًا في الهدف نفسه مع تكييف معلوم، ويقارن المشاركة والفهم والاستقلال لدى من تلقوا الدعم والمتقدمين. يبقي ما نفع ويعدل ما لم يفتح فرصة تعلم فعلية.","o":"عمل أول وآخر ووصف المساعدة وقرار استمرار أو تغيير التكييف؛ لا بيانات شخصية في العرض."}],"2-1-1-3":[{"id":"2-1-1-3-B01-A01","t":"حلل ناتج التعلم ومستويات الطلاب والعائق في التعلم","o":"أداء أول وتفسير يحددان الحاجة التعليمية ومتطلبها."},{"id":"2-1-1-3-B01-A04","t":"قارن النتائج وحسن اختيار الطريقة","o":"مقارنة أعمال وقرار تغيير محدد ونتيجته اللاحقة حين تتاح."}],"2-1-1-4":[{"id":"2-1-1-4-B01-A05","t":"قبل المهمة، يعرض المعلم لمن عرفت حاجته الخطوة الرقمية اللازمة، ثم يتركه يجربها بنفسه في مثال قصير. يثبت الاستعداد للبدء دون أن يحل المهمة التعليمية نيابة عنه.","o":"تنفيذ الطالب للخطوة المطلوبة قبل الدخول في مهمة التعلم، مع وصف الدعم."},{"id":"2-1-1-4-B01-A04","t":"إذا ظهرت أثناء المهمة فجوة رقمية تعطلها، يوقف المعلم عند الخطوة اللازمة ويقدم دعمًا قصيرًا، ثم يعيد الطالب لإنجازها بنفسه داخل الموقف. إذا لم تظهر فجوة يسجل عدم الحاجة للدعم ولا يصطنع تدريبًا.","o":"وصف الفجوة عند ظهورها ومحاولة الطالب بعد الدعم في المهمة نفسها؛ أو عدم انطباق الدعم."}],"2-1-1-6":[{"id":"2-1-1-6-B01-A01","t":"يسمع معلم العربية قراءة مناسبة ويطلب فهم كلمة وفكرة وكتابة قصيرة من محتوى الصف. يميز تعرف الكلمات والطلاقة ذات المعنى والفهم والتعبير، ويحدد دعمًا أو إثراءً من دليل فعلي.","o":"قراءة وإجابة وكتابة مؤرخة عند الاستخدام؛ موضع حاجة محدد لا تصنيف دائم."},{"id":"2-1-1-6-B01-A02","t":"ينتقي معلم العربية نصًا وكلمات وتراكيب من المنهج تناسب الحاجة، وينمذج القراءة أو بناء المعنى والكتابة. يتيح قراءة وفهمًا وتعبيرًا قصيرًا مترابطًا، ويجعل نصوص المواد مجال تطبيق بإسناد معلميها.","o":"مهام قراءة وكتابة وأعمال وتفسير يبين الصلة بالحاجة."},{"id":"2-1-1-6-B01-A03","t":"يجمع معلم العربية من يشتركون مؤقتًا في حاجة واحدة لتعليم موجه، ويعيد المهارة إلى نص الصف. يعطي المتقدم تفسيرًا أعمق أو كتابة توظف الفكرة، ويغير المجموعة من الاستجابة اللاحقة.","o":"عمل قبل الدعم وبعده ومهمة إثراء ذات عمق؛ لا فئات ثابتة أو حرمان من المنهج."},{"id":"2-1-1-6-B01-A04","t":"يعيد معلم العربية فحص المهارة بنص مناسب آخر وكتابة قصيرة مع مقدار مساعدة معلوم. يقارن دقة القراءة والفهم والتعبير، ويقرر استمرار الدعم أو تغييره أو تخفيفه ويراقب من لم يستفد.","o":"مقارنة مهارية من أعمال مستقلة وقرار لاحق؛ لا نسبة نتيجة مختلقة."},{"id":"2-1-1-6-B02-A01","t":"يعرض معلم الرياضيات مهمة مقدار أو تمثيل أو عملية مناسبة للمقرر، ويطلب تفسير الحل ومعقوليته. يميز خطأ معنى العدد أو القيمة أو العلاقة من خطأ إجراء أو قراءة المسألة.","o":"حل وتمثيل وشرح يكشفان نمط الخطأ أو العمق المتاح للمتقن."},{"id":"2-1-1-6-B02-A02","t":"يعلم معلم الرياضيات المعنى بتمثيل ملائم، ويصل بين الأداة أو الرسم والرمز واللغة الرياضية. يعرض مثالًا واضحًا ويتيح ممارسة موجهة ثم مسألة فردية مع تفسير.","o":"تمثيل متصل بالرمز وحل مفسر؛ أدوات مختارة للفكرة من منهج الصف."},{"id":"2-1-1-6-B02-A03","t":"يعالج المعلم نمط الخطأ المؤيد بتعليم موجه وممارسة في حاجة واحدة، ثم يعيده إلى موضوع الصف. يعطي المتقدم مسألة تقارن طرقًا أو تغير قيدًا وتطلب تعليلًا؛ يعاد التجميع من الاستجابة.","o":"محاولة علاجية أو إثرائية توضح الخطأ والتعديل أو عمق التفكير."},{"id":"2-1-1-6-B02-A04","t":"يفحص المعلم مهمة عددية أخرى في المهارة نفسها مع تفسير مستقل، ويقارن معنى الحل وصحته ومعقوليته والمساعدة. يقرر ما يعاد تعليمه وما يمكن توسيعه ويتابع بقاء المهارة في درس لاحق.","o":"عملان مناسبان ومحك تفسير وقرار تعليم لاحق؛ لا قياس بالسرعة وحدها."}],"2-1-1-7":[{"id":"2-1-1-7-B02-A01","t":"يختار المعلم تحديًا يستطيع الطلاب التعامل معه بما يعرفونه، ويدعوهم لأفكار تختلف في معناها لا في كلماتها فقط. ويناقش فائدتها وإمكان تطويرها وما تضيفه في هذا الموقف، دون اختراع معيار رسمي للأصالة.","o":"أفكار متنوعة ومحكات ملاءمة وتطوير مفهومة للطلاب."},{"id":"2-1-1-7-B02-A02","t":"يجرب الطلاب فكرة بنموذج أو تمثيل آمن ويلاحظون ما نفع وما يحتاج تعديلًا. يتيح المعلم إثراءً صفيًا وغير صفي ضمن الموارد القائمة، ويحفظ أثر مساهمة كل طالب ولا يشترط مسابقة.","o":"فكرة أولى ومحاولة اختبار وتعديل سببه ملاحظة أو دليل."},{"id":"2-1-1-7-B02-A03","t":"يراجع المعلم والطلاب جودة الفكرة وفائدتها لمن صممت له، ويطلبون بيان ما تغير ولماذا. يقارن الطالب بديلًا أو يختبر تحسينًا ويبين حدود ما حققه؛ يتابع المعلم التنفيذ المتاح.","o":"نسختا فكرة أو نموذج وسبب تحسين ودليل فائدة وحدود."}],"2-1-1-9":[{"id":"2-1-1-9-B01-A01","t":"يستمع المعلم إلى رأي الطلاب في معنى المهمة وصعوبتها وما يساعدهم على البدء، ويقابل ذلك بأعمالهم وملاحظة المحاولة والعودة بعد الخطأ. يصوغ عائقًا محتملًا فقط إذا تأيد، وإلا يسجل عدم وضوحه.","o":"صوت طالب متاح وملاحظة وعمل يميز فهم المطلوب والتحدي والوصول والشعور بالأمان."},{"id":"2-1-1-9-B01-A04","t":"يقارن المعلم خبرة الطلاب ومشاركتهم وأعمالهم واستمرار محاولتهم في تعلم لاحق، ويتابع من لم يستفد. يعدل التحدي أو معنى المهمة أو الدعم وفق الأدلة، مع إبقاء العوامل الأخرى واحتمال عدم وضوح السبب.","o":"رأي اختياري وعمل لاحق وملاحظة استجابة لدى فئات مختلفة وقرار تعديل."}],"2-2-1-1":[{"id":"2-2-1-1-B01-A03","t":"يحدد المعلم ما يغيره في التدريس أو المهمة أو الدعم استجابة لكل حاجة، ويضيفه إلى خطة التعلم المستخدمة ووقت تنفيذه. ويحفظ سبب التغيير والعمل الذي يكشف الحاجة دون إعداد خطة أخرى للعمل نفسه.","o":"يظهر فرق محدد في التعليم أو الدعم يعود إلى حاجة مكتشفة؛ اسم برنامج عام لا يكفي."},{"id":"2-2-1-1-B02-A03","t":"يقرأ المعلم نتيجة التقويم أثناء التعلم ويقدم دعمًا أو إثراءً أو يغير التدريس في وقت يستطيع الطالب الاستفادة منه. ثم يراجع الأداء التالي أو يبين تعذر جمعه، ويعدل الدعم إذا استمر التعثر.","o":"تغيير تعليمي أو دعم في وقت مفيد مسند إلى نتيجة؛ دعم متأخر بعد الختام لا يثبت الاستخدام البنائي لهذه الواقعة."},{"id":"2-2-1-1-B03-A03","t":"يبين المعلم ما يتقنه الطلاب وما يحتاج إلى تعلم على مستوى المهارة والفئة، ويحدد توصية للتعليم أو الدعم في المرحلة التالية. ويحفظ صلتها بالنتيجة ويسلم المعلومات اللازمة للمعلم أو المسؤول الذي يتولى المتابعة عند تغير الفترة أو انتقال العمل.","o":"التوصية تحدد ناتجًا أو مهارة وحاجة ومسار متابعة؛ عبارة تحسين المستوى وحدها لا تكفي."}],"2-2-1-2":[{"id":"2-2-1-2-B01-A04","t":"يراجع المعلم تغطية النواتج وصلاحية الأداة والتطبيق. يميز خلل الأداة أو التطبيق ونقص الشاهد عن حاجة التعلم الحقيقية، ويصحح ما ثبت. يفسر النتيجة الصالحة ويوجه دعمًا مناسبًا أو يحفظ الحكم معلقًا إذا لم تكف الأدلة.","o":"قرار عن الناتج مبني على أداء صالح ومحك معلوم؛ لا حكم من أداة مختلة أو تغطية شكلية."}],"2-2-1-3":[{"id":"2-2-1-3-B02-A01","t":"يصمم المعلم دعمًا أو إثراءً للمهارة التي يكشفها التحليل، ويحدد من أين يبدأ وما يفعله الطالب ووقت العمل ومخرجه وفحصه اللاحق. ويستخدم تدخلًا قائمًا إذا ناسب الحاجة ويعدله بدل إنشاء برنامج عام مكرر.","o":"تدخل يطابق حاجة مسندة ومخرجًا وفحصًا؛ برنامج عام لا يقابل الفجوة لا يكفي."},{"id":"2-2-1-3-B02-A02","t":"ينفذ المعلم التدخل في مهمات المادة والطلاب الذين يتولى تعليمهم ويوثق الأداء الفعلي أو تعذر التنفيذ. يفحص إن كان الخلل في التعليم أو الأداة أو التطبيق ويعدل ما تؤيده الأدلة. يحفظ علاقة التعديل بالسبب ولا يسجل التغيير الشكلي نجاحًا أو تقويمًا وظيفيًا.","o":"تعديل أو دعم منفذ مرتبط بالحاجة والسبب المدعوم، مع مخرج يمكن متابعته."},{"id":"2-2-1-3-B02-A03","t":"يعيد المعلم فحص الناتج المستهدف بقدر مناسب من المقارنة ويسجل المساعدة والظروف. يقارن الاستجابة أو عدمها، ولا يستدل من حضور البرنامج على التحسن. يقرر الاستمرار أو تعديل الدعم أو إعادة التشخيص، ويربطه بدورة المتابعة التالية دون إنشاء مهمة تشغيلية.","o":"أداء لاحق وقرار مسند؛ عدم التحسن وتعذر المقارنة يبقيان ظاهرين دون نسبة سببية مؤكدة."}],"2-2-1-4":[{"id":"2-2-1-4-B01-A03","t":"يتيح المعلم تعديل العمل أو محاولة أو مهمة لاحقة، ويقارن الأداء الأول واللاحق بمعايير واضحة. ويبين التحسن أو استمرار التعثر أو ما يمنع المقارنة. وعند عدم التحسن يفحص فهم التوجيه والوقت والوصول والمهمة، ويعدل ما تدعمه المعلومات ثم يعيد المتابعة.","o":"أداء أول وتعليق وأداء لاحق منسوبان للطالب والفترة؛ المقارنة معللة، وعدم التحسن محفوظ ويستدعي متابعة مناسبة."}],"3-2-1-6":[{"id":"3-2-1-6-B01-A01","t":"يقوم المعلم بإتاحة اختيار هدف وخطة تعلم مناسبة، ويطلب من المتعلم بيان المطلوب وخطوات العمل والوقت والمساعدة التي قد يحتاجها.","o":"هدف وخطة طالب"},{"id":"3-2-1-6-B01-A02","t":"ينفذ المتعلم خطته وينظم وقته ويطلب دعمًا مناسبًا، ويلاحظ المعلم ما يديره بنفسه وما يحتاج فيه إلى مساندة فعلية.","o":"إنجاز يقوده الطالب"},{"id":"3-2-1-6-B01-A03","t":"يراجع المتعلم أداءه واستراتيجيته مع توجيه ملائم، ويحدد ما يعدله في المهمة التالية وما يستمر عليه.","o":"تقويم ذاتي وخطة لاحقة"},{"id":"3-2-1-6-B02-A01","t":"يساند المعلم المتعلم في صياغة سؤال تعلم واختيار مصادر مناسبة، ويحدد ما يستطيع الوصول إليه وكيف يراجع فهمه.","o":"سؤال ومصادر تعلم"},{"id":"3-2-1-6-B02-A02","t":"يجمع المتعلم المعلومات ويستعملها في مهمة أو منتج ويبين مصادره ودوره، ويُفحص الفهم بدل النقل أو اكتمال الشكل.","o":"ملاحظات ومنتج تعلم"},{"id":"3-2-1-6-B02-A03","t":"يتيح المعلم أداءً لاحقًا يكشف نقل التعلم والاستقلال بدرجة مساعدة معلومة، ويعدل الدعم على أساس ما يظهر.","o":"أداء لاحق مستقل"}]},"TLD-06":{"2-1-1-1":[{"id":"2-1-1-1-B01-A01","t":"يعرض المعلم مهمة قصيرة من هدف الدرس، ويسمع تفسير الطلاب ويرصد من تعوقه التعليمات أو المصدر أو وسيلة الإجابة. يراجع معلومات الدعم المسموح بها ويسأل الطالب عما يساعده دون وصم.","o":"عمل أول مع وصف العائق وسياقه؛ تمييز حاجة الوصول من فجوة المهارة، وبيان ما يحتاجه المتقدم."},{"id":"2-1-1-1-B01-A04","t":"يفحص المعلم أداءً لاحقًا في الهدف نفسه مع تكييف معلوم، ويقارن المشاركة والفهم والاستقلال لدى من تلقوا الدعم والمتقدمين. يبقي ما نفع ويعدل ما لم يفتح فرصة تعلم فعلية.","o":"عمل أول وآخر ووصف المساعدة وقرار استمرار أو تغيير التكييف؛ لا بيانات شخصية في العرض."}],"2-1-1-3":[{"id":"2-1-1-3-B01-A04","t":"قارن النتائج وحسن اختيار الطريقة","o":"مقارنة أعمال وقرار تغيير محدد ونتيجته اللاحقة حين تتاح."}],"2-1-1-4":[{"id":"2-1-1-4-B01-A03","t":"يفحص المعلم الناتج التعليمي من تفسير الطالب وعمله، ويقارنه بأداء أول مناسب وبمقدار الدعم والوصول. يقرر استمرار الاستخدام أو تعديله أو اختيار وسيلة أوضح؛ ولا يجعل نقل مهارة رقمية جديدة شرطًا للإغلاق.","o":"عمل يبين التعلم وقرار استخدام لاحق مع حد المقارنة؛ PEND-D05 محفوظ."}],"2-1-1-6":[{"id":"2-1-1-6-B01-A01","t":"يسمع معلم العربية قراءة مناسبة ويطلب فهم كلمة وفكرة وكتابة قصيرة من محتوى الصف. يميز تعرف الكلمات والطلاقة ذات المعنى والفهم والتعبير، ويحدد دعمًا أو إثراءً من دليل فعلي.","o":"قراءة وإجابة وكتابة مؤرخة عند الاستخدام؛ موضع حاجة محدد لا تصنيف دائم."},{"id":"2-1-1-6-B01-A04","t":"يعيد معلم العربية فحص المهارة بنص مناسب آخر وكتابة قصيرة مع مقدار مساعدة معلوم. يقارن دقة القراءة والفهم والتعبير، ويقرر استمرار الدعم أو تغييره أو تخفيفه ويراقب من لم يستفد.","o":"مقارنة مهارية من أعمال مستقلة وقرار لاحق؛ لا نسبة نتيجة مختلقة."},{"id":"2-1-1-6-B02-A01","t":"يعرض معلم الرياضيات مهمة مقدار أو تمثيل أو عملية مناسبة للمقرر، ويطلب تفسير الحل ومعقوليته. يميز خطأ معنى العدد أو القيمة أو العلاقة من خطأ إجراء أو قراءة المسألة.","o":"حل وتمثيل وشرح يكشفان نمط الخطأ أو العمق المتاح للمتقن."},{"id":"2-1-1-6-B02-A04","t":"يفحص المعلم مهمة عددية أخرى في المهارة نفسها مع تفسير مستقل، ويقارن معنى الحل وصحته ومعقوليته والمساعدة. يقرر ما يعاد تعليمه وما يمكن توسيعه ويتابع بقاء المهارة في درس لاحق.","o":"عملان مناسبان ومحك تفسير وقرار تعليم لاحق؛ لا قياس بالسرعة وحدها."}],"2-1-1-7":[{"id":"2-1-1-7-B01-A03","t":"يفحص المعلم تفسير الطالب ودليله والعلاقة بينهما، ويقدم سؤالًا يساعده على تعديل نقطة واضحة. ثم يفحص عملًا آخر ليرى جودة التبرير واختيار الحل والحاجة إلى التلميح.","o":"حجة أولى ومعدلة وتفسير لاحق مستقل مع حدود المقارنة."},{"id":"2-1-1-7-B02-A03","t":"يراجع المعلم والطلاب جودة الفكرة وفائدتها لمن صممت له، ويطلبون بيان ما تغير ولماذا. يقارن الطالب بديلًا أو يختبر تحسينًا ويبين حدود ما حققه؛ يتابع المعلم التنفيذ المتاح.","o":"نسختا فكرة أو نموذج وسبب تحسين ودليل فائدة وحدود."},{"id":"2-1-1-7-B03-A03","t":"يعرض الطالب جوابًا يربطه بالدليل ويشرح كيف جمعه وما لا يسمح باستنتاجه. يناقش المعلم الطريقة والنتيجة ويطلب تصحيحًا عند تجاوز الدليل، ويحفظ الطلاب ما بقي سؤالًا.","o":"نتيجة وتفسير للطريقة وإحالات وحدود؛ عمل فردي يظهر مساهمة الطالب."}],"2-2-1-1":[{"id":"2-2-1-1-B01-A02","t":"يفسر المعلم استجابات الطلاب بحسب المهارة لا الانطباع أو السنة السابقة. يحدد حاجات وفئات دعم مرنة ويبين الأداء الذي استند إليه كل تفسير. يسجل نقص البيانات ويعيد النظر في التجميع عند تغير الأداء.","o":"كل حاجة أو تجميع مقرون بأداء معلوم؛ لا تصنيف ثابت للطالب أو حكم من بيانات ناقصة."},{"id":"2-2-1-1-B03-A02","t":"يطبق المعلم الأداة في ظروف تساعد على قراءة الأداء المطلوب، ويحفظ الأعمال وتاريخها. ويقوّمها بالمعايير المحددة، ويناقش ما يختلف في تقديره ليتحقق من اتساق التطبيق، دون افتراض مراجع مستقل أو درجة رسمية جديدة.","o":"نتائج ختامية يمكن تفسيرها ومحك يطبق باتساق؛ اختلاف المصححين يعالج من الأداء لا من المتوسط فقط."},{"id":"2-2-1-1-B03-A03","t":"يبين المعلم ما يتقنه الطلاب وما يحتاج إلى تعلم على مستوى المهارة والفئة، ويحدد توصية للتعليم أو الدعم في المرحلة التالية. ويحفظ صلتها بالنتيجة ويسلم المعلومات اللازمة للمعلم أو المسؤول الذي يتولى المتابعة عند تغير الفترة أو انتقال العمل.","o":"التوصية تحدد ناتجًا أو مهارة وحاجة ومسار متابعة؛ عبارة تحسين المستوى وحدها لا تكفي."}],"2-2-1-2":[{"id":"2-2-1-2-B01-A03","t":"يطبق المعلم الأدوات المناسبة ويجمع أعمالًا يعرف أصحابها وما تقيسه من تعلم. وإذا بقي ناتج بلا أداء يكشفه، يستكمل فحصه في مهمة قائمة تصلح لذلك أو يبين ما يتعذر، دون إنشاء اختبار مكرر تلقائيًا.","o":"لكل ناتج مفحوص أداء قابل للفحص أو فجوة معلنة؛ الخطة أو المهمة غير المنفذة لا تثبت التقويم."},{"id":"2-2-1-2-B01-A04","t":"يراجع المعلم تغطية النواتج وصلاحية الأداة والتطبيق. يميز خلل الأداة أو التطبيق ونقص الشاهد عن حاجة التعلم الحقيقية، ويصحح ما ثبت. يفسر النتيجة الصالحة ويوجه دعمًا مناسبًا أو يحفظ الحكم معلقًا إذا لم تكف الأدلة.","o":"قرار عن الناتج مبني على أداء صالح ومحك معلوم؛ لا حكم من أداة مختلة أو تغطية شكلية."}],"2-2-1-3":[{"id":"2-2-1-3-B01-A01","t":"يتحقق المعلم من مصدر النتائج والفئة والفترة وطريقة الحكم على الأداء، ويفحص نقص الرصد واختلاف الأدوات والظروف. ويصحح ما يستطيع تصحيحه ويبين ما يمنع المقارنة قبل تفسير النتيجة.","o":"بيانات مناسبة للتحليل وحدود مقارنة معلومة؛ لا يعامل غياب الدرجة كصفر أو يجمع ما لا يقارن بصمت."},{"id":"2-2-1-3-B01-A02","t":"يفصل المعلم النتائج بحسب الناتج والفئة ولا يكتفي بمتوسط المدرسة. يصف نمط الأداء ويقترح تفسيرًا قابلًا للاختبار. يختبر الفرضية بأعمال إضافية عند الحاجة، ويفصل السبب المثبت عما لم يتضح بعد.","o":"فجوة ونمط وتفسير مسند أو فرضية معلقة؛ انخفاض الدرجة وحده لا يثبت السبب."},{"id":"2-2-1-3-B01-A03","t":"يحدد المعلم من يحتاج إلى دعم أو إثراء وما يحتاج إلى تغيير في التعليم أو أداة التقويم، ويبين سبب القرار من الأداء. ويراجع اختلاف القرارات في الحالات المتشابهة حتى لا يبقى تفاوت بلا تفسير.","o":"قرار مبرر يميز الحاجات؛ وجود درجة فاصلة غير موثقة لا يتحول إلى محك رسمي."},{"id":"2-2-1-3-B02-A03","t":"يعيد المعلم فحص الناتج المستهدف بقدر مناسب من المقارنة ويسجل المساعدة والظروف. يقارن الاستجابة أو عدمها، ولا يستدل من حضور البرنامج على التحسن. يقرر الاستمرار أو تعديل الدعم أو إعادة التشخيص، ويربطه بدورة المتابعة التالية دون إنشاء مهمة تشغيلية.","o":"أداء لاحق وقرار مسند؛ عدم التحسن وتعذر المقارنة يبقيان ظاهرين دون نسبة سببية مؤكدة."}],"2-2-1-4":[{"id":"2-2-1-4-B01-A03","t":"يتيح المعلم تعديل العمل أو محاولة أو مهمة لاحقة، ويقارن الأداء الأول واللاحق بمعايير واضحة. ويبين التحسن أو استمرار التعثر أو ما يمنع المقارنة. وعند عدم التحسن يفحص فهم التوجيه والوقت والوصول والمهمة، ويعدل ما تدعمه المعلومات ثم يعيد المتابعة.","o":"أداء أول وتعليق وأداء لاحق منسوبان للطالب والفترة؛ المقارنة معللة، وعدم التحسن محفوظ ويستدعي متابعة مناسبة."}]},"TLD-07":{"2-1-1-1":[{"id":"2-1-1-1-B01-A01","t":"يعرض المعلم مهمة قصيرة من هدف الدرس، ويسمع تفسير الطلاب ويرصد من تعوقه التعليمات أو المصدر أو وسيلة الإجابة. يراجع معلومات الدعم المسموح بها ويسأل الطالب عما يساعده دون وصم.","o":"عمل أول مع وصف العائق وسياقه؛ تمييز حاجة الوصول من فجوة المهارة، وبيان ما يحتاجه المتقدم."},{"id":"2-1-1-1-B01-A04","t":"يفحص المعلم أداءً لاحقًا في الهدف نفسه مع تكييف معلوم، ويقارن المشاركة والفهم والاستقلال لدى من تلقوا الدعم والمتقدمين. يبقي ما نفع ويعدل ما لم يفتح فرصة تعلم فعلية.","o":"عمل أول وآخر ووصف المساعدة وقرار استمرار أو تغيير التكييف؛ لا بيانات شخصية في العرض."}],"2-1-1-5":[{"id":"2-1-1-5-B01-A02","t":"يعد المعلم مهمة تتطلب أداءً ومنتجًا وتفسيرًا، ويحدد ما يدل على صحة التطبيق ومعقوليته وما يحتاجه من أدوات وأمان ومساعدة للمشاركة. ويعلم المتطلب الجديد ويوفر موارد التنفيذ داخل المدرسة.","o":"وصف مهمة وموارد ومحك يفرق إتمام المنتج من فهم التطبيق."},{"id":"2-1-1-5-B01-A03","t":"ينفذ الطلاب المهمة ويشرحون ما اختاروه وكيف تحققوا من النتيجة. يتابع المعلم خطواتهم ويقدم دعمًا محددًا، ثم يطلب من كل طالب تفسيرًا أو جزءًا مستقلًا يظهر تعلمه.","o":"منتج وأداء وتفسير فردي، مع الخطأ والتعديل والمساعدة."},{"id":"2-1-1-5-B01-A04","t":"يعرض المعلم موقفًا مشابهًا يغير البيانات أو القيد بما يحتاج اختيارًا من الفكرة نفسها. يفحص تفسير الطالب ومعقولية حله وما احتاجه من تلميح، ويعيد تعليم الصلة التي لم تنتقل.","o":"تطبيق لاحق وتفسير يبين ما انتقل وحدود الموقف الجديد."}],"2-1-1-6":[{"id":"2-1-1-6-B01-A01","t":"يسمع معلم العربية قراءة مناسبة ويطلب فهم كلمة وفكرة وكتابة قصيرة من محتوى الصف. يميز تعرف الكلمات والطلاقة ذات المعنى والفهم والتعبير، ويحدد دعمًا أو إثراءً من دليل فعلي.","o":"قراءة وإجابة وكتابة مؤرخة عند الاستخدام؛ موضع حاجة محدد لا تصنيف دائم."},{"id":"2-1-1-6-B01-A04","t":"يعيد معلم العربية فحص المهارة بنص مناسب آخر وكتابة قصيرة مع مقدار مساعدة معلوم. يقارن دقة القراءة والفهم والتعبير، ويقرر استمرار الدعم أو تغييره أو تخفيفه ويراقب من لم يستفد.","o":"مقارنة مهارية من أعمال مستقلة وقرار لاحق؛ لا نسبة نتيجة مختلقة."},{"id":"2-1-1-6-B02-A01","t":"يعرض معلم الرياضيات مهمة مقدار أو تمثيل أو عملية مناسبة للمقرر، ويطلب تفسير الحل ومعقوليته. يميز خطأ معنى العدد أو القيمة أو العلاقة من خطأ إجراء أو قراءة المسألة.","o":"حل وتمثيل وشرح يكشفان نمط الخطأ أو العمق المتاح للمتقن."},{"id":"2-1-1-6-B02-A04","t":"يفحص المعلم مهمة عددية أخرى في المهارة نفسها مع تفسير مستقل، ويقارن معنى الحل وصحته ومعقوليته والمساعدة. يقرر ما يعاد تعليمه وما يمكن توسيعه ويتابع بقاء المهارة في درس لاحق.","o":"عملان مناسبان ومحك تفسير وقرار تعليم لاحق؛ لا قياس بالسرعة وحدها."}],"2-1-1-7":[{"id":"2-1-1-7-B01-A01","t":"يعد المعلم سؤالًا من مادته يحتاج إلى تحليل أو استنتاج أو تقويم أو حل مشكلة، ويحدد المعرفة اللازمة وما يجعل الإجابة مقنعة من رأي ودليل وتفسير للعلاقة بينهما. ويتيح أكثر من حل إذا سمحت المسألة بذلك.","o":"مهمة ومحك يكشفان التفكير المطلوب، مع تهيئة المعرفة اللازمة."},{"id":"2-1-1-7-B01-A03","t":"يفحص المعلم تفسير الطالب ودليله والعلاقة بينهما، ويقدم سؤالًا يساعده على تعديل نقطة واضحة. ثم يفحص عملًا آخر ليرى جودة التبرير واختيار الحل والحاجة إلى التلميح.","o":"حجة أولى ومعدلة وتفسير لاحق مستقل مع حدود المقارنة."},{"id":"2-1-1-7-B03-A03","t":"يعرض الطالب جوابًا يربطه بالدليل ويشرح كيف جمعه وما لا يسمح باستنتاجه. يناقش المعلم الطريقة والنتيجة ويطلب تصحيحًا عند تجاوز الدليل، ويحفظ الطلاب ما بقي سؤالًا.","o":"نتيجة وتفسير للطريقة وإحالات وحدود؛ عمل فردي يظهر مساهمة الطالب."}],"2-1-1-8":[{"id":"2-1-1-8-B01-A03","t":"يتابع المعلم المهارة في موقف تعلم لاحق، ويصف ما فعله الطالب وما احتاجه من تذكير، ويستمع إلى تفسيره. يراجع مع الطالب خطوة نافعة ويعيد التدريب أو يطلب دعمًا مختصًا وفق الحاجة.","o":"ملاحظة سياقية لاحقة وتأمل اختياري وقرار دعم؛ لا ملف علني للمشاعر."},{"id":"2-1-1-8-B02-A03","t":"يراجع الطلاب مع المعلم موقف التعاون: ما الذي ساعد على الفهم وما الذي سيغيرونه في المحاولة المقبلة. يقدم المعلم ملاحظة محددة ويتيح ممارسة لاحقة، ويلاحظ جودة الحوار وتقليل التذكير.","o":"ملاحظة أولى ومراجعة وممارسة لاحقة مع أثر تعديل في التواصل."}],"2-1-1-9":[{"id":"2-1-1-9-B01-A01","t":"يستمع المعلم إلى رأي الطلاب في معنى المهمة وصعوبتها وما يساعدهم على البدء، ويقابل ذلك بأعمالهم وملاحظة المحاولة والعودة بعد الخطأ. يصوغ عائقًا محتملًا فقط إذا تأيد، وإلا يسجل عدم وضوحه.","o":"صوت طالب متاح وملاحظة وعمل يميز فهم المطلوب والتحدي والوصول والشعور بالأمان."},{"id":"2-1-1-9-B01-A04","t":"يقارن المعلم خبرة الطلاب ومشاركتهم وأعمالهم واستمرار محاولتهم في تعلم لاحق، ويتابع من لم يستفد. يعدل التحدي أو معنى المهمة أو الدعم وفق الأدلة، مع إبقاء العوامل الأخرى واحتمال عدم وضوح السبب.","o":"رأي اختياري وعمل لاحق وملاحظة استجابة لدى فئات مختلفة وقرار تعديل."}],"2-2-1-1":[{"id":"2-2-1-1-B01-A01","t":"يحدد المعلم ما يلزم معرفته عن بداية تعلم طلابه ويختار أداة تناسب المهارة والفئة. يطبقها مع التكييف الملائم ويجمع الأداء قبل تفسير اختلاف المستويات. يفحص إن كانت النتيجة تميز الحاجة؛ تشابه الدرجات إشارة للفحص وليس دليلًا قاطعًا على عيب الأداة.","o":"أداة وأعمال يمكن بها تفسير مستويات البداية؛ إذا لم تتضح الفروق يختبر ملاءمة الأسئلة والتطبيق قبل التصنيف."},{"id":"2-2-1-1-B02-A01","t":"يراجع من يتولى متابعة التعليم مع المعلمين أعمال تقويم فعلية لمعرفة حاجتهم إلى اختيار الأداة وطريقة الحكم على الأداء وتطبيقها. ويطلب المدير تدريبًا عمليًا ممن يملك الخبرة اللازمة، ثم تراجع الاستفادة في تطبيق المعلم. ولا يعاد تدريب يتقن المعلم عمله لمجرد توحيد البرنامج.","o":"استخدام مناسب للأداة في عمل تعليمي؛ الحضور أو الشهادة وحدهما لا يثبتان الكفاية، والوكيل المنسق ليس مدربًا تلقائيًا."},{"id":"2-2-1-1-B02-A02","t":"يختار المعلم أداة تكشف الحاجة أثناء التعلم ويحدد سبب ملاءمتها. يوظف تقويمًا ذاتيًا أو أقرانًا أو أداءً أو مشروعًا أو ملفًا بحسب الحاجة؛ لا يفرضها كلها. يجمع أداءً وملاحظة يبينان ما يعرفه المتعلم وما يحتاجه.","o":"نتيجة مفيدة عن الحاجة؛ تنوع الأسماء أو جمع ملف أعمال دون تفسير ليس دليلًا كافيًا."},{"id":"2-2-1-1-B03-A01","t":"يربط المعلم الأسئلة والمهام الختامية بما يريد تقويمه من تعلم، ويراجع ما يغيب من النواتج وما يأخذ أكثر من حقه. ويحدد كيف يحكم على الإجابة وطريقة التطبيق والتعديلات التي يحتاجها الطلاب قبل الاستخدام.","o":"أداة ختامية مناسبة ومحك معروف؛ الأداة المشتركة مع2-2-1-2 تحفظ بإحالة لكن حكم المستويات مستقل عن حكم تغطية النواتج."},{"id":"2-2-1-1-B03-A02","t":"يطبق المعلم الأداة في ظروف تساعد على قراءة الأداء المطلوب، ويحفظ الأعمال وتاريخها. ويقوّمها بالمعايير المحددة، ويناقش ما يختلف في تقديره ليتحقق من اتساق التطبيق، دون افتراض مراجع مستقل أو درجة رسمية جديدة.","o":"نتائج ختامية يمكن تفسيرها ومحك يطبق باتساق؛ اختلاف المصححين يعالج من الأداء لا من المتوسط فقط."}],"2-2-1-2":[{"id":"2-2-1-2-B01-A01","t":"يحصر المعلم النواتج المستهدفة من المنهج والفترة التي يدرسها الطلاب. يقابلها بخطة التوزيع القائمة ويصحح النقص أو خطأ الفترة. يثبت نطاق التقويم دون إنشاء نواتج إضافية أو اشتراط اكتمال المصدر المساند كحاجز لازم.","o":"قائمة تعكس المصدر والفترة والمنهج فعلًا؛ حفظت التبعية المساندة لخريطة النواتج دون تحويلها إلى إلزام جديد."},{"id":"2-2-1-2-B01-A02","t":"يختار المعلم لكل ناتج أداة وطريقة حكم تكشف المعرفة أو المهارة أو القيمة التي يتضمنها. ويتحقق من صلاحية الأداة الورقية أو العملية للأداء المطلوب، ويبين سبب الاختيار ويستفيد من التدريب المتاح دون نسخه أو فرض جميع أنواع الأدوات.","o":"الأداة والمحك يلائمان طبيعة الناتج؛ لا يخترع سلم رسمي أو ناتج قيمي خارج المصدر."},{"id":"2-2-1-2-B01-A03","t":"يطبق المعلم الأدوات المناسبة ويجمع أعمالًا يعرف أصحابها وما تقيسه من تعلم. وإذا بقي ناتج بلا أداء يكشفه، يستكمل فحصه في مهمة قائمة تصلح لذلك أو يبين ما يتعذر، دون إنشاء اختبار مكرر تلقائيًا.","o":"لكل ناتج مفحوص أداء قابل للفحص أو فجوة معلنة؛ الخطة أو المهمة غير المنفذة لا تثبت التقويم."},{"id":"2-2-1-2-B01-A04","t":"يراجع المعلم تغطية النواتج وصلاحية الأداة والتطبيق. يميز خلل الأداة أو التطبيق ونقص الشاهد عن حاجة التعلم الحقيقية، ويصحح ما ثبت. يفسر النتيجة الصالحة ويوجه دعمًا مناسبًا أو يحفظ الحكم معلقًا إذا لم تكف الأدلة.","o":"قرار عن الناتج مبني على أداء صالح ومحك معلوم؛ لا حكم من أداة مختلة أو تغطية شكلية."}],"2-2-1-3":[{"id":"2-2-1-3-B01-A01","t":"يتحقق المعلم من مصدر النتائج والفئة والفترة وطريقة الحكم على الأداء، ويفحص نقص الرصد واختلاف الأدوات والظروف. ويصحح ما يستطيع تصحيحه ويبين ما يمنع المقارنة قبل تفسير النتيجة.","o":"بيانات مناسبة للتحليل وحدود مقارنة معلومة؛ لا يعامل غياب الدرجة كصفر أو يجمع ما لا يقارن بصمت."},{"id":"2-2-1-3-B02-A02","t":"ينفذ المعلم التدخل في مهمات المادة والطلاب الذين يتولى تعليمهم ويوثق الأداء الفعلي أو تعذر التنفيذ. يفحص إن كان الخلل في التعليم أو الأداة أو التطبيق ويعدل ما تؤيده الأدلة. يحفظ علاقة التعديل بالسبب ولا يسجل التغيير الشكلي نجاحًا أو تقويمًا وظيفيًا.","o":"تعديل أو دعم منفذ مرتبط بالحاجة والسبب المدعوم، مع مخرج يمكن متابعته."},{"id":"2-2-1-3-B02-A03","t":"يعيد المعلم فحص الناتج المستهدف بقدر مناسب من المقارنة ويسجل المساعدة والظروف. يقارن الاستجابة أو عدمها، ولا يستدل من حضور البرنامج على التحسن. يقرر الاستمرار أو تعديل الدعم أو إعادة التشخيص، ويربطه بدورة المتابعة التالية دون إنشاء مهمة تشغيلية.","o":"أداء لاحق وقرار مسند؛ عدم التحسن وتعذر المقارنة يبقيان ظاهرين دون نسبة سببية مؤكدة."}],"2-2-1-4":[{"id":"2-2-1-4-B01-A01","t":"يفحص معلم كل مادة أعمال طلابه على أساس التعلم المطلوب ومعايير تقويمه، ويحدد ما يتقنه الطالب وما يحتاج إلى تحسينه في عمله نفسه. ويقدم ملاحظة يفهمها ويكيف لغتها أو وسيلتها، ويتحقق من الفهم ويحفظ العمل في موضعه بدل تكرار نسخه.","o":"تربط الملاحظة بسطر أو خطوة في عمل الطالب وبمحك معلوم، ويشرح الطالب موضع الإتقان والتحسين؛ إن عجز يُعاد التوضيح ويسجل التعثر."},{"id":"2-2-1-4-B01-A03","t":"يتيح المعلم تعديل العمل أو محاولة أو مهمة لاحقة، ويقارن الأداء الأول واللاحق بمعايير واضحة. ويبين التحسن أو استمرار التعثر أو ما يمنع المقارنة. وعند عدم التحسن يفحص فهم التوجيه والوقت والوصول والمهمة، ويعدل ما تدعمه المعلومات ثم يعيد المتابعة.","o":"أداء أول وتعليق وأداء لاحق منسوبان للطالب والفترة؛ المقارنة معللة، وعدم التحسن محفوظ ويستدعي متابعة مناسبة."}]}},"stages":[{"stage":"الابتدائية","school":"الضرم الابتدائية","ref":"REF-2025-S-29327","source":"خطة التحسين — منصة تميز الرقمية، هيئة تقويم التعليم والتدريب"},{"stage":"المتوسطة","school":"الضرم المتوسطة","ref":"REF-2025-S-29454","source":"خطة التحسين — منصة تميز الرقمية، هيئة تقويم التعليم والتدريب"},{"stage":"الثانوية","school":"الضرم الثانوية - مسارات","ref":"REF-2025-S-M3929637","source":"خطة التحسين — منصة تميز الرقمية، هيئة تقويم التعليم والتدريب"}],"cards":[{"id":"ADM-02/م1/1","k":"rec","rec":"ADM-02","dom":"م1","domt":"البرامج المستضافة في هذا السجل","t":"حكايات الوطن المصورة (برنامج 16): خطة النشاط، صور التنفيذ","own":"رائد النشاط","names":["عبدالله سعد الدوسري"],"when":"الفصل الأول · الأسابيع 4 إلى 5","lv":"تنفيذ","form":null,"roles":["رائد النشاط"],"ind":["1-1-1-1","1-1-1-2","1-2-1-1","1-2-1-2","1-2-1-3","1-2-1-4","1-2-1-5","1-3-1-1","1-3-1-2","1-3-1-3","1-4-1-4","1-4-1-5","1-4-1-6","1-4-1-7","1-5-1-2","3-2-1-1","3-2-1-4","3-2-1-7"]},{"id":"ADM-02/م1/2","k":"rec","rec":"ADM-02","dom":"م1","domt":"البرامج المستضافة في هذا السجل","t":"السلامة الرقمية (برنامج 17): كشوف الحضور، نسخة الرسالة المرسلة","own":"الموجه الطلابي","names":["خالد الفديع فيحان الشريف","فايز مساعد فواز الدوسري"],"when":"الفصل الثاني · الأسابيع 2 إلى 4","lv":"تنفيذ","form":null,"roles":["الموجه الطلابي"],"ind":["1-1-1-1","1-1-1-2","1-2-1-1","1-2-1-2","1-2-1-3","1-2-1-4","1-2-1-5","1-3-1-1","1-3-1-2","1-3-1-3","1-4-1-4","1-4-1-5","1-4-1-6","1-4-1-7","1-5-1-2","3-2-1-1","3-2-1-4","3-2-1-7"]},{"id":"ADM-02/م1/3","k":"rec","rec":"ADM-02","dom":"م1","domt":"البرامج المستضافة في هذا السجل","t":"مجلس صوت الطالب (برنامج 18): محاضر المجلس" let S = {view:"home", tab:store.get("coverageTab","req"), q:"", stage:store.get("stage", (B.stages[0]||{}).stage)};
const stack = [];
function go(view, extra){stack.push(Object.assign({},S));S=Object.assign({},S,{view},extra||{});render();window.scrollTo(0,0)}
function back(){S = stack.pop() || {view:"home",tab:S.tab,q:"",stage:S.stage};render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

const role = ()=>settings.myRole;
const forRole = c => role()==="الكل" || c.roles.includes(role());

/* ---------- عناصر مشتركة ---------- */
function codeTxt(c){return `<bdi dir="rtl">${esc(String(c||"").replace(/\//g," / "))}</bdi>`}
function lvPill(l){return `<span class="lv lv-${esc(l)}">${esc(l)}</span>`}
function roleBar(){
  return `<div class="rolebar noprint"><label for="roleSel">صفتي</label>
    <select id="roleSel">${["الكل",...B.roles].map(r=>`<option ${r===role()?"selected":""}>${esc(r)}</option>`).join("")}</select>
    <span class="small muted">تظهر البطاقات المسندة إلى هذه الصفة</span></div>`}
function bindRole(){const s=$("#roleSel");if(s)s.onchange=()=>{settings.myRole=s.value;saveSettings();render()}}
function cardRow(c, opts={}){
  let src = "";
  if(c.k==="rec") src = `${esc(c.rec)} · ${esc(c.domt||"")}`;
  if(c.k==="prg") src = `برنامج في الخطة التشغيلية · يُحفظ في ${esc(c.rec)}`;
  if(c.k==="imp") src = `خطة التحسين · ${esc(c.stage)} · الإجراء ${c.n}`;
  return `<button type="button" class="card" data-card="${esc(c.id)}">
    <div class="meta">${lvPill(c.lv)}${c.k!=="imp"?`<span class="code" style="direction:rtl">${codeTxt(c.id)}</span>`:""}${opts.hideSrc?"":`<span>${src}</span>`}</div>
    <div class="t">${md(c.t)}</div>
    <div class="meta"><span>المنفذ: ${esc(c.own||"—")}</span>${c.when?`<span>· ${esc(c.when)}</span>`:""}${c.week?`<span>· ${esc(c.term||"")} ${esc(c.week)}</span>`:""}</div>
    <span class="go">وثّق ←</span></button>`}

function requirementIds(values){return Array.isArray(values)?[...new Set(values.filter(v=>(typeof v==="number"||typeof v==="string")&&/^\d+$/.test(String(v))).map(Number).filter(v=>Number.isInteger(v)&&v>=1&&v<=REQUIREMENTS.length))]:[]}
function coverageBoard(){const rows=store.get("board",[]);return Array.isArray(rows)?rows.filter(x=>x&&typeof x.id==="string"&&x.id.trim()&&Object.hasOwn(CARD,x.card)):[]}
function requirementTarget(id){const all=store.get("coverageTargets",{}),n=Number(all&&all[id]);return Number.isInteger(n)&&n>=1&&n<=9999?n:4}
function coverageRows(){
  const unique=new Map(coverageBoard().map(ev=>[ev.id,ev]));
  return REQUIREMENTS.map(r=>{const files=[...unique.values()].filter(ev=>requirementIds(ev.requirementIds).includes(r.id));
    const approved=files.filter(ev=>["معتمد","معتمد مع ملاحظة"].includes(ev.decision)).length;
    const pending=files.filter(ev=>!ev.decision).length,returned=files.filter(ev=>ev.decision==="يُعاد مع توجيه").length,target=requirementTarget(r.id);
    return {...r,files,approved,pending,returned,target,complete:approved>=target};});
}
function requirementTile(r,next=false){return `<button type="button" class="panel requirement-card ${next?"next":""}" data-requirement="${r.id}" aria-label="المتطلب ${r.id}: ${esc(r.title)}، معتمد ${r.approved} من ${r.target}"><span class="requirement-meta"><span>المتطلب ${r.id}</span><span>${r.complete?"مكتمل التغطية":next?"المتطلب التالي":"غير مكتمل"}</span></span><h2>${esc(r.title)}</h2><span>اعتُمد ${r.approved} من ${r.target} شواهد</span><progress value="${Math.min(r.approved,r.target)}" max="${r.target}" aria-label="تغطية المتطلب ${r.id}"></progress><span class="requirement-meta"><span>المتبقي ${Math.max(0,r.target-r.approved)}</span><span>للمراجعة ${r.pending}</span><span>مُعاد ${r.returned}</span></span><span class="small muted">${esc(r.owner)}</span></button>`}

    ev.requirementIds=requirementIds([...(previous?.requirementIds||[]),...requirementIds(ev.requirementIds),current]);
    boardAdd(ev);loaded++;if(!ev.requirementIds.length)unlinked++;
  }catch(err){rejected++}}
  if(S.view==="requirement"&&current&&S.requirement===current)refreshRequirement(current);else if(S.view==="home")paintRes();

};

/* ---------- التاريخ ---------- */
const HFMT = (()=>{try{return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"})}catch(e){return null}})();
const WFMT = (()=>{try{return new Intl.DateTimeFormat("ar-SA-u-nu-latn",{weekday:"long"})}catch(e){return null}})();
const GFMT = (()=>{try{return new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"long",year:"numeric"})}catch(e){return null}})();
function d8(iso){const [y,m,d]=String(iso||"").split("-").map(Number);return y?new Date(y,m-1,d,12):null}
function fmtH(iso){const d=d8(iso);if(!d)return "";let h=HFMT?HFMT.format(d):iso;h=h.replace(/\s*هـ$/,"")+"هـ";return h}
function fmtG(iso){const d=d8(iso);if(!d)return iso||"";return GFMT?GFMT.format(d).replace(/\s*م$/,"")+"م":iso}
function fmtDay(iso){const d=d8(iso);return d&&WFMT?WFMT.format(d):""}
function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayISO(){return isoOf(new Date())}
/* سبب عدم صلاحية التاريخ يوم عمل، أو "" إن كان يوم دوام */
function dayBlock(iso){
  const d=d8(iso); if(!d) return "اختر التاريخ";
  if(iso>todayISO()) return "تاريخ في المستقبل: الشاهد يوثّق ما نُفّذ فعلًا";
  if(settings.yearStart && iso<settings.yearStart) return "قبل بداية العام الدراسي";
  if((settings.weekend||[]).includes(d.getDay())) return WEEKDAYS[d.getDay()]+" إجازة نهاية الأسبوع";
  const h=(settings.holidays||[]).find(([a,b])=>iso>=a&&iso<=b); if(h) return h[2]+" ("+(h[0]===h[1]?fmtH(h[0]):fmtH(h[0])+" – "+fmtH(h[1]))+")";
  return "";
}
function lastSchoolDay(){const d=new Date();for(let i=0;i<60;i++){const iso=isoOf(d);if(!dayBlock(iso))return iso;d.setDate(d.getDate()-1)}return todayISO()}

function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function compress(file,max=1400){
  const url=URL.createObjectURL(file);
  try{const im=await loadImage(url);const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL("image/jpeg",0.8)}
  finally{URL.revokeObjectURL(url)}
}
$("#fileCamera").onchange=$("#filePhoto").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{const src=await compress(f);
    if(phTarget==null) EV.photos.push({src,cap:""}); else EV.photos[phTarget].src=src;
    paintPhotos();check()}catch(err){toast("تعذر فتح الصورة. جرّب صورة بصيغة JPG أو PNG.")}
};
async function openBlur(ix){
  const p=EV.photos[ix]; const im=await loadImage(p.src);
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="in"><b>اسحب مستطيلًا فوق الوجه أو الاسم لطمسه</b><canvas id="bc"></canvas><div class="bar" style="margin:0"><button type="button" class="btn" id="bDone">تم</button><button type="button" class="btn ghost" id="bUndo">تراجع</button><button type="button" class="btn ghost" id="bCancel">إلغاء</button></div></div>`;
  document.body.appendChild(m);
  const cv=$("#bc",m), g=cv.getContext("2d"); cv.width=im.naturalWidth; cv.height=im.naturalHeight; g.drawImage(im,0,0);
  const hist=[g.getImageData(0,0,cv.width,cv.height)]; let st=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);st=pt(e)};
  cv.onpointermove=e=>{if(!st)return;const [x,y]=pt(e);g.putImageData(hist[hist.length-1],0,0);g.strokeStyle="#ffcc00";g.lineWidth=Math.max(3,cv.width/250);g.strokeRect(st[0],st[1],x-st[0],y-st[1])};
  cv.onpointerup=e=>{if(!st)return;const [x,y]=pt(e);g.putImageData(hist[hist.length-1],0,0);
    const x0=Math.max(0,Math.min(st[0],x)),y0=Math.max(0,Math.min(st[1],y)),w=Math.min(cv.width-x0,Math.abs(x-st[0])),h=Math.min(cv.height-y0,Math.abs(y-st[1]));st=null;
    if(w<6||h<6)return; const bs=Math.max(10,Math.round(Math.max(w,h)/8));
    const data=g.getImageData(x0,y0,w,h);
    for(let by=0;by<h;by+=bs)for(let bx=0;bx<w;bx+=bs){let r=0,gg=0,b=0,n=0;
      for(let yy=by;yy<Math.min(by+bs,h);yy++)for(let xx=bx;xx<Math.min(bx+bs,w);xx++){const o=(yy*w+xx)*4;r+=data.data[o];gg+=data.data[o+1];b+=data.data[o+2];n++}
      g.fillStyle=`rgb(${r/n|0},${gg/n|0},${b/n|0})`;g.fillRect(x0+bx,y0+by,Math.min(bs,w-bx),Math.min(bs,h-by))}
    hist.push(g.getImageData(0,0,cv.width,cv.height))};
  $("#bUndo",m).onclick=()=>{if(hist.length>1){hist.pop();g.putImageData(hist[hist.length-1],0,0)}};
  $("#bCancel",m).onclick=()=>m.remove();
  $("#bDone",m).onclick=()=>{p.src=cv.toDataURL("image/jpeg",0.82);m.remove();paintPhotos()};
}

function EV_ITEM(ev){return (ev.evItem||"").replace(/[.]$/,"")}
function sent(s){s=String(s||"").trim().replace(/\s+/g," ");if(!s)return "";return /[.!؟?:]$/.test(s)?s:s+"."}
function pick(arr,seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;return arr[h%arr.length]}
function describe(ev){
  const c=CARD[ev.card]; const day=fmtDay(ev.date), hd=fmtH(ev.date);
  const who = ev.actor.trim()+(ev.actorRole.trim()?"، "+ev.actorRole.trim()+"،":"");
  const bt = ev.ben.trim();
  const ben = bt? (" "+(bt.startsWith("ال")?"لل"+bt.slice(2):"ل"+bt)+(ev.count?`، وعددهم ${ev.count}`:"")) : (ev.count?` لعدد ${ev.count} من المستفيدين`:"");
  let frame="";
  if(c.k==="rec") frame = `ضمن ${ev.recName} (${ev.rec})${ev.domt?"، في مجال «"+ev.domt+"»":""}`;
  if(c.k==="prg") frame = `ضمن برنامج «${c.t}» في الخطة التشغيلية للمدرسة`;
  if(c.k==="imp") frame = `تنفيذًا للإجراء ${c.n} من خطة التحسين للمرحلة ${c.stage}`;
  const item = c.t.replace(/\*\*/g,"").replace(/\s*\(ن-\d\d\)/g,"").replace(/[.]$/,"");
  const what = c.k==="imp" ? (ev.step? `والخطوة المنفذة منه: «${ev.step.replace(/[.؛]$/,"")}».` : "")
             : c.k==="prg" ? (EV_ITEM(ev)? `ويثبت هذا الشاهد بند «${EV_ITEM(ev)}» من شواهد البرنامج.` : "") : pick([`ويثبت هذا الشاهد بند «${item}».`,`ويوثّق الشاهد بند «${item}» من بنود السجل.`],ev.id||"");
  const openers=[
    `نفّذ ${who} يوم ${day} ${hd}${ben}، ${frame}.`,
    `في يوم ${day} ${hd} نفّذ ${who}${ben}، ${frame}.`,
    `${frame}، نفّذ ${who} يوم ${day} ${hd}${ben}.`];
  const p=[(pick(openers,ev.id||ev.created)+(what?" "+what:"")).replace(/،،/g,"،").replace(/،\./g,".").replace(/\s+،/g,"،")];
  p.push(sent(ev.did));
  if(ev.note.trim()) p.push(pick(["وسجّل المنفذ بعد التنفيذ: ","ومما لاحظه المنفذ: "],ev.id)+sent(ev.note));
  if(ev.before.trim()&&ev.after.trim()) p.push(`وقيس ${ev.measure.trim()||"الأداء"} قبل التنفيذ وبعده: ${ev.before.trim()} قبل، و${ev.after.trim()} بعد.`);
  return p;
}

function packCodeOf(ev){const c=CARD[ev.card];return c.k==="imp" ? `ADM-13/${c.stage}/${c.n}` : (ev.evCode||c.id)}
function fileBase(ev){return [packCodeOf(ev),ev.date,ev.actor,ev.id].join("__").replace(/\//g,"_").replace(/\s+/g,"-")+(ev.review&&ev.review.decision?"__مراجع":"")}

let DL; const dlReady = (window.claude&&window.claude.use? window.claude.use("downloads").catch(()=>null):Promise.resolve(null)).then(d=>DL=d);
async function saveFile(name,data){
  await dlReady;
  if(DL){try{await DL.save({filename:name,data});toast("حُفظ الملف")}catch(e){if(e&&e.code!=="declined")toast("تعذر الحفظ هنا: "+(e.message||e.code||""))}return}
  const blob=data instanceof Blob?data:new Blob([data],{type:name.endsWith(".json")?"application/json":"application/octet-stream"});
  const a=document.createElement("a");a.hidden=true;a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportPdf(ev){
  await dlReady;
  const btn=$("#bPdf"); btn.disabled=true; btn.textContent="يجري التجهيز…";
  try{
    if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    if(!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const host=document.createElement("div");host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff";
    host.innerHTML=sheetHTML(ev);document.body.appendChild(host);
    await Promise.all([...host.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    densify(host); const el=host.firstElementChild;
    const cv=await window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:794});
    host.remove();
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({orientation:"p",unit:"mm",format:"a4",compress:true});
    // احتوِ الشاهد كاملًا في A4 واحدة؛ فرق التقريب لا ينشئ صفحة إضافية.
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const scale=Math.min(pw/cv.width,ph/cv.height);
    const width=cv.width*scale, height=cv.height*scale;
    pdf.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",(pw-width)/2,0,width,height);
    await saveFile(fileBase(ev)+".pdf", pdf.output("blob"));
    toast("نزل الملف. أرسله إلى المنسق مع ملف الشاهد");
  }catch(e){toast("تعذر تجهيز PDF. تحقق من اتصال الإنترنت لتحميل أدوات التصدير، ثم أعد المحاولة.")}
  finally{btn.disabled=false;btn.textContent="تنزيل PDF"}
}

/* ---------- لوحة المساهمة ---------- */
const boardName = value => String(value==null?"":value).trim().replace(/\s+/g," ");
function boardAdd(ev){
  if(!ev || typeof ev.card!=="string" || !Object.hasOwn(CARD,ev.card))return;
  const text = value => typeof value==="string" || typeof value==="number" ? String(value) : "";
  const rv=ev.review||{};
  const item={id:text(ev.id),actor:boardName(text(ev.actor)),actorRole:text(ev.actorRole),rec:text(ev.rec),card:ev.card,
    kind:text(ev.kind),inds:Array.isArray(ev.inds)?ev.inds.filter(x=>typeof x==="string"):[],level:text(ev.level),date:text(ev.date),
    decision:text(rv.decision),reviewLevel:text(rv.level),reviewedAt:text(rv.date),photos:(ev.photos||[]).length};
  const data=store.get("board",[]), rows=Array.isArray(data)?data:[];
  const at=rows.findIndex(x=>x.id===item.id);
  const previousRequirements=at>=0?requirementIds(rows[at].requirementIds):[];
  if(at<0)rows.push(item);
  else if(!rows[at].decision || item.decision)rows[at]=item;
  const saved=rows.find(x=>x.id===item.id);
  if(saved)saved.requirementIds=Object.hasOwn(ev,"requirementIds")?requirementIds(ev.requirementIds):previousRequirements;
  store.set("board",rows);
}
function boardRows(){
  const members=new Map(), weights={"مرجع":1,"تنفيذ":1,"ممارسة":2,"أثر":3};
  const data=store.get("board",[]);
  for(const ev of Array.isArray(data)?data:[]){
    const name=boardName(ev.actor);
    if(!members.has(name))members.set(name,{name,role:ev.actorRole,submissions:0,withPhotos:0,withoutPhotos:0,unknownPhotos:0,approved:0,pending:0,returned:0,points:0,inds:new Set()});
    const m=members.get(name);if(!m.role)m.role=ev.actorRole;
    m.submissions++;if(ev.photos>0)m.withPhotos++;else if(ev.photos===0)m.withoutPhotos++;else m.unknownPhotos++;
    if(ev.decision==="معتمد" || ev.decision==="معتمد مع ملاحظة"){
      m.approved++;m.points+=weights[ev.reviewLevel||ev.level]||0;
      (ev.inds||[]).forEach(x=>m.inds.add(x));
    }else if(!ev.decision)m.pending++;
    else if(ev.decision==="يُعاد مع توجيه")m.returned++;
  }
  return [...members.values()].sort((a,b)=>b.submissions-a.submissions || b.approved-a.approved || a.name.localeCompare(b.name,"ar"));
}

  $("#bk").onclick=back;
  $("#b_min").onchange=e=>{if(!e.target.validity.valid || e.target.value==="")return;settings.boardMin=+e.target.value;saveSettings();setTimeout(()=>{if(S.view==="board")viewBoard()},0)};
  $("#b_import").onclick=()=>$("#fileBoard").click();
  $("#b_csv").onclick=()=>{
    const cells=[["الاسم","الصفة","التسليمات","بمرفقات","بلا مرفقات","مرفقات غير معروف","معتمد","قيد المراجعة","مُعاد","النقاط","المؤشرات"],
      ...rows.map(m=>[m.name,m.role,m.submissions,m.withPhotos,m.withoutPhotos,m.unknownPhotos,m.approved,m.pending,m.returned,m.points,m.inds.size])];
    const csv="\uFEFF"+cells.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
    saveFile("لوحة-المساهمة.csv",csv);
  };
  $("#b_clear").onclick=()=>{$("#b_confirm").hidden=false};
