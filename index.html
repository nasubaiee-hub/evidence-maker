قرار يبين ما تحسن وما بقي."}],"1-2-1-4":[{"id":"1-2-1-4-B01-A01","t":"يرصد المعلمون والموجه الطلابي أنماط السلوك وسياقها من ملاحظات وأعمال مناسبة، ويميزون الملاحظة من تفسيرها.","o":"وصف سلوك وسياق وفئة تحتاج دعمًا دون وصم."},{"id":"1-2-1-4-B01-A02","t":"يصمم الموجه والمعلمون وقاية تعلم السلوك البديل، ويهيئون المشاركة للموهوبين وذوي الإعاقة بحسب حاجتهم الفعلية.","o":"برنامج يحدد المهارة السلوكية والتكييف والشاهد."},{"id":"1-2-1-4-B01-A03","t":"يمارس الطلاب السلوك المستهدف في مواقف مدرسية بإرشاد المعلم، ويتابع الموجه وصول الوقاية واستجابتهم.","o":"ممارسة سلوك في موقف يومي مع وصف المساعدة."},{"id":"1-2-1-4-B02-A01","t":"يناقش الموجه حاجة الطالب مع من يشاركون في تعليمه ودعمه، ويحدد ما يمكن تقديمه تربويًا وما يحتاج إلى طلب خدمة من مختص، ويتبع طريقة الإحالة التي تعتمدها المدرسة.","o":"قرار دعم أو إحالة مسند لشاهد ومرجع إجراء."},{"id":"1-2-1-4-B02-A02","t":"ينفذ المعلم والموجه دعمًا يراعي سبب الحالة ويشرحان للطالب السلوك البديل وطريقة ممارسته، وينسقان ما يلزم مع الأسرة.","o":"خطوة دعم مفهومة للطالب وعمل يبين استجابته."},{"id":"1-2-1-4-B02-A03","t":"يقارن المعلم والموجه ملاحظات قبل الدعم وبعده في مواقف متقاربة، ويراجعان أثر المساعدة والظروف.","o":"مقارنة سلوك مفسرة دون ادعاء سببية منفردة."}],"1-5-1-1":[{"id":"1-5-1-1-B02-A01","t":"يتحقق المدير والموجه من طريقة الرصد والإبلاغ وطلب الخدمة التي تعتمدها المدرسة، ويستخدمان التعليمات نفسها عند متابعة التنمر بدل إنشاء إجراء مواز لا تعتمده الجهة المختصة.","o":"مسار مصدره وجهته واضحان مع حفظ PEND-D01."},{"id":"1-5-1-1-B02-A02","t":"يتولى المختص معالجة الحالة وفق الإجراء المعتمد، ويقوم كل مشارك بما يخصه من حماية وطلب خدمة ومتابعة. وتحفظ المعلومات اللازمة لدى المسؤولين عن الحالة، ولا تتاح لمن لا يحتاجها لعمله.","o":"استجابة وإحالة ضمن الاختصاص دون عرض تفاصيل الحالة."},{"id":"1-5-1-1-B02-A03","t":"يتابع الموجه والمختص استمرار أمان الطالب وتنفيذ المعالجة ضمن دورهما، ويرفعان الحاجة الباقية للجهة المعنية.","o":"متابعة أمان ودعم وقرار من المختص عند اللزوم."}],"1-5-1-2":[{"id":"1-5-1-2-B02-A01","t":"يوفر المدير والموجه قنوات وصول آمنة ومفهومة، ويراجعان ما قد يمنع الطالب من استخدامها وييسران بديلًا مناسبًا.","o":"قناة يعرفها الطلاب ويستطيعون استخدامها دون اختبار واقعة حقيقية في العرض."},{"id":"1-5-1-2-B02-A02","t":"يتولى المختص التحقق والاستجابة وفق المسار المشترك مع حقوق المتعلم، ويؤدي المعلم والمدير دوريهما المقررين دون مواجهة غير مأمونة بين الأطراف.","o":"إحالة واستجابة ضمن مصدر الإجراء؛ التفاصيل في الملف المقيد."},{"id":"1-5-1-2-B02-A03","t":"يراجع الموجه والمختص تكرار الأذى واستمرار أمان الطالب في المواقف المختلفة بعد الاستجابة ويحددان الدعم التالي.","o":"متابعة لاحقة متعددة المواقف وقرار دعم."}],"3-2-1-5":[{"id":"3-2-1-5-B01-A01","t":"يحدد مسؤول متابعة السلوك مصادر الوقائع والفئة والفترة والقواعد التي تخصها، ويتحقق من صحة البيانات وما ينقصها قبل الحكم.","o":"تعريف قياس واضح"},{"id":"3-2-1-5-B01-A02","t":"يقرأ المختص مظاهر الالتزام والتعثر في سياقاتها، ويميز تسجيل الواقعة عن تفسير سببها أو الحكم على جميع المتعلمين.","o":"نتيجة التزام قابلة للتتبع"},{"id":"3-2-1-5-B01-A03","t":"يتعاون المعنيون في دعم المتعثر ومراجعة الاستجابة، وتعود النتيجة إلى الإجراءات والبرامج المناسبة ضمن الصلاحية.","o":"دعم وتغير التزام"},{"id":"3-2-1-5-B02-A01","t":"يقوم صاحب متابعة المواظبة بالرجوع إلى مصدر الحضور الصحيح وتحديد الفترة والفئة وطريقة تفسير الحالات.","o":"تعريف حضور وفترة"},{"id":"3-2-1-5-B02-A02","t":"يراجع المعنيون الانتظام وأثر العوائق والاستجابة، ويصحح صاحب المصدر ما يتعارض من وقائع قبل بناء الحكم.","o":"نتيجة حضور وحالات متكررة"},{"id":"3-2-1-5-B02-A03","t":"تتابع المدرسة الاتجاه اللاحق والدعم المتبقي، وتحفظ بيانات الحالات في نطاقها مع استقلال حكم الحضور عن السلوك.","o":"دعم وتحسن حضور"}]},"ADM-07":{"1-1-1-1":[{"id":"1-1-1-1-B02-A02","t":"يراجع المدير مع مصمم النشاط فرص الوصول والمشاركة، ويستشير المختص المتاح في تكييف العمل للموهوبين وذوي الإعاقة عند وجودهم؛ يبين البديل الذي يحفظ الغرض.","o":"تصميم نشاط يوضح الفئات والحواجز والتكييف وطريقة التحقق من مشاركة المستهدفين دون أسماء في العرض."}],"1-2-1-4":[{"id":"1-2-1-4-B01-A02","t":"يصمم الموجه والمعلمون وقاية تعلم السلوك البديل، ويهيئون المشاركة للموهوبين وذوي الإعاقة بحسب حاجتهم الفعلية.","o":"برنامج يحدد المهارة السلوكية والتكييف والشاهد."},{"id":"1-2-1-4-B02-A02","t":"ينفذ المعلم والموجه دعمًا يراعي سبب الحالة ويشرحان للطالب السلوك البديل وطريقة ممارسته، وينسقان ما يلزم مع الأسرة.","o":"خطوة دعم مفهومة للطالب وعمل يبين استجابته."},{"id":"1-2-1-4-B03-A02","t":"يتيح المعلمون ورائد النشاط فرصًا متنوعة لإظهار السلوك الإيجابي، ويشجعون الجهد والتقدم دون استبعاد من يحتاج دعمًا.","o":"أعمال ومشاركة وتشجيع مرتبط بسلوك محدد."}],"1-2-1-5":[{"id":"1-2-1-5-B01-A01","t":"يبني رائد النشاط والمعلمون خطة إثراء تربط ميول الطلاب بفرص تعلم وتحدد الفئات والموارد والمسؤوليات والتوقيت.","o":"خطة تبين غرض الإثراء وفئاته وإحالته للخطة التشغيلية."},{"id":"1-2-1-5-B01-A02","t":"يقدم المعلمون ورائد النشاط خبرات خارج الصف يتعمق فيها الطالب في فكرة أو ينتج حلًا، مع ملاءمة الوقت والمكان والدعم.","o":"إنتاج أو أداء يبين ما أضافه الإثراء للتعلم."},{"id":"1-2-1-5-B01-A03","t":"ينظم رائد النشاط تشجيعًا معنويًا أو عينيًا تسمح به الصلاحية والموارد، ويربطه بالجهد والتعلم والمشاركة.","o":"معايير تشجيع وفرص معلنة دون كلفة مفترضة."},{"id":"1-2-1-5-B01-A04","t":"يراجع رائد النشاط من أتيحت لهم الفرصة ومن شاركوا وأسباب عدم المشاركة، ويعدل الحاجز الذي تؤيده الشواهد.","o":"تغطية ومراجعة عوائق ونتيجة معالجتها."},{"id":"1-2-1-5-B02-A01","t":"يجمع المعلم والمختص المتاح شواهد قدرات الطلاب وميولهم بوسائل مناسبة، ويفصل الملاحظة المدرسية عن التصنيف الرسمي للموهبة.","o":"عينات أداء وملاحظة وفرصة استكشاف أوسع."},{"id":"1-2-1-5-B02-A02","t":"يصمم المعلم والمختص خبرة أعمق تتصل بالشواهد، ويتيحان مراجعة المنتج وتطويره بدل تدريب متكرر لا يزيد تحديه.","o":"منتج نامٍ يبين قرار الطالب وتحسينه."},{"id":"1-2-1-5-B02-A03","t":"يوضح المعلم والمختص للطالب والأسرة غرض مقاييس الموهبة وشروطها من الجهة المنظمة، ويشجعان مشاركة مؤهلة دون وعد بنتيجة.","o":"تعريف صحيح واختيار أسري أو طلابي واعٍ بالمشاركة."},{"id":"1-2-1-5-B02-A04","t":"يحتفي المعلم ورائد النشاط بمنجز الطالب المثبت ويتيحان عرض تعلمه، مع تشجيع الآخرين على استكشاف قدراتهم.","o":"منجز موثق وتشجيع لا يحول المقارنة إلى وصم."},{"id":"1-2-1-5-B04-A01","t":"يبني الموجه الطلابي مع المعلمين خطة إرشاد أكاديمي ومهني تناسب عمر الطلاب ومرحلتهم واحتياجاتهم.","o":"خطة استكشاف وخيارات مناسبة للعمر ومصادر حديثة."},{"id":"1-2-1-5-B04-A02","t":"ينظم الموجه والمعلمون لقاءات ومهمات استكشاف تتيح للطالب فهم ميوله وخياراته، مع ترتيبات المشاركة لمن يحتاجها.","o":"تفسير الطالب لخيار وما يحتاج معرفته عنه."},{"id":"1-2-1-5-B04-A04","t":"يحدد المدير والموجه نوع مساهمة مؤسسة المجتمع والإذن الذي تحتاجه، ويحافظان على تعليق اعتماد الشراكة الرسمية إلى حين التحكيم.","o":"تحديد نوع التعاون ومرجع الإذن؛ لا توقيع أو نموذج بديل."},{"id":"1-2-1-5-B04-A03","t":"يشجع الموجه مشاركة الطلاب في الإرشاد بفرص عرض وتساؤل وتقدير جهد مناسبة دون إغراء بقرار بعينه.","o":"مشاركة واعية وفرص تشجيع تشمل الفئات."},{"id":"1-2-1-5-B04-A05","t":"يناقش الموجه الطالب في ما تعلمه عن الخيارات ومصادر معلوماتها والخطوة التالية، ويراجع ما يحتاجه من دعم.","o":"خلاصة طالب مبنية على معلومات مع بيان ما يزال مجهولًا."}],"1-3-1-3":[{"id":"1-3-1-3-B02-A01","t":"يفحص المعلم والمختص المتاح حاجات الفئات وخدمات المؤسسات التي يمكن أن تستجيب لها مع مراجعة مصدر معلومات الخدمة.","o":"صلة حاجة–خدمة وإتاحة مناسبة للفئات."},{"id":"1-3-1-3-B02-A02","t":"يعرف المسؤول المعني المجتمع المدرسي بالخدمات المناسبة وينظم استخدامها بعد استكمال الإذن الخاص بالنشاط.","o":"تعريف وإجراء وصول ومشاركة فعلية مأذونة."},{"id":"1-3-1-3-B02-A03","t":"يتابع المعلم والمختص أثر استفادة الفئات في تعلمها ومشاركتها، ويعدل تصميم الوصول إذا بقيت فئة خارج الفرصة.","o":"نتيجة للفئة مع بيان حدود البيانات والتغطية."}],"1-5-1-1":[{"id":"1-5-1-1-B01-A02","t":"يراجع المعلمون والموجه إتاحة التعلم والخدمات وعدالة التعامل ويسمعون من الطلاب ما يعيق مشاركتهم دون كشف حالاتهم.","o":"عائق محدد وخطوة إتاحة ومراجعة أثرها."},{"id":"1-5-1-1-B02-A01","t":"يتحقق المدير والموجه من طريقة الرصد والإبلاغ وطلب الخدمة التي تعتمدها المدرسة، ويستخدمان التعليمات نفسها عند متابعة التنمر بدل إنشاء إجراء مواز لا تعتمده الجهة المختصة.","o":"مسار مصدره وجهته واضحان مع حفظ PEND-D01."},{"id":"1-5-1-1-B02-A02","t":"يتولى المختص معالجة الحالة وفق الإجراء المعتمد، ويقوم كل مشارك بما يخصه من حماية وطلب خدمة ومتابعة. وتحفظ المعلومات اللازمة لدى المسؤولين عن الحالة، ولا تتاح لمن لا يحتاجها لعمله.","o":"استجابة وإحالة ضمن الاختصاص دون عرض تفاصيل الحالة."},{"id":"1-5-1-1-B02-A03","t":"يتابع الموجه والمختص استمرار أمان الطالب وتنفيذ المعالجة ضمن دورهما، ويرفعان الحاجة الباقية للجهة المعنية.","o":"متابعة أمان ودعم وقرار من المختص عند اللزوم."}],"2-1-1-1":[{"id":"2-1-1-1-B01-A01","t":"يعرض المعلم مهمة قصيرة من هدف الدرس، ويسمع تفسير الطلاب ويرصد من تعوقه التعليمات أو المصدر أو وسيلة الإجابة. يراجع معلومات الدعم المسموح بها ويسأل الطالب عما يساعده دون وصم.","o":"عمل أول مع وصف العائق وسياقه؛ تمييز حاجة الوصول من فجوة المهارة، وبيان ما يحتاجه المتقدم."}],"4-1-1-3":[{"id":"4-1-1-3-B01-A01","t":"يختار المعلم مهمة من منهج الصف، ويلاحظ من يستطيع رؤية العرض وفهم التواصل وبلوغ الأداة وإنتاج العمل. يميز عائق الوصول من عدم فهم الفكرة. يقترح للمختص تهيئة تحتاج تجهيزًا أو قرارًا فرديًا خارج صلاحية المعلم.","o":"مهمة محددة وحاجة بيئية وفئة وظيفية وأثر على المشاركة."},{"id":"4-1-1-3-B01-A03","t":"يعيد المعلم مهمة مناسبة بعد التهيئة، ويسجل ما رآه أو استعمله الطالب وما أنتجه، ومقدار المساعدة المعتادة. إذا بقي التعثر يفحص الفهم وطريقة العرض كلًا على حدة. يرفع للمختص ما استمر من حاجة إتاحة؛ ويعالج تعثر المفهوم بالتعليم المناسب.","o":"ملاحظة مهمة وعمل طالب أو وصف أداء، مع الدعم والعائق الباقي."}],"4-1-1-4":[{"id":"4-1-1-4-B01-A01","t":"يجمع مسؤول الخدمة والمعلم وصف ما يريد الطالب فعله وما يمنعه، ويحددان ما يخص المكان أو الأداة أو طريقة الوصول للخدمة. ويرسل كل جزء إلى الجهة التي تعالجه مع بيان صلته بالحاجة نفسها.","o":"حصر مشترك بمعرف حاجة وإحالات مستقلة للمرفق والتجهيز والخدمة."},{"id":"4-1-1-4-B01-A03","t":"يراجع المعني بالمرفق تجربة استخدام مألوفة بعد تأمينها: هل يصل المستهدف ويفهم طريقة الاستخدام ويحصل على الخصوصية والدعم المعتاد؟ يرفع ما بقي من عائق فني، ويعالج داخل صلاحية المدرسة توقيت فتح أو طريقة طلب أو توجيه ثبتت حاجته.","o":"نتيجة استعمال للمرفق مرتبطة بالحاجة الأصلية."},{"id":"4-1-1-4-B02-A03","t":"يطلب المعلم من المستهدف قراءة أو تسجيلًا أو تواصلًا أو مناولة تناسب هدف المهمة، ويتابع كيفية استعمال التجهيز وما بقي من عائق واجهة أو تحكم. يقترح للمختص تكييفًا يحتاجه المستهدف مع وصف الوظيفة بدل الاكتفاء بطلب جهاز آخر.","o":"مهمة وأداء يربطان منفعة التجهيز بالحاجة الأصلية."},{"id":"4-1-1-4-B03-A01","t":"يشرح مسؤول الخدمة كيف يطلب الطالب أو من يسانده الخدمة التي يحتاجها، ويتحقق من أن القناة مفهومة ومتاحة وتحفظ الخصوصية. ويطلب من الجهة المسؤولة تيسير القناة أو توفير الخدمة غير المتاحة، دون إنشاء خدمة علاجية أو التزام جديد من عنده.","o":"حاجة وقناة وخطوات مفهومة ونطاق خدمة مثبت عند التطبيق."},{"id":"4-1-1-4-B03-A02","t":"يراجع مسؤول الخدمة مع الطالب والجهة المقدمة لها هل تصل في وقت يساعده على الاستخدام والمشاركة. ويميز التأخر عن تقديم خدمة لا تناسب الحاجة، ثم يطلب تغيير القناة أو الوقت أو إعادة الطلب للجهة المناسبة بناء على السبب الذي يتضح.","o":"موقف تقديم موثق وطلب متعثر أو استجابة فعلية دون تفاصيل حساسة في العرض."},{"id":"4-1-1-4-B03-A03","t":"يسأل المعني المستفيد بوسيلة ميسرة: ما الذي أصبح ممكنًا؟ وما الذي بقي متعذرًا؟ ويربط الإجابة بالحاجة الأصلية وبملاحظة مسموحة إن أمكنت. يرفع طلب تحسين محددًا إذا لم تلب الحاجة، مع إبقاء السبب غير واضح عند تعارض الدليل.","o":"نتيجة استفادة وسؤال رضا مرتبط بالحاجة وإجراء تصحيح عند اللزوم."}]},"ADM-08":{"1-2-1-3":[{"id":"1-2-1-3-B01-A02","t":"يشرح المعلمون والموجه الطلابي توقعات الحضور والسلوك بمواقف وتواصل مناسب، ويستمعون إلى أسئلة الطلاب والأسر.","o":"تفسير الطالب أو الأسرة لما يتوقع ولطريقة طلب المساعدة."},{"id":"1-2-1-3-B02-A01","t":"يجمع مسؤول الحضور والمعنيون بالسلوك بياناتهم المسموح بها ويقابلونها بالسجل الأصلي قبل مناقشة الأنماط.","o":"بيانات حضور وسلوك محددة الفترة ومصدر التصحيح."},{"id":"1-2-1-3-B02-A02","t":"يناقش الموجه الطلابي الحالات المتكررة مع الطالب ومن يلزم من المعنيين، ويميز العائق الدراسي أو الأسري أو التنظيمي دون افتراض السبب.","o":"وصف حالة وفرضيات مؤيدة أو سبب غير محسوم."},{"id":"1-2-1-3-B02-A03","t":"يقدم الموجه والمعلم دعمًا يعالج السبب الذي تؤيده المعلومات. وإذا استدعت الحالة إجراءً نظاميًا، يرجع المسؤول عن المعالجة إلى التعليمات لتحديد الإجراء ومن يملك اتخاذه، قبل تطبيقه.","o":"دعم مرتبط بسبب ومرجع للإجراء النظامي عند استخدامه."},{"id":"1-2-1-3-B02-A04","t":"يراجع الموجه والمعلم انتظام حضور الطالب ومشاركته بعد المعالجة، ويقرران تعديل الدعم أو رفع ما يتجاوز اختصاصهما.","o":"متابعة لاحقة وقرار يبين ما تحسن وما بقي."}],"1-2-1-4":[{"id":"1-2-1-4-B02-A02","t":"ينفذ المعلم والموجه دعمًا يراعي سبب الحالة ويشرحان للطالب السلوك البديل وطريقة ممارسته، وينسقان ما يلزم مع الأسرة.","o":"خطوة دعم مفهومة للطالب وعمل يبين استجابته."}],"1-2-1-5":[{"id":"1-2-1-5-B04-A01","t":"يبني الموجه الطلابي مع المعلمين خطة إرشاد أكاديمي ومهني تناسب عمر الطلاب ومرحلتهم واحتياجاتهم.","o":"خطة استكشاف وخيارات مناسبة للعمر ومصادر حديثة."},{"id":"1-2-1-5-B04-A02","t":"ينظم الموجه والمعلمون لقاءات ومهمات استكشاف تتيح للطالب فهم ميوله وخياراته، مع ترتيبات المشاركة لمن يحتاجها.","o":"تفسير الطالب لخيار وما يحتاج معرفته عنه."},{"id":"1-2-1-5-B04-A04","t":"يحدد المدير والموجه نوع مساهمة مؤسسة المجتمع والإذن الذي تحتاجه، ويحافظان على تعليق اعتماد الشراكة الرسمية إلى حين التحكيم.","o":"تحديد نوع التعاون ومرجع الإذن؛ لا توقيع أو نموذج بديل."},{"id":"1-2-1-5-B04-A03","t":"يشجع الموجه مشاركة الطلاب في الإرشاد بفرص عرض وتساؤل وتقدير جهد مناسبة دون إغراء بقرار بعينه.","o":"مشاركة واعية وفرص تشجيع تشمل الفئات."},{"id":"1-2-1-5-B04-A05","t":"يناقش الموجه الطالب في ما تعلمه عن الخيارات ومصادر معلوماتها والخطوة التالية، ويراجع ما يحتاجه من دعم.","o":"خلاصة طالب مبنية على معلومات مع بيان ما يزال مجهولًا."}],"1-3-1-1":[{"id":"1-3-1-1-B01-A01","t":"ينسق المدير أعمالًا مشتركة تجمع المنسوبين بحسب اختصاصهم، ويشارك الطلاب والأسر حيث يتصل العمل بهم دون تكرار الأعمال القائمة.","o":"عمل مشترك بأدوار معلومة وإحالات إلى أصوله."},{"id":"1-3-1-1-B01-A02","t":"يتشارك أصحاب العمل حل مشكلة أو إنتاج مخرج، ويشرح كل طرف ما قدمه وكيف استفاد من الآخرين؛ ييسر المدير حوار الاختلاف.","o":"مخرج مشترك وأثر مساهمة كل طرف وطريقة حل الاختلاف."},{"id":"1-3-1-1-B01-A03","t":"يتيح المدير تشجيعًا منصفًا للمشاركة والتعاون وفق الصلاحية، ويظهر قيمة المساندة الأقل ظهورًا لا الإنجاز الفردي وحده.","o":"معايير تشجيع وتغطية للأدوار المختلفة."},{"id":"1-3-1-1-B01-A04","t":"يسأل المدير وأصحاب العمل المشاركين عن وضوح الأدوار واحترام الرأي وجودة التعاون، ويعالجون الاستبعاد أو تعارض المسؤولية الذي يظهره الدليل. يراجع المشاركون أيضًا الاحترام وتبادل المساندة والثقة في التعامل اليومي خارج المهمة المحددة.","o":"مخرج مشترك وخبرة المشاركين في الاحترام والدعم وصوت الأقل مشاركة، مع ملاحظة يومية أخرى وقرار تحسين."}],"1-3-1-2":[{"id":"1-3-1-2-B01-A01","t":"يحدد المعلمون والموجه موضوعات تستطيع الأسرة أن تسهم فيها لدعم تعلم ابنها واستكشاف مستقبله، من حاجة معلومة لا قائمة رسائل عامة.","o":"موضوع يتصل بتعلم الطالب وخطوة دعم مناسبة للأسرة."},{"id":"1-3-1-2-B01-A02","t":"يقدم المعلم والموجه شرحًا أو لقاءً أو مادة مناسبة للغة الأسرة ووقتها، ويبينان فيها نموذجًا لدعم التعلم دون أن تحل الأسرة واجب الطالب.","o":"مثال دعم واضح ووصول لطرق تواصل متنوعة."},{"id":"1-3-1-2-B01-A03","t":"يطلب المعلم من الأسرة شرح خطوة الدعم بلغتها، ويستمع إلى ما يصعب عليها ويغير الشرح أو البديل.","o":"فهم أسري وخطوة قابلة للتطبيق."},{"id":"1-3-1-2-B02-A01","t":"ينظم المدير والموجه قنوات تواصل معتمدة تراعي الوقت والخصوصية، ويوضحان كيف تصل الرسالة لمن يعنيه الموضوع.","o":"قنوات معلومة ومسؤول استجابة وحدود تداول."},{"id":"1-3-1-2-B02-A02","t":"يشارك المعلم الأسرة معلومات مفهومة عن عمل ابنها وما يمكن دعمه، دون كشف بيانات طلاب آخرين أو مقارنة تجرحه.","o":"رسالة مرتبطة بعمل الطالب وخطوة دعم محددة."},{"id":"1-3-1-2-B02-A04","t":"يناقش المعلم مع الأسرة ملاحظتها لعمل ابنها ومقدار مساعدتها له، ويحتفظ بشاهد مستقل من الطالب عند تقويم تعلمه.","o":"ملاحظة أسرية وعمل طالب يميز المساعدة من الاستقلال."},{"id":"1-3-1-2-B02-A03","t":"يتفق المعلم والموجه مع الطالب والأسرة على وصف المشكلة وخطوة مدرسية وأخرى منزلية ممكنة، مع حماية خصوصية الحالة.","o":"اتفاق واضح بأدوار مناسبة وشاهد متابعة."},{"id":"1-3-1-2-B02-A05","t":"يراجع المعلم مع الطالب والأسرة أثر الدعم في عمل لاحق ويعدل الخطوة التي لم تنفع أو لم يمكن تطبيقها.","o":"مقارنة أداء وحوار أسري وقرار تالٍ."},{"id":"1-3-1-2-B03-A01","t":"يتحقق المدير من الإجراء الذي يسمح بمساهمة الأسرة وخبرتها، وينظم المعلم مساهمة مرتبطة بهدف تعلم وتكافؤ الفرص.","o":"هدف ومساهمة وإذن عند لزومه؛ بلا أفضلية لابن المشارك."},{"id":"1-3-1-2-B03-A02","t":"يجمع الموجه أو المسؤول عن التواصل رأي الأسر بوسيلة مناسبة تشمل من لا يصل صوتهم عادة ويحفظ خصوصيتهم.","o":"رأي بمصدر وفئة وحدود تمثيل؛ دون تعميم من المستجيبين فقط."},{"id":"1-3-1-2-B03-A03","t":"يراجع المدير الملاحظات مع صاحب الخدمة ويحدد ما يمكن تحسينه وسبب تأجيل ما يتجاوز الإمكان أو الصلاحية.","o":"قرار مرتبط بملاحظة ومسؤول متابعة."},{"id":"1-3-1-2-B03-A04","t":"يبلغ المسؤول عن التواصل الأسر بما عولج من ملاحظاتها وما تعذر وسببه بلغة مفهومة، ويتيح الاستيضاح.","o":"تغذية راجعة للأسرة وأثرها في الثقة والتواصل."}],"1-5-1-1":[{"id":"1-5-1-1-B02-A01","t":"يتحقق المدير والموجه من طريقة الرصد والإبلاغ وطلب الخدمة التي تعتمدها المدرسة، ويستخدمان التعليمات نفسها عند متابعة التنمر بدل إنشاء إجراء مواز لا تعتمده الجهة المختصة.","o":"مسار مصدره وجهته واضحان مع حفظ PEND-D01."},{"id":"1-5-1-1-B02-A02","t":"يتولى المختص معالجة الحالة وفق الإجراء المعتمد، ويقوم كل مشارك بما يخصه من حماية وطلب خدمة ومتابعة. وتحفظ المعلومات اللازمة لدى المسؤولين عن الحالة، ولا تتاح لمن لا يحتاجها لعمله.","o":"استجابة وإحالة ضمن الاختصاص دون عرض تفاصيل الحالة."},{"id":"1-5-1-1-B02-A03","t":"يتابع الموجه والمختص استمرار أمان الطالب وتنفيذ المعالجة ضمن دورهما، ويرفعان الحاجة الباقية للجهة المعنية.","o":"متابعة أمان ودعم وقرار من المختص عند اللزوم."}],"1-5-1-2":[{"id":"1-5-1-2-B02-A01","t":"يوفر المدير والموجه قنوات وصول آمنة ومفهومة، ويراجعان ما قد يمنع الطالب من استخدامها وييسران بديلًا مناسبًا.","o":"قناة يعرفها الطلاب ويستطيعون استخدامها دون اختبار واقعة حقيقية في العرض."},{"id":"1-5-1-2-B02-A02","t":"يتولى المختص التحقق والاستجابة وفق المسار المشترك مع حقوق المتعلم، ويؤدي المعلم والمدير دوريهما المقررين دون مواجهة غير مأمونة بين الأطراف.","o":"إحالة واستجابة ضمن مصدر الإجراء؛ التفاصيل في الملف المقيد."},{"id":"1-5-1-2-B02-A03","t":"يراجع الموجه والمختص تكرار الأذى واستمرار أمان الطالب في المواقف المختلفة بعد الاستجابة ويحددان الدعم التالي.","o":"متابعة لاحقة متعددة المواقف وقرار دعم."}],"2-2-1-4":[{"id":"2-2-1-4-B02-A01","t":"يرسل المعلم، أو الشخص الذي ترسل المدرسة من خلاله المعلومات، وصفًا يخص أداء الطالب وخطوة تستطيع الأسرة مساندتها عبر القناة المعتمدة. ويتحقق من الوصول أو تعذره ويستخدم البديل الذي تسمح به المدرسة. وينسق المعلمون المواعيد لتجنب التضارب والإغراق، دون نشر بيانات طلاب آخرين.","o":"رسالة تخص الطالب وحده عبر قناة قائمة مخولة، وتحتوي وصفًا وخطوة قابلة للدعم؛ حالة الوصول أو تعذره معلومة."},{"id":"2-2-1-4-B02-A02","t":"يجمع معلم المادة استجابة المتعلم والأسرة، ويحدد إن كانت خطوة الدعم مناسبة لوقتهما ومعرفتهما وإمكاناتهما. يعدل الخطوة أو وسيلة التواصل عند ثبوت عائق، ويحفظ الدعم المدرسي للمتعلم إذا تعذر دعم الأسرة. يسجل الاستجابة أو عدمها ومحاولة التكييف، ويستخدم هذه المعلومات في المتابعة التالية دون افتراض تحسن من مجرد التعاون.","o":"متابعة توضح الخطوة المتفق عليها وحالة تطبيقها وملاءمتها، أو العائق ومحاولة التكييف؛ عدم الاستجابة مسجل دون إسقاط الطالب من الدعم المدرسي."},{"id":"2-2-1-4-B02-A03","t":"يحدث المعلم الأسرة بما يظهر في العمل اللاحق من تقدم أو تعثر، ويبين ما يقارن به والسبب، ويحدد الخطوة التالية للطالب والأسرة. وإذا غاب دليل التقدم يصرح بذلك، وتتابع المدرسة من تستمر حاجتهم وتفاوت التطبيق بين المواد والصفوف.","o":"رسالة تقدم مسندة إلى عمل لاحق أو تصرح بأن التقدم غير مثبت؛ الخطوة التالية محددة ومحمية الخصوصية."}]},"ADM-10":{"1-2-1-2":[{"id":"1-2-1-2-B01-A01","t":"يراجع المدير الميثاق الذي تعمل به المدرسة، ويناقش مع العاملين كيف يظهر الاحترام والعدل وحفظ السر في قراراتهم وتعليمهم وخدماتهم وتواصلهم اليومي.","o":"مرجع بإصداره وأمثلة سلوك مهني متفق على فهمها."},{"id":"1-2-1-2-B02-A01","t":"يحدد المدير مع أصحاب الاختصاص كيفية تطبيق القاعدة ومن يقرر عند اختلاف تفسيرها، ويرجع للجهة المختصة فيما يتجاوز المدرسة.","o":"إجراءات ومسار استفسار وحدود قرار محددة."}],"1-2-1-3":[{"id":"1-2-1-3-B01-A01","t":"يراجع المدير والموجه الطلابي قواعد السلوك والمواظبة التي تخص مرحلة المدرسة، ويوضحان للطلاب والأسر ما يطلب منهم ومن يجيب عن استفساراتهم.","o":"مرجع محدد وشرح مناسب للمرحلة وقناة استفسار."}],"1-3-1-3":[{"id":"1-3-1-3-B01-A05","t":"يصنف المدير مع صاحب الاختصاص المقترح إلى تواصل عام أو نشاط يحتاج إذنًا أو اتفاق رسمي، ويثبت المسار الذي ينطبق عليه.","o":"نوع تعاون وصاحب قرار ومرجع إجراء؛ تبقى الروابط المرشحة معلقة."},{"id":"1-3-1-3-B01-A02","t":"يعرض المدير مقترح الشراكة على جهة المراجعة والاعتماد التي تحددها تعليمات الشراكات قبل أي توقيع. وتبقى النماذج5و6 تنتظر التحكيم، ولا يستحدث هذا الوصف نموذجًا بديلًا عنها.","o":"إحالة للحكم السابق للتوقيع وحالته؛ لا إذن أو توقيع مفترض."}],"1-4-1-4":[{"id":"1-4-1-4-B01-A01","t":"يراجع المدير والمعلمون المعنيون متطلبات الرخصة من مصدر الهيئة وقت التطبيق، ويحدد كل معلم خطوة الدعم التي تخصه دون افتراض استحقاق أو مستوى.","o":"مرجع حالي وحاجة دعم بحسب التخصص والحالة."}],"1-4-1-6":[{"id":"1-4-1-6-B01-A01","t":"يتحقق المدير والمعنيون بالتقويم من إصدار الدليل والمعايير المطبقين، ويثبتون ما لم تحسم مطابقته بدل مزج نسخ مختلفة.","o":"مرجع محدد وحدود قراءة ومعلقات محفوظة."}],"1-5-1-1":[{"id":"1-5-1-1-B01-A01","t":"يراجع المدير والموجه تعليمات حقوق المتعلم وحمايته التي تعمل بها المدرسة، ويحددان الجهات المسؤولة عن الاستقبال والاستجابة. ولا تضيف هذه الصياغة موعد إبلاغ أو صلاحية جديدة إلى التفاصيل التي ما زالت تنتظر التحقق من مصدرها.","o":"مرجع بإصداره وجهات اختصاص وما لم يحسم منه."},{"id":"1-5-1-1-B02-A01","t":"يتحقق المدير والموجه من طريقة الرصد والإبلاغ وطلب الخدمة التي تعتمدها المدرسة، ويستخدمان التعليمات نفسها عند متابعة التنمر بدل إنشاء إجراء مواز لا تعتمده الجهة المختصة.","o":"مسار مصدره وجهته واضحان مع حفظ PEND-D01."}],"1-5-1-2":[{"id":"1-5-1-2-B02-A02","t":"يتولى المختص التحقق والاستجابة وفق المسار المشترك مع حقوق المتعلم، ويؤدي المعلم والمدير دوريهما المقررين دون مواجهة غير مأمونة بين الأطراف.","o":"إحالة واستجابة ضمن مصدر الإجراء؛ التفاصيل في الملف المقيد."}]},"ADM-11":{"1-4-1-4":[{"id":"1-4-1-4-B01-A01","t":"يراجع المدير والمعلمون المعنيون متطلبات الرخصة من مصدر الهيئة وقت التطبيق، ويحدد كل معلم خطوة الدعم التي تخصه دون افتراض استحقاق أو مستوى.","o":"مرجع حالي وحاجة دعم بحسب التخصص والحالة."},{"id":"1-4-1-4-B01-A02","t":"ينظم المدير والمختص المتاح تعريفًا متنوعًا بالتخصصات والمتطلبات ومصادر المعلومات، ويتيح الاستفسار.","o":"تعريف مفهوم ومصدر رسمي يحال إليه المعلم."},{"id":"1-4-1-4-B01-A03","t":"يوفر المدير وقتًا أو تعلمًا أو تشجيعًا يسمح به التنظيم، ويساعد المعلم على اختيار دعم يناسب حاجته دون وعد بترخيص.","o":"دعم مرتبط بحاجة وإمكان فعلي وصلاحية."}],"1-4-1-5":[{"id":"1-4-1-5-B01-A01","t":"يناقش المدير والمنسوبون أدلة العمل ونتائج التقويم التي يملك كل منهم الاطلاع عليها، ويحددون حاجة مهنية قابلة للتعلم.","o":"حاجة مرتبطة بممارسة وشاهد وصلاحية اطلاع."},{"id":"1-4-1-5-B01-A02","t":"يشارك المعلمون والإداريون في تحديد أهداف التطوير وطرائقه الملائمة لأعمالهم دون نقل معيار معلم إلى إداري.","o":"أهداف تعلم مهني ودور كل فئة في صياغتها."},{"id":"1-4-1-5-B01-A03","t":"يراجع المدير اتصال خطة التطوير بالحاجات والموارد، ثم يرفع الإصدار المحدد إلى جهة اعتماده التي تسميها تعليمات المدرسة.","o":"خطة ومرجع اعتماد يطابق نسختها."},{"id":"1-4-1-5-B02-A01","t":"ينسق المدير وأصحاب البرامج وقت التعلم المهني والتجريب والمتابعة على امتداد العام بحسب الحاجة والتقويم.","o":"تنظيم يتيح التعلم ثم تطبيقه دون تزاحم غير معالج."},{"id":"1-4-1-5-B02-A02","t":"يقدم المختص أو الزميل المتمكن شرحًا ونموذجًا ويتيح تجربة وتغذية راجعة، ويدعم المدير المشاركة الملائمة داخل المدرسة وخارجها.","o":"تجربة مهنية وتغذية راجعة وخطوة تطبيق في العمل."},{"id":"1-4-1-5-B02-A03","t":"يراجع المدير والمشاركون ما تعلموه وما طبقوه وما يحتاجون إليه بعد البرنامج، ويميزون الحضور من تغير الممارسة.","o":"شاهد تطبيق وحاجة دعم لاحق."},{"id":"1-4-1-5-B03-A01","t":"يتعاون المنسوبون في مجتمع تعلم يعالج سؤالًا من ممارسة فعلية، وييسر المدير الوقت والموارد وفق التنظيم القائم.","o":"سؤال مهني وأعمال مقارنة وقرار تعلم مشترك."},{"id":"1-4-1-5-B03-A02","t":"يجرب المعلمون معالجة تعليمية مناسبة ويجمعون أعمالًا قبلها وبعدها ضمن الإجراءات المسموحة، مع حماية البيانات وعدم نسبة سبب وحيد من مقارنة بسيطة.","o":"تجريب مفسر وحدود استدلال واضحة."},{"id":"1-4-1-5-B03-A03","t":"يطبق المشاركون ما دعمت الشواهد نفعه في نطاق مناسب، ويشرحون عناصره الأساسية وما يحتاج تكييفًا.","o":"تطبيق لاحق يبين ما نقل وما عدل وسببه."},{"id":"1-4-1-5-B03-A04","t":"يراجع المعلمون والمدير أثر التطبيق في جودة الممارسة وأعمال الطلاب، ويفحص الإداريون أثر تطويرهم في الخدمة التي يقدمونها.","o":"شاهد ممارسة ونتيجة مناسبة لكل دور."}],"1-4-1-1":[{"id":"1-4-1-1-B02-A01","t":"تحقق من مؤهلات كل دور تعليمي ومرجع إسناده","o":"مصفوفة تأهيل وإسناد"},{"id":"1-4-1-1-B02-A02","t":"قارن المهام المسندة بالتخصص والاختصاص المنطبق","o":"حالات توافق أو تعارض"},{"id":"1-4-1-1-B02-A03","t":"تحقق من أثر تصحيح الإسناد على انتظام التعلم","o":"إسناد مصحح ونتيجة مراجعة"}],"1-4-1-2":[{"id":"1-4-1-2-B02-A01","t":"تحقق من مؤهلات وخبرة العاملين ومرجع أدوارهم","o":"بيانات تأهيل ومرجع دور"},{"id":"1-4-1-2-B02-A02","t":"راجع توافق المهام مع التأهيل وحدد احتياجات الدعم","o":"توافق ومهارات تحتاج دعمًا"},{"id":"1-4-1-2-B02-A03","t":"راجع جودة الخدمة بعد المعالجة","o":"نتيجة مراجعة خدمة"}],"1-4-1-6":[{"id":"1-4-1-6-B01-A06","t":"يشرح المعنيون للمنسوبين والطلاب والأسر أدوارهم وحقوقهم في المشاركة بلغة تناسبهم قبل الجمع.","o":"فهم المشاركين ودور معلوم دون تدريب على إجابة متوقعة."},{"id":"1-4-1-6-B02-A01","t":"يستخدم المعنيون وسائل شرح وحوار مناسبة لمختلف المنسوبين على مدار العمل، ويستوضحون ما التبس من معنى التقويم.","o":"فهم دور التقويم وصلته بالتطوير."}],"1-2-1-2":[{"id":"1-2-1-2-B01-A02","t":"يناقش المنسوبون مواقف مهنية من أعمالهم، ويتيح المدير وسائل تعريف تناسب الأدوار المختلفة دون عرض حالات شخصية.","o":"تفسير مهني لموقف ومادة تعريف مناسبة للأدوار."},{"id":"1-2-1-2-B01-A04","t":"يطلب المدير من المشاركين تفسير الاستجابة المناسبة لموقف من اختصاصهم، ويعيد مناقشة ما التبس عليهم.","o":"استجابة مفسرة وتصحيح مفهوم مهني."}],"1-4-1-7":[{"id":"1-4-1-7-B01-A02","t":"يصمم صاحب كل عمل تحسينًا للأولوية التي يتولاها، ويحدد الخطوات والموارد والمسؤولين والوقت والدليل الذي يكشف النتيجة، ويبين صلته بالعمل الموجود في الخطة التشغيلية.","o":"خطة تحسين مستقلة مترابطة بعناصرها وإحالاتها."},{"id":"1-4-1-7-B02-A01","t":"ينفذ أصحاب الأعمال التدخل في الفئات والمواقف التي كشفتها الحاجة، ويكيفون الوسيلة مع حفظ الغرض.","o":"شاهد تطبيق فعلي وجودة وصول للفئة."},{"id":"1-4-1-7-B02-A03","t":"يقارن أصحاب العمل النتيجة بالبداية ويفحصون الزمن والتغطية، ويقررون استمرار التدخل أو تعديله أو جمع دليل آخر.","o":"مقارنة نتيجة وقرار لاحق دون حد مبتكر مخترع."}]},"ENV-01":{"4-2-1-1":[{"id":"4-2-1-1-B03-A03","t":"تتابع الإدارة إجراء الوقاية أو المعالجة المدرسية الذي تحدده الجهة الصحية للفئة والحالة، وتوضح دور العامل وطريقة طلب الخدمة. وتراجع التنفيذ وما يبقى دون تشخيص أو وصف علاج أو إضافة شرط تطعيم من المدرسة.","o":"تعليمات معتمدة من جهة محددة، وموقف تنفيذ محدود الصلاحية بلا بيانات صحية حساسة في العرض."}],"3-2-1-3":[{"id":"3-2-1-3-B01-A01","t":"يحدد المعلم ومسؤول الخدمة الصحية الممارسة التي تتطلبها مرحلة الطلاب وبيئتهم بالرجوع إلى التوجيه الصحي المختص، ويوضحان معناها وطريقة أدائها المناسبة.","o":"ممارسات ومواقف فحص"},{"id":"3-2-1-3-B01-A02","t":"تتيح المدرسة مورد الممارسة وفرصتها وتلاحظ أداء المتعلم، مع تحديد العائق الذي تستطيع معالجته أو رفعه إلى المختص.","o":"ملاحظات ممارسة وعوائق"},{"id":"3-2-1-3-B01-A03","t":"يتابع مسؤول الخدمة الممارسة والدعم وطلب المساعدة المتخصصة، ويتعاون مع الأسرة في خطوة ممكنة، دون تشخيص محلي.","o":"دعم وتهيئة مناسبة"},{"id":"3-2-1-3-B01-A04","t":"تراجع المدرسة قرائن الأداء والاستجابة وتحمي بيانات الحالات، وتفصل الالتزام الفعلي عن حضور برنامج أو توافر ملف.","o":"استمرار ممارسة"}]},"ENV-02":{"1-2-1-3":[{"id":"1-2-1-3-B02-A01","t":"يجمع مسؤول الحضور والمعنيون بالسلوك بياناتهم المسموح بها ويقابلونها بالسجل الأصلي قبل مناقشة الأنماط.","o":"بيانات حضور وسلوك محددة الفترة ومصدر التصحيح."},{"id":"1-2-1-3-B02-A02","t":"يناقش الموجه الطلابي الحالات المتكررة مع الطالب ومن يلزم من المعنيين، ويميز العائق الدراسي أو الأسري أو التنظيمي دون افتراض السبب.","o":"وصف حالة وفرضيات مؤيدة أو سبب غير محسوم."},{"id":"1-2-1-3-B02-A03","t":"يقدم الموجه والمعلم دعمًا يعالج السبب الذي تؤيده المعلومات. وإذا استدعت الحالة إجراءً نظاميًا، يرجع المسؤول عن المعالجة إلى التعليمات لتحديد الإجراء ومن يملك اتخاذه، قبل تطبيقه.","o":"دعم مرتبط بسبب ومرجع للإجراء النظامي عند استخدامه."},{"id":"1-2-1-3-B02-A04","t":"يراجع الموجه والمعلم انتظام حضور الطالب ومشاركته بعد المعالجة، ويقرران تعديل الدعم أو رفع ما يتجاوز اختصاصهما.","o":"متابعة لاحقة وقرار يبين ما تحسن وما بقي."}],"3-2-1-5":[{"id":"3-2-1-5-B01-A01","t":"يحدد مسؤول متابعة السلوك مصادر الوقائع والفئة والفترة والقواعد التي تخصها، ويتحقق من صحة البيانات وما ينقصها قبل الحكم.","o":"تعريف قياس واضح"},{"id":"3-2-1-5-B01-A02","t":"يقرأ المختص مظاهر الالتزام والتعثر في سياقاتها، ويميز تسجيل الواقعة عن تفسير سببها أو الحكم على جميع المتعلمين.","o":"نتيجة التزام قابلة للتتبع"},{"id":"3-2-1-5-B01-A03","t":"يتعاون المعنيون في دعم المتعثر ومراجعة الاستجابة، وتعود النتيجة إلى الإجراءات والبرامج المناسبة ضمن الصلاحية.","o":"دعم وتغير التزام"},{"id":"3-2-1-5-B02-A01","t":"يقوم صاحب متابعة المواظبة بالرجوع إلى مصدر الحضور الصحيح وتحديد الفترة والفئة وطريقة تفسير الحالات.","o":"تعريف حضور وفترة"},{"id":"3-2-1-5-B02-A02","t":"يراجع المعنيون الانتظام وأثر العوائق والاستجابة، ويصحح صاحب المصدر ما يتعارض من وقائع قبل بناء الحكم.","o":"نتيجة حضور وحالات متكررة"},{"id":"3-2-1-5-B02-A03","t":"تتابع المدرسة الاتجاه اللاحق والدعم المتبقي، وتحفظ بيانات الحالات في نطاقها مع استقلال حكم الحضور عن السلوك.","o":"دعم وتحسن حضور"}]},"ENV-03":{"3-2-1-4":[{"id":"3-2-1-4-B01-A01","t":"يحدد مسؤول النشاط فرصة مجتمعية أو تطوعية ذات غرض واضح، ويتحقق المدير من الموافقات والموارد وشروط المشاركة قبل التنفيذ.","o":"حاجات وفرص مشاركة مقترحة"},{"id":"3-2-1-4-B01-A04","t":"يوضح المعنيون الأدوار والفئات والإتاحة ومقدار المساندة، ويعالجون ما يمنع وصول المستهدفين قبل التنفيذ المأذون.","o":"فرص مخولة ومخرجات متفق عليها"},{"id":"3-2-1-4-B01-A02","t":"ينسق مسؤول النشاط التنفيذ ويراجع تنظيمه، ويحفظ ما يبين إتاحة المدرسة للفرصة مستقلًا عما يبين أداء الطالب فيها، مع الرجوع إلى العمل نفسه.","o":"فرص متاحة وبرامج تحفيز"},{"id":"3-2-1-4-B02-A04","t":"يؤدي المتعلم دوره في العمل الفعلي ويبين ما ينجزه، ويلاحظ صاحب النشاط مساهمته الفردية في المنتج أو الخدمة المشتركة.","o":"تعريف مشاركة ونطاق رصد"},{"id":"3-2-1-4-B02-A02","t":"يشرح المتعلم ما يتعلمه وما يفيد به غيره في حدود المهمة، ويفحص المعنيون الصلة بين المشاركة والنتاج دون نسب عمل الآخرين إليه.","o":"سجل مشاركة بأدوار ونطاق"},{"id":"3-2-1-4-B02-A03","t":"يراجع أصحاب الاختصاص الفائدة والعوائق وإمكان تحسين المشاركة، ويستمعون إلى المستفيد عند ملاءمة ذلك وإمكانه.","o":"نتيجة تنوع واتساع"},{"id":"3-2-1-4-B02-A05","t":"تحدد المدرسة الفرصة أو الدعم التالي وتتابع أثر التعديل، مع بقاء الشواهد في أصولها وأغراض الحكم مستقلة.","o":"نتيجة مساهمة وتعلم وقرار تطوير"}]},"ENV-S02":{"4-2-1-1":[{"id":"4-2-1-1-B02-A01","t":"يراجع المدير خطة الوقاية والطوارئ المعتمدة مع مسؤوليها، ويوضح أدوار الإشراف والتبليغ وعد الأشخاص ومساعدة من يحتاج والعودة للتعليم. ويحدد ما تغطيه من فصول ومعامل ومرافق وزوار، ويطلب تحديد المسارات والإجراءات الفنية من الجهة المختصة دون اختراع طريقة حمل أو إنقاذ أو إخلاء.","o":"نسخة الخطة المخولة وإحالات الأدوار الفعلية، ووصف فهم المعني لدوره دون نشر تفاصيل أمنية حساسة."},{"id":"4-2-1-1-B02-A02","t":"تنظم الإدارة توعية قصيرة وتدريبًا مأذونًا من الخطة، مع تعليمات بلغة العمر ووسيلة تواصل ميسرة ودعم المستفيد المقرر. يلاحظ المعنيون فهم التعليمات وأداء الأدوار وعد الأشخاص والعوائق؛ لا ينشئ المعلم خطرًا ولا يستخدم الطلاب في اختبار فني.","o":"هدف التوعية، وموافقة نطاق التدريب، وملاحظات أدوار ومشاركة واحتياجات لم تغط."},{"id":"4-2-1-1-B02-A03","t":"تراجع الإدارة ملاحظة التدريب مع صاحب الدور: هل تعثر التوجيه أم عد الأشخاص أم المساعدة أم صلاحية المسار؟ تصحح الشرح أو الإسناد داخل صلاحيتها، وترفع الجانب الفني، ثم تراجع أثر التصحيح في تدريب مأذون لاحق مناسب.","o":"ملاحظة وسؤال سبب وتعديل وموقف إعادة الفحص؛ لا نسب نجاح مخترعة."}],"4-1-1-2":[{"id":"4-1-1-2-B01-A02","t":"يقارن المسؤول الإداري والمعلم توزيع الأماكن بمتطلبات الدرس والعمر: فهم الطريق، بلوغ الأدوات، والإشراف والخصوصية. يرفع تقدير السعة أو التعديل الفني إلى المختص؛ ويقترح ترتيبًا مدرسيًا محددًا داخل المتاح.","o":"مراجعة عدد مرتبطة بمرجع مختص، ومراجعة ملاءمة عمرية موثقة."},{"id":"4-1-1-2-B03-A01","t":"يسأل المعلم المستفيد بوسيلة ميسرة عما يحتاج الوصول إليه، ثم يفحص بالغ مخول المسار والوجهة وطريقة الاستعمال قبل ملاحظة مشاركة آمنة. يطلب تقييمًا تخصصيًا للعائق الحركي أو الحسي أو التواصلي عند الحاجة.","o":"بطاقة مسار وعائق ووجهة ومساعدة معتادة، بلا أسماء في نسخة العرض."},{"id":"4-1-1-2-B03-A02","t":"يرسل المسؤول الإداري وصف الرحلة والمهمة المتعذرة والدعم المعتاد، ويقترح أقرب ترتيب تعليمي مأمون داخل صلاحية المدرسة. يرفع الحل الإنشائي أو الفني وصلاحية البديل للمختص؛ يوضح في الطلب لماذا لا يكفي تيسير المدخل وحده.","o":"تقييم إتاحة ومعالجة موثقة من مخول مع ما بقي منها."}],"4-1-1-3":[{"id":"4-1-1-3-B01-A02","t":"يختار المعلم تعديلًا مسموحًا في موضع العرض أو ترتيب النشاط، أو وسيلة مقررة يمكن للمستهدف استخدامها، مع حفظ هدف التعلم ووصول زملائه. يرفع الاحتياج الفني أو الفردي الذي لا يعالج بالترتيب المتاح؛ لا يشتري أو يعدل خارج التخويل.","o":"اختيار معالجة وأساسها وتنفيذها المخول."},{"id":"4-1-1-3-B02-A02","t":"ينسق المعلم مع محضر المختبر، أو الشخص الذي يتولى تجهيز النشاط في المدرسة، الأدوات وتوزيعها وحجزها بطريقة تتيح المشاركة. ويطلب تحقق الجهة الفنية من الجاهزية عند لزومه، ويرفع الإصلاح أو التجهيز المتخصص للجهة المسؤولة، ويعدل الموعد أو البديل وفق ما تسمح به التعليمات.","o":"تحقق جاهزية خاص بالنشاط وجدول إتاحة لا يزاحم احتياج فئة أخرى."}],"4-1-1-4":[{"id":"4-1-1-4-B01-A02","t":"يصف مسؤول الخدمة ما يتعذر على الطالب من وصول إلى تعلم أو لعب أو مرفق يحتاجه، وما يطلبه من تهيئة أو توضيح دون كشف بيانات شخصية. ويطلب من الجهة المختصة معالجة محددة، ويعرض عليها بديلًا لاستخدام المكان إذا أمكن انتظار موافقتها على سلامته.","o":"طلب محدد ورد ومعالجة مخولة أو نقص قائم."},{"id":"4-1-1-4-B02-A02","t":"يبين مسؤول الخدمة في طلب الإصلاح وظيفة الجهاز المتعطلة والمهمة التي تحتاجها، ويتابع الرد والتحقق الفني قبل إعادة الاستخدام. ويطلب البديل أو الاستكمال من الجهة التي توافق عليه، ويبين المعلم ما يمكن تنفيذه بالأداة المتاحة التي تسمح المدرسة باستعمالها.","o":"طلب وصيانة أو توريد ونتيجة تحقق مرتبطة بالفجوة."}],"4-2-1-2":[{"id":"4-2-1-2-B01-A02","t":"نفذ الفحوص الدورية عبر المختص وسجل نتائجها","o":"تقرير منفذ مرتبط بالأصل وتاريخه الفعلي وموقف فحص لم ينفذ."},{"id":"4-2-1-2-B02-A01","t":"حدد إجراءات البلاغ ومعالجة الأعطال وحماية المستخدمين وفق المختص","o":"بلاغ محدد الأصل، وتعليمات وضع الاستخدام أو طلبها، وإحالة المعالجة."}],"4-2-1-3":[{"id":"4-2-1-3-B01-A03","t":"يتابع المسؤول الإداري أو المعني بالخدمة المناطق أثناء استخدامها المعتاد ويصف الملاحظة ووقتها: اتساخ ظاهر، نقص مورد، تجمع نفايات، أو عائق يمنع الاستعمال. يستمع للمستفيد بوسيلة مناسبة دون تفتيش خصوصيته أو تصويره.","o":"ملاحظة محددة الموقع والوقت والخدمة والاستعمال، لا صور تحضيرية ليوم زيارة فقط."},{"id":"4-2-1-3-B01-A04","t":"تطلب الإدارة معالجة السبب الذي تؤيده الملاحظة: توقيت خدمة أو تغطية منطقة أو مورد أو إصلاح تسرب لدى المختص. تعيد المراجعة في وقت استخدام مشابه، وتتابع ما عاد دون تحميل الطلاب عمل المتعهد أو افتراض سبب سلوكي.","o":"ملاحظة ومعالجة ونتيجة مراجعة لاحقة، مع إحالة فنية إذا كان الأصل معطلًا."}]},"ENV-S03":{"4-2-1-1":[{"id":"4-2-1-1-B02-A01","t":"يراجع المدير خطة الوقاية والطوارئ المعتمدة مع مسؤوليها، ويوضح أدوار الإشراف والتبليغ وعد الأشخاص ومساعدة من يحتاج والعودة للتعليم. ويحدد ما تغطيه من فصول ومعامل ومرافق وزوار، ويطلب تحديد المسارات والإجراءات الفنية من الجهة المختصة دون اختراع طريقة حمل أو إنقاذ أو إخلاء.","o":"نسخة الخطة المخولة وإحالات الأدوار الفعلية، ووصف فهم المعني لدوره دون نشر تفاصيل أمنية حساسة."},{"id":"4-2-1-1-B02-A02","t":"تنظم الإدارة توعية قصيرة وتدريبًا مأذونًا من الخطة، مع تعليمات بلغة العمر ووسيلة تواصل ميسرة ودعم المستفيد المقرر. يلاحظ المعنيون فهم التعليمات وأداء الأدوار وعد الأشخاص والعوائق؛ لا ينشئ المعلم خطرًا ولا يستخدم الطلاب في اختبار فني.","o":"هدف التوعية، وموافقة نطاق التدريب، وملاحظات أدوار ومشاركة واحتياجات لم تغط."},{"id":"4-2-1-1-B02-A03","t":"تراجع الإدارة ملاحظة التدريب مع صاحب الدور: هل تعثر التوجيه أم عد الأشخاص أم المساعدة أم صلاحية المسار؟ تصحح الشرح أو الإسناد داخل صلاحيتها، وترفع الجانب الفني، ثم تراجع أثر التصحيح في تدريب مأذون لاحق مناسب.","o":"ملاحظة وسؤال سبب وتعديل وموقف إعادة الفحص؛ لا نسب نجاح مخترعة."}],"4-1-1-2":[{"id":"4-1-1-2-B01-A02","t":"يقارن المسؤول الإداري والمعلم توزيع الأماكن بمتطلبات الدرس والعمر: فهم الطريق، بلوغ الأدوات، والإشراف والخصوصية. يرفع تقدير السعة أو التعديل الفني إلى المختص؛ ويقترح ترتيبًا مدرسيًا محددًا داخل المتاح.","o":"مراجعة عدد مرتبطة بمرجع مختص، ومراجعة ملاءمة عمرية موثقة."},{"id":"4-1-1-2-B01-A03","t":"إذا أجاز التخويل تعديل وقت استعمال أو ترتيب أماكن، يجرب في نطاقه، ثم يراجع المسؤول الإداري والمعلم وصول المجموعة وبدء المهمة التعليمية. يقترح التغيير الذي يمس المكان فنيًا للجهة المعنية ولا ينفذه محليًا.","o":"تنظيم معتمد في نطاقه وملاحظة استخدام بعده."},{"id":"4-1-1-2-B03-A01","t":"يسأل المعلم المستفيد بوسيلة ميسرة عما يحتاج الوصول إليه، ثم يفحص بالغ مخول المسار والوجهة وطريقة الاستعمال قبل ملاحظة مشاركة آمنة. يطلب تقييمًا تخصصيًا للعائق الحركي أو الحسي أو التواصلي عند الحاجة.","o":"بطاقة مسار وعائق ووجهة ومساعدة معتادة، بلا أسماء في نسخة العرض."},{"id":"4-1-1-2-B03-A02","t":"يرسل المسؤول الإداري وصف الرحلة والمهمة المتعذرة والدعم المعتاد، ويقترح أقرب ترتيب تعليمي مأمون داخل صلاحية المدرسة. يرفع الحل الإنشائي أو الفني وصلاحية البديل للمختص؛ يوضح في الطلب لماذا لا يكفي تيسير المدخل وحده.","o":"تقييم إتاحة ومعالجة موثقة من مخول مع ما بقي منها."},{"id":"4-1-1-2-B03-A03","t":"بعد أن تؤكد الجهة الفنية إتاحة المسار للاستخدام، يلاحظ المعلم وصول الطالب إلى نشاط مألوف واستعمال المكان أو الأداة بمساعدته المعتادة، ويسأله عما يبقى صعبًا. ويرفع العائق وأثره إلى مسؤول الخدمة، دون مطالبة الطالب بتجربة قد تعرضه للخطر.","o":"نتيجة وصول واستعمال ودرجة المساعدة والعائق الباقي إن وجد."}]},"ENV-S04":{"4-2-1-1":[{"id":"4-2-1-1-B01-A02","t":"تعرض الإدارة الشهادة أو الإفادة على الجهة المعنية، وتطلب تحديد السريان والنطاق والملاحظات التي تحتاج متابعة. تجمع ملاحظات الاستخدام العادي كعائق في مسار أو تلف ظاهر وتبلغها، دون اختبار كهربائي أو إنشائي أو تشغيل معدات سلامة غير مخول.","o":"بيان سريان ونطاق، وملاحظات مرتبطة بمكانها وحكم الجهة المختصة."},{"id":"4-2-1-1-B01-A03","t":"يربط المسؤول الإداري كل ملاحظة بطلب معالجة، ويتابع المدير حماية المستخدمين وترتيب التعليم في الأماكن المسموح بها وفق تعليمات الحالة. يطلب تحقق المختص من المعالجة، ثم يستعين بالمعني بالمرفق لوصف عودة الاستعمال المعتاد.","o":"طلب ومعالجة وتحقق مختص، ووصف استعمال بعد الإذن؛ أو حاجة ما زالت مفتوحة."},{"id":"4-2-1-1-B02-A03","t":"تراجع الإدارة ملاحظة التدريب مع صاحب الدور: هل تعثر التوجيه أم عد الأشخاص أم المساعدة أم صلاحية المسار؟ تصحح الشرح أو الإسناد داخل صلاحيتها، وترفع الجانب الفني، ثم تراجع أثر التصحيح في تدريب مأذون لاحق مناسب.","o":"ملاحظة وسؤال سبب وتعديل وموقف إعادة الفحص؛ لا نسب نجاح مخترعة."}],"4-1-1-2":[{"id":"4-1-1-2-B03-A01","t":"يسأل المعلم المستفيد بوسيلة ميسرة عما يحتاج الوصول إليه، ثم يفحص بالغ مخول المسار والوجهة وطريقة الاستعمال قبل ملاحظة مشاركة آمنة. يطلب تقييمًا تخصصيًا للعائق الحركي أو الحسي أو التواصلي عند الحاجة.","o":"بطاقة مسار وعائق ووجهة ومساعدة معتادة، بلا أسماء في نسخة العرض."},{"id":"4-1-1-2-B03-A02","t":"يرسل المسؤول الإداري وصف الرحلة والمهمة المتعذرة والدعم المعتاد، ويقترح أقرب ترتيب تعليمي مأمون داخل صلاحية المدرسة. يرفع الحل الإنشائي أو الفني وصلاحية البديل للمختص؛ يوضح في الطلب لماذا لا يكفي تيسير المدخل وحده.","o":"تقييم إتاحة ومعالجة موثقة من مخول مع ما بقي منها."}],"4-1-1-3":[{"id":"4-1-1-3-B01-A02","t":"يختار المعلم تعديلًا مسموحًا في موضع العرض أو ترتيب النشاط، أو وسيلة مقررة يمكن للمستهدف استخدامها، مع حفظ هدف التعلم ووصول زملائه. يرفع الاحتياج الفني أو الفردي الذي لا يعالج بالترتيب المتاح؛ لا يشتري أو يعدل خارج التخويل.","o":"اختيار معالجة وأساسها وتنفيذها المخول."},{"id":"4-1-1-3-B02-A02","t":"ينسق المعلم مع محضر المختبر، أو الشخص الذي يتولى تجهيز النشاط في المدرسة، الأدوات وتوزيعها وحجزها بطريقة تتيح المشاركة. ويطلب تحقق الجهة الفنية من الجاهزية عند لزومه، ويرفع الإصلاح أو التجهيز المتخصص للجهة المسؤولة، ويعدل الموعد أو البديل وفق ما تسمح به التعليمات.","o":"تحقق جاهزية خاص بالنشاط وجدول إتاحة لا يزاحم احتياج فئة أخرى."}],"4-1-1-4":[{"id":"4-1-1-4-B02-A01","t":"تفحص الجهة الفنية وظيفة التجهيز قبل استخدامه عندما يحتاج إلى تحقق فني، ثم يستخدمه المعلم في مهمة ليميز بين عطل الجهاز وصعوبة واجهته أو نقص تعليم استعماله. ويحدد طلب الصيانة أو التهيئة أو الاستكمال بما يساعد الطالب على فعله.","o":"مقارنة حاجة وتجهيز ووظيفة وحالة استخدام."},{"id":"4-1-1-4-B02-A02","t":"يبين مسؤول الخدمة في طلب الإصلاح وظيفة الجهاز المتعطلة والمهمة التي تحتاجها، ويتابع الرد والتحقق الفني قبل إعادة الاستخدام. ويطلب البديل أو الاستكمال من الجهة التي توافق عليه، ويبين المعلم ما يمكن تنفيذه بالأداة المتاحة التي تسمح المدرسة باستعمالها.","o":"طلب وصيانة أو توريد ونتيجة تحقق مرتبطة بالفجوة."}],"4-2-1-2":[{"id":"4-2-1-2-B01-A02","t":"نفذ الفحوص الدورية عبر المختص وسجل نتائجها","o":"تقرير منفذ مرتبط بالأصل وتاريخه الفعلي وموقف فحص لم ينفذ."},{"id":"4-2-1-2-B02-A02","t":"تابع الإصلاح وسجل العمل المنفذ بدقة","o":"إحالة بلاغ إلى تقرير عمل محدد؛ بيان إصلاح أو جزء لم يستكمل."},{"id":"4-2-1-2-B02-A03","t":"تحقق عبر المختص من صلاحية الاستخدام وتحسن الظروف قبل إغلاق المعالجة","o":"نتيجة فحص إغلاق مختص، ووصف استعمال مأذون، وإحالة عودة خلل إن ظهرت."}]},"ENV-S05":{"4-2-1-1":[{"id":"4-2-1-1-B02-A01","t":"يراجع المدير خطة الوقاية والطوارئ المعتمدة مع مسؤوليها، ويوضح أدوار الإشراف والتبليغ وعد الأشخاص ومساعدة من يحتاج والعودة للتعليم. ويحدد ما تغطيه من فصول ومعامل ومرافق وزوار، ويطلب تحديد المسارات والإجراءات الفنية من الجهة المختصة دون اختراع طريقة حمل أو إنقاذ أو إخلاء.","o":"نسخة الخطة المخولة وإحالات الأدوار الفعلية، ووصف فهم المعني لدوره دون نشر تفاصيل أمنية حساسة."},{"id":"4-2-1-1-B02-A02","t":"تنظم الإدارة توعية قصيرة وتدريبًا مأذونًا من الخطة، مع تعليمات بلغة العمر ووسيلة تواصل ميسرة ودعم المستفيد المقرر. يلاحظ المعنيون فهم التعليمات وأداء الأدوار وعد الأشخاص والعوائق؛ لا ينشئ المعلم خطرًا ولا يستخدم الطلاب في اختبار فني.","o":"هدف التوعية، وموافقة نطاق التدريب، وملاحظات أدوار ومشاركة واحتياجات لم تغط."},{"id":"4-2-1-1-B02-A03","t":"تراجع الإدارة ملاحظة التدريب مع صاحب الدور: هل تعثر التوجيه أم عد الأشخاص أم المساعدة أم صلاحية المسار؟ تصحح الشرح أو الإسناد داخل صلاحيتها، وترفع الجانب الفني، ثم تراجع أثر التصحيح في تدريب مأذون لاحق مناسب.","o":"ملاحظة وسؤال سبب وتعديل وموقف إعادة الفحص؛ لا نسب نجاح مخترعة."}],"4-1-1-2":[{"id":"4-1-1-2-B03-A01","t":"يسأل المعلم المستفيد بوسيلة ميسرة عما يحتاج الوصول إليه، ثم يفحص بالغ مخول المسار والوجهة وطريقة الاستعمال قبل ملاحظة مشاركة آمنة. يطلب تقييمًا تخصصيًا للعائق الحركي أو الحسي أو التواصلي عند الحاجة.","o":"بطاقة مسار وعائق ووجهة ومساعدة معتادة، بلا أسماء في نسخة العرض."},{"id":"4-1-1-2-B03-A03","t":"بعد أن تؤكد الجهة الفنية إتاحة المسار للاستخدام، يلاحظ المعلم وصول الطالب إلى نشاط مألوف واستعمال المكان أو الأداة بمساعدته المعتادة، ويسأله عما يبقى صعبًا. ويرفع العائق وأثره إلى مسؤول الخدمة، دون مطالبة الطالب بتجربة قد تعرضه للخطر.","o":"نتيجة وصول واستعمال ودرجة المساعدة والعائق الباقي إن وجد."}]},"ENV-S06":{"4-2-1-2":[{"id":"4-2-1-2-B01-A01","t":"احصر المرافق والتجهيزات وضع خطة صيانة شاملة للاعتماد المخول","o":"حصر أصول مرتبط بنطاق خطة وعقد أو مرجع، مع فجوات التغطية لا جدول افتراضي."},{"id":"4-2-1-2-B01-A02","t":"نفذ الفحوص الدورية عبر المختص وسجل نتائجها","o":"تقرير منفذ مرتبط بالأصل وتاريخه الفعلي وموقف فحص لم ينفذ."},{"id":"4-2-1-2-B01-A03","t":"عدل الأولويات وفق نتائج الفحص","o":"أولوية معللة بنتيجة مختص وأثر على الاستخدام، وترتيب خدمة وتعليم في حدود الإذن."},{"id":"4-2-1-2-B02-A01","t":"حدد إجراءات البلاغ ومعالجة الأعطال وحماية المستخدمين وفق المختص","o":"بلاغ محدد الأصل، وتعليمات وضع الاستخدام أو طلبها، وإحالة المعالجة."},{"id":"4-2-1-2-B02-A02","t":"تابع الإصلاح وسجل العمل المنفذ بدقة","o":"إحالة بلاغ إلى تقرير عمل محدد؛ بيان إصلاح أو جزء لم يستكمل."},{"id":"4-2-1-2-B02-A03","t":"تحقق عبر المختص من صلاحية الاستخدام وتحسن الظروف قبل إغلاق المعالجة","o":"نتيجة فحص إغلاق مختص، ووصف استعمال مأذون، وإحالة عودة خلل إن ظهرت."}],"4-1-1-2":[{"id":"4-1-1-2-B01-A03","t":"إذا أجاز التخويل تعديل وقت استعمال أو ترتيب أماكن، يجرب في نطاقه، ثم يراجع المسؤول الإداري والمعلم وصول المجموعة وبدء المهمة التعليمية. يقترح التغيير الذي يمس المكان فنيًا للجهة المعنية ولا ينفذه محليًا.","o":"تنظيم معتمد في نطاقه وملاحظة استخدام بعده."},{"id":"4-1-1-2-B03-A02","t":"يرسل المسؤول الإداري وصف الرحلة والمهمة المتعذرة والدعم المعتاد، ويقترح أقرب ترتيب تعليمي مأمون داخل صلاحية المدرسة. يرفع الحل الإنشائي أو الفني وصلاحية البديل للمختص؛ يوضح في الطلب لماذا لا يكفي تيسير المدخل وحده.","o":"تقييم إتاحة ومعالجة موثقة من مخول مع ما بقي منها."}],"4-1-1-3":[{"id":"4-1-1-3-B01-A02","t":"يختار المعلم تعديلًا مسموحًا في موضع العرض أو ترتيب النشاط، أو وسيلة مقررة يمكن للمستهدف استخدامها، مع حفظ هدف التعلم ووصول زملائه. يرفع الاحتياج الفني أو الفردي الذي لا يعالج بالترتيب المتاح؛ لا يشتري أو يعدل خارج التخويل.","o":"اختيار معالجة وأساسها وتنفيذها المخول."},{"id":"4-1-1-3-B02-A02","t":"ينسق المعلم مع محضر المختبر، أو الشخص الذي يتولى تجهيز النشاط في المدرسة، الأدوات وتوزيعها وحجزها بطريقة تتيح المشاركة. ويطلب تحقق الجهة الفنية من الجاهزية عند لزومه، ويرفع الإصلاح أو التجهيز المتخصص للجهة المسؤولة، ويعدل الموعد أو البديل وفق ما تسمح به التعليمات.","o":"تحقق جاهزية خاص بالنشاط وجدول إتاحة لا يزاحم احتياج فئة أخرى."}],"4-1-1-4":[{"id":"4-1-1-4-B01-A02","t":"يصف مسؤول الخدمة ما يتعذر على الطالب من وصول إلى تعلم أو لعب أو مرفق يحتاجه، وما يطلبه من تهيئة أو توضيح دون كشف بيانات شخصية. ويطلب من الجهة المختصة معالجة محددة، ويعرض عليها بديلًا لاستخدام المكان إذا أمكن انتظار موافقتها على سلامته.","o":"طلب محدد ورد ومعالجة مخولة أو نقص قائم."},{"id":"4-1-1-4-B02-A02","t":"يبين مسؤول الخدمة في طلب الإصلاح وظيفة الجهاز المتعطلة والمهمة التي تحتاجها، ويتابع الرد والتحقق الفني قبل إعادة الاستخدام. ويطلب البديل أو الاستكمال من الجهة التي توافق عليه، ويبين المعلم ما يمكن تنفيذه بالأداة المتاحة التي تسمح المدرسة باستعمالها.","o":"طلب وصيانة أو توريد ونتيجة تحقق مرتبطة بالفجوة."}],"4-2-1-1":[{"id":"4-2-1-1-B01-A03","t":"يربط المسؤول الإداري كل ملاحظة بطلب معالجة، ويتابع المدير حماية المستخدمين وترتيب التعليم في الأماكن المسموح بها وفق تعليمات الحالة. يطلب تحقق المختص من المعالجة، ثم يستعين بالمعني بالمرفق لوصف عودة الاستعمال المعتاد.","o":"طلب ومعالجة وتحقق مختص، ووصف استعمال بعد الإذن؛ أو حاجة ما زالت مفتوحة."}]},"LO-02":{"2-2-1-3":[{"id":"2-2-1-3-B01-A03","t":"يحدد المعلم من يحتاج إلى دعم أو إثراء وما يحتاج إلى تغيير في التعليم أو أداة التقويم، ويبين سبب القرار من الأداء. ويراجع اختلاف القرارات في الحالات المتشابهة حتى لا يبقى تفاوت بلا تفسير.","o":"قرار مبرر يميز الحاجات؛ وجود درجة فاصلة غير موثقة لا يتحول إلى محك رسمي."},{"id":"2-2-1-3-B02-A01","t":"يصمم المعلم دعمًا أو إثراءً للمهارة التي يكشفها التحليل، ويحدد من أين يبدأ وما يفعله الطالب ووقت العمل ومخرجه وفحصه اللاحق. ويستخدم تدخلًا قائمًا إذا ناسب الحاجة ويعدله بدل إنشاء برنامج عام مكرر.","o":"تدخل يطابق حاجة مسندة ومخرجًا وفحصًا؛ برنامج عام لا يقابل الفجوة لا يكفي."},{"id":"2-2-1-3-B02-A03","t":"يعيد المعلم فحص الناتج المستهدف بقدر مناسب من المقارنة ويسجل المساعدة والظروف. يقارن الاستجابة أو عدمها، ولا يستدل من حضور البرنامج على التحسن. يقرر الاستمرار أو تعديل الدعم أو إعادة التشخيص، ويربطه بدورة المتابعة التالية دون إنشاء مهمة تشغيلية.","o":"أداء لاحق وقرار مسند؛ عدم التحسن وتعذر المقارنة يبقيان ظاهرين دون نسبة سببية مؤكدة."}]},"LO-03":{"3-2-1-1":[{"id":"3-2-1-1-B01-A02","t":"يتيح المعنيون ممارسة واختيارًا يظهران تمثل القيمة، ويحددون دور المتعلم والمساعدة التي يتلقاها، مع فصل تنفيذ البرنامج عن ناتجه.","o":"أدلة أداء طلاب"},{"id":"3-2-1-1-B02-A02","t":"يشارك المتعلم في مواقف مناسبة ويبين دوره ومعنى ما يمارسه، ويلاحظ المعنيون ما يكشف الاعتزاز في حدود السياق والعمر.","o":"ناتج فردي أو جماعي موثق"}],"3-2-1-2":[{"id":"3-2-1-2-B01-A02","t":"يتيح المعلم للمتعلم اتخاذ اختيار ومراجعة أدائه وتقبل توجيه مناسب، ويلاحظ ما يظهر من اتجاه نحو ذاته في هذا السياق.","o":"أدلة اتجاه ومشاركة"},{"id":"3-2-1-2-B02-A02","t":"يلاحظ صاحب العمل التفاعل ومساهمة المتعلم وتفسيره، ويميز العائق في اللغة أو تنظيم المهمة عن افتراض اتجاه سلبي.","o":"أدلة تعامل متكررة"}],"3-2-1-4":[{"id":"3-2-1-4-B02-A02","t":"يشرح المتعلم ما يتعلمه وما يفيد به غيره في حدود المهمة، ويفحص المعنيون الصلة بين المشاركة والنتاج دون نسب عمل الآخرين إليه.","o":"سجل مشاركة بأدوار ونطاق"},{"id":"3-2-1-4-B02-A05","t":"تحدد المدرسة الفرصة أو الدعم التالي وتتابع أثر التعديل، مع بقاء الشواهد في أصولها وأغراض الحكم مستقلة.","o":"نتيجة مساهمة وتعلم وقرار تطوير"}],"3-2-1-6":[{"id":"3-2-1-6-B01-A02","t":"ينفذ المتعلم خطته وينظم وقته ويطلب دعمًا مناسبًا، ويلاحظ المعلم ما يديره بنفسه وما يحتاج فيه إلى مساندة فعلية.","o":"إنجاز يقوده الطالب"},{"id":"3-2-1-6-B02-A02","t":"يجمع المتعلم المعلومات ويستعملها في مهمة أو منتج ويبين مصادره ودوره، ويُفحص الفهم بدل النقل أو اكتمال الشكل.","o":"ملاحظات ومنتج تعلم"},{"id":"3-2-1-6-B02-A03","t":"يتيح المعلم أداءً لاحقًا يكشف نقل التعلم والاستقلال بدرجة مساعدة معلومة، ويعدل الدعم على أساس ما يظهر.","o":"أداء لاحق مستقل"}],"3-2-1-7":[{"id":"3-2-1-7-B01-A02","t":"يقدم المتعلم تفسيرًا أو اختيارًا أو أداءً يبين الاعتزاز بثقافته، ويلاحظ المعلم دوره وما يستند إليه من فهم.","o":"أعمال وتفسير فردي"},{"id":"3-2-1-7-B02-A02","t":"يمارس المتعلم الاحترام في الحوار والعمل والتعاون، ويبين المعنيون ما تكشفه الممارسة وما يحتاج إلى توجيه.","o":"أدلة احترام في مواقف فعلية"}]},"LO-04":{"1-2-1-3":[{"id":"1-2-1-3-B02-A02","t":"يناقش الموجه الطلابي الحالات المتكررة مع الطالب ومن يلزم من المعنيين، ويميز العائق الدراسي أو الأسري أو التنظيمي دون افتراض السبب.","o":"وصف حالة وفرضيات مؤيدة أو سبب غير محسوم."},{"id":"1-2-1-3-B02-A03","t":"يقدم الموجه والمعلم دعمًا يعالج السبب الذي تؤيده المعلومات. وإذا استدعت الحالة إجراءً نظاميًا، يرجع المسؤول عن المعالجة إلى التعليمات لتحديد الإجراء ومن يملك اتخاذه، قبل تطبيقه.","o":"دعم مرتبط بسبب ومرجع للإجراء النظامي عند استخدامه."},{"id":"1-2-1-3-B02-A04","t":"يراجع الموجه والمعلم انتظام حضور الطالب ومشاركته بعد المعالجة، ويقرران تعديل الدعم أو رفع ما يتجاوز اختصاصهما.","o":"متابعة لاحقة وقرار يبين ما تحسن وما بقي."}],"2-2-1-3":[{"id":"2-2-1-3-B02-A01","t":"يصمم المعلم دعمًا أو إثراءً للمهارة التي يكشفها التحليل، ويحدد من أين يبدأ وما يفعله الطالب ووقت العمل ومخرجه وفحصه اللاحق. ويستخدم تدخلًا قائمًا إذا ناسب الحاجة ويعدله بدل إنشاء برنامج عام مكرر.","o":"تدخل يطابق حاجة مسندة ومخرجًا وفحصًا؛ برنامج عام لا يقابل الفجوة لا يكفي."},{"id":"2-2-1-3-B02-A03","t":"يعيد المعلم فحص الناتج المستهدف بقدر مناسب من المقارنة ويسجل المساعدة والظروف. يقارن الاستجابة أو عدمها، ولا يستدل من حضور البرنامج على التحسن. يقرر الاستمرار أو تعديل الدعم أو إعادة التشخيص، ويربطه بدورة المتابعة التالية دون إنشاء مهمة تشغيلية.","o":"أداء لاحق وقرار مسند؛ عدم التحسن وتعذر المقارنة يبقيان ظاهرين دون نسبة سببية مؤكدة."}],"3-2-1-2":[{"id":"3-2-1-2-B01-A01","t":"يقوم المعلم بإتاحة موقف يصف فيه المتعلم ما يستطيع فعله وما يحتاج فيه إلى مساندة، دون مطالبة بإفصاح شخصي خارج غرض التعلم.","o":"مواقف فحص تربوي"},{"id":"3-2-1-2-B01-A02","t":"يتيح المعلم للمتعلم اتخاذ اختيار ومراجعة أدائه وتقبل توجيه مناسب، ويلاحظ ما يظهر من اتجاه نحو ذاته في هذا السياق.","o":"أدلة اتجاه ومشاركة"},{"id":"3-2-1-2-B01-A03","t":"يراجع المعنيون استمرار القرائن ويحددون الدعم المناسب، مع عدم تحويل تعثر مهمة أو استجابة عارضة إلى صفة ثابتة.","o":"استجابة وتقدم"},{"id":"3-2-1-2-B02-A01","t":"يتيح المعلم موقف تعاون أو تعامل يبين فيه المتعلم احترامه للآخرين وطريقة الاستجابة للاختلاف ضمن العمر والفرصة المتاحة.","o":"فرص ملاحظة تعامل"},{"id":"3-2-1-2-B02-A02","t":"يلاحظ صاحب العمل التفاعل ومساهمة المتعلم وتفسيره، ويميز العائق في اللغة أو تنظيم المهمة عن افتراض اتجاه سلبي.","o":"أدلة تعامل متكررة"},{"id":"3-2-1-2-B02-A03","t":"تراجع المدرسة قرائن المواقف وتعدل الدعم أو التنظيم، وتحيل ما يحتاج إلى اختصاص عبر مساره مع حفظ الخصوصية.","o":"ممارسة اجتماعية محسنة"}],"3-2-1-3":[{"id":"3-2-1-3-B01-A01","t":"يحدد المعلم ومسؤول الخدمة الصحية الممارسة التي تتطلبها مرحلة الطلاب وبيئتهم بالرجوع إلى التوجيه الصحي المختص، ويوضحان معناها وطريقة أدائها المناسبة.","o":"ممارسات ومواقف فحص"},{"id":"3-2-1-3-B01-A02","t":"تتيح المدرسة مورد الممارسة وفرصتها وتلاحظ أداء المتعلم، مع تحديد العائق الذي تستطيع معالجته أو رفعه إلى المختص.","o":"ملاحظات ممارسة وعوائق"},{"id":"3-2-1-3-B01-A03","t":"يتابع مسؤول الخدمة الممارسة والدعم وطلب المساعدة المتخصصة، ويتعاون مع الأسرة في خطوة ممكنة، دون تشخيص محلي.","o":"دعم وتهيئة مناسبة"},{"id":"3-2-1-3-B01-A04","t":"تراجع المدرسة قرائن الأداء والاستجابة وتحمي بيانات الحالات، وتفصل الالتزام الفعلي عن حضور برنامج أو توافر ملف.","o":"استمرار ممارسة"}],"3-2-1-5":[{"id":"3-2-1-5-B01-A01","t":"يحدد مسؤول متابعة السلوك مصادر الوقائع والفئة والفترة والقواعد التي تخصها، ويتحقق من صحة البيانات وما ينقصها قبل الحكم.","o":"تعريف قياس واضح"},{"id":"3-2-1-5-B01-A02","t":"يقرأ المختص مظاهر الالتزام والتعثر في سياقاتها، ويميز تسجيل الواقعة عن تفسير سببها أو الحكم على جميع المتعلمين.","o":"نتيجة التزام قابلة للتتبع"},{"id":"3-2-1-5-B01-A03","t":"يتعاون المعنيون في دعم المتعثر ومراجعة الاستجابة، وتعود النتيجة إلى الإجراءات والبرامج المناسبة ضمن الصلاحية.","o":"دعم وتغير التزام"},{"id":"3-2-1-5-B02-A01","t":"يقوم صاحب متابعة المواظبة بالرجوع إلى مصدر الحضور الصحيح وتحديد الفترة والفئة وطريقة تفسير الحالات.","o":"تعريف حضور وفترة"},{"id":"3-2-1-5-B02-A02","t":"يراجع المعنيون الانتظام وأثر العوائق والاستجابة، ويصحح صاحب المصدر ما يتعارض من وقائع قبل بناء الحكم.","o":"نتيجة حضور وحالات متكررة"},{"id":"3-2-1-5-B02-A03","t":"تتابع المدرسة الاتجاه اللاحق والدعم المتبقي، وتحفظ بيانات الحالات في نطاقها مع استقلال حكم الحضور عن السلوك.","o":"دعم وتحسن حضور"}]},"TLD-01":{"2-1-1-1":[{"id":"2-1-1-1-B01-A01","t":"يعرض المعلم مهمة قصيرة من هدف الدرس، ويسمع تفسير الطلاب ويرصد من تعوقه التعليمات أو المصدر أو وسيلة الإجابة. يراجع معلومات الدعم المسموح بها ويسأل الطالب عما يساعده دون وصم.","o":"عمل أول مع وصف العائق وسياقه؛ تمييز حاجة الوصول من فجوة المهارة، وبيان ما يحتاجه المتقدم."},{"id":"2-1-1-1-B01-A02","t":"يختار المعلم تكييفًا يزيل العائق: نصًا أوضح أو طريقة عرض أو تعبير ميسرة أو تجزئة للمهمة أو وقتًا مناسبًا؛ ويحدد ما يبقى ثابتًا من ناتج التعلم. يرجع للخطة الفردية المعتمدة عند وجودها ويعد تحديًا أعمق للمتقن.","o":"المهمة قبل التكييف وبعده مع سبب التعديل؛ هدف محفوظ أو إحالة إلى هدف مخول تغييره."},{"id":"2-1-1-1-B01-A03","t":"يتيح المعلم فرصة تفكير وإجابة لكل طالب، وينظم تبادل الأدوار واستخدام المصدر. يتابع مشاركة من حددت حاجته، ويطلب عملًا فرديًا يبين ما أنجزه داخل النشاط المشترك.","o":"أعمال فردية وملاحظة مشاركة موزعة، مع وسيلة الاستجابة ومقدار الدعم."},{"id":"2-1-1-1-B01-A05","t":"يهيئ المعلم المواد والتعليمات قبل العمل، ويجزئ الوقت بحسب متطلبات المهمة والحاجة. يقلل الانتظار والتنقل غير المفيد، ويتيح وقت تفكير ودعمًا دون سحب الطالب من التعلم المستهدف.","o":"ملاحظة ما استغرقه الانتظار والعمل والدعم وربطها بما أُنجز؛ لا نسبة زمن إلزامية."},{"id":"2-1-1-1-B01-A04","t":"يفحص المعلم أداءً لاحقًا في الهدف نفسه مع تكييف معلوم، ويقارن المشاركة والفهم والاستقلال لدى من تلقوا الدعم والمتقدمين. يبقي ما نفع ويعدل ما لم يفتح فرصة تعلم فعلية.","o":"عمل أول وآخر ووصف المساعدة وقرار استمرار أو تغيير التكييف؛ لا بيانات شخصية في العرض."}],"2-1-1-2":[{"id":"2-1-1-2-B01-A01","t":"يقرأ معلم المادة نواتج الوحدة من المنهج المعتمد، ويصل كل ناتج بمعرفة أو أداء أو قيمة قابلة للملاحظة في مهمة مناسبة. يثبت متطلبات التعلم السابقة وما ستكشفه المهمة، دون اختلاق هدف رسمي جديد.","o":"خريطة ناتج–مهمة–شاهد مرتبطة بمقرر وصفحات يثبتان عند الاستخدام."},{"id":"2-1-1-2-B01-A02","t":"ينتقي المعلم مصدرًا صحيحًا ومقروءًا ومهمة تعلم لكل ناتج؛ ينمذج ما يحتاج شرحًا ويتيح ممارسة وتفسيرًا. يطلب المورد المتعذر عبر الإدارة ويعد بديلًا مكافئًا متاحًا داخل المدرسة.","o":"مصدر ومهمة مرتبطان بالناتج وأعمال ناتجة عنهما، مع وصف بديل المورد عند الحاجة."},{"id":"2-1-1-2-B01-A03","t":"يراجع المعلم عمل الطالب وتفسيره ومحاولته المستقلة في ضوء الناتج. يميز المعرفة التي تعلمها والأداء الذي أتقنه والممارسة الدالة على القيمة في سياقها، ثم يعيد تعليم موضع الحاجة ويتيح إثراءً للمتقن.","o":"عمل مفسر وملاحظة ممارسة مناسبة وقرار تدريس لاحق؛ لا اكتمال مبني على تسليم الواجب وحده."},{"id":"2-1-1-2-B02-A01","t":"يقابل الوكيل التعليمي موقف التعليم بخطة الدراسة والتوزيع المعتمدين بعد تثبيت المرحلة والبرنامج. يستمع لمعلم المادة ويفحص عينة أعمال وملاحظة تعلم، ويميز ما عُلّم وما بقي وما يحتاج استعادة.","o":"موقف تنفيذ يربط الخطة بما تعلمه الطلاب وأسباب الفجوة التي تأيدت، دون حكم أداء وظيفي تلقائي."},{"id":"2-1-1-2-B02-A02","t":"يحدد الوكيل التعليمي مع معلم المادة سبب التعثر المؤيد: وقت أو مورد أو متطلب سابق أو طارئ. يعد بديلًا لاستمرار تعليم النواتج ضمن الصلاحية، ويعرض ما يحتاج قرارًا على المدير دون حذف محتوى معتمد.","o":"تحدٍّ ودليله وبديل مخول يحفظ الناتج، مع حدود ما لا تملكه المدرسة من تعديل."},{"id":"2-1-1-2-B02-A03","t":"يدرس المدير سبب تعثر تنفيذ المنهج مع المعنيين، ويهيئ ما تحتاجه المعالجة من موارد وتنظيم، ويحدد المسؤوليات ويتابع استعادة فرص التعلم. وإذا احتاج الأمر معالجة إدارية، يتابعها وفق الأنظمة وفي حدود اختصاصه، مع استمرار تعليم الطلاب.","o":"سبب تعثر تدعمه معلومات مناسبة، ومسؤوليات وخطوات معالجة واضحة، وأعمال طلاب تبين ما استكمل من التعلم. تحفظ المعلومات الإدارية في مصدرها المسموح."}],"2-1-1-3":[{"id":"2-1-1-3-B01-A01","t":"حلل ناتج التعلم ومستويات الطلاب والعائق في التعلم","o":"أداء أول وتفسير يحددان الحاجة التعليمية ومتطلبها."},{"id":"2-1-1-3-B01-A02","t":"اختر استراتيجيات متنوعة تلائم الحاجة وصمم مشاركة الطلاب","o":"درس يبين لماذا اختيرت الطريقة وما الذي سيفعله كل طالب وكيف سيظهر فهمه."},{"id":"2-1-1-3-B01-A03","t":"نفذ الاستراتيجيات وافحص أعمال الطلاب والمشاركة","o":"ملاحظة تنفيذ وعمل فردي وتفسير، مع نوع المساعدة."},{"id":"2-1-1-3-B01-A04","t":"قارن النتائج وحسن اختيار الطريقة","o":"مقارنة أعمال وقرار تغيير محدد ونتيجته اللاحقة حين تتاح."}],"2-1-1-4":[{"id":"2-1-1-4-B01-A01","t":"يحدد المعلم ناتجًا وحاجة تخدمها أداة رقمية بعينها، ويفحص إتاحتها وملاءمتها للمرحلة والمصدر. يجرب الخطوات المطلوبة من الطالب ويتعرف من يحتاج تعلم مهارة رقمية قبل بدء المهمة.","o":"مبرر تعلم وخريطة وصول ومهارات لازمة وبديل متاح؛ دون حسابات أو بيانات حقيقية."},{"id":"2-1-1-4-B01-A05","t":"قبل المهمة، يعرض المعلم لمن عرفت حاجته الخطوة الرقمية اللازمة، ثم يتركه يجربها بنفسه في مثال قصير. يثبت الاستعداد للبدء دون أن يحل المهمة التعليمية نيابة عنه.","o":"تنفيذ الطالب للخطوة المطلوبة قبل الدخول في مهمة التعلم، مع وصف الدعم."},{"id":"2-1-1-4-B01-A02","t":"ينفذ المعلم مهمة يستخدم فيها الطالب التقنية للفهم أو التمثيل أو الممارسة أو الاستجابة للتغذية الراجعة. يصل العمل الرقمي بالنقاش الصفي حين يخدم الهدف، ويتيح البديل لمن تعذر وصوله مع بقاء الناتج.","o":"منتج وتفسير أو تعديل من الطالب، وربطه بناتج المادة؛ والبديل المكافئ عند الحاجة."},{"id":"2-1-1-4-B01-A04","t":"إذا ظهرت أثناء المهمة فجوة رقمية تعطلها، يوقف المعلم عند الخطوة اللازمة ويقدم دعمًا قصيرًا، ثم يعيد الطالب لإنجازها بنفسه داخل الموقف. إذا لم تظهر فجوة يسجل عدم الحاجة للدعم ولا يصطنع تدريبًا.","o":"وصف الفجوة عند ظهورها ومحاولة الطالب بعد الدعم في المهمة نفسها؛ أو عدم انطباق الدعم."},{"id":"2-1-1-4-B01-A03","t":"يفحص المعلم الناتج التعليمي من تفسير الطالب وعمله، ويقارنه بأداء أول مناسب وبمقدار الدعم والوصول. يقرر استمرار الاستخدام أو تعديله أو اختيار وسيلة أوضح؛ ولا يجعل نقل مهارة رقمية جديدة شرطًا للإغلاق.","o":"عمل يبين التعلم وقرار استخدام لاحق مع حد المقارنة؛ PEND-D05 محفوظ."}],"2-1-1-5":[{"id":"2-1-1-5-B01-A01","t":"يحدد المعلم ناتجًا من مقرر الصف وموقفًا حياتيًا يفهمه الطلاب أو يقدمه لهم داخل الدرس. يوضح أين ستستخدم المعرفة ولماذا، ويتأكد أن السياق لا يشترط موردًا منزليًا أو خبرة لا تتاح للجميع.","o":"ناتج وسياق وتفسير للصلة بينهما وحدود المرحلة."},{"id":"2-1-1-5-B01-A02","t":"يعد المعلم مهمة تتطلب أداءً ومنتجًا وتفسيرًا، ويحدد ما يدل على صحة التطبيق ومعقوليته وما يحتاجه من أدوات وأمان ومساعدة للمشاركة. ويعلم المتطلب الجديد ويوفر موارد التنفيذ داخل المدرسة.","o":"وصف مهمة وموارد ومحك يفرق إتمام المنتج من فهم التطبيق."},{"id":"2-1-1-5-B01-A03","t":"ينفذ الطلاب المهمة ويشرحون ما اختاروه وكيف تحققوا من النتيجة. يتابع المعلم خطواتهم ويقدم دعمًا محددًا، ثم يطلب من كل طالب تفسيرًا أو جزءًا مستقلًا يظهر تعلمه.","o":"منتج وأداء وتفسير فردي، مع الخطأ والتعديل والمساعدة."},{"id":"2-1-1-5-B01-A04","t":"يعرض المعلم موقفًا مشابهًا يغير البيانات أو القيد بما يحتاج اختيارًا من الفكرة نفسها. يفحص تفسير الطالب ومعقولية حله وما احتاجه من تلميح، ويعيد تعليم الصلة التي لم تنتقل.","o":"تطبيق لاحق وتفسير يبين ما انتقل وحدود الموقف الجديد."}],"2-1-1-6":[{"id":"2-1-1-6-B01-A01","t":"يسمع معلم العربية قراءة مناسبة ويطلب فهم كلمة وفكرة وكتابة قصيرة من محتوى الصف. يميز تعرف الكلمات والطلاقة ذات المعنى والفهم والتعبير، ويحدد دعمًا أو إثراءً من دليل فعلي.","o":"قراءة وإجابة وكتابة مؤرخة عند الاستخدام؛ موضع حاجة محدد لا تصنيف دائم."},{"id":"2-1-1-6-B01-A02","t":"ينتقي معلم العربية نصًا وكلمات وتراكيب من المنهج تناسب الحاجة، وينمذج القراءة أو بناء المعنى والكتابة. يتيح قراءة وفهمًا وتعبيرًا قصيرًا مترابطًا، ويجعل نصوص المواد مجال تطبيق بإسناد معلميها.","o":"مهام قراءة وكتابة وأعمال وتفسير يبين الصلة بالحاجة."},{"id":"2-1-1-6-B01-A03","t":"يجمع معلم العربية من يشتركون مؤقتًا في حاجة واحدة لتعليم موجه، ويعيد المهارة إلى نص الصف. يعطي المتقدم تفسيرًا أعمق أو كتابة توظف الفكرة، ويغير المجموعة من الاستجابة اللاحقة.","o":"عمل قبل الدعم وبعده ومهمة إثراء ذات عمق؛ لا فئات ثابتة أو حرمان من المنهج."},{"id":"2-1-1-6-B01-A04","t":"يعيد معلم العربية فحص المهارة بنص مناسب آخر وكتابة قصيرة مع مقدار مساعدة معلوم. يقارن دقة القراءة والفهم والتعبير، ويقرر استمرار الدعم أو تغييره أو تخفيفه ويراقب من لم يستفد.","o":"مقارنة مهارية من أعمال مستقلة وقرار لاحق؛ لا نسبة نتيجة مختلقة."},{"id":"2-1-1-6-B02-A01","t":"يعرض معلم الرياضيات مهمة مقدار أو تمثيل أو عملية مناسبة للمقرر، ويطلب تفسير الحل ومعقوليته. يميز خطأ معنى العدد أو القيمة أو العلاقة من خطأ إجراء أو قراءة المسألة.","o":"حل وتمثيل وشرح يكشفان نمط الخطأ أو العمق المتاح للمتقن."},{"id":"2-1-1-6-B02-A02","t":"يعلم معلم الرياضيات المعنى بتمثيل ملائم، ويصل بين الأداة أو الرسم والرمز واللغة الرياضية. يعرض مثالًا واضحًا ويتيح ممارسة موجهة ثم مسألة فردية مع تفسير.","o":"تمثيل متصل بالرمز وحل مفسر؛ أدوات مختارة للفكرة من منهج الصف."},{"id":"2-1-1-6-B02-A03","t":"يعالج المعلم نمط الخطأ المؤيد بتعليم موجه وممارسة في حاجة واحدة، ثم يعيده إلى موضوع الصف. يعطي المتقدم مسألة تقارن طرقًا أو تغير قيدًا وتطلب تعليلًا؛ يعاد التجميع من الاستجابة.","o":"محاولة علاجية أو إثرائية توضح الخطأ والتعديل أو عمق التفكير."},{"id":"2-1-1-6-B02-A04","t":"يفحص المعلم مهمة عددية أخرى في المهارة نفسها مع تفسير مستقل، ويقارن معنى الحل وصحته ومعقوليته والمساعدة. يقرر ما يعاد تعليمه وما يمكن توسيعه ويتابع بقاء المهارة في درس لاحق.","o":"عملان مناسبان ومحك تفسير وقرار تعليم لاحق؛ لا قياس بالسرعة وحدها."}],"2-1-1-7":[{"id":"2-1-1-7-B01-A01","t":"يعد المعلم سؤالًا من مادته يحتاج إلى تحليل أو استنتاج أو تقويم أو حل مشكلة، ويحدد المعرفة اللازمة وما يجعل الإجابة مقنعة من رأي ودليل وتفسير للعلاقة بينهما. ويتيح أكثر من حل إذا سمحت المسألة بذلك.","o":"مهمة ومحك يكشفان التفكير المطلوب، مع تهيئة المعرفة اللازمة."},{"id":"2-1-1-7-B01-A02","t":"ينمذج المعلم كيف يختار الدليل ويبرر الصلة، ثم يفحص الطلاب مصدرًا أو بيانات أو تمثيلًا ويحلون ويشرحون. يقارنون تفسيرين ويبين كل طالب سبب ترجيحه دون اكتفاء بموافقة المجموعة.","o":"حل وتبرير فردي واستعمال دليل، مع بيان مقدار التوجيه."},{"id":"2-1-1-7-B01-A03","t":"يفحص المعلم تفسير الطالب ودليله والعلاقة بينهما، ويقدم سؤالًا يساعده على تعديل نقطة واضحة. ثم يفحص عملًا آخر ليرى جودة التبرير واختيار الحل والحاجة إلى التلميح.","o":"حجة أولى ومعدلة وتفسير لاحق مستقل مع حدود المقارنة."},{"id":"2-1-1-7-B02-A01","t":"يختار المعلم تحديًا يستطيع الطلاب التعامل معه بما يعرفونه، ويدعوهم لأفكار تختلف في معناها لا في كلماتها فقط. ويناقش فائدتها وإمكان تطويرها وما تضيفه في هذا الموقف، دون اختراع معيار رسمي للأصالة.","o":"أفكار متنوعة ومحكات ملاءمة وتطوير مفهومة للطلاب."},{"id":"2-1-1-7-B02-A02","t":"يجرب الطلاب فكرة بنموذج أو تمثيل آمن ويلاحظون ما نفع وما يحتاج تعديلًا. يتيح المعلم إثراءً صفيًا وغير صفي ضمن الموارد القائمة، ويحفظ أثر مساهمة كل طالب ولا يشترط مسابقة.","o":"فكرة أولى ومحاولة اختبار وتعديل سببه ملاحظة أو دليل."},{"id":"2-1-1-7-B02-A03","t":"يراجع المعلم والطلاب جودة الفكرة وفائدتها لمن صممت له، ويطلبون بيان ما تغير ولماذا. يقارن الطالب بديلًا أو يختبر تحسينًا ويبين حدود ما حققه؛ يتابع المعلم التنفيذ المتاح.","o":"نسختا فكرة أو نموذج وسبب تحسين ودليل فائدة وحدود."},{"id":"2-1-1-7-B03-A01","t":"يختار الطلاب بتوجيه المعلم سؤالًا محددًا يناسب العمر والمادة ويمكن الإجابة عنه بمعلومات متاحة أو ملاحظة آمنة. يحددون نوع الدليل وخطوات جمعه دون بيانات شخصية.","o":"سؤال وخطة مختصرة ومصدر أو طريقة ملاحظة تخدمه."},{"id":"2-1-1-7-B03-A02","t":"يعلم المعلم الطلاب فحص صاحب المصدر وتاريخه وصلته بالسؤال، والتمييز بين المعلومة والرأي. وينظم الطلاب ما يجمعونه ويذكرون مصدره، ويفحصون اختلاف المعلومات بدل نسخ النص أو قبول أول نتيجة بحث.","o":"ملاحظات منظمة ونسبة المعلومات لمصادرها وسبب قبولها أو التحفظ عليها."},{"id":"2-1-1-7-B03-A03","t":"يعرض الطالب جوابًا يربطه بالدليل ويشرح كيف جمعه وما لا يسمح باستنتاجه. يناقش المعلم الطريقة والنتيجة ويطلب تصحيحًا عند تجاوز الدليل، ويحفظ الطلاب ما بقي سؤالًا.","o":"نتيجة وتفسير للطريقة وإحالات وحدود؛ عمل فردي يظهر مساهمة الطالب."}],"2-1-1-8":[{"id":"2-1-1-8-B01-A01","t":"يختار المعلم موقفًا مأمونًا من التعلم يحتاج تسمية شعور وتنظيم استجابة، مستفيدًا من ملاحظة عامة وصوت الطلاب دون إجبارهم على الإفصاح. يحدد فعلًا قابلًا للتدريب يناسب المرحلة.","o":"موقف وهدف مهاري كسؤال المساعدة أو التوقف والعودة، بلا تشخيص نفسي."},{"id":"2-1-1-8-B01-A02","t":"يعرض المعلم استجابة لشخصية افتراضية: تسمية الشعور واختيار فعل آمن وطلب مساعدة عند الحاجة. يتدرب الطلاب بوسيلة تواصل مناسبة، ثم يناقشون أثر الخيار دون كشف قصص خاصة.","o":"ممارسة فعل محدد وتغذية راجعة وصفية مع مقدار التذكير."},{"id":"2-1-1-8-B01-A03","t":"يتابع المعلم المهارة في موقف تعلم لاحق، ويصف ما فعله الطالب وما احتاجه من تذكير، ويستمع إلى تفسيره. يراجع مع الطالب خطوة نافعة ويعيد التدريب أو يطلب دعمًا مختصًا وفق الحاجة.","o":"ملاحظة سياقية لاحقة وتأمل اختياري وقرار دعم؛ لا ملف علني للمشاعر."},{"id":"2-1-1-8-B02-A01","t":"يختار المعلم مهارة إصغاء أو حوار أو تعاون ويحولها إلى فعل مفهوم، مثل إعادة فكرة زميل قبل الرد أو إنجاز جزء ثم تنسيقه. يضبط المطلب للعمر وطريقة التواصل المتاحة.","o":"هدف اجتماعي وفعل ملاحظ في مهمة تعلم حقيقية."},{"id":"2-1-1-8-B02-A02","t":"ينظم المعلم مهمة جماعية تحتاج إلى مساهمة الطلاب، مع أدوار يتبادلونها. ويوضح الإصغاء والطلب والاختلاف باحترام، ويتابع ممارسة كل طالب ويتيح له وسيلة مناسبة للمساهمة.","o":"عمل تعاوني وملاحظة مساهمة وتواصل لكل طالب بالوسيلة الملائمة."},{"id":"2-1-1-8-B02-A03","t":"يراجع الطلاب مع المعلم موقف التعاون: ما الذي ساعد على الفهم وما الذي سيغيرونه في المحاولة المقبلة. يقدم المعلم ملاحظة محددة ويتيح ممارسة لاحقة، ويلاحظ جودة الحوار وتقليل التذكير.","o":"ملاحظة أولى ومراجعة وممارسة لاحقة مع أثر تعديل في التواصل."}],"2-1-1-9":[{"id":"2-1-1-9-B01-A01","t":"يستمع المعلم إلى رأي الطلاب في معنى المهمة وصعوبتها وما يساعدهم على البدء، ويقابل ذلك بأعمالهم وملاحظة المحاولة والعودة بعد الخطأ. يصوغ عائقًا محتملًا فقط إذا تأيد، وإلا يسجل عدم وضوحه.","o":"صوت طالب متاح وملاحظة وعمل يميز فهم المطلوب والتحدي والوصول والشعور بالأمان."},{"id":"2-1-1-9-B01-A02","t":"يعد المعلم مهمة ذات غرض مفهوم وتحد يمكن بلوغه مع دعم، ويتيح خيارًا محدودًا يخدم الناتج. يوضح معنى النجاح ويهيئ بدء المحاولة، ويختار سياقًا لا يتطلب موارد منزلية.","o":"مهمة وغرض وخيارات متكافئة ودعم مرتبط بالعائق المؤيد."},{"id":"2-1-1-9-B01-A03","t":"ينفذ الطلاب المهمة ويختارون ضمن حدودها ويجربون، ويقدم المعلم تغذية تصف ما تحقق وخطوة التحسين. يتيح إعادة المحاولة ويلاحظ الجهد والفهم وطلب المساعدة دون ترتيب علني أو مدح صفة ثابتة.","o":"محاولة وتعديل من التغذية الراجعة وملاحظة مثابرة، مع تفسير الطالب لعمله."},{"id":"2-1-1-9-B01-A04","t":"يقارن المعلم خبرة الطلاب ومشاركتهم وأعمالهم واستمرار محاولتهم في تعلم لاحق، ويتابع من لم يستفد. يعدل التحدي أو معنى المهمة أو الدعم وفق الأدلة، مع إبقاء العوامل الأخرى واحتمال عدم وضوح السبب.","o":"رأي اختياري وعمل لاحق وملاحظة استجابة لدى فئات مختلفة وقرار تعديل."}],"2-2-1-1":[{"id":"2-2-1-1-B01-A01","t":"يحدد المعلم ما يلزم معرفته عن بداية تعلم طلابه ويختار أداة تناسب المهارة والفئة. يطبقها مع التكييف الملائم ويجمع الأداء قبل تفسير اختلاف المستويات. يفحص إن كانت النتيجة تميز الحاجة؛ تشابه الدرجات إشارة للفحص وليس دليلًا قاطعًا على عيب الأداة.","o":"أداة وأعمال يمكن بها تفسير مستويات البداية؛ إذا لم تتضح الفروق يختبر ملاءمة الأسئلة والتطبيق قبل التصنيف."},{"id":"2-2-1-1-B01-A02","t":"يفسر المعلم استجابات الطلاب بحسب المهارة لا الانطباع أو السنة السابقة. يحدد حاجات وفئات دعم مرنة ويبين الأداء الذي استند إليه كل تفسير. يسجل نقص البيانات ويعيد النظر في التجميع عند تغير الأداء.","o":"كل حاجة أو تجميع مقرون بأداء معلوم؛ لا تصنيف ثابت للطالب أو حكم من بيانات ناقصة."},{"id":"2-2-1-1-B01-A03","t":"يحدد المعلم ما يغيره في التدريس أو المهمة أو الدعم استجابة لكل حاجة، ويضيفه إلى خطة التعلم المستخدمة ووقت تنفيذه. ويحفظ سبب التغيير والعمل الذي يكشف الحاجة دون إعداد خطة أخرى للعمل نفسه.","o":"يظهر فرق محدد في التعليم أو الدعم يعود إلى حاجة مكتشفة؛ اسم برنامج عام لا يكفي."},{"id":"2-2-1-1-B02-A01","t":"يراجع من يتولى متابعة التعليم مع المعلمين أعمال تقويم فعلية لمعرفة حاجتهم إلى اختيار الأداة وطريقة الحكم على الأداء وتطبيقها. ويطلب المدير تدريبًا عمليًا ممن يملك الخبرة اللازمة، ثم تراجع الاستفادة في تطبيق المعلم. ولا يعاد تدريب يتقن المعلم عمله لمجرد توحيد البرنامج.","o":"استخدام مناسب للأداة في عمل تعليمي؛ الحضور أو الشهادة وحدهما لا يثبتان الكفاية، والوكيل المنسق ليس مدربًا تلقائيًا."},{"id":"2-2-1-1-B02-A02","t":"يختار المعلم أداة تكشف الحاجة أثناء التعلم ويحدد سبب ملاءمتها. يوظف تقويمًا ذاتيًا أو أقرانًا أو أداءً أو مشروعًا أو ملفًا بحسب الحاجة؛ لا يفرضها كلها. يجمع أداءً وملاحظة يبينان ما يعرفه المتعلم وما يحتاجه.","o":"نتيجة مفيدة عن الحاجة؛ تنوع الأسماء أو جمع ملف أعمال دون تفسير ليس دليلًا كافيًا."},{"id":"2-2-1-1-B02-A03","t":"يقرأ المعلم نتيجة التقويم أثناء التعلم ويقدم دعمًا أو إثراءً أو يغير التدريس في وقت يستطيع الطالب الاستفادة منه. ثم يراجع الأداء التالي أو يبين تعذر جمعه، ويعدل الدعم إذا استمر التعثر.","o":"تغيير تعليمي أو دعم في وقت مفيد مسند إلى نتيجة؛ دعم متأخر بعد الختام لا يثبت الاستخدام البنائي لهذه الواقعة."},{"id":"2-2-1-1-B03-A01","t":"يربط المعلم الأسئلة والمهام الختامية بما يريد تقويمه من تعلم، ويراجع ما يغيب من النواتج وما يأخذ أكثر من حقه. ويحدد كيف يحكم على الإجابة وطريقة التطبيق والتعديلات التي يحتاجها الطلاب قبل الاستخدام.","o":"أداة ختامية مناسبة ومحك معروف؛ الأداة المشتركة مع2-2-1-2 تحفظ بإحالة لكن حكم المستويات مستقل عن حكم تغطية النواتج."},{"id":"2-2-1-1-B03-A02","t":"يطبق المعلم الأداة في ظروف تساعد على قراءة الأداء المطلوب، ويحفظ الأعمال وتاريخها. ويقوّمها بالمعايير المحددة، ويناقش ما يختلف في تقديره ليتحقق من اتساق التطبيق، دون افتراض مراجع مستقل أو درجة رسمية جديدة.","o":"نتائج ختامية يمكن تفسيرها ومحك يطبق باتساق؛ اختلاف المصححين يعالج من الأداء لا من المتوسط فقط."},{"id":"2-2-1-1-B03-A03","t":"يبين المعلم ما يتقنه الطلاب وما يحتاج إلى تعلم على مستوى المهارة والفئة، ويحدد توصية للتعليم أو الدعم في المرحلة التالية. ويحفظ صلتها بالنتيجة ويسلم المعلومات اللازمة للمعلم أو المسؤول الذي يتولى المتابعة عند تغير الفترة أو انتقال العمل.","o":"التوصية تحدد ناتجًا أو مهارة وحاجة ومسار متابعة؛ عبارة تحسين المستوى وحدها لا تكفي."}],"2-2-1-2":[{"id":"2-2-1-2-B01-A01","t":"يحصر المعلم النواتج المستهدفة من المنهج والفترة التي يدرسها الطلاب. يقابلها بخطة التوزيع القائمة ويصحح النقص أو خطأ الفترة. يثبت نطاق التقويم دون إنشاء نواتج إضافية أو اشتراط اكتمال المصدر المساند كحاجز لازم.","o":"قائمة تعكس المصدر والفترة والمنهج فعلًا؛ حفظت التبعية المساندة لخريطة النواتج دون تحويلها إلى إلزام جديد."},{"id":"2-2-1-2-B01-A02","t":"يختار المعلم لكل ناتج أداة وطريقة حكم تكشف المعرفة أو المهارة أو القيمة التي يتضمنها. ويتحقق من صلاحية الأداة الورقية أو العملية للأداء المطلوب، ويبين سبب الاختيار ويستفيد من التدريب المتاح دون نسخه أو فرض جميع أنواع الأدوات.","o":"الأداة والمحك يلائمان طبيعة الناتج؛ لا يخترع سلم رسمي أو ناتج قيمي خارج المصدر."},{"id":"2-2-1-2-B01-A03","t":"يطبق المعلم الأدوات المناسبة ويجمع أعمالًا يعرف أصحابها وما تقيسه من تعلم. وإذا بقي ناتج بلا أداء يكشفه، يستكمل فحصه في مهمة قائمة تصلح لذلك أو يبين ما يتعذر، دون إنشاء اختبار مكرر تلقائيًا.","o":"لكل ناتج مفحوص أداء قابل للفحص أو فجوة معلنة؛ الخطة أو المهمة غير المنفذة لا تثبت التقويم."},{"id":"2-2-1-2-B01-A04","t":"يراجع المعلم تغطية النواتج وصلاحية الأداة والتطبيق. يميز خلل الأداة أو التطبيق ونقص الشاهد عن حاجة التعلم الحقيقية، ويصحح ما ثبت. يفسر النتيجة الصالحة ويوجه دعمًا مناسبًا أو يحفظ الحكم معلقًا إذا لم تكف الأدلة.","o":"قرار عن الناتج مبني على أداء صالح ومحك معلوم؛ لا حكم من أداة مختلة أو تغطية شكلية."}],"2-2-1-3":[{"id":"2-2-1-3-B01-A01","t":"يتحقق المعلم من مصدر النتائج والفئة والفترة وطريقة الحكم على الأداء، ويفحص نقص الرصد واختلاف الأدوات والظروف. ويصحح ما يستطيع تصحيحه ويبين ما يمنع المقارنة قبل تفسير النتيجة.","o":"بيانات مناسبة للتحليل وحدود مقارنة معلومة؛ لا يعامل غياب الدرجة كصفر أو يجمع ما لا يقارن بصمت."},{"id":"2-2-1-3-B01-A02","t":"يفصل المعلم النتائج بحسب الناتج والفئة ولا يكتفي بمتوسط المدرسة. يصف نمط الأداء ويقترح تفسيرًا قابلًا للاختبار. يختبر الفرضية بأعمال إضافية عند الحاجة، ويفصل السبب المثبت عما لم يتضح بعد.","o":"فجوة ونمط وتفسير مسند أو فرضية معلقة؛ انخفاض الدرجة وحده لا يثبت السبب."},{"id":"2-2-1-3-B01-A03","t":"يحدد المعلم من يحتاج إلى دعم أو إثراء وما يحتاج إلى تغيير في التعليم أو أداة التقويم، ويبين سبب القرار من الأداء. ويراجع اختلاف القرارات في الحالات المتشابهة حتى لا يبقى تفاوت بلا تفسير.","o":"قرار مبرر يميز الحاجات؛ وجود درجة فاصلة غير موثقة لا يتحول إلى محك رسمي."},{"id":"2-2-1-3-B02-A01","t":"يصمم المعلم دعمًا أو إثراءً للمهارة التي يكشفها التحليل، ويحدد من أين يبدأ وما يفعله الطالب ووقت العمل ومخرجه وفحصه اللاحق. ويستخدم تدخلًا قائمًا إذا ناسب الحاجة ويعدله بدل إنشاء برنامج عام مكرر.","o":"تدخل يطابق حاجة مسندة ومخرجًا وفحصًا؛ برنامج عام لا يقابل الفجوة لا يكفي."},{"id":"2-2-1-3-B02-A02","t":"ينفذ المعلم التدخل في مهمات المادة والطلاب الذين يتولى تعليمهم ويوثق الأداء الفعلي أو تعذر التنفيذ. يفحص إن كان الخلل في التعليم أو الأداة أو التطبيق ويعدل ما تؤيده الأدلة. يحفظ علاقة التعديل بالسبب ولا يسجل التغيير الشكلي نجاحًا أو تقويمًا وظيفيًا.","o":"تعديل أو دعم منفذ مرتبط بالحاجة والسبب المدعوم، مع مخرج يمكن متابعته."},{"id":"2-2-1-3-B02-A03","t":"يعيد المعلم فحص الناتج المستهدف بقدر مناسب من المقارنة ويسجل المساعدة والظروف. يقارن الاستجابة أو عدمها، ولا يستدل من حضور البرنامج على التحسن. يقرر الاستمرار أو تعديل الدعم أو إعادة التشخيص، ويربطه بدورة المتابعة التالية دون إنشاء مهمة تشغيلية.","o":"أداء لاحق وقرار مسند؛ عدم التحسن وتعذر المقارنة يبقيان ظاهرين دون نسبة سببية مؤكدة."}],"2-2-1-4":[{"id":"2-2-1-4-B01-A01","t":"يفحص معلم كل مادة أعمال طلابه على أساس التعلم المطلوب ومعايير تقويمه، ويحدد ما يتقنه الطالب وما يحتاج إلى تحسينه في عمله نفسه. ويقدم ملاحظة يفهمها ويكيف لغتها أو وسيلتها، ويتحقق من الفهم ويحفظ العمل في موضعه بدل تكرار نسخه.","o":"تربط الملاحظة بسطر أو خطوة في عمل الطالب وبمحك معلوم، ويشرح الطالب موضع الإتقان والتحسين؛ إن عجز يُعاد التوضيح ويسجل التعثر."},{"id":"2-2-1-4-B01-A02","t":"يقدم معلم المادة تغذية راجعة منتظمة بعد فرص التقويم المناسبة، ويختار تعليقًا أو شرحًا أو تصحيحًا موجهًا بحسب الحاجة. يحدد خطوة تحسين واضحة يستطيع المتعلم تطبيقها في مادته، مع بيان فرصة التطبيق المتاحة. يطلب من المتعلم توضيح ما سيفعله بعدها، ويعيد التفسير أو يغير الوسيلة إذا لم يفهم الخطوة.","o":"تتضمن التغذية وصف الأداء والخطوة التالية، ويستطيع الطالب ذكر ما سيفعله؛ يحفظ سبب القناة أو الصيغة المختارة."},{"id":"2-2-1-4-B01-A03","t":"يتيح المعلم تعديل العمل أو محاولة أو مهمة لاحقة، ويقارن الأداء الأول واللاحق بمعايير واضحة. ويبين التحسن أو استمرار التعثر أو ما يمنع المقارنة. وعند عدم التحسن يفحص فهم التوجيه والوقت والوصول والمهمة، ويعدل ما تدعمه المعلومات ثم يعيد المتابعة.","o":"أداء أول وتعليق وأداء لاحق منسوبان للطالب والفترة؛ المقارنة معللة، وعدم التحسن محفوظ ويستدعي متابعة مناسبة."},{"id":"2-2-1-4-B02-A01","t":"يرسل المعلم، أو الشخص الذي ترسل المدرسة من خلاله المعلومات، وصفًا يخص أداء الطالب وخطوة تستطيع الأسرة مساندتها عبر القناة المعتمدة. ويتحقق من الوصول أو تعذره ويستخدم البديل الذي تسمح به المدرسة. وينسق المعلمون المواعيد لتجنب التضارب والإغراق، دون نشر بيانات طلاب آخرين.","o":"رسالة تخص الطالب وحده عبر قناة قائمة مخولة، وتحتوي وصفًا وخطوة قابلة للدعم؛ حالة الوصول أو تعذره معلومة."},{"id":"2-2-1-4-B02-A02","t":"يجمع معلم المادة استجابة المتعلم والأسرة، ويحدد إن كانت خطوة الدعم مناسبة لوقتهما ومعرفتهما وإمكاناتهما. يعدل الخطوة أو وسيلة التواصل عند ثبوت عائق، ويحفظ الدعم المدرسي للمتعلم إذا تعذر دعم الأسرة. يسجل الاستجابة أو عدمها ومحاولة التكييف، ويستخدم هذه المعلومات في المتابعة التالية دون افتراض تحسن من مجرد التعاون.","o":"متابعة توضح الخطوة المتفق عليها وحالة تطبيقها وملاءمتها، أو العائق ومحاولة التكييف؛ عدم الاستجابة مسجل دون إسقاط الطالب من الدعم المدرسي."},{"id":"2-2-1-4-B02-A03","t":"يحدث المعلم الأسرة بما يظهر في العمل اللاحق من تقدم أو تعثر، ويبين ما يقارن به والسبب، ويحدد الخطوة التالية للطالب والأسرة. وإذا غاب دليل التقدم يصرح بذلك، وتتابع المدرسة من تستمر حاجتهم وتفاوت التطبيق بين المواد والصفوف.","o":"رسالة تقدم مسندة إلى عمل لاحق أو تصرح بأن التقدم غير مثبت؛ الخطوة التالية محددة ومحمية الخصوصية."}]},"TLD-03":{"2-1-1-1":[{"id":"2-1-1-1-B01-A03","t":"يتيح المعلم فرصة تفكير وإجابة لكل طالب، وينظم تبادل الأدوار واستخدام المصدر. يتابع مشاركة من حددت حاجته، ويطلب عملًا فرديًا يبين ما أنجزه داخل النشاط المشترك.","o":"أعمال فردية وملاحظة مشاركة موزعة، مع وسيلة الاستجابة ومقدار الدعم."},{"id":"2-1-1-1-B01-A04","t":"يفحص المعلم أداءً لاحقًا في الهدف نفسه مع تكييف معلوم، ويقارن المشاركة والفهم والاستقلال لدى من تلقوا الدعم والمتقدمين. يبقي ما نفع ويعدل ما لم يفتح فرصة تعلم فعلية.","o":"عمل أول وآخر ووصف المساعدة وقرار استمرار أو تغيير التكييف؛ لا بيانات شخصية في العرض."}],"2-1-1-2":[{"id":"2-1-1-2-B01-A03","t":"يراجع المعلم عمل الطالب وتفسيره ومحاولته المستقلة في ضوء الناتج. يميز المعرفة التي تعلمها والأداء الذي أتقنه والممارسة الدالة على القيمة في سياقها، ثم يعيد تعليم موضع الحاجة ويتيح إثراءً للمتقن.","o":"عمل مفسر وملاحظة ممارسة مناسبة وقرار تدريس لاحق؛ لا اكتمال مبني على تسليم الواجب وحده."}],"2-1-1-3":[{"id":"2-1-1-3-B01-A03","t":"نفذ الاستراتيجيات وافحص أعمال الطلاب والمشاركة","o":"ملاحظة تنفيذ وعمل فردي وتفسير، مع نوع المساعدة."}],"2-1-1-4":[{"id":"2-1-1-4-B01-A02","t":"ينفذ المعلم مهمة يستخدم فيها الطالب التقنية للفهم أو التمثيل أو الممارسة أو الاستجابة للتغذية الراجعة. يصل العمل الرقمي بالنقاش الصفي حين يخدم الهدف، ويتيح البديل لمن تعذر وصوله مع بقاء الناتج.","o":"منتج وتفسير أو تعديل من الطالب، وربطه بناتج المادة؛ والبديل المكافئ عند الحاجة."},{"id":"2-1-1-4-B01-A04","t":"إذا ظهرت أثناء المهمة فجوة رقمية تعطلها، يوقف المعلم عند الخطوة اللازمة ويقدم دعمًا قصيرًا، ثم يعيد الطالب لإنجازها بنفسه داخل الموقف. إذا لم تظهر فجوة يسجل عدم الحاجة للدعم ولا يصطنع تدريبًا.","o":"وصف الفجوة عند ظهورها ومحاولة الطالب بعد الدعم في المهمة نفسها؛ أو عدم انطباق الدعم."},{"id":"2-1-1-4-B01-A03","t":"يفحص المعلم الناتج التعليمي من تفسير الطالب وعمله، ويقارنه بأداء أول مناسب وبمقدار الدعم والوصول. يقرر استمرار الاستخدام أو تعديله أو اختيار وسيلة أوضح؛ ولا يجعل نقل مهارة رقمية جديدة شرطًا للإغلاق.","o":"عمل يبين التعلم وقرار استخدام لاحق مع حد المقارنة؛ PEND-D05 محفوظ."}],"2-1-1-5":[{"id":"2-1-1-5-B01-A03","t":"ينفذ الطلاب المهمة ويشرحون ما اختاروه وكيف تحققوا من النتيجة. يتابع المعلم خطواتهم ويقدم دعمًا محددًا، ثم يطلب من كل طالب تفسيرًا أو جزءًا مستقلًا يظهر تعلمه.","o":"منتج وأداء وتفسير فردي، مع الخطأ والتعديل والمساعدة."},{"id":"2-1-1-5-B01-A04","t":"يعرض المعلم موقفًا مشابهًا يغير البيانات أو القيد بما يحتاج اختيارًا من الفكرة نفسها. يفحص تفسير الطالب ومعقولية حله وما احتاجه من تلميح، ويعيد تعليم الصلة التي لم تنتقل.","o":"تطبيق لاحق وتفسير يبين ما انتقل وحدود الموقف الجديد."}],"2-1-1-6":[{"id":"2-1-1-6-B01-A01","t":"يسمع معلم العربية قراءة مناسبة ويطلب فهم كلمة وفكرة وكتابة قصيرة من محتوى الصف. يميز تعرف الكلمات والطلاقة ذات المعنى والفهم والتعبير، ويحدد دعمًا أو إثراءً من دليل فعلي.","o":"قراءة وإجابة وكتابة مؤرخة عند الاستخدام؛ موضع حاجة محدد لا تصنيف دائم."},{"id":"2-1-1-6-B01-A02","t":"ينتقي معلم العربية نصًا وكلمات وتراكيب من المنهج تناسب الحاجة، وينمذج القراءة أو بناء المعنى والكتابة. يتيح قراءة وفهمًا وتعبيرًا قصيرًا مترابطًا، ويجعل نصوص المواد مجال تطبيق بإسناد معلميها.","o":"مهام قراءة وكتابة وأعمال وتفسير يبين الصلة بالحاجة."},{"id":"2-1-1-6-B01-A03","t":"يجمع معلم العربية من يشتركون مؤقتًا في حاجة واحدة لتعليم موجه، ويعيد المهارة إلى نص الصف. يعطي المتقدم تفسيرًا أعمق أو كتابة توظف الفكرة، ويغير المجموعة من الاستجابة اللاحقة.","o":"عمل قبل الدعم وبعده ومهمة إثراء ذات عمق؛ لا فئات ثابتة أو حرمان من المنهج."},{"id":"2-1-1-6-B01-A04","t":"يعيد معلم العربية فحص المهارة بنص مناسب آخر وكتابة قصيرة مع مقدار مساعدة معلوم. يقارن دقة القراءة والفهم والتعبير، ويقرر استمرار الدعم أو تغييره أو تخفيفه ويراقب من لم يستفد.","o":"مقارنة مهارية من أعمال مستقلة وقرار لاحق؛ لا نسبة نتيجة مختلقة."},{"id":"2-1-1-6-B02-A01","t":"يعرض معلم الرياضيات مهمة مقدار أو تمثيل أو عملية مناسبة للمقرر، ويطلب تفسير الحل ومعقوليته. يميز خطأ معنى العدد أو القيمة أو العلاقة من خطأ إجراء أو قراءة المسألة.","o":"حل وتمثيل وشرح يكشفان نمط الخطأ أو العمق المتاح للمتقن."},{"id":"2-1-1-6-B02-A02","t":"يعلم معلم الرياضيات المعنى بتمثيل ملائم، ويصل بين الأداة أو الرسم والرمز واللغة الرياضية. يعرض مثالًا واضحًا ويتيح ممارسة موجهة ثم مسألة فردية مع تفسير.","o":"تمثيل متصل بالرمز وحل مفسر؛ أدوات مختارة للفكرة من منهج الصف."},{"id":"2-1-1-6-B02-A03","t":"يعالج المعلم نمط الخطأ المؤيد بتعليم موجه وممارسة في حاجة واحدة، ثم يعيده إلى موضوع الصف. يعطي المتقدم مسألة تقارن طرقًا أو تغير قيدًا وتطلب تعليلًا؛ يعاد التجميع من الاستجابة.","o":"محاولة علاجية أو إثرائية توضح الخطأ والتعديل أو عمق التفكير."},{"id":"2-1-1
