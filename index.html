دلة أداء طلاب","c":"هل الدليل من الطالب نفسه؟"},{"id":"3-2-1-1-B01-A03","b":"ظهور القيم في أداء المتعلم","a":"حدد الفجوات وقدم دعمًا ثم أعد الملاحظة","o":"تحسن ممارسة وفهم","c":"هل ظهرت القيمة في موقف آخر؟"},{"id":"3-2-1-1-B02-A01","b":"ظهور الاعتزاز بالهوية الوطنية","a":"حدد مواقف يعبر فيها الطالب عن معنى الهوية والانتماء","o":"مهمة تعبير أو ممارسة","c":"هل تتجاوز المهمة ترديد الشعار؟"},{"id":"3-2-1-1-B02-A02","b":"ظهور الاعتزاز بالهوية الوطنية","a":"افحص أعمال الطلاب وتفسيراتهم","o":"ناتج فردي أو جماعي موثق","c":"هل يستطيع الطالب شرح معنى مشاركته؟"},{"id":"3-2-1-1-B02-A03","b":"ظهور الاعتزاز بالهوية الوطنية","a":"قدم دعمًا للفهم المتعثر وراجع الأداء اللاحق","o":"نتيجة دعم لاحقة","c":"هل تغير الفهم في أداء الطالب؟"}]},{"ref":"3-2-1-2","text":"يظهر المتعلمون اتجاهات إيجابية نحو ذواتهم والآخرين.","standard":"التطور الشخصي والصحي والاجتماعي","standard_ref":"3-2","domain":"نواتج التعلم","kind":"ناتج متعلم","branches":["الاتجاه الإيجابي نحو الذات","الاتجاه الإيجابي نحو الآخرين"],"actions":[{"id":"3-2-1-2-B01-A01","b":"الاتجاه الإيجابي نحو الذات","a":"حدد مواقف يظهر فيها إدراك الطالب لقدرته ومحاولته","o":"مواقف فحص تربوي","c":"هل الوصف أداء ملاحظ لا تشخيص؟"},{"id":"3-2-1-2-B01-A02","b":"الاتجاه الإيجابي نحو الذات","a":"اجمع أعمالًا وتعبيرًا ذاتيًا وملاحظات مناسبة","o":"أدلة اتجاه ومشاركة","c":"هل تكفي الأدلة لطبيعة السلوك المستهدف، ولا تقوم على موقف واحد؟"},{"id":"3-2-1-2-B01-A03","b":"الاتجاه الإيجابي نحو الذات","a":"قدم دعمًا وتغذية راجعة وراجع استعداد المحاولة","o":"استجابة وتقدم","c":"هل زادت المشاركة وطلب المساعدة المناسب؟"},{"id":"3-2-1-2-B02-A01","b":"الاتجاه الإيجابي نحو الآخرين","a":"حدد مواقف حوار وتعاون تتيح ظهور التعامل مع الآخرين","o":"فرص ملاحظة تعامل","c":"هل يتاح تبادل الأدوار والآراء؟"},{"id":"3-2-1-2-B02-A02","b":"الاتجاه الإيجابي نحو الآخرين","a":"راجع الإصغاء والاحترام والتعاون في أكثر من موقف","o":"أدلة تعامل متكررة","c":"هل السلوك يظهر خارج النشاط الموجه؟"},{"id":"3-2-1-2-B02-A03","b":"الاتجاه الإيجابي نحو الآخرين","a":"قدم دعمًا للتعامل المتعثر وافحص استمراره","o":"ممارسة اجتماعية محسنة","c":"هل يتغير السلوك في موقف تال؟"}]},{"ref":"3-2-1-3","text":"يظهر المتعلمون التزامًا بالممارسات الصحية السليمة.","standard":"التطور الشخصي والصحي والاجتماعي","standard_ref":"3-2","domain":"نواتج التعلم","kind":"ناتج متعلم","branches":["ممارسة السلوك الصحي"],"actions":[{"id":"3-2-1-3-B01-A01","b":"ممارسة السلوك الصحي","a":"حدد ممارسات تربوية صحية مناسبة من المرجع المنطبق","o":"ممارسات ومواقف فحص","c":"هل الممارسة واضحة ومناسبة للمرحلة؟"},{"id":"3-2-1-3-B01-A02","b":"ممارسة السلوك الصحي","a":"لاحظ أداء الطلاب وافحص عوائق البيئة أو الفهم","o":"ملاحظات ممارسة وعوائق","c":"هل ضعف الممارسة سببه المعرفة أم عدم الإتاحة؟"},{"id":"3-2-1-3-B01-A03","b":"ممارسة السلوك الصحي","a":"قدم توعية وتطبيقًا عمليًا وعالج عائق البيئة عبر المختص","o":"دعم وتهيئة مناسبة","c":"هل أصبح تطبيق الممارسة ممكنًا؟"},{"id":"3-2-1-3-B01-A04","b":"ممارسة السلوك الصحي","a":"أعد الملاحظة في الحياة المدرسية","o":"استمرار ممارسة","c":"هل يستمر السلوك خارج النشاط؟"}]},{"ref":"3-2-1-4","text":"يشارك المتعلمون في الأنشطة المجتمعية والأعمال التطوعية.","standard":"التطور الشخصي والصحي والاجتماعي","standard_ref":"3-2","domain":"نواتج التعلم","kind":"عمل مدرسي داعم + ناتج متعلم","branches":["إتاحة فرص التطوع ودعم المشاركة (عمل مدرسي داعم)","المشاركة الفعلية ونتائجها (ناتج متعلم)"],"actions":[{"id":"3-2-1-4-B01-A01","b":"إتاحة فرص التطوع ودعم المشاركة (عمل مدرسي داعم)","a":"عزز ثقافة التطوع وحدد حاجات مدرسية ومجتمعية مناسبة للطلاب","o":"حاجات وفرص مشاركة مقترحة","c":"هل يعرف الطالب غرض الخدمة وحاجتها؟"},{"id":"3-2-1-4-B01-A04","b":"إتاحة فرص التطوع ودعم المشاركة (عمل مدرسي داعم)","a":"لفرص التطوع خارج المدرسة أو مع جهات خارجية: احسم الإذن والضوابط المنطبقة قبل إتاحتها","o":"فرص مخولة ومخرجات متفق عليها","c":"هل المشاركة مناسبة وآمنة ومخولة؟"},{"id":"3-2-1-4-B01-A02","b":"إتاحة فرص التطوع ودعم المشاركة (عمل مدرسي داعم)","a":"أتح فرص تطوع متنوعة داخل المدرسة وفي المجتمع المحلي لجميع الفئات، وادعم المشاركة فيها بالتحفيز","o":"فرص متاحة وبرامج تحفيز","c":"هل الفرص متنوعة ومتاحة لكل فئة؟ وهل الخارجية منها مأذونة؟"},{"id":"3-2-1-4-B02-A04","b":"المشاركة الفعلية ونتائجها (ناتج متعلم)","a":"حدد ما يُحتسب مشاركة فعلية (دور وعمل منجز) والفئة والفترة قبل الرصد","o":"تعريف مشاركة ونطاق رصد","c":"هل يميز التعريف المساهمة الفعلية من الحضور، وهل المقام معلوم؟"},{"id":"3-2-1-4-B02-A02","b":"المشاركة الفعلية ونتائجها (ناتج متعلم)","a":"سجّل مشاركة الطلاب الفعلية وأدوارهم داخل المدرسة وفي المجتمع المحلي وفق التعريف","o":"سجل مشاركة بأدوار ونطاق","c":"هل لكل مشاركة دور ومخرج، وهل يظهر النطاقان؟"},{"id":"3-2-1-4-B02-A03","b":"المشاركة الفعلية ونتائجها (ناتج متعلم)","a":"راجع تنوع مجالات المشاركة واتساعها بين الفئات","o":"نتيجة تنوع واتساع","c":"هل تتنوع مجالات المشاركة الفعلية وتتسع بين الفئات؟"},{"id":"3-2-1-4-B02-A05","b":"المشاركة الفعلية ونتائجها (ناتج متعلم)","a":"قوّم مساهمة الطلاب الفعلية وما تعلموه منها، وطوّر الفرصة اللاحقة","o":"نتيجة مساهمة وتعلم وقرار تطوير","c":"هل الدليل مساهمة الطالب نفسه لا صورة الفعالية، وهل يظهر تعلم مرتبط بالدور؟"}]},{"ref":"3-2-1-5","text":"يلتزم المتعلمون بقواعد السلوك والانضباط المدرسي.","standard":"التطور الشخصي والصحي والاجتماعي","standard_ref":"3-2","domain":"نواتج التعلم","kind":"ناتج متعلم","branches":["ناتج الالتزام بالسلوك","ناتج الانتظام في الحضور"],"actions":[{"id":"3-2-1-5-B01-A01","b":"ناتج الالتزام بالسلوك","a":"حدد تعريف الالتزام والفترة والفئة من المرجع المنطبق","o":"تعريف قياس واضح","c":"هل التعريف والمقام ثابتان ومعلومان؟"},{"id":"3-2-1-5-B01-A02","b":"ناتج الالتزام بالسلوك","a":"راجع الوقائع والسجل المعتمد واستخرج النتيجة الفعلية","o":"نتيجة التزام قابلة للتتبع","c":"هل استبعد التسجيل المكرر وعولجت البيانات الناقصة؟"},{"id":"3-2-1-5-B01-A03","b":"ناتج الالتزام بالسلوك","a":"حلل الحالات المتكررة واربطها بالدعم السلوكي ثم راجع النتيجة","o":"دعم وتغير التزام","c":"هل انخفض التعثر في الفترة اللاحقة؟"},{"id":"3-2-1-5-B02-A01","b":"ناتج الانتظام في الحضور","a":"ثبت تعريف الانتظام والفترة والمقام من المصدر المنطبق","o":"تعريف حضور وفترة","c":"هل النسبة تقيس أفرادًا أم أيامًا وفق المرجع؟"},{"id":"3-2-1-5-B02-A02","b":"ناتج الانتظام في الحضور","a":"تحقق من بيانات الحضور والغياب وأسباب الانقطاع","o":"نتيجة حضور وحالات متكررة","c":"هل البيانات كاملة وليست غيابًا غير مسجل؟"},{"id":"3-2-1-5-B02-A03","b":"ناتج الانتظام في الحضور","a":"نسق دعم الحالات مع الأسرة والمختص وراجع الانتظام لاحقًا","o":"دعم وتحسن حضور","c":"هل تغير نمط الغياب بعد الدعم؟"}]},{"ref":"3-2-1-6","text":"يظهر المتعلمون الاستقلالية والقدرة على التعلم الذاتي.","standard":"التطور الشخصي والصحي والاجتماعي","standard_ref":"3-2","domain":"نواتج التعلم","kind":"ناتج متعلم","branches":["الاستقلالية وإدارة التعلم","البحث والتعلم الذاتي"],"actions":[{"id":"3-2-1-6-B01-A01","b":"الاستقلالية وإدارة التعلم","a":"أتح للطالب تحديد هدف وخطة بسيطة للتعلم","o":"هدف وخطة طالب","c":"هل يستطيع الطالب تفسير هدفه وخطواته؟"},{"id":"3-2-1-6-B01-A02","b":"الاستقلالية وإدارة التعلم","a":"اطلب تنفيذ الخطة وإدارة الوقت وطلب الدعم عند الحاجة","o":"إنجاز يقوده الطالب","c":"هل يتخذ الطالب قرارات مناسبة أثناء العمل؟"},{"id":"3-2-1-6-B01-A03","b":"الاستقلالية وإدارة التعلم","a":"راجع الأداء الذاتي وتخطيط المهمة التالية","o":"تقويم ذاتي وخطة لاحقة","c":"هل يقل الاعتماد على المساعدة مع بقاء الجودة؟"},{"id":"3-2-1-6-B02-A01","b":"البحث والتعلم الذاتي","a":"حدد مع الطالب سؤال تعلم ومصادر مناسبة","o":"سؤال ومصادر تعلم","c":"هل يستطيع الطالب اختيار مصدر يخدم السؤال؟"},{"id":"3-2-1-6-B02-A02","b":"البحث والتعلم الذاتي","a":"اطلب جمع المعلومات وتجريبها أو استخدامها في مهمة","o":"ملاحظات ومنتج تعلم","c":"هل يشرح الطالب ما تعلمه وكيف استخدمه؟"},{"id":"3-2-1-6-B02-A03","b":"البحث والتعلم الذاتي","a":"افحص نقل التعلم إلى مهمة لاحقة","o":"أداء لاحق مستقل","c":"هل يستخدم الطالب المهارة دون توجيه كامل؟"}]},{"ref":"3-2-1-7","text":"يظهر المتعلمون اعتزازًا بثقافتهم واحترامًا للتنوع الثقافي في المجتمع.","standard":"التطور الشخصي والصحي والاجتماعي","standard_ref":"3-2","domain":"نواتج التعلم","kind":"ناتج متعلم","branches":["الاعتزاز بالثقافة","احترام التنوع الثقافي"],"actions":[{"id":"3-2-1-7-B01-A01","b":"الاعتزاز بالثقافة","a":"صمم مهمة يشرح فيها الطالب جانبًا من ثقافته","o":"مهمة تعبير ثقافي","c":"هل المهمة مناسبة لعمره وخبرته؟"},{"id":"3-2-1-7-B01-A02","b":"الاعتزاز بالثقافة","a":"افحص أعمال الطلاب وتفسيرهم لمعناها","o":"أعمال وتفسير فردي","c":"هل يشرح الطالب المعنى بكلماته؟"},{"id":"3-2-1-7-B01-A03","b":"الاعتزاز بالثقافة","a":"قدم دعمًا للفهم وراجع تعبيرًا لاحقًا","o":"فهم وتعبير أفضل","c":"هل تحسن التفسير؟"},{"id":"3-2-1-7-B02-A01","b":"احترام التنوع الثقافي","a":"أتح مواقف حوار وتعاون مناسبة بين وجهات نظر متنوعة","o":"فرص تفاعل وفحص","c":"هل تسمح المهمة بالإصغاء وتقبل الاختلاف؟"},{"id":"3-2-1-7-B02-A02","b":"احترام التنوع الثقافي","a":"لاحظ اللغة والتعامل والمشاركة","o":"أدلة احترام في مواقف فعلية","c":"هل توجد سخرية أو استبعاد متكرر؟"},{"id":"3-2-1-7-B02-A03","b":"احترام التنوع الثقافي","a":"راجع استمرار التعامل المحترم خارج النشاط","o":"ممارسة لاحقة","c":"هل يظهر الاحترام في الحياة المدرسية؟"}]},{"ref":"4-1-1-1","text":"توفر المدرسة مبنى تعليميًا يستوفي المواصفات والاشتراطات المعتمدة من حيث النوع والخدمات المساندة.","standard":"المبنى المدرسي","standard_ref":"4-1","domain":"البيئة المدرسية","kind":"عمل مدرسي","branches":["مطابقة المبنى التعليمي","مطابقة الخدمات المساندة"],"actions":[{"id":"4-1-1-1-B01-A01","b":"مطابقة المبنى التعليمي","a":"حدد نوع المبنى والاشتراطات المنطبقة عبر الجهة المختصة","o":"نوع ومرجع فني","c":"هل المرجع يخص نوع المبنى المستخدم؟"},{"id":"4-1-1-1-B01-A02","b":"مطابقة المبنى التعليمي","a":"اطلب فحص المطابقة وحدد النواقص وأثرها","o":"تقرير مختص وفجوات","c":"هل الحكم مستند إلى تقرير مناسب؟"},{"id":"4-1-1-1-B01-A03","b":"مطابقة المبنى التعليمي","a":"تابع معالجة النواقص وتحقق من إغلاقها مع المختص","o":"معالجة وإثبات إغلاق","c":"هل زالت الفجوة فنيًا؟"},{"id":"4-1-1-1-B02-A01","b":"مطابقة الخدمات المساندة","a":"احصر الخدمات المساندة التي تشترطها المواصفة لنوع المبنى (احتياجات الطلاب من الخدمات تُعالج في 4-1-1-4)","o":"قائمة متطلبات منطبقة","c":"هل القائمة مأخوذة من المرجع الفني لنوع المبنى لا من رأي المدرسة؟"},{"id":"4-1-1-1-B02-A02","b":"مطابقة الخدمات المساندة","a":"قارن الخدمات الفعلية بالمتطلبات مع الجهة المختصة","o":"فجوات خدمة ومطابقة","c":"هل الخدمة تعمل بالمستوى المطلوب؟"},{"id":"4-1-1-1-B02-A03","b":"مطابقة الخدمات المساندة","a":"تحقق من استكمال الخدمة بعد المعالجة","o":"إثبات استيفاء خدمة","c":"هل استكمل النقص الذي سجله الفحص؟"}]},{"ref":"4-1-1-2","text":"تنظيم مبنى المدرسة ملائم لعدد المتعلمين وخصائص المرحلة العمرية، ومنهم ذوو الإعاقة.","standard":"المبنى المدرسي","standard_ref":"4-1","domain":"البيئة المدرسية","kind":"عمل مدرسي","branches":["ملاءمة التنظيم لعدد المتعلمين وخصائص المرحلة العمرية","إتاحة التنظيم لذوي الإعاقة"],"actions":[{"id":"4-1-1-2-B01-A01","b":"ملاءمة التنظيم لعدد المتعلمين وخصائص المرحلة العمرية","a":"احصر الطلاب بحسب المراحل واستخدامهم الفعلي للمساحات والمرافق وأوقات الحركة","o":"حصر عدد واستخدام بحسب المرحلة","c":"هل يُظهر الحصر أماكن الازدحام (العدد) والمرافق غير المناسبة لمرحلة بعينها (المرحلة العمرية)، كلٌّ في خانته؟"},{"id":"4-1-1-2-B01-A02","b":"ملاءمة التنظيم لعدد المتعلمين وخصائص المرحلة العمرية","a":"راجع توزيع المساحات والمرافق مقابل المرجع الفني المنطبق وخصائص كل مرحلة","o":"فجوات توزيع وملاءمة عمرية","c":"هل صدر حكم مستقل لكل نقطة: ملاءمة العدد، وملاءمة المرحلة العمرية، مبني على مرجع مختص؟ ملاءمة إحداهما لا تعوض الأخرى."},{"id":"4-1-1-2-B01-A03","b":"ملاءمة التنظيم لعدد المتعلمين وخصائص المرحلة العمرية","a":"نفذ التعديل المخول وراجع تدفق الحركة والاستخدام لكل مرحلة","o":"تنظيم معدل ومراجعة استخدام","c":"هل زال التعثر بعد التعديل في نقطة العدد ونقطة المرحلة العمرية كلٌّ على حدة؟"},{"id":"4-1-1-2-B03-A01","b":"إتاحة التنظيم لذوي الإعاقة","a":"حدد احتياجات الوصول والاستخدام للفئات المعنية","o":"عوائق إتاحة محددة","c":"هل فُحص المسار كاملًا لا نقطة واحدة؟"},{"id":"4-1-1-2-B03-A02","b":"إتاحة التنظيم لذوي الإعاقة","a":"اطلب تقييم الإتاحة ومعالجة العوائق عبر المختص","o":"تعديل مخول","c":"هل المعالجة تلائم الحاجة الفعلية؟"},{"id":"4-1-1-2-B03-A03","b":"إتاحة التنظيم لذوي الإعاقة","a":"تحقق من استخدام المستفيد للمسار والمرفق","o":"مراجعة وصول فعلية","c":"هل أصبحت المشاركة ممكنة؟"}]},{"ref":"4-1-1-3","text":"تتوافر فصول ومعامل ملائمة للعملية التعليمية تلبي احتياجات المتعلمين، ومنهم ذوو الإعاقة.","standard":"المبنى المدرسي","standard_ref":"4-1","domain":"البيئة المدرسية","kind":"عمل مدرسي","branches":["الفصول الملائمة","المعامل الملائمة"],"actions":[{"id":"4-1-1-3-B01-A01","b":"الفصول الملائمة","a":"احصر حاجات التعلم والفئات والتجهيز والإتاحة في الفصول","o":"احتياجات وفجوات فصل","c":"هل يتيح الفصل المشاركة للفئات المستهدفة؟"},{"id":"4-1-1-3-B01-A02","b":"الفصول الملائمة","a":"راجع الملاءمة مع المختص ونفذ المعالجة المخولة","o":"فصل مهيأ وتجهيز مناسب","c":"هل عالج التجهيز الحاجة المحددة؟"},{"id":"4-1-1-3-B01-A03","b":"الفصول الملائمة","a":"افحص الاستخدام أثناء الدرس","o":"ملاحظة تعلم ووصول","c":"هل يستفيد الطلاب من التجهيز فعليًا؟"},{"id":"4-1-1-3-B02-A01","b":"المعامل الملائمة","a":"حدد حاجات الأنشطة العملية وملاءمة المعمل والإتاحة","o":"حاجات عملية وفجوات","c":"هل يتصل التجهيز بالمناهج والمستخدمين؟"},{"id":"4-1-1-3-B02-A02","b":"المعامل الملائمة","a":"جهز المعمل عبر الإجراء المختص ونظم استخدامه المخول","o":"جاهزية وجدول استخدام","c":"هل يمكن تنفيذ النشاط المقصود؟"},{"id":"4-1-1-3-B02-A03","b":"المعامل الملائمة","a":"راجع استفادة الطلاب أثناء النشاط","o":"استخدام فعلي وأعمال","c":"هل يتيح المعمل مشاركة الفئات؟"}]},{"ref":"4-1-1-4","text":"تلبي المرافق والتجهيزات والخدمات المساندة احتياجات المتعلمين، ومنهم ذوو الإعاقة.","standard":"المبنى المدرسي","standard_ref":"4-1","domain":"البيئة المدرسية","kind":"عمل مدرسي","branches":["ملاءمة المرافق","ملاءمة التجهيزات","ملاءمة الخدمات المساندة"],"actions":[{"id":"4-1-1-4-B01-A01","b":"ملاءمة المرافق","a":"احصر مرة واحدة احتياجات الطلاب من المرافق والتجهيزات والخدمات المساندة ومنها احتياجات ذوي الإعاقة، ووزع الفجوات على البنود الثلاثة","o":"حصر مشترك وفجوات موزعة","c":"هل يغطي الحصر الأنواع الثلاثة ويفحص الوصول والاستخدام؟"},{"id":"4-1-1-4-B01-A02","b":"ملاءمة المرافق","a":"ارفع التهيئة أو التعديل للجهة المختصة","o":"معالجة مرفق مخولة","c":"هل تعالج المعالجة عائقًا محددًا؟"},{"id":"4-1-1-4-B01-A03","b":"ملاءمة المرافق","a":"تحقق من استفادة الفئات بعد المعالجة","o":"استخدام فعلي","c":"هل زال العائق؟"},{"id":"4-1-1-4-B02-A01","b":"ملاءمة التجهيزات","a":"قارن التجهيز بالحاجة التعليمية والفئة اعتمادًا على الحصر المشترك","o":"فجوات تجهيز","c":"هل التجهيز مناسب ويعمل؟"},{"id":"4-1-1-4-B02-A02","b":"ملاءمة التجهيزات","a":"عالج نقص التجهيز أو عطله عبر الإجراء المخول","o":"تجهيز مستكمل أو مصحح","c":"هل أغلقت الفجوة التي أعاقت التعلم؟"},{"id":"4-1-1-4-B02-A03","b":"ملاءمة التجهيزات","a":"افحص استخدام التجهيز في المهمة","o":"استفادة تعليمية","c":"هل استفاد المستهدف من التجهيز؟"},{"id":"4-1-1-4-B03-A01","b":"ملاءمة الخدمات المساندة","a":"حدد من الحصر المشترك حاجة الطلاب للخدمات المساندة وطرق الحصول عليها","o":"احتياجات وقنوات خدمة","c":"هل القناة مفهومة ومتاحة؟"},{"id":"4-1-1-4-B03-A02","b":"ملاءمة الخدمات المساندة","a":"راجع تقديم الخدمة واستجابتها مع الجهة المعنية","o":"موقف خدمة وفجوات","c":"هل تصل الخدمة للفئة في وقت مفيد؟"},{"id":"4-1-1-4-B03-A03","b":"ملاءمة الخدمات المساندة","a":"تابع الاستفادة والرضا المرتبط بالحاجة","o":"نتيجة استفادة وتحسين","c":"هل لبت الخدمة الحاجة المحددة؟"}]},{"ref":"4-2-1-1","text":"تتوافر في مبنى المدرسة ومرافقها جميع متطلبات الأمن والسلامة.","standard":"الأمن والسلامة","standard_ref":"4-2","domain":"البيئة المدرسية","kind":"عمل مدرسي","branches":["شهادة ومتطلبات الأمن والسلامة","الوقاية والطوارئ والتدريب","المتطلبات الصحية المنطبقة للعاملين"],"actions":[{"id":"4-2-1-1-B01-A01","b":"شهادة ومتطلبات الأمن والسلامة","a":"تحقق مع المختص من الشهادة المطلوبة وانطباقها ومرجع صدورها","o":"مستند وانطباق","c":"هل المستند المطلوب متحقق للمبنى؟"},{"id":"4-2-1-1-B01-A02","b":"شهادة ومتطلبات الأمن والسلامة","a":"راجع صلاحية الشهادة ومتطلبات السلامة الفنية والفجوات","o":"صلاحية وفجوات فنية","c":"هل توجد متطلبات غير مستوفاة رغم الشهادة؟"},{"id":"4-2-1-1-B01-A03","b":"شهادة ومتطلبات الأمن والسلامة","a":"تابع معالجة فجوات السلامة الفنية حتى إغلاقها مع المختص","o":"إثبات إغلاق الفجوات","c":"هل أغلقت الفجوات ذات الأثر؟"},{"id":"4-2-1-1-B01-A04","b":"شهادة ومتطلبات الأمن والسلامة","a":"تابع تجديد شهادة الأمن والسلامة المنطبقة قبل انتهاء سريانها عبر الجهة المختصة","o":"شهادة سارية أو طلب تجديد موثق","c":"هل الشهادة سارية، أو قُدم طلب التجديد قبل انتهائها؟"},{"id":"4-2-1-1-B02-A01","b":"الوقاية والطوارئ والتدريب","a":"ثبت الخطط الوقائية والطوارئ المعتمدة والأدوار","o":"خطط وأدوار مخولة","c":"هل يفهم المعنيون دورهم؟"},{"id":"4-2-1-1-B02-A02","b":"الوقاية والطوارئ والتدريب","a":"نفذ توعية متنوعة وتدريبات واختبارات وفق الخطة المخولة","o":"تنفيذ وملاحظات تدريب","c":"هل يكشف التدريب عائقًا في الاستعداد؟"},{"id":"4-2-1-1-B02-A03","b":"الوقاية والطوارئ والتدريب","a":"راجع نتائج التدريب وحسن الجاهزية","o":"تعديل ومعالجة متحققة","c":"هل عولج العائق، وهل يتكرر العائق نفسه بما يدل على خلل في الخطة؟"},{"id":"4-2-1-1-B03-A01","b":"المتطلبات الصحية المنطبقة للعاملين","a":"احسم مع الجهة المختصة انطباق الشهادات والفحوص والتطعيمات والتقارير على كل فئة","o":"متطلبات منطبقة وصاحب تحقق","c":"هل لكل مطلب سند وفئة وصلاحية وصول؟"},{"id":"4-2-1-1-B03-A02","b":"المتطلبات الصحية المنطبقة للعاملين","a":"تحقق عبر المخول من سريان الشهادات المطلوبة ومنها شهادات العاملين بالمقصف","o":"نتيجة تحقق وصلاحية دون تفاصيل صحية","c":"هل التحقق صادر عن صاحب الاختصاص؟"},{"id":"4-2-1-1-B03-A03","b":"المتطلبات الصحية المنطبقة للعاملين","a":"تابع تطبيق إجراءات الوقاية والمعالجة الصحية المعتمدة","o":"متابعة إجراء مخول","c":"هل بقي نقص أو إجراء غير منفذ؟"}]},{"ref":"4-2-1-2","text":"تتابع المدرسة صيانة المبنى، وجميع مرافقه وتجهيزاته بشكل دوري.","standard":"الأمن والسلامة","standard_ref":"4-2","domain":"البيئة المدرسية","kind":"عمل مدرسي","branches":["الصيانة الوقائية والفحوص","معالجة الأعطال والتحقق من الإصلاح"],"actions":[{"id":"4-2-1-2-B01-A01","b":"الصيانة الوقائية والفحوص","a":"احصر المرافق والتجهيزات وضع خطة صيانة شاملة للاعتماد المخول","o":"جرد وخطة معتمدة","c":"هل تشمل الخطة جميع المرافق والتجهيزات؟"},{"id":"4-2-1-2-B01-A02","b":"الصيانة الوقائية والفحوص","a":"نفذ الفحوص الدورية عبر المختص وسجل نتائجها","o":"فحوص ونتائج مرتبطة بالأصول","c":"هل الفحص منفذ لا مجدول فقط؟"},{"id":"4-2-1-2-B01-A03","b":"الصيانة الوقائية والفحوص","a":"عدل الأولويات وفق نتائج الفحص","o":"أولويات وقاية ومعالجة","c":"هل تعالج الأولوية أثر الخلل؟"},{"id":"4-2-1-2-B02-A01","b":"معالجة الأعطال والتحقق من الإصلاح","a":"حدد إجراءات البلاغ ومعالجة الأعطال وحماية المستخدمين وفق المختص","o":"بلاغ أصل وإجراء مخول","c":"هل الخلل ووضع الاستخدام واضحان؟"},{"id":"4-2-1-2-B02-A02","b":"معالجة الأعطال والتحقق من الإصلاح","a":"تابع الإصلاح وسجل العمل المنفذ بدقة","o":"إصلاح موثق ومرجع أصل","c":"هل يعالج الإصلاح سبب العطل؟"},{"id":"4-2-1-2-B02-A03","b":"معالجة الأعطال والتحقق من الإصلاح","a":"تحقق عبر المختص من صلاحية الاستخدام وتحسن الظروف قبل إغلاق المعالجة","o":"فحص إغلاق ومتابعة تكرار","c":"هل عاد الأصل للعمل دون تكرار الخلل؟"}]},{"ref":"4-2-1-3","text":"تتابع المدرسة نظافة المبنى المدرسي، وجميع مرافقه بشكل مستمر.","standard":"الأمن والسلامة","standard_ref":"4-2","domain":"البيئة المدرسية","kind":"عمل مدرسي","branches":["النظافة المستمرة لجميع المرافق"],"actions":[{"id":"4-2-1-3-B01-A01","b":"النظافة المستمرة لجميع المرافق","a":"احصر مناطق التنظيف وأوقات الاستخدام وحدد خدمة مناسبة","o":"نطاق خدمة وجدول ومسؤولية","c":"هل يشمل النطاق جميع المرافق؟"},{"id":"4-2-1-3-B01-A02","b":"النظافة المستمرة لجميع المرافق","a":"نفذ الخدمة بالمستلزمات والتعليمات المعتمدة من الجهة المختصة","o":"خدمة منفذة","c":"هل التنفيذ مناسب ولا يعطل التعلم؟"},{"id":"4-2-1-3-B01-A03","b":"النظافة المستمرة لجميع المرافق","a":"افحص النظافة أثناء الاستخدام وسجل الملاحظات","o":"فحص جودة ومناطق متعثرة","c":"هل تعكس النتيجة الوضع اليومي لا قبل التصوير فقط؟"},{"id":"4-2-1-3-B01-A04","b":"النظافة المستمرة لجميع المرافق","a":"عالج الملاحظات وتحقق من استمرار الجودة","o":"معالجة وفحص لاحق","c":"هل اختفت الملاحظة ولم تتكرر؟"}]},{"ref":"م-الث-1","text":"يحقق المتعلمون نتائج متقدمة في الاختبارات التحصيلية للمرحلة الثانوية.","standard":"التحصيل التعليمي","standard_ref":"","domain":"نواتج التعلم","kind":"مؤشر مرحلة","branches":[],"actions":[],"stage_only":"الثانوية"},{"ref":"م-الث-2","text":"يحقق المتعلمون نتائج متقدمة في اختبارات القدرات العامة للمرحلة الثانوية.","standard":"التحصيل التعليمي","standard_ref":"","domain":"نواتج التعلم","kind":"مؤشر مرحلة","branches":[],"actions":[],"stage_only":"الثانوية"}],"records":[{"code":"ADM-02","name":"البرامج والأنشطة والمبادرات","subtitle":"برامج الخطة التشغيلية من الجدولة إلى الشاهد والموقف الفصلي","domain":"الإدارة المدرسية","tier":"A","indicators":["1-1-1-1","1-1-1-2","1-2-1-1","1-2-1-2","1-2-1-3","1-2-1-4","1-2-1-5","1-3-1-1","1-3-1-2","1-3-1-3","1-4-1-4","1-4-1-5","1-4-1-6","1-4-1-7","1-5-1-2","3-2-1-1","3-2-1-4","3-2-1-7"],"domains":[{"code":"م1","title":"البرامج المستضافة في هذا السجل","what":"برامج الخطة التي لا يستضيفها سجل متخصص، فتُوثَّق هنا كاملة: البطاقة، والتنفيذ، والتقرير، والشاهد.","note":"البرنامج ذو التكلفة يُنفذ بعد اعتماد نموذج تكلفته من مدير المدرسة."},{"code":"م2","title":"برامج الإدارة المدرسية","what":"برامج مجال الإدارة المدرسية المستضافة في سجلات أخرى: يتابع هذا السجل موعد كل برنامج وتنفيذه وموضع شاهده.","note":"الشاهد يبقى في سجله المستضيف، ويُكتب موضعه في جدول التنفيذ الشهري."},{"code":"م3","title":"برامج التعليم والتعلم","what":"برامج مجال التعليم والتعلم المستضافة في سجلات أخرى: يتابع هذا السجل موعد كل برنامج وتنفيذه وموضع شاهده.","note":"الشاهد يبقى في سجله المستضيف، ويُكتب موضعه في جدول التنفيذ الشهري."},{"code":"م4","title":"برامج نواتج التعلم","what":"برامج مجال نواتج التعلم المستضافة في سجلات أخرى: يتابع هذا السجل موعد كل برنامج وتنفيذه وموضع شاهده.","note":"الشاهد يبقى في سجله المستضيف، ويُكتب موضعه في جدول التنفيذ الشهري."},{"code":"م5","title":"برامج البيئة المدرسية","what":"برامج مجال البيئة المدرسية المستضافة في سجلات أخرى: يتابع هذا السجل موعد كل برنامج وتنفيذه وموضع شاهده.","note":"الشاهد يبقى في سجله المستضيف، ويُكتب موضعه في جدول التنفيذ الشهري."}],"forms":{"ن-01":{"code":"ن-01","title":"بطاقة برنامج","use":"يعدها المسؤول الرئيس قبل تنفيذ البرنامج أول مرة","type":"card","fields":[{"label":"رقم البرنامج واسمه"},{"label":"الهدف التفصيلي"},{"label":"السجل المستضيف"},{"label":"المسؤول الرئيس / المساعد"},{"label":"المستفيدون والعدد المتوقع"},{"label":"زمن التنفيذ المخطط (الفصل / الأسبوع)"},{"label":"المتطلبات المالية / غير المالية"},{"label":"أسلوب التنفيذ"},{"label":"مؤشر الإنجاز وخط الأساس"},{"label":"الشاهد المطلوب"}],"signatures":["منسق المتابعة","مدير المدرسة"]},"ن-02":{"code":"ن-02","title":"جدول التنفيذ الشهري","use":"يفتحه منسق المتابعة أول كل شهر ويكمله قبل اجتماع اللجنة","type":"log_table","columns":["رقم البرنامج","البرنامج","المسؤول","الموعد المخطط","نُفذ / لم يُنفذ","تاريخ التنفيذ","موضع الشاهد","السبب","رقم بند المتابعة"],"example_row":["18","مجلس صوت الطالب","وكيل شؤون الطلاب","الأسبوع 6","نُفذ","1448/04/12","محضر المجلس — ن-06","",""]},"ن-03":{"code":"ن-03","title":"تقرير تنفيذ برنامج","use":"يرفعه المسؤول الرئيس بعد تنفيذ برنامج مستضاف في هذا السجل","type":"card","fields":[{"label":"رقم البرنامج واسمه"},{"label":"تاريخ التنفيذ ومكانه"},{"label":"المنفذون"},{"label":"المستفيدون الفعليون وعددهم"},{"label":"ما نُفذ باختصار"},{"label":"المؤشر: المستهدف / المتحقق"},{"label":"الشاهد المرفق"},{"label":"ما يُحسَّن في التنفيذ القادم"}],"signatures":["منسق المتابعة"]},"ن-04":{"code":"ن-04","title":"طلب تعديل برنامج أو تأجيله","use":"يقدمه مسؤول البرنامج، ويُقر في اجتماع لجنة التميز","type":"card","fields":[{"label":"رقم البرنامج واسمه"},{"label":"المطلوب","options":["تأجيل","تعديل الأسلوب","تعديل المستهدف","استبدال"]},{"label":"السبب"},{"label":"الموعد الجديد أو البديل المقترح"},{"label":"أثر التعديل على المؤشر"},{"label":"قرار اللجنة ورقم المحضر"}],"signatures":["منسق المتابعة","مدير المدرسة"]},"ن-05":{"code":"ن-05","title":"الموقف الفصلي لتنفيذ البرامج","use":"يعده منسق المتابعة نهاية كل فصل ويُعرض على اللجنة","type":"summary_by_domain","columns":["المجال","المخطط","نُفذ","متأخر","معدَّل","لم يُنفذ","أبرز شاهد أثر"]},"ن-06":{"code":"ن-06","title":"فهرس شواهد البرامج المستضافة","use":"يُقيد فيه كل شاهد يُحفظ في هذا السجل","type":"log_table","columns":["م","رقم البرنامج","البرنامج","الشاهد","التاريخ","موضع الحفظ"]}},"steward":"منسق المتابعة"},{"code":"ADM-03","name":"ملف المتابعة","subtitle":"سجل متابعة الخطط والمعالجات والقرارات من الرصد حتى الإغلاق","domain":"الإدارة المدرسية","tier":"A","indicators":["1-1-1-2","1-2-1-2","1-2-1-3","1-2-1-4","1-2-1-5","1-3-1-1","1-3-1-2","1-3-1-3","1-4-1-1","1-4-1-2","1-4-1-3","1-4-1-4","1-4-1-5","1-4-1-6","1-4-1-7","1-5-1-1","1-5-1-2"],"domains":[{"code":"م1","title":"الخطة التشغيلية وتقويمها","what":"تقدم برامج الخطة التشغيلية وفق جدولها الزمني، ومعالجة ما تعثر منها، والتحقق من أن البرنامج المنفذ حرّك المؤشر الذي وُضع من أجله.","note":"اكتمال النشاط أو حضور المستهدفين لا يعني تحقق هدف البرنامج. يُغلق البند على «التنفيذ» إن كان السؤال عن التنفيذ، ولا يُغلق على «التحسن» إلا بشاهد أثر."},{"code":"م2","title":"الالتزام المهني وأخلاقيات المهنة","what":"الملاحظات المهنية الموثقة (الانضباط في الدوام، وأداء المهام المسندة، والالتزام بميثاق أخلاقيات مهنة التعليم)، والدعم المقدم بعدها، وتحسن الممارسة اللاحقة.","note":"خطابات لفت النظر والإجراءات النظامية تُحفظ في الملف الوظيفي. يُدوَّن هنا رقم الإحالة وحالة المتابعة فقط، وتُستوضح أي ملاحظة أو بلاغ قبل البناء عليه."},{"code":"م3","title":"المواظبة والسلوك","what":"انتظام الطلاب في الحضور، والمخالفات السلوكية وإجراءاتها وفق قواعد السلوك والمواظبة المعتمدة، وأثر المعالجات على الطلاب المتكرر غيابهم أو مخالفاتهم.","note":"صحة سجل الحضور لا تعني تعلمًا، وعدم رد ولي الأمر لا يثبت إهمالًا. لا يُدوَّن في هذا السجل سبب أسري أو صحي لغياب طالب."},{"code":"م4","title":"استجابة الطلاب للوقاية والدعم","what":"وصول البرامج العلاجية والوقائية إلى الطلاب المستهدفين فعلًا، واستجابتهم لها مقيسةً بأدائهم المستقل لا بحضورهم.","note":"شهادة المشاركة أو الحضور لا تعوض قياس الأداء. الأداء الذي تم بمساعدة لا يُعد إتقانًا مستقلًا، ولا يُنسب التحسن إلى برنامج واحد إذا تزامنت معه عوامل أخرى."},{"code":"م5","title":"الإثراء والمنجزات والتوجيه","what":"إتاحة فرص الإثراء والمسابقات لجميع الطلاب لا لفئة محدودة، وتوثيق المنجزات كما صدرت من جهاتها، ومتابعة خدمات التوجيه الأكاديمي والمهني.","note":"لا يُنسب إلى الطالب عمل أنجزه غيره، ولا تُعد مسابقةٌ لم تختر المدرسة المشاركة فيها بندًا ناقصًا."},{"code":"م6","title":"العمل التعاوني ومجتمعات التعلم المهنية","what":"انتظام لقاءات مجتمعات التعلم المهنية وخروجها بمنتج يُطبَّق في الصف، وشمول التعاون جميع المعلمين بمن فيهم الأقل مشاركة.","note":"انعقاد الاجتماع أو رضا طرف واحد لا يثبت تعاونًا شاملًا، ولا يُبنى حكم على موظف من انطباع."},{"code":"م7","title":"الشراكة مع الأسرة ومعالجة ملاحظاتها","what":"وصول التواصل إلى الأسر فعليًا، والاستجابة لملاحظاتها وشكاواها في وقت محدد، وإشراكها في دعم تعلم أبنائها.","note":"إرسال الرسالة لا يثبت وصولها، وعدم الرد لا يعني رفضًا، ورأي المستجيبين لا يمثل جميع الأسر ما لم تكن نسبة الاستجابة كافية."},{"code":"م8","title":"الرخصة المهنية والدعم اللاحق","what":"معرفة حالة الرخص المهنية لمعلمي المدرسة، وتحديد من يحتاج إلى دعم أو إجراء قبل موعده.","note":"لا تُجمع صور الوثائق الشخصية ولا بيانات الدخول إلى الحسابات. شهادة حضور دورة لا تثبت رخصة، والحالة غير المعروفة تُكتب «لم ترد بعد» لا «منتهية»."},{"code":"م9","title":"التطوير المهني وأثره","what":"بناء التطوير المهني على احتياج فعلي، وانتقال ما تعلمه المعلم إلى ممارسته الصفية، وظهور أثره في تعلم الطلاب.","note":"انطباع المعلم الإيجابي عن الدورة لا يثبت أثرها. وإذا لم يُطبَّق التدريب فقد يكون الحل موردًا أو وقتًا، لا تكرار الدورة نفسها."},{"code":"م10","title":"حماية المتعلم وسلامته بعد المعالجة","what":"التأكد من أن الحالات التي عولجت ما زالت تحت متابعة المسار المختص، وأن المدرسة نفّذت ما يخصها إداريًا من إشراف وتعديل جداول وتهيئة بيئة.","note":"عند ظهور أي مؤشر إيذاء أو خطر على طالب يُبلَّغ فورًا وفق الإجراء المعتمد لدى المدرسة والجهة المختصة، ولا يُنتظر اجتماع اللجنة. لا تُدوَّن تفاصيل الحالة أو أسماء أطرافها هنا، وإغلاق البند الإداري لا يعني إغلاق الحالة."},{"code":"م11","title":"الوقاية من التنمر واستمرار الأمان","what":"وجود برنامج وقائي، وإشراف كافٍ على المواقع الأكثر عرضة، وقناة بلاغ آمنة يعرفها الطلاب، ومتابعة استمرار الأمان بعد معالجة البلاغات.","note":"انعزال طالب أو قلة مشاركته لا يثبت تعرضه للتنمر. لا تُواجَه أطراف البلاغ ولا تُجمع إفاداتهم في هذا السجل؛ ذلك عمل المختص في مساره."},{"code":"م12","title":"التقويم الذاتي وخطط التحسين (إحالة)","what":"التقويم الذاتي وخطة التحسين لهما مصدرهما الخارجي المعتمد. يتابع هذا السجل فقط ما يخرج منهما من إجراءات داخل المدرسة.","note":"النتائج والخطة تبقى في مصدرهما الخارجي؛ يُثبت هنا اسم الأصل وإصداره وتاريخه، وتُتابع الإجراءات المسندة إلى المدرسة."},{"code":"م13","title":"الشراكة المجتمعية (إحالة)","what":"متابعة الشراكات المعتمدة مع جهات المجتمع من حيث التنفيذ والمستفيدين وجدوى الاستمرار.","note":"تبدأ أي شراكة بعد اعتمادها من الجهة المخولة في إدارة التعليم؛ يتابع هذا السجل تنفيذ الشراكات المعتمدة فقط."}],"forms":{"ن-01":{"code":"ن-01","title":"سجل بنود المتابعة","use":"يُقيَّد فيه كل بند عند فتحه","type":"log_table","columns":["م","رقم البند","المجال","موضوع المتابعة","المالك","تاريخ الفتح","الموعد","الأولوية","الحالة"],"example_row":["مثال","م3-001","م3","ارتفاع غياب فصل (2/أ) يوم الأحد","وكيل شؤون الطلاب","1448/03/12","1448/04/10","عالية","قيد التنفيذ"]},"ن-02":{"code":"ن-02","title":"بطاقة متابعة بند","use":"لكل بند عالي أو حرج الأولوية","type":"card","fields":[{"label":"رقم البند"},{"label":"المجال"},{"label":"موضوع المتابعة"},{"label":"مصدر الرصد","options":["زيارة","بيانات نور","تقرير","ملاحظة ولي أمر","قرار اجتماع","أخرى"]},{"label":"الوضع الحالي"},{"label":"معيار الإغلاق"},{"label":"المالك"},{"label":"الأولوية","options":["حرجة","عالية","عادية"]}],"subtables":[{"title":"خطة الإجراء","columns":["م","الإجراء","المنفذ","الموعد","الشاهد المتوقع","تم"]},{"title":"جولات المراجعة","columns":["التاريخ","ما تقدّم","ما تعثّر وسببه","القرار والخطوة التالية"]}],"signatures":["منسق المتابعة","مدير المدرسة"]},"ن-03":{"code":"ن-03","title":"محضر مراجعة المتابعة","use":"كل اجتماع شهري","type":"minutes"},"ن-04":{"code":"ن-04","title":"طلب شاهد أو استيضاح","use":"عند طلب شاهد من عضو","type":"card"},"ن-05":{"code":"ن-05","title":"إحالة غير كاشفة","use":"للبنود المقيدة","type":"card"},"ن-06":{"code":"ن-06","title":"تصعيد بند","use":"عند التعثر مرتين أو الحاجة لصلاحية أعلى","type":"card"},"ن-07":{"code":"ن-07","title":"فهرس شواهد المدرسة","use":"عند اعتماد كل شاهد","type":"log_table","columns":["رقم الشاهد","رقم البند","وصف الشاهد","مقدِّمه","التاريخ","المستوى","موضع الحفظ","السرية"]},"ن-08":{"code":"ن-08","title":"الموقف الفصلي","use":"نهاية كل فصل","type":"summary_by_domain"}},"steward":"منسق المتابعة"},{"code":"ADM-04","name":"ملف حصر الغياب والتأخر والاستئذان","subtitle":"الرصد اليومي لحضور الطلاب وإشعار الأسر والإجراء في موعده","domain":"الإدارة المدرسية","tier":"A","indicators":["1-2-1-3","1-5-1-1","3-2-1-5"],"domains":[{"code":"م1","title":"الرصد اليومي للحضور","what":"رصد حضور كل فصل في الحصة الأولى، وإدخاله في نظام نور في اليوم نفسه، ومطابقته مع الكشف الموقع.","note":"يُصحَّح القيد من الكشف الموقع قبل أي عدّ أو إجراء. الخانة الفارغة في الكشف يُسأل عنها المعلم في اليوم نفسه."},{"code":"م2","title":"التأخر الصباحي","what":"رصد الطلاب الذين يدخلون بعد بدء اليوم الدراسي ووقت دخولهم، ومعالجة التأخر المتكرر.","note":""},{"code":"م3","title":"الاستئذان والخروج أثناء الدوام","what":"خروج الطالب قبل نهاية الدوام بإذن مكتوب، وتسليمه لولي أمره أو من يفوضه كتابيًا، وقيد وقت الخروج.","note":"يُسلَّم الطالب لولي أمره أو المفوَّض كتابيًا فقط. وعند الشك في هوية المستلم يُتصل بولي الأمر قبل التسليم."},{"code":"م4","title":"التواصل مع أولياء الأمور","what":"إشعار ولي أمر الغائب والمتأخر في اليوم نفسه، واستقبال الأعذار، واستدعاء ولي الأمر عند بلوغ حد الإجراء.","note":"يُقيد في هذا الملف وجود العذر وتاريخه. التقارير الطبية وأسباب الغياب الأسرية تُحفظ لدى الموجه الطلابي برقم إحالة."},{"code":"م5","title":"الإجراءات والمعالجة","what":"اتخاذ الإجراء المقرر في قواعد السلوك والمواظبة لمن بلغ حدوده، ومعالجة أسباب الغياب المتكرر، وقياس أثر المعالجة.","note":"حدود الإجراء ونماذجه من قواعد السلوك والمواظبة المعتمدة. يُحفظ هنا الإجراء المتخذ وتاريخه وتوقيعه، ونص القواعد في ملف قواعد السلوك والمواظبة (ADM-05)."}],"forms":{"ن-01":{"code":"ن-01","title":"كشف حضور الفصل اليومي","use":"يرصده معلم الحصة الأولى ويسلمه موقعًا","type":"card","fields":[{"label":"الصف والفصل"},{"label":"التاريخ"},{"label":"معلم الحصة الأولى"}],"subtables":[{"title": لمهارة المطلوبة","سبب الاحتياج","المستهدفون","الجهة والموعد","شاهد التطبيق","ما بقي"]}},"steward":"مسؤول الأمن والسلامة"},{"code":"ENV-S06","name":"ملف الصيانة","subtitle":"يتابع الملف بلاغات الصيانة من رصد الخلل إلى التحقق من المعالجة","domain":"البيئة المدرسية","tier":"B","indicators":["4-1-1-2","4-1-1-3","4-1-1-4","4-2-1-1","4-2-1-2"],"domains":[{"code":"م1","title":"الرصد والإحالة","what":"تسجيل الخلل وموقعه وحماية المستخدمين وتنظيم الطلب.","note":"عند وجود خطر مباشر يطبق المسؤول إجراء السلامة المعتمد ويبلغ الجهة المختصة فورًا، ثم يتابع البلاغ حتى معالجة مصدر الخطر."},{"code":"م2","title":"المتابعة والتحقق من الإغلاق","what":"يتحقق المختص من استعادة الانتفاع ويقرر وكيل الشؤون المدرسية إغلاق البلاغ.","note":""}],"forms":{"ن-01":{"code":"ن-01","title":"قيد بلاغات الصيانة","use":"يفتح مسؤول الصيانة قيد العطل فور تلقي البلاغ ويسجل موقعه ووصفه ووقت رصده.","type":"log_table","columns":["م","رقم البلاغ","التاريخ","الموقع","وصف الخلل","الأولوية","المسؤول","الحالة"]},"ن-02":{"code":"ن-02","title":"إحالة البلاغ والتحقق من المعالجة","use":"يثبت وكيل الشؤون المدرسية جهة إحالة العطل ورقم الطلب عند إرساله ونتيجة التحقق بعد الإصلاح.","type":"card","fields":[{"label":"رقم البلاغ وموقعه"},{"label":"الإجراء الوقائي"},{"label":"الجهة المختصة"},{"label":"رقم الإحالة وتاريخها"},{"label":"موعد المعالجة"},{"label":"إفادة المختص وموضعها"},{"label":"نتيجة التحقق من الاستخدام"},{"label":"قرار الإغلاق أو الاستمرار وسببه"}],"signatures":["وكيل الشؤون المدرسية","مدير المدرسة"]},"ن-03":{"code":"ن-03","title":"سجل متابعة البلاغات والإشعارات","use":"يحدث مسؤول الصيانة رد الجهة المنفذة وموعدها كلما تابع طلبًا مفتوحًا.","type":"log_table","columns":["التاريخ","رقم البلاغ","الجهة المخاطبة","ما تم","العائق","الخطوة التالية","المسؤول","الموعد"]},"ن-04":{"code":"ن-04","title":"التقرير الدوري للصيانة","use":"يعد وكيل الشؤون المدرسية ملخص الأعطال المغلقة والمتكررة في موعد تقرير الصيانة.","type":"card","fields":[{"label":"فترة التقرير"},{"label":"البلاغات المفتوحة والمغلقة والمتأخرة"},{"label":"الأعطال المتكررة ومواقعها"},{"label":"أسباب التأخر"},{"label":"نتيجة المعالجة"},{"label":"قرار الوقاية أو التصعيد"},{"label":"المسؤول والموعد"}],"signatures":["وكيل الشؤون المدرسية","مدير المدرسة"]},"ن-05":{"code":"ن-05","title":"فهرس الشواهد","use":"يفهرس مسؤول الصيانة الطلب وإفادة الإصلاح ومحضر التحقق بعد ضمها إلى ملف البلاغ.","type":"log_table","columns":["م","رقم البند","الشاهد","التاريخ","المسؤول","موضع الأصل","الاطلاع"]}},"steward":"وكيل الشؤون المدرسية"}],"reg_ind":{"ADM-02":{"1-1-1-1":[{"id":"1-1-1-1-B01-A01","t":"يعرض المدير شواهد الاحتياج المتاحة على أصحاب العمل، ويميز الحاجة المؤيدة من السؤال المفتوح، ثم يصوغ معهم أهدافًا تعليمية وتربوية مرتبة ومبررة.","o":"خريطة حاجة–هدف فيها إحالة أصلية لكل شاهد وحدود الفئة والفترة وسبب الأولوية."},{"id":"1-1-1-1-B01-A02","t":"يكتب المدير مع صاحب الهدف وصف البداية والنتيجة المرادة وطريقة جمع دليلها، ويجرب استخدام الأداة قبل تثبيت الهدف. إن غابت البداية يكلف بجمعها بعد ثبوت الإسناد.","o":"بطاقة هدف تبين الفئة والبداية ومصدرها والمحك وأداة التحقق؛ القيم الواقعية تملأ محليًا."},{"id":"1-1-1-1-B01-A03","t":"يطلب المدير من أصحاب العمل شرح الأهداف بلغتهم وتقدير متطلباتها؛ يعدل الصياغة أو الوسيلة عند الغموض أو التعذر، مع إبقاء ما يلزم من الغرض.","o":"هدف منقح مع تفسير صاحبه ومتطلبات التنفيذ والفجوة المرفوعة إن وجدت."},{"id":"1-1-1-1-B02-A01","t":"يربط المدير وأصحاب البرامج كل هدف بعمل يفسر كيف يخدمه. يفحصون الأهداف التي لا عمل لها والأنشطة التي لا تسندها حاجة قبل إقرارها.","o":"مصفوفة هدف–برنامج–مخرج–نتيجة، بإحالات إلى تصميم البرنامج الأصلي."},{"id":"1-1-1-1-B02-A02","t":"يراجع المدير مع مصمم النشاط فرص الوصول والمشاركة، ويستشير المختص المتاح في تكييف العمل للموهوبين وذوي الإعاقة عند وجودهم؛ يبين البديل الذي يحفظ الغرض.","o":"تصميم نشاط يوضح الفئات والحواجز والتكييف وطريقة التحقق من مشاركة المستهدفين دون أسماء في العرض."},{"id":"1-1-1-1-B02-A03","t":"يطلب المدير من صاحب النشاط كتابة خطوات البدء والعمل والإغلاق ووقتها، ثم يطابقها مع التقويم المعتمد والتبعيات قبل تثبيت موعد فعلي.","o":"بطاقة نشاط بخطوات مرتبة ومخرجات ومواعيد تستكمل بعد تثبيت التقويم."},{"id":"1-1-1-1-B03-A01","t":"يجمع المدير احتياج كل نشاط من وقت ومكان وأدوات وخبرة وكلفة عند اللزوم، ويقابله بالمتاح ويثبت فجوة المورد وجهة طلبه قبل بدء العمل.","o":"قائمة متطلبات مرتبطة بكل خطوة، والمتاح والفجوة ومرجع طلبها عند الحاجة."},{"id":"1-1-1-1-B03-A02","t":"يراجع المدير من يتولى أعمال البرنامج وما يسمح به توزيع العمل والتفويض الحالي. ويحدد لكل مهمة مسؤولًا ومساعدة واضحة، ويطلب اعتماد أي إسناد يحتاج إلى قرار من صاحب هذا القرار قبل التنفيذ.","o":"مصفوفة مهمة–دور–مرجع إسناد، دون موظفين افتراضيين أو مهام يتنازعها مسؤولان."},{"id":"1-1-1-1-B03-A03","t":"يرتب المدير وصاحب العمل البدء والإنجاز بعد الخطوات التي يعتمد عليها وفي وقت يسمح به التقويم. ويراجعان تزاحم وقت العاملين والموارد، فيعدل المدير الترتيب أو يطلب تعديل توزيع العمل من الجهة التي تملكه.","o":"جدول تنفيذ موحد يبين المسؤول والتبعيات والعبء والتعارض المعالج."},{"id":"1-1-1-1-B03-A04","t":"يختار المدير وصاحب العمل أسلوبًا يحتاج تحسينًا من شاهد فعلي، ويحددان وجه الجودة، ثم يجربان بديلًا في العمل نفسه ويقارنان النتيجة قبل تعميمه.","o":"وصف الأسلوبين وشاهد جودة قابل للمقارنة مع اختلافات السياق والعبء."},{"id":"1-1-1-1-B04-A01","t":"يتيح مدير المدرسة للمعلمين المشاركة في قراءة الاحتياج وصياغة الأهداف واختيار البرامج والإسناد، ويسجل المقترح وأثره في المسودة وسبب القرار بشأنه.","o":"أثر مراجعة يربط مساهمات الكادر بعناصر الخطة منذ الإعداد، دون اشتراط اجتماع إضافي لكل خطوة."},{"id":"1-1-1-1-B04-A02","t":"يجمع المدير عناصر الخطة ويراجع اتصال الأهداف والبرامج والقياس والموارد والأدوار والجدول، ثم يرفع الإصدار المحدد إلى صاحب الصلاحية ويتثبت من مرجع اعتماده.","o":"إصدار كامل مرقم ومرجع اعتماد يخص الإصدار نفسه؛ ما لم يعتمد يبقى مسودة."},{"id":"1-1-1-1-B04-A03","t":"يشرح المدير الإصدار المعتمد لأصحاب العمل ويطلب تحديد أدوارهم ومخرجاتهم منه، ويعلن مرجعًا واحدًا للنسخة النافذة مع حفظ النسخ السابقة كتاريخ.","o":"مرجع النسخة النافذة وشاهد فهم المنفذ لدوره؛ الإرسال وحده لا يثبت الفهم."},{"id":"1-1-1-1-B04-A04","t":"يراجع المدير مشاركة الكادر في التنفيذ وفق الاختصاص والإسناد، ويربطها بما شاركوا في إعداده؛ يستند إلى العمل المنجز دون أن يفترض أن كل مشارك ينفذ كل برنامج.","o":"إحالات لأعمال الكادر المنفذة مرتبطة بمصفوفة المسؤوليات، مع بيان سبب أي استبعاد لازم."}],"1-1-1-2":[{"id":"1-1-1-2-B01-A01","t":"يبني المدير من الخطة المعتمدة جدولًا يحدد ما يفحص ومن يجمع شاهده ومن يقرر بشأنه ومتى، ويختار المواعيد وفق نقاط تقدم العمل ومخاطره.","o":"جدول متابعة للمخرجات والنتائج والموارد، بإحالات واحدة إلى شواهدها الأصلية."},{"id":"1-1-1-2-B01-A02","t":"يقابل المدير وأصحاب الأعمال ما نُفذ بالفعل بالمواعيد والمخرجات، ويفصل المتأخر والمتوقف عن المكتمل ويسجل العوائق وأدلتها قبل تلخيص التقدم.","o":"موقف تنفيذ لكل عمل وشاهده والعائق والعمل المتأثر؛ الأسباب غير المؤكدة موسومة."},{"id":"1-1-1-2-B01-A03","t":"يناقش المدير مع صاحب العمل السبب المدعوم للعائق، ويختار معه حلًا تملك المدرسة اتخاذه أو يرفع الطلب للجهة المختصة، ثم يتابع التنفيذ وإزالة العائق.","o":"قرار معالجة مرتبط بالعائق ومرجع طلب عند التجاوز، وشاهد استئناف العمل أو استمرار التعطل."},{"id":"1-1-1-2-B02-A01","t":"يختار المدير وصاحب الهدف ما يكشف التغير المطلوب من عمل أو وثيقة أو ملاحظة أو رأي، ويحددان كيف يميزان النتيجة الجيدة من غيرها. ويجمعان الأدلة التي تجيب عن السؤال دون زيادة أدوات لا يحتاجها القرار.","o":"خريطة هدف–سؤال–أداة–مصدر نتيجة، وتمييز بين دليل التنفيذ ودليل النتيجة."},{"id":"1-1-1-2-B02-A02","t":"يراجع المدير مع أصحاب الأهداف البداية والنتيجة والتقدم الفعلي في الوقت المناسب، ويفحص بقاء الأولوية وفاعلية البرنامج وحدود المقارنة قبل إصدار قرار الاستمرار أو التعديل.","o":"حكم مسبب لكل هدف وبرنامج يبين التنفيذ والنتيجة والفئات وحدود الاستدلال."},{"id":"1-1-1-2-B02-A03","t":"يراجع المدير وأصحاب الأعمال الوقت والخبرة والموارد المادية والمالية المتاحة، ويحددون ما ينقص وأثره والبديل الممكن أو جهة طلبه. ولا يحذفون هدفًا لازمًا لمجرد صعوبة توفير المورد.","o":"مراجعة موارد تربط النقص المحدد بالعمل المتأثر وقرار إعادة تخصيص أو طلب مخول."},{"id":"1-1-1-2-B03-A01","t":"يرتب المدير وأصحاب الأعمال جوانب التطوير من نتائج التقويم، ويختبرون تفسير التعثر ثم يحددون لكل أولوية هدفًا يحتفظ بمرجع النتيجة وسبب الاختيار.","o":"قائمة تطوير فيها النتيجة والسبب المدعوم والهدف وما يزال غير محسوم."},{"id":"1-1-1-2-B03-A02","t":"يصمم المدير التعديل مع المنفذين ومن يتأثر به من المجتمع المدرسي بحسب الموضوع، ويحددون العمل والموارد والتوقيت والشاهد، ويستكملون الإذن اللازم قبل تطبيقه.","o":"تصميم تعديل يوضح سبب الاختيار ومساهمة أصحاب العلاقة وما يتطلبه من صلاحية."},{"id":"1-1-1-2-B03-A03","t":"يحفظ الشخص المسؤول عن ملفات الخطة الإصدار السابق، ويبين في النسخة المعدلة التغيير وسببه ونتيجة المراجعة التي تدعمه والموافقة اللازمة. ويعلن المدير النسخة التي يبدأ العمل بها بعد استكمال اعتمادها.","o":"سجل إصدارات يمكن منه تتبع القديم والجديد وسبب التعديل؛ لا يختلق تاريخًا مفقودًا."},{"id":"1-1-1-2-B03-A04","t":"يفحص المدير وصاحب العمل في دورة لاحقة تنفيذ التعديل ثم نتيجته على العنصر المقصود، ويقابلانها بالبداية مع بيان التوقيت والفئة والظروف. إن بقي الدليل ناقصًا يستمران في الاستقصاء.","o":"شاهد لاحق للتنفيذ والنتيجة وقرار استمرار أو مراجعة مسبب؛ لا نتيجة واقعية في هذا النموذج."}],"1-2-1-1":[{"id":"1-2-1-1-B01-A01","t":"يناقش المعلمون ورائد النشاط مع المدير القيم التي تخدم حاجات الطلاب، ويصوغون لكل قيمة موقفًا يتيح فهمها وممارستها.","o":"هدف يربط القيمة بمعناها وموقف تعلم مناسب."},{"id":"1-2-1-1-B01-A02","t":"يقدم المعلم ورائد النشاط مواقف من حياة الطالب تبين الصدق والأمانة والاحترام، ويطلبان منه تفسير اختياره وتطبيقه في عمل مشترك.","o":"تفسير الطالب وسلوكه في موقف آخر؛ صور النشاط شاهد تنفيذ فقط."},{"id":"1-2-1-1-B01-A04","t":"ينظم رائد النشاط مع المعنيين توعية تناسب حاجة المجتمع المحلي، ويتحقق المدير من محتواها والإذن اللازم لإقامتها.","o":"مادة مناسبة ومشاركة وتعليق يبين ما فهمه المستفيد؛ دون افتراض أثر مجتمعي عام."},{"id":"1-2-1-1-B01-A03","t":"يراجع المعلمون تفسير الطلاب وتصرفاتهم، ويعدلون الموقف التالي لمعالجة سوء الفهم مع تجنب الحكم على قناعة الفرد من نشاط واحد.","o":"ملاحظة مفسرة وتغيير في النشاط ثم فحص لاحق."},{"id":"1-2-1-1-B02-A01","t":"يحدد المعلمون مع رائد النشاط معاني الانتماء والمسؤولية الوطنية المناسبة للعمر ويربطونها بتعلم الطلاب وخدمة محيطهم.","o":"هدف يبين معنى الهوية الذي يتعلمه الطالب وكيف يظهره."},{"id":"1-2-1-1-B02-A02","t":"يشارك الطلاب في مناسبة وطنية معتمدة بإنتاج أو حوار يبين ما تعلموه عن الوطن ودورهم فيه، وييسر المعلم مشاركة الفئات المستهدفة.","o":"منتج أو تفسير يوضح معنى تعلمه الطالب ومساهمته."},{"id":"1-2-1-1-B02-A03","t":"يناقش المعلم ورائد النشاط مع الطلاب ما فهموه وما يحتاج تعديلًا، ويستخدمان ذلك في تصميم المشاركة التالية.","o":"خلاصة تعلم ومراجعة النشاط من أعمال الطلاب."}],"1-2-1-2":[{"id":"1-2-1-2-B01-A01","t":"يراجع المدير الميثاق الذي تعمل به المدرسة، ويناقش مع العاملين كيف يظهر الاحترام والعدل وحفظ السر في قراراتهم وتعليمهم وخدماتهم وتواصلهم اليومي.","o":"مرجع بإصداره وأمثلة سلوك مهني متفق على فهمها."},{"id":"1-2-1-2-B01-A02","t":"يناقش المنسوبون مواقف مهنية من أعمالهم، ويتيح المدير وسائل تعريف تناسب الأدوار المختلفة دون عرض حالات شخصية.","o":"تفسير مهني لموقف ومادة تعريف مناسبة للأدوار."},{"id":"1-2-1-2-B01-A03","t":"يدرج المدير لقاءات ومراجعات الأخلاقيات في التنظيم السنوي. يبقى تكرار مرتين في السنة على الأقل نصًا مرجعيًا غير مثبت الإصدار، ولا يقدم كحد رسمي نافذ.","o":"توقيت مقترح وحفظ قيد الدورية ومصدره."},{"id":"1-2-1-2-B01-A04","t":"يطلب المدير من المشاركين تفسير الاستجابة المناسبة لموقف من اختصاصهم، ويعيد مناقشة ما التبس عليهم.","o":"استجابة مفسرة وتصحيح مفهوم مهني."},{"id":"1-2-1-2-B02-A01","t":"يحدد المدير مع أصحاب الاختصاص كيفية تطبيق القاعدة ومن يقرر عند اختلاف تفسيرها، ويرجع للجهة المختصة فيما يتجاوز المدرسة.","o":"إجراءات ومسار استفسار وحدود قرار محددة."},{"id":"1-2-1-2-B02-A02","t":"ينظم المنسوبون أعمالًا مشتركة يتبادلون فيها الدعم ويحفظون الاحترام والحقوق، ويعالج المدير اختلاف العمل بحوار مهني.","o":"عمل مشترك وشاهد تعاون وحوار يحترم الخصوصية."},{"id":"1-2-1-2-B02-A03","t":"يراجع المدير وصول التعريف والفرص إلى مختلف الأدوار، ويفحص اختلاف التطبيق قبل اقتراح دعم مناسب.","o":"تغطية للأدوار ومراجعة اتساق التطبيق."},{"id":"1-2-1-2-B03-A01","t":"يناقش المدير مع المنسوبين معايير تشجيع معلنة ومنصفة، ويتأكد أن وسائله ضمن الصلاحية والموارد المتاحة.","o":"معايير مفهومة وسبب التشجيع؛ بلا استحقاق مالي مفترض."},{"id":"1-2-1-2-B03-A02","t":"يتابع المدير السلوك المهني من ملاحظات وأعمال مسموح له الاطلاع عليها، ويستوضح الوقائع قبل إصدار حكم.","o":"واقعة قابلة للتحقق وسياقها وحق الاستيضاح."},{"id":"1-2-1-2-B03-A03","t":"يقدم المدير تشجيعًا أو دعمًا يتصل بالسلوك الملاحظ، ويعيد التوعية حيث ظهر سوء فهم، ويتابع تغير الممارسة.","o":"صلة بين الملاحظة والدعم والممارسة اللاحقة."}],"1-2-1-3":[{"id":"1-2-1-3-B01-A01","t":"يراجع المدير والموجه الطلابي قواعد السلوك والمواظبة التي تخص مرحلة المدرسة، ويوضحان للطلاب والأسر ما يطلب منهم ومن يجيب عن استفساراتهم.","o":"مرجع محدد وشرح مناسب للمرحلة وقناة استفسار."},{"id":"1-2-1-3-B01-A02","t":"يشرح المعلمون والموجه الطلابي توقعات الحضور والسلوك بمواقف وتواصل مناسب، ويستمعون إلى أسئلة الطلاب والأسر.","o":"تفسير الطالب أو الأسرة لما يتوقع ولطريقة طلب المساعدة."},{"id":"1-2-1-3-B01-A03","t":"ينظم المدير والموجه الطلابي استمرار التعريف في العام؛ ويحفظان عبارة مرتين سنويًا من المرجع غير المثبت دون ترقيتها إلى إلزام رسمي.","o":"تنظيم توعية ومراجعة فهم مع وسم حد المصدر."},{"id":"1-2-1-3-B02-A01","t":"يجمع مسؤول الحضور والمعنيون بالسلوك بياناتهم المسموح بها ويقابلونها بالسجل الأصلي قبل مناقشة الأنماط.","o":"بيانات حضور وسلوك محددة الفترة ومصدر التصحيح."},{"id":"1-2-1-3-B02-A02","t":"يناقش الموجه الطلابي الحالات المتكررة مع الطالب ومن يلزم من المعنيين، ويميز العائق الدراسي أو الأسري أو التنظيمي دون افتراض السبب.","o":"وصف حالة وفرضيات مؤيدة أو سبب غير محسوم."},{"id":"1-2-1-3-B02-A03","t":"يقدم الموجه والمعلم دعمًا يعالج السبب الذي تؤيده المعلومات. وإذا استدعت الحالة إجراءً نظاميًا، يرجع المسؤول عن المعالجة إلى التعليمات لتحديد الإجراء ومن يملك اتخاذه، قبل تطبيقه.","o":"دعم مرتبط بسبب ومرجع للإجراء النظامي عند استخدامه."},{"id":"1-2-1-3-B02-A04","t":"يراجع الموجه والمعلم انتظام حضور الطالب ومشاركته بعد المعالجة، ويقرران تعديل الدعم أو رفع ما يتجاوز اختصاصهما.","o":"متابعة لاحقة وقرار يبين ما تحسن وما بقي."}],"1-2-1-4":[{"id":"1-2-1-4-B01-A01","t":"يرصد المعلمون والموجه الطلابي أنماط السلوك وسياقها من ملاحظات وأعمال مناسبة، ويميزون الملاحظة من تفسيرها.","o":"وصف سلوك وسياق وفئة تحتاج دعمًا دون وصم."},{"id":"1-2-1-4-B01-A02","t":"يصمم الموجه والمعلمون وقاية تعلم السلوك البديل، ويهيئون المشاركة للموهوبين وذوي الإعاقة بحسب حاجتهم الفعلية.","o":"برنامج يحدد المهارة السلوكية والتكييف والشاهد."},{"id":"1-2-1-4-B01-A03","t":"يمارس الطلاب السلوك المستهدف في مواقف مدرسية بإرشاد المعلم، ويتابع الموجه وصول الوقاية واستجابتهم.","o":"ممارسة سلوك في موقف يومي مع وصف المساعدة."},{"id":"1-2-1-4-B02-A01","t":"يناقش الموجه حاجة الطالب مع من يشاركون في تعليمه ودعمه، ويحدد ما يمكن تقديمه تربويًا وما يحتاج إلى طلب خدمة من مختص، ويتبع طريقة الإحالة التي تعتمدها المدرسة.","o":"قرار دعم أو إحالة مسند لشاهد ومرجع إجراء."},{"id":"1-2-1-4-B02-A02","t":"ينفذ المعلم والموجه دعمًا يراعي سبب الحالة ويشرحان للطالب السلوك البديل وطريقة ممارسته، وينسقان ما يلزم مع الأسرة.","o":"خطوة دعم مفهومة للطالب وعمل يبين استجابته."},{"id":"1-2-1-4-B02-A03","t":"يقارن المعلم والموجه ملاحظات قبل الدعم وبعده في مواقف متقاربة، ويراجعان أثر المساعدة والظروف.","o":"مقارنة سلوك مفسرة دون ادعاء سببية منفردة."},{"id":"1-2-1-4-B03-A01","t":"يحدد الموجه والمعلمون السلوك الذي سيشجعونه وكيف يلاحظونه، ويشرحون للطلاب علاقة التعزيز به.","o":"خطة تعزيز بمعايير مفهومة وفرص منصفة."},{"id":"1-2-1-4-B03-A02","t":"يتيح المعلمون ورائد النشاط فرصًا متنوعة لإظهار السلوك الإيجابي، ويشجعون الجهد والتقدم دون استبعاد من يحتاج دعمًا.","o":"أعمال ومشاركة وتشجيع مرتبط بسلوك محدد."},{"id":"1-2-1-4-B03-A03","t":"يراجع الموجه والمعلمون أثر أسلوب التعزيز وتقبله واستمرار السلوك، ويعدلون ما لم يخدم الغرض.","o":"نتيجة متابعة وقرار بشأن وسيلة التعزيز."}],"1-2-1-5":[{"id":"1-2-1-5-B01-A01","t":"يبني رائد النشاط والمعلمون خطة إثراء تربط ميول الطلاب بفرص تعلم وتحدد الفئات والموارد والمسؤوليات والتوقيت.","o":"خطة تبين غرض الإثراء وفئاته وإحالته للخطة التشغيلية."},{"id":"1-2-1-5-B01-A02","t":"يقدم المعلمون ورائد النشاط خبرات خارج الصف يتعمق فيها الطالب في فكرة أو ينتج حلًا، مع ملاءمة الوقت والمكان والدعم.","o":"إنتاج أو أداء يبين ما أضافه الإثراء للتعلم."},{"id":"1-2-1-5-B01-A03","t":"ينظم رائد النشاط تشجيعًا معنويًا أو عينيًا تسمح به الصلاحية والموارد، ويربطه بالجهد والتعلم والمشاركة.","o":"معايير تشجيع وفرص معلنة دون كلفة مفترضة."},{"id":"1-2-1-5-B01-A04","t":"يراجع رائد النشاط من أتيحت لهم الفرصة ومن شاركوا وأسباب عدم المشاركة، ويعدل الحاجز الذي تؤيده الشواهد.","o":"تغطية ومراجعة عوائق ونتيجة معالجتها."},{"id":"1-2-1-5-B02-A01","t":"يجمع المعلم والمختص المتاح شواهد قدرات الطلاب وميولهم بوسائل مناسبة، ويفصل الملاحظة المدرسية عن التصنيف الرسمي للموهبة.","o":"عينات أداء وملاحظة وفرصة استكشاف أوسع."},{"id":"1-2-1-5-B02-A02","t":"يصمم المعلم والمختص خبرة أعمق تتصل بالشواهد، ويتيحان مراجعة المنتج وتطويره بدل تدريب متكرر لا يزيد تحديه.","o":"منتج نامٍ يبين قرار الطالب وتحسينه."},{"id":"1-2-1-5-B02-A03","t":"يوضح المعلم والمختص للطالب والأسرة غرض مقاييس الموهبة وشروطها من الجهة المنظمة، ويشجعان مشاركة مؤهلة دون وعد بنتيجة.","o":"تعريف صحيح واختيار أسري أو طلابي واعٍ بالمشاركة."},{"id":"1-2-1-5-B02-A04","t":"يحتفي المعلم ورائد النشاط بمنجز الطالب المثبت ويتيحان عرض تعلمه، مع تشجيع الآخرين على استكشاف قدراتهم.","o":"منجز موثق وتشجيع لا يحول المقارنة إلى وصم."},{"id":"1-2-1-5-B03-A01","t":"يتحقق رائد النشاط والمعلم من معلومات المسابقة الحالية وشروطها ومصدرها، ويختاران ما يلائم الفئة والتعلم.","o":"بطاقة فرصة بمصدر رسمي وشروط مثبتة وقت التطبيق."},{"id":"1-2-1-5-B03-A04","t":"يعرّف رائد النشاط المجتمع المدرسي بالفرصة وطريقة المشاركة بلغة ميسرة، ويبين المعلم ما يحتاجه الطالب للاستعداد.","o":"رسالة واضحة وفرصة استفسار ووصول للفئات المناسبة."},{"id":"1-2-1-5-B03-A02","t":"يدرب المعلم الطلاب على مهارات المسابقة المناسبة ويتيح لهم حلًا وشرحًا مستقلين، ويتابع رائد النشاط إجراءات المشاركة المأذونة.","o":"أعمال استعداد ومشاركة موثقة دون نتيجة مفترضة."},{"id":"1-2-1-5-B03-A03","t":"يحفظ رائد النشاط نتيجة المشاركة كما أعلنتها الجهة المنظمة ويربطها بالطالب المشارك في الملف المقيد المناسب.","o":"إحالة إلى النتيجة الأصلية مع وصف نطاقها."},{"id":"1-2-1-5-B03-A05","t":"ينظم المدير ورائد النشاط احتفاءً بالمنجز وفق الإمكان والصلاحية ويبرز التعلم الذي أفضى إليه.","o":"شاهد احتفاء منصف ومنجز مثبت."},{"id":"1-2-1-5-B04-A01","t":"يبني الموجه الطلابي مع المعلمين خطة إرشاد أكاديمي ومهني تناسب عمر الطلاب ومرحلتهم واحتياجاتهم.","o":"خطة استكشاف وخيارات مناسبة للعمر ومصادر حديثة."},{"id":"1-2-1-5-B04-A02","t":"ينظم الموجه والمعلمون لقاءات ومهمات استكشاف تتيح للطالب فهم ميوله وخياراته، مع ترتيبات المشاركة لمن يحتاجها.","o":"تفسير الطالب لخيار وما يحتاج معرفته عنه."},{"id":"1-2-1-5-B04-A04","t":"يحدد المدير والموجه نوع مساهمة مؤسسة المجتمع والإذن الذي تحتاجه، ويحافظان على تعليق اعتماد الشراكة الرسمية إلى حين التحكيم.","o":"تحديد نوع التعاون ومرجع الإذن؛ لا توقيع أو نموذج بديل."},{"id":"1-2-1-5-B04-A03","t":"يشجع الموجه مشاركة الطلاب في الإرشاد بفرص عرض وتساؤل وتقدير جهد مناسبة دون إغراء بقرار بعينه.","o":"مشاركة واعية وفرص تشجيع تشمل الفئات."},{"id":"1-2-1-5-B04-A05","t":"يناقش الموجه الطالب في ما تعلمه عن الخيارات ومصادر معلوماتها والخطوة التالية، ويراجع ما يحتاجه من دعم.","o":"خلاصة طالب مبنية على معلومات مع بيان ما يزال مجهولًا."}],"1-3-1-1":[{"id":"1-3-1-1-B01-A01","t":"ينسق المدير أعمالًا مشتركة تجمع المنسوبين بحسب اختصاصهم، ويشارك الطلاب والأسر حيث يتصل العمل بهم دون تكرار الأعمال القائمة.","o":"عمل مشترك بأدوار معلومة وإحالات إلى أصوله."},{"id":"1-3-1-1-B01-A02","t":"يتشارك أصحاب العمل حل مشكلة أو إنتاج مخرج، ويشرح كل طرف ما قدمه وكيف استفاد من الآخرين؛ ييسر المدير حوار الاختلاف.","o":"مخرج مشترك وأثر مساهمة كل طرف وطريقة حل الاختلاف."},{"id":"1-3-1-1-B01-A03","t":"يتيح المدير تشجيعًا منصفًا للمشاركة والتعاون وفق الصلاحية، ويظهر قيمة المساندة الأقل ظهورًا لا الإنجاز الفردي وحده.","o":"معايير تشجيع وتغطية للأدوار المختلفة."},{"id":"1-3-1-1-B01-A04","t":"يسأل المدير وأصحاب العمل المشاركين عن وضوح الأدوار واحترام الرأي وجودة التعاون، ويعالجون الاستبعاد أو تعارض المسؤولية الذي يظهره الدليل. يراجع المشاركون أيضًا الاحترام وتبادل المساندة والثقة في التعامل اليومي خارج المهمة المحددة.","o":"مخرج مشترك وخبرة المشاركين في الاحترام والدعم وصوت الأقل مشاركة، مع ملاحظة يومية أخرى وقرار تحسين."}],"1-3-1-2":[{"id":"1-3-1-2-B01-A01","t":"يحدد المعلمون والموجه موضوعات تستطيع الأسرة أن تسهم فيها لدعم تعلم ابنها واستكشاف مستقبله، من حاجة معلومة لا قائمة رسائل عامة.","o":"موضوع يتصل بتعلم الطالب وخطوة دعم مناسبة للأسرة."},{"id":"1-3-1-2-B01-A02","t":"يقدم المعلم والموجه شرحًا أو لقاءً أو مادة مناسبة للغة الأسرة ووقتها، ويبينان فيها نموذجًا لدعم التعلم دون أن تحل الأسرة واجب الطالب.","o":"مثال دعم واضح ووصول لطرق تواصل متنوعة."},{"id":"1-3-1-2-B01-A03","t":"يطلب المعلم من الأسرة شرح خطوة الدعم بلغتها، ويستمع إلى ما يصعب عليها ويغير الشرح أو البديل.","o":"فهم أسري وخطوة قابلة للتطبيق."},{"id":"1-3-1-2-B02-A01","t":"ينظم المدير والموجه قنوات تواصل معتمدة تراعي الوقت والخصوصية، ويوضحان كيف تصل الرسالة لمن يعنيه الموضوع.","o":"قنوات معلومة ومسؤول استجابة وحدود تداول."},{"id":"1-3-1-2-B02-A02","t":"يشارك المعلم الأسرة معلومات مفهومة عن عمل ابنها وما يمكن دعمه، دون كشف بيانات طلاب آخرين أو مقارنة تجرحه.","o":"رسالة مرتبطة بعمل الطالب وخطوة دعم محددة."},{"id":"1-3-1-2-B02-A04","t":"يناقش المعلم مع الأسرة ملاحظتها لعمل ابنها ومقدار مساعدتها له، ويحتفظ بشاهد مستقل من الطالب عند تقويم تعلمه.","o":"ملاحظة أسرية وعمل طالب يميز المساعدة من الاستقلال."},{"id":"1-3-1-2-B02-A03","t":"يتفق المعلم والموجه مع الطالب والأسرة على وصف المشكلة وخطوة مدرسية وأخرى منزلية ممكنة، مع حماية خصوصية الحالة.","o":"اتفاق واضح بأدوار مناسبة وشاهد متابعة."},{"id":"1-3-1-2-B02-A05","t":"يراجع المعلم مع الطالب والأسرة أثر الدعم في عمل لاحق ويعدل الخطوة التي لم تنفع أو لم يمكن تطبيقها.","o":"مقارنة أداء وحوار أسري وقرار تالٍ."},{"id":"1-3-1-2-B03-A01","t":"يتحقق المدير من الإجراء الذي يسمح بمساهمة الأسرة وخبرتها، وينظم المعلم مساهمة مرتبطة بهدف تعلم وتكافؤ الفرص.","o":"هدف ومساهمة وإذن عند لزومه؛ بلا أفضلية لابن المشارك."},{"id":"1-3-1-2-B03-A02","t":"يجمع الموجه أو المسؤول عن التواصل رأي الأسر بوسيلة مناسبة تشمل من لا يصل صوتهم عادة ويحفظ خصوصيتهم.","o":"رأي بمصدر وفئة وحدود تمثيل؛ دون تعميم من المستجيبين فقط."},{"id":"1-3-1-2-B03-A03","t":"يراجع المدير الملاحظات مع صاحب الخدمة ويحدد ما يمكن تحسينه وسبب تأجيل ما يتجاوز الإمكان أو الصلاحية.","o":"قرار مرتبط بملاحظة ومسؤول متابعة."},{"id":"1-3-1-2-B03-A04","t":"يبلغ المسؤول عن التواصل الأسر بما عولج من ملاحظاتها وما تعذر وسببه بلغة مفهومة، ويتيح الاستيضاح.","o":"تغذية راجعة للأسرة وأثرها في الثقة والتواصل."}],"1-3-1-3":[{"id":"1-3-1-3-B01-A01","t":"يحدد المدير والمعلمون حاجة تعلم يمكن أن تخدمها مؤسسة أو مدرسة أخرى، ويفحصون ملاءمة خبرتها ووسيلة التواصل معها.","o":"حاجة محددة ومساهمة مقترحة وحدود الفائدة المتوقعة."},{"id":"1-3-1-3-B01-A05","t":"يصنف المدير مع صاحب الاختصاص المقترح إلى تواصل عام أو نشاط يحتاج إذنًا أو اتفاق رسمي، ويثبت المسار الذي ينطبق عليه.","o":"نوع تعاون وصاحب قرار ومرجع إجراء؛ تبقى الروابط المرشحة معلقة."},{"id":"1-3-1-3-B01-A02","t":"يعرض المدير مقترح الشراكة على جهة المراجعة والاعتماد التي تحددها تعليمات الشراكات قبل أي توقيع. وتبقى النماذج5و6 تنتظر التحكيم، ولا يستحدث هذا الوصف نموذجًا بديلًا عنها.","o":"إحالة للحكم السابق للتوقيع وحالته؛ لا إذن أو توقيع مفترض."},{"id":"1-3-1-3-B01-A03","t":"ينفذ المعلمون والمعنيون التعاون في حدود ما أجيز، ويحددون مهمة الطالب ودور المؤسسة ووقت العمل ويحافظون على مصدره الواحد.","o":"مخرج تعلم ومشاركة وشاهد التزام بنطاق الإذن."},{"id":"1-3-1-3-B01-A04","t":"يقارن المعلم والمستفيدون تعلمًا أو أداءً قبل التعاون وبعده، ويصدرون حكم أثر يبين حدود المقارنة مستقلًا عن اعتماد الاتفاق.","o":"نتيجة فعلية وقرار أثر لاحق؛ لا يعد التوقيع شاهد نتيجة."},{"id":"1-3-1-3-B02-A01","t":"يفحص المعلم والمختص المتاح حاجات الفئات وخدمات المؤسسات التي يمكن أن تستجيب لها مع مراجعة مصدر معلومات الخدمة.","o":"صلة حاجة–خدمة وإتاحة مناسبة للفئات."},{"id":"1-3-1-3-B02-A02","t":"يعرف المسؤول المعني المجتمع المدرسي بالخدمات المناسبة وينظم استخدامها بعد استكمال الإذن الخاص بالنشاط.","o":"تعريف وإجراء وصول ومشاركة فعلية مأذونة."},{"id":"1-3-1-3-B02-A03","t":"يتابع المعلم والمختص أثر استفادة الفئات في تعلمها ومشاركتها، ويعدل تصميم الوصول إذا بقيت فئة خارج الفرصة.","o":"نتيجة للفئة مع بيان حدود البيانات والتغطية."},{"id":"1-3-1-3-B03-A01","t":"يناقش المدير والمعنيون حاجات المجتمع وما تستطيع المدرسة تقديمه دون الإخلال بالتعلم، ويحددون الإذن والموارد والحدود.","o":"مقترح خدمة مرتبط بحاجة وصلاحية وإمكان."},{"id":"1-3-1-3-B03-A02","t":"يقدم المشاركون الخدمة التي صدر الإذن بها، وينظمون مشاركة الأطراف ووقت العمل وحماية بياناتهم.","o":"خدمة منفذة ضمن الإذن وشاهد انتفاع؛ دون سجلات رئيسية مكررة."},{"id":"1-3-1-3-B03-A03","t":"يراجع المدير والمستفيدون فائدة الخدمة والوقت والتنظيم اللذين تتطلبهما وأثرها، ويحددون استمرارها أو تعديلها مع بيان صلة القرار بالعمل المحفوظ في المدرسة.","o":"حكم أثر وقرار لاحق مستقلان عن الإذن الأول."}],"1-4-1-4":[{"id":"1-4-1-4-B01-A01","t":"يراجع المدير والمعلمون المعنيون متطلبات الرخصة من مصدر الهيئة وقت التطبيق، ويحدد كل معلم خطوة الدعم التي تخصه دون افتراض استحقاق أو مستوى.","o":"مرجع حالي وحاجة دعم بحسب التخصص والحالة."},{"id":"1-4-1-4-B01-A02","t":"ينظم المدير والمختص المتاح تعريفًا متنوعًا بالتخصصات والمتطلبات ومصادر المعلومات، ويتيح الاستفسار.","o":"تعريف مفهوم ومصدر رسمي يحال إليه المعلم."},{"id":"1-4-1-4-B01-A03","t":"يوفر المدير وقتًا أو تعلمًا أو تشجيعًا يسمح به التنظيم، ويساعد المعلم على اختيار دعم يناسب حاجته دون وعد بترخيص.","o":"دعم مرتبط بحاجة وإمكان فعلي وصلاحية."},{"id":"1-4-1-4-B02-A01","t":"يتحقق المسؤول المصرح له من حالة الرخصة ومستواها بمستند أو خدمة مسموحة، ويحفظ بياناتها في موضع مقيد.","o":"تحقق موثق من المصدر؛ لا ترخيص ذاتي من شهادة حضور."},{"id":"1-4-1-4-B02-A02","t":"يناقش المدير مع المعلم ما بقي من خطوة إجرائية أو دعم مهني، ويتابعانها بحسب الاختصاص.","o":"خطوة معلومة ومصدر متابعة دون تاريخ مفترض."},{"id":"1-4-1-4-B02-A03","t":"يراجع المدير النتائج التي صدرت فعلًا من جهة الترخيص، ومنها المستويات المتقدمة حيث تنطبق، ويعيد تنظيم الدعم.","o":"نتيجة أصلية وقرار دعم؛ لا مستوى مفترض."}],"1-4-1-5":[{"id":"1-4-1-5-B01-A01","t":"يناقش المدير والمنسوبون أدلة العمل ونتائج التقويم التي يملك كل منهم الاطلاع عليها، ويحددون حاجة مهنية قابلة للتعلم.","o":"حاجة مرتبطة بممارسة وشاهد وصلاحية اطلاع."},{"id":"1-4-1-5-B01-A02","t":"يشارك المعلمون والإداريون في تحديد أهداف التطوير وطرائقه الملائمة لأعمالهم دون نقل معيار معلم إلى إداري.","o":"أهداف تعلم مهني ودور كل فئة في صياغتها."},{"id":"1-4-1-5-B01-A03","t":"يراجع المدير اتصال خطة التطوير بالحاجات والموارد، ثم يرفع الإصدار المحدد إلى جهة اعتماده التي تسميها تعليمات المدرسة.","o":"خطة ومرجع اعتماد يطابق نسختها."},{"id":"1-4-1-5-B02-A01","t":"ينسق المدير وأصحاب البرامج وقت التعلم المهني والتجريب والمتابعة على امتداد العام بحسب الحاجة والتقويم.","o":"تنظيم يتيح التعلم ثم تطبيقه دون تزاحم غير معالج."},{"id":"1-4-1-5-B02-A02","t":"يقدم المختص أو الزميل المتمكن شرحًا ونموذجًا ويتيح تجربة وتغذية راجعة، ويدعم المدير المشاركة الملائمة داخل المدرسة وخارجها.","o":"تجربة مهنية وتغذية راجعة وخطوة تطبيق في العمل."},{"id":"1-4-1-5-B02-A03","t":"يراجع المدير والمشاركون ما تعلموه وما طبقوه وما يحتاجون إليه بعد البرنامج، ويميزون الحضور من تغير الممارسة.","o":"شاهد تطبيق وحاجة دعم لاحق."},{"id":"1-4-1-5-B03-A01","t":"يتعاون المنسوبون في مجتمع تعلم يعالج سؤالًا من ممارسة فعلية، وييسر المدير الوقت والموارد وفق التنظيم القائم.","o":"سؤال مهني وأعمال مقارنة وقرار تعلم مشترك."},{"id":"1-4-1-5-B03-A02","t":"يجرب المعلمون معالجة تعليمية مناسبة ويجمعون أعمالًا قبلها وبعدها ضمن الإجراءات المسموحة، مع حماية البيانات وعدم نسبة سبب وحيد من مقارنة بسيطة.","o":"تجريب مفسر وحدود استدلال واضحة."},{"id":"1-4-1-5-B03-A03","t":"يطبق المشاركون ما دعمت الشواهد نفعه في نطاق مناسب، ويشرحون عناصره الأساسية وما يحتاج تكييفًا.","o":"تطبيق لاحق يبين ما نقل وما عدل وسببه."},{"id":"1-4-1-5-B03-A04","t":"يراجع المعلمون والمدير أثر التطبيق في جودة الممارسة وأعمال الطلاب، ويفحص الإداريون أثر تطويرهم في الخدمة التي يقدمونها.","o":"شاهد ممارسة ونتيجة مناسبة لكل دور."}],"1-4-1-6":[{"id":"1-4-1-6-B01-A01","t":"يتحقق المدير والمعنيون بالتقويم من إصدار الدليل والمعايير المطبقين، ويثبتون ما لم تحسم مطابقته بدل مزج نسخ مختلفة.","o":"مرجع محدد وحدود قراءة ومعلقات محفوظة."},{"id":"1-4-1-6-B01-A04","t":"يراجع المدير تكليفات فريق التقويم القائمة ومطابقتها للتنظيم، ويرفع أي تعديل لجهته؛ لا تنشأ فرق أو تتغير أسماء بهذه الحزمة.","o":"مرجع تشكيل قائم أو حاجة تعديل مرفوعة."},{"id":"1-4-1-6-B01-A05","t":"يعد المسؤولون عن التقويم خطة تبين المراحل ومن ينفذ كل عمل وكيف يعرف إنجازه ومتى يراجع. ويراجعها المدير ويرفعها إلى جهة الموافقة المطلوبة قبل العمل بما يحتاج اعتمادًا.","o":"خطة تشتمل على إعداد وتنفيذ وتقرير وتحسين ومراجعة بحسب الدليل المحلي."},{"id":"1-4-1-6-B01-A02","t":"يجمع المعنيون أدلة مناسبة لكل معيار وفق الإجراءات المعتمدة، ويبررون الحكم ويبينون ما لا تكفي أدلته.","o":"إحالة معيار–دليل–حكم وحدود ثقة."},{"id":"1-4-1-6-B01-A06","t":"يشرح المعنيون للمنسوبين والطلاب والأسر أدوارهم وحقوقهم في المشاركة بلغة تناسبهم قبل الجمع.","o":"فهم المشاركين ودور معلوم دون تدريب على إجابة متوقعة."},{"id":"1-4-1-6-B01-A03","t":"يراجع المدير سير التقويم وعوائقه وكفاية أدلته، ويعدل تنظيمه دون تغيير المعايير أو صناعة درجات.","o":"مراجعة عملية وقرار تحسين محدد."},{"id":"1-4-1-6-B02-A01","t":"يستخدم المعنيون وسائل شرح وحوار مناسبة لمختلف المنسوبين على مدار العمل، ويستوضحون ما التبس من معنى التقويم.","o":"فهم دور التقويم وصلته بالتطوير."},{"id":"1-4-1-6-B02-A02","t":"يشارك أصحاب العلاقة بشواهد ورؤى من مواقعهم، ويناقش المعنيون اختلاف المصادر ويصرحون بحدود تمثيلها.","o":"أدلة متعددة وتفسير اختلافها لا تصويت على الحكم."},{"id":"1-4-1-6-B02-A03","t":"يعرض المدير والمعنيون النتائج التي يجوز مشاركتها بصيغة مفهومة ومجمعة، ويناقشون أولويات التطوير دون كشف حالات الأفراد.","o":"عرض مناسب وردود استيضاح وأولويات مبررة."}],"1-4-1-7":[{"id":"1-4-1-7-B01-A01","t":"يناقش المدير والمعنيون نتائج التقويم وأدلتها لتحديد فجوة وأسباب محتملة، ويميزون السبب المؤيد مما يحتاج استقصاء.","o":"فجوة محددة ومصدر وفرضية مفسرة أو سبب غير محسوم."},{"id":"1-4-1-7-B01-A02","t":"يصمم صاحب كل عمل تحسينًا للأولوية التي يتولاها، ويحدد الخطوات والموارد والمسؤولين والوقت والدليل الذي يكشف النتيجة، ويبين صلته بالعمل الموجود في الخطة التشغيلية.","o":"خطة تحسين مستقلة مترابطة بعناصرها وإحالاتها."},{"id":"1-4-1-7-B01-A03","t":"يراجع المدير اتساق المعالجة مع السبب والموارد والاختصاص، ويرفع النسخة لصاحب صلاحية الاعتماد حسب التنظيم.","o":"خطة ومرجع اعتماد أو حالة انتظار واضحة."},{"id":"1-4-1-7-B02-A01","t":"ينفذ أصحاب الأعمال التدخل في الفئات والمواقف التي كشفتها الحاجة، ويكيفون الوسيلة مع حفظ الغرض.","o":"شاهد تطبيق فعلي وجودة وصول للفئة."},{"id":"1-4-1-7-B02-A02","t":"يراجع المدير وأصحاب العمل التقدم والعوائق وأسبابها، ويقدمون دعمًا أو يرفعون ما يتجاوز المدرسة.","o":"موقف تنفيذ وعائق ومعالجة ونتيجة استئناف."},{"id":"1-4-1-7-B02-A03","t":"يقارن أصحاب العمل النتيجة بالبداية ويفحصون الزمن والتغطية، ويقررون استمرار التدخل أو تعديله أو جمع دليل آخر.","o":"مقارنة نتيجة وقرار لاحق دون حد مبتكر مخترع."}],"1-5-1-2":[{"id":"1-5-1-2-B01-A01","t":"يصمم الموجه والمعلمون وقاية من التنمر تشمل مواقف اليوم المدرسي والوسائط المناسبة، ويهيئون مشاركة مختلف الفئات دون افتراض وجود حالة.","o":"خطة وقاية مرتبطة بمخاطر السياق ومهارات طلب الدعم."},{"id":"1-5-1-2-B01-A02","t":"ينمذج المعلم التعبير المناسب للمشاعر والإنصات واحترام الاختلاف وحل خلاف بسيط، ويتيح ممارسة في تعاون يومي. يوضح الموجه طريق الدعم من بالغ؛ لا يطلب الطلاب الإفصاح عن حالة شخصية أمام الآخرين أو تحمل حماية أنفسهم وحدهم.","o":"تعبير مناسب وإنصات ومشاركة وتعاون في موقف آخر مع وصف الدعم؛ لا تشخيص نفسي أو نتيجة حالة مفترضة."},{"id":"1-5-1-2-B01-A03","t":"يسمع الموجه والمعلمون رأي الطلاب عن الأمان والعلاقات بوسيلة مناسبة وآمنة، ويقابلونه بملاحظات اليوم المدرسي.","o":"رأي وملاحظة بمصدر وحدود تمثيل دون كشف الأفراد."},{"id":"1-5-1-2-B02-A01","t":"يوفر المدير والموجه قنوات وصول آمنة ومفهومة، ويراجعان ما قد يمنع الطالب من استخدامها وييسران بديلًا مناسبًا.","o":"قناة يعرفها الطلاب ويستطيعون استخدامها دون اختبار واقعة حقيقية في العرض."},{"id":"1-5-1-2-B02-A02","t":"يتولى المختص التحقق والاستجابة وفق المسار المشترك مع حقوق المتعلم، ويؤدي المعلم والمدير دوريهما المقررين دون مواجهة غير مأمونة بين الأطراف.","o":"إحالة واستجابة ضمن مصدر الإجراء؛ التفاصيل في الملف المقيد."},{"id":"1-5-1-2-B02-A03","t":"يراجع الموجه والمختص تكرار الأذى واستمرار أمان الطالب في المواقف المختلفة بعد الاستجابة ويحددان الدعم التالي.","o":"متابعة لاحقة متعددة المواقف وقرار دعم."}],"3-2-1-1":[{"id":"3-2-1-1-B01-A01","t":"يقوم المعلم بإتاحة موقف يفسر فيه المتعلم معنى قيمة مناسبة وصلتها بتعامل أو قرار، ويتحقق من فهم المعنى بلغته ووسيلته الملائمة.","o":"مواقف فحص ناتج"},{"id":"3-2-1-1-B01-A02","t":"يتيح المعنيون ممارسة واختيارًا يظهران تمثل القيمة، ويحددون دور المتعلم والمساعدة التي يتلقاها، مع فصل تنفيذ البرنامج عن ناتجه.","o":"أدلة أداء طلاب"},{"id":"3-2-1-1-B01-A03","t":"يراجع المعلم فهم الطلاب للقيم والهوية الوطنية وكيف يعبرون عنه في موقف لاحق. فإذا ظهر فهم غير صحيح يوضحه ويناقشه، وإذا فهم الطالب القيمة ولم يلتزم بها في ممارسته يوجهه إلى السلوك المطلوب ويتابع ممارسته؛ فلا يكتفي بإعادة النشاط نفسه.","o":"تحسن ممارسة وفهم"},{"id":"3-2-1-1-B02-A01","t":"يقوم المعلم وصاحب النشاط بإتاحة تعلم مناسب عن الهوية الوطنية، ويطلبان تفسيرًا أو عملًا يبين ما يدركه المتعلم منها.","o":"مهمة تعبير أو ممارسة"},{"id":"3-2-1-1-B02-A02","t":"يشارك المتعلم في مواقف مناسبة ويبين دوره ومعنى ما يمارسه، ويلاحظ المعنيون ما يكشف الاعتزاز في حدود السياق والعمر.","o":"ناتج فردي أو جماعي موثق"},{"id":"3-2-1-1-B02-A03","t":"تراجع المدرسة ظهور الناتج عبر الفئات والمواقف، وتعدل فرص التعلم والتعزيز مع بيان ما لم يشمله الفحص وحدود الحكم.","o":"نتيجة دعم لاحقة"}],"3-2-1-4":[{"id":"3-2-1-4-B01-A01","t":"يحدد مسؤول النشاط فرصة مجتمعية أو تطوعية ذات غرض واضح، ويتحقق المدير من الموافقات والموارد وشروط المشاركة قبل التنفيذ.","o":"حاجات وفرص مشاركة مقترحة"},{"id":"3-2-1-4-B01-A04","t":"يوضح المعنيون الأدوار والفئات والإتاحة ومقدار المساندة، ويعالجون ما يمنع وصول المستهدفين قبل التنفيذ المأذون.","o":"فرص مخولة ومخرجات متفق عليها"},{"id":"3-2-1-4-B01-A02","t":"ينسق مسؤول النشاط التنفيذ ويراجع تنظيمه، ويحفظ ما يبين إتاحة المدرسة للفرصة مستقلًا عما يبين أداء الطالب فيها، مع الرجوع إلى العمل نفسه.","o":"فرص متاحة وبرامج تحفيز"},{"id":"3-2-1-4-B02-A04","t":"يؤدي المتعلم دوره في العمل الفعلي ويبين ما ينجزه، ويلاحظ صاحب النشاط مساهمته الفردية في المنتج أو الخدمة المشتركة.","o":"تعريف مشاركة ونطاق رصد"},{"id":"3-2-1-4-B02-A02","t":"يشرح المتعلم ما يتعلمه وما يفيد به غيره في حدود المهمة، ويفحص المعنيون الصلة بين المشاركة والنتاج دون نسب عمل الآخرين إليه.","o":"سجل مشاركة بأدوار ونطاق"},{"id":"3-2-1-4-B02-A03","t":"يراجع أصحاب الاختصاص الفائدة والعوائق وإمكان تحسين المشاركة، ويستمعون إلى المستفيد عند ملاءمة ذلك وإمكانه.","o":"نتيجة تنوع واتساع"},{"id":"3-2-1-4-B02-A05","t":"تحدد المدرسة الفرصة أو الدعم التالي وتتابع أثر التعديل، مع بقاء الشواهد في أصولها وأغراض الحكم مستقلة.","o":"نتيجة مساهمة وتعلم وقرار تطوير"}],"3-2-1-7":[{"id":"3-2-1-7-B01-A01","t":"يقوم المعلم بإتاحة معرفة مناسبة بعناصر الثقافة ومناقشة صلتها بحياة المتعلم، مع مراعاة العمر والخبرة واللغة.","o":"مهمة تعبير ثقافي"},{"id":"3-2-1-7-B01-A02","t":"يقدم المتعلم تفسيرًا أو اختيارًا أو أداءً يبين الاعتزاز بثقافته، ويلاحظ المعلم دوره وما يستند إليه من فهم.","o":"أعمال وتفسير فردي"},{"id":"3-2-1-7-B01-A03","t":"يراجع المعنيون القرائن في موقف لاحق ويحددون التعليم أو الدعم المناسب، دون الاكتفاء بمظهر أو مناسبة.","o":"فهم وتعبير أفضل"},{"id":"3-2-1-7-B02-A01","t":"يهيئ المعلم موقف تفاعل وحوار يتيح معرفة التنوع الثقافي في المجتمع واحترام الاختلاف ضمن إطار التعامل المناسب.","o":"فرص تفاعل وفحص"},{"id":"3-2-1-7-B02-A02","t":"يمارس المتعلم الاحترام في الحوار والعمل والتعاون، ويبين المعنيون ما تكشفه الممارسة وما يحتاج إلى توجيه.","o":"أدلة احترام في مواقف فعلية"},{"id":"3-2-1-7-B02-A03","t":"تراجع المدرسة الاعتزاز والاحترام عبر السياقات والفئات، وتعدل الفرص والتوجيه وتحفظ حدود الحكم والخصوصية.","o":"ممارسة لاحقة"}]},"ADM-03":{"1-1-1-2":[{"id":"1-1-1-2-B01-A01","t":"يبني المدير من الخطة المعتمدة جدولًا يحدد ما يفحص ومن يجمع شاهده ومن يقرر بشأنه ومتى، ويختار المواعيد وفق نقاط تقدم العمل ومخاطره.","o":"جدول متابعة للمخرجات والنتائج والموارد، بإحالات واحدة إلى شواهدها الأصلية."},{"id":"1-1-1-2-B01-A02","t":"يقابل المدير وأصحاب الأعمال ما نُفذ بالفعل بالمواعيد والمخرجات، ويفصل المتأخر والمتوقف عن المكتمل ويسجل العوائق وأدلتها قبل تلخيص التقدم.","o":"موقف تنفيذ لكل عمل وشاهده والعائق والعمل المتأثر؛ الأسباب غير المؤكدة موسومة."},{"id":"1-1-1-2-B01-A03","t":"يناقش المدير مع صاحب العمل السبب المدعوم للعائق، ويختار معه حلًا تملك المدرسة اتخاذه أو يرفع الطلب للجهة المختصة، ثم يتابع التنفيذ وإزالة العائق.","o":"قرار معالجة مرتبط بالعائق ومرجع طلب عند التجاوز، وشاهد استئناف العمل أو استمرار التعطل."},{"id":"1-1-1-2-B02-A01","t":"يختار المدير وصاحب الهدف ما يكشف التغير المطلوب من عمل أو وثيقة أو ملاحظة أو رأي، ويحددان كيف يميزان النتيجة الجيدة من غيرها. ويجمعان الأدلة التي تجيب عن السؤال دون زيادة أدوات لا يحتاجها القرار.","o":"خريطة هدف–سؤال–أداة–مصدر نتيجة، وتمييز بين دليل التنفيذ ودليل النتيجة."},{"id":"1-1-1-2-B02-A02","t":"يراجع المدير مع أصحاب الأهداف البداية والنتيجة والتقدم الفعلي في الوقت المناسب، ويفحص بقاء الأولوية وفاعلية البرنامج وحدود المقارنة قبل إصدار قرار الاستمرار أو التعديل.","o":"حكم مسبب لكل هدف وبرنامج يبين التنفيذ والنتيجة والفئات وحدود الاستدلال."},{"id":"1-1-1-2-B02-A03","t":"يراجع المدير وأصحاب الأعمال الوقت والخبرة والموارد المادية والمالية المتاحة، ويحددون ما ينقص وأثره والبديل الممكن أو جهة طلبه. ولا يحذفون هدفًا لازمًا لمجرد صعوبة توفير المورد.","o":"مراجعة موارد تربط النقص المحدد بالعمل المتأثر وقرار إعادة تخصيص أو طلب مخول."},{"id":"1-1-1-2-B03-A04","t":"يفحص المدير وصاحب العمل في دورة لاحقة تنفيذ التعديل ثم نتيجته على العنصر المقصود، ويقابلانها بالبداية مع بيان التوقيت والفئة والظروف. إن بقي الدليل ناقصًا يستمران في الاستقصاء.","o":"شاهد لاحق للتنفيذ والنتيجة وقرار استمرار أو مراجعة مسبب؛ لا نتيجة واقعية في هذا النموذج."}],"1-2-1-2":[{"id":"1-2-1-2-B03-A02","t":"يتابع المدير السلوك المهني من ملاحظات وأعمال مسموح له الاطلاع عليها، ويستوضح الوقائع قبل إصدار حكم.","o":"واقعة قابلة للتحقق وسياقها وحق الاستيضاح."},{"id":"1-2-1-2-B03-A03","t":"يقدم المدير تشجيعًا أو دعمًا يتصل بالسلوك الملاحظ، ويعيد التوعية حيث ظهر سوء فهم، ويتابع تغير الممارسة.","o":"صلة بين الملاحظة والدعم والممارسة اللاحقة."}],"1-2-1-3":[{"id":"1-2-1-3-B02-A01","t":"يجمع مسؤول الحضور والمعنيون بالسلوك بياناتهم المسموح بها ويقابلونها بالسجل الأصلي قبل مناقشة الأنماط.","o":"بيانات حضور وسلوك محددة الفترة ومصدر التصحيح."},{"id":"1-2-1-3-B02-A02","t":"يناقش الموجه الطلابي الحالات المتكررة مع الطالب ومن يلزم من المعنيين، ويميز العائق الدراسي أو الأسري أو التنظيمي دون افتراض السبب.","o":"وصف حالة وفرضيات مؤيدة أو سبب غير محسوم."},{"id":"1-2-1-3-B02-A03","t":"يقدم الموجه والمعلم دعمًا يعالج السبب الذي تؤيده المعلومات. وإذا استدعت الحالة إجراءً نظاميًا، يرجع المسؤول عن المعالجة إلى التعليمات لتحديد الإجراء ومن يملك اتخاذه، قبل تطبيقه.","o":"دعم مرتبط بسبب ومرجع للإجراء النظامي عند استخدامه."},{"id":"1-2-1-3-B02-A04","t":"يراجع الموجه والمعلم انتظام حضور الطالب ومشاركته بعد المعالجة، ويقرران تعديل الدعم أو رفع ما يتجاوز اختصاصهما.","o":"متابعة لاحقة وقرار يبين ما تحسن وما بقي."}],"1-2-1-4":[{"id":"1-2-1-4-B01-A03","t":"يمارس الطلاب السلوك المستهدف في مواقف مدرسية بإرشاد المعلم، ويتابع الموجه وصول الوقاية واستجابتهم.","o":"ممارسة سلوك في موقف يومي مع وصف المساعدة."},{"id":"1-2-1-4-B02-A03","t":"يقارن المعلم والموجه ملاحظات قبل الدعم وبعده في مواقف متقاربة، ويراجعان أثر المساعدة والظروف.","o":"مقارنة سلوك مفسرة دون ادعاء سببية منفردة."},{"id":"1-2-1-4-B03-A03","t":"يراجع الموجه والمعلمون أثر أسلوب التعزيز وتقبله واستمرار السلوك، ويعدلون ما لم يخدم الغرض.","o":"نتيجة متابعة وقرار بشأن وسيلة التعزيز."}],"1-2-1-5":[{"id":"1-2-1-5-B01-A04","t":"يراجع رائد النشاط من أتيحت لهم الفرصة ومن شاركوا وأسباب عدم المشاركة، ويعدل الحاجز الذي تؤيده الشواهد.","o":"تغطية ومراجعة عوائق ونتيجة معالجتها."},{"id":"1-2-1-5-B02-A04","t":"يحتفي المعلم ورائد النشاط بمنجز الطالب المثبت ويتيحان عرض تعلمه، مع تشجيع الآخرين على استكشاف قدراتهم.","o":"منجز موثق وتشجيع لا يحول المقارنة إلى وصم."},{"id":"1-2-1-5-B03-A03","t":"يحفظ رائد النشاط نتيجة المشاركة كما أعلنتها الجهة المنظمة ويربطها بالطالب المشارك في الملف المقيد المناسب.","o":"إحالة إلى النتيجة الأصلية مع وصف نطاقها."},{"id":"1-2-1-5-B04-A05","t":"يناقش الموجه الطالب في ما تعلمه عن الخيارات ومصادر معلوماتها والخطوة التالية، ويراجع ما يحتاجه من دعم.","o":"خلاصة طالب مبنية على معلومات مع بيان ما يزال مجهولًا."}],"1-3-1-1":[{"id":"1-3-1-1-B01-A04","t":"يسأل المدير وأصحاب العمل المشاركين عن وضوح الأدوار واحترام الرأي وجودة التعاون، ويعالجون الاستبعاد أو تعارض المسؤولية الذي يظهره الدليل. يراجع المشاركون أيضًا الاحترام وتبادل المساندة والثقة في التعامل اليومي خارج المهمة المحددة.","o":"مخرج مشترك وخبرة المشاركين في الاحترام والدعم وصوت الأقل مشاركة، مع ملاحظة يومية أخرى وقرار تحسين."}],"1-3-1-2":[{"id":"1-3-1-2-B02-A05","t":"يراجع المعلم مع الطالب والأسرة أثر الدعم في عمل لاحق ويعدل الخطوة التي لم تنفع أو لم يمكن تطبيقها.","o":"مقارنة أداء وحوار أسري وقرار تالٍ."},{"id":"1-3-1-2-B03-A03","t":"يراجع المدير الملاحظات مع صاحب الخدمة ويحدد ما يمكن تحسينه وسبب تأجيل ما يتجاوز الإمكان أو الصلاحية.","o":"قرار مرتبط بملاحظة ومسؤول متابعة."},{"id":"1-3-1-2-B03-A04","t":"يبلغ المسؤول عن التواصل الأسر بما عولج من ملاحظاتها وما تعذر وسببه بلغة مفهومة، ويتيح الاستيضاح.","o":"تغذية راجعة للأسرة وأثرها في الثقة والتواصل."}],"1-3-1-3":[{"id":"1-3-1-3-B01-A04","t":"يقارن المعلم والمستفيدون تعلمًا أو أداءً قبل التعاون وبعده، ويصدرون حكم أثر يبين حدود المقارنة مستقلًا عن اعتماد الاتفاق.","o":"نتيجة فعلية وقرار أثر لاحق؛ لا يعد التوقيع شاهد نتيجة."},{"id":"1-3-1-3-B02-A03","t":"يتابع المعلم والمختص أثر استفادة الفئات في تعلمها ومشاركتها، ويعدل تصميم الوصول إذا بقيت فئة خارج الفرصة.","o":"نتيجة للفئة مع بيان حدود البيانات والتغطية."},{"id":"1-3-1-3-B03-A03","t":"يراجع المدير والمستفيدون فائدة الخدمة والوقت والتنظيم اللذين تتطلبهما وأثرها، ويحددون استمرارها أو تعديلها مع بيان صلة القرار بالعمل المحفوظ في المدرسة.","o":"حكم أثر وقرار لاحق مستقلان عن الإذن الأول."}],"1-4-1-1":[{"id":"1-4-1-1-B01-A03","t":"راجع استمرار اكتمال الكادر عند تغير الجدول أو العاملين","o":"موقف تغطية محدث"},{"id":"1-4-1-1-B02-A03","t":"تحقق من أثر تصحيح الإسناد على انتظام التعلم","o":"إسناد مصحح ونتيجة مراجعة"}],"1-4-1-2":[{"id":"1-4-1-2-B01-A03","t":"تابع المعالجة ونظم استمرار الخدمة ضمن الصلاحيات","o":"معالجة وتغطية خدمة"},{"id":"1-4-1-2-B02-A03","t":"راجع جودة الخدمة بعد المعالجة","o":"نتيجة مراجعة خدمة"}],"1-4-1-3":[{"id":"1-4-1-3-B02-A03","t":"راجع تغير الموارد والالتزامات وحدث المعالجة","o":"مراجعة استدامة محدثة"}],"1-4-1-4":[{"id":"1-4-1-4-B02-A01","t":"يتحقق المسؤول المصرح له من حالة الرخصة ومستواها بمستند أو خدمة مسموحة، ويحفظ بياناتها في موضع مقيد.","o":"تحقق موثق من المصدر؛ لا ترخيص ذاتي من شهادة حضور."},{"id":"1-4-1-4-B02-A02","t":"يناقش المدير مع المعلم ما بقي من خطوة إجرائية أو دعم مهني، ويتابعانها بحسب الاختصاص.","o":"خطوة معلومة ومصدر متابعة دون تاريخ مفترض."},{"id":"1-4-1-4-B02-A03","t":"يراجع المدير النتائج التي صدرت فعلًا من جهة الترخيص، ومنها المستويات المتقدمة حيث تنطبق، ويعيد تنظيم الدعم.","o":"نتيجة أصلية وقرار دعم؛ لا مستوى مفترض."}],"1-4-1-5":[{"id":"1-4-1-5-B02-A03","t":"يراجع المدير والمشاركون ما تعلموه وما طبقوه وما يحتاجون إليه بعد البرنامج، ويميزون الحضور من تغير الممارسة.","o":"شاهد تطبيق وحاجة دعم لاحق."},{"id":"1-4-1-5-B03-A04","t":"يراجع المعلمون والمدير أثر التطبيق في جودة الممارسة وأعمال الطلاب، ويفحص الإداريون أثر تطويرهم في الخدمة التي يقدمونها.","o":"شاهد ممارسة ونتيجة مناسبة لكل دور."}],"1-4-1-6":[{"id":"1-4-1-6-B01-A03","t":"يراجع المدير سير التقويم وعوائقه وكفاية أدلته، ويعدل تنظيمه دون تغيير المعايير أو صناعة درجات.","o":"مراجعة عملية وقرار تحسين محدد."}],"1-4-1-7":[{"id":"1-4-1-7-B02-A02","t":"يراجع المدير وأصحاب العمل التقدم والعوائق وأسبابها، ويقدمون دعمًا أو يرفعون ما يتجاوز المدرسة.","o":"موقف تنفيذ وعائق ومعالجة ونتيجة استئناف."},{"id":"1-4-1-7-B02-A03","t":"يقارن أصحاب العمل النتيجة بالبداية ويفحصون الزمن والتغطية، ويقررون استمرار التدخل أو تعديله أو جمع دليل آخر.","o":"مقارنة نتيجة وقرار لاحق دون حد مبتكر مخترع."}],"1-5-1-1":[{"id":"1-5-1-1-B02-A03","t":"يتابع الموجه والمختص استمرار أمان الطالب وتنفيذ المعالجة ضمن دورهما، ويرفعان الحاجة الباقية للجهة المعنية.","o":"متابعة أمان ودعم وقرار من المختص عند اللزوم."}],"1-5-1-2":[{"id":"1-5-1-2-B02-A03","t":"يراجع الموجه والمختص تكرار الأذى واستمرار أمان الطالب في المواقف المختلفة بعد الاستجابة ويحددان الدعم التالي.","o":"متابعة لاحقة متعددة المواقف وقرار دعم."}]},"ADM-04":{"1-2-1-3":[{"id":"1-2-1-3-B02-A01","t":"يجمع مسؤول الحضور والمعنيون بالسلوك بياناتهم المسموح بها ويقابلونها بالسجل الأصلي قبل مناقشة الأنماط.","o":"بيانات حضور وسلوك محددة الفترة ومصدر التصحيح."},{"id":"1-2-1-3-B02-A02","t":"يناقش الموجه الطلابي الحالات المتكررة مع الطالب ومن يلزم من المعنيين، ويميز العائق الدراسي أو الأسري أو التنظيمي دون افتراض السبب.","o":"وصف حالة وفرضيات مؤيدة أو سبب غير محسوم."},{"id":"1-2-1-3-B02-A03","t":"يقدم الموجه والمعلم دعمًا يعالج السبب الذي تؤيده المعلومات. وإذا استدعت الحالة إجراءً نظاميًا، يرجع المسؤول عن المعالجة إلى التعليمات لتحديد الإجراء ومن يملك اتخاذه، قبل تطبيقه.","o":"دعم مرتبط بسبب ومرجع للإجراء النظامي عند استخدامه."},{"id":"1-2-1-3-B02-A04","t":"يراجع الموجه والمعلم انتظام حضور الطالب ومشاركته بعد المعالجة، ويقرران تعديل الدعم أو رفع ما يتجاوز اختصاصهما.","o":"متابعة لاحقة وقرار يبين ما تحسن وما بقي."}],"1-5-1-1":[{"id":"1-5-1-1-B02-A01","t":"يتحقق المدير والموجه من طريقة الرصد والإبلاغ وطلب الخدمة التي تعتمدها المدرسة، ويستخدمان التعليمات نفسها عند متابعة التنمر بدل إنشاء إجراء مواز لا تعتمده الجهة المختصة.","o":"مسار مصدره وجهته واضحان مع حفظ PEND-D01."},{"id":"1-5-1-1-B02-A03","t":"يتابع الموجه والمختص استمرار أمان الطالب وتنفيذ المعالجة ضمن دورهما، ويرفعان الحاجة الباقية للجهة المعنية.","o":"متابعة أمان ودعم وقرار من المختص عند اللزوم."}],"3-2-1-5":[{"id":"3-2-1-5-B01-A01","t":"يحدد مسؤول متابعة السلوك مصادر الوقائع والفئة والفترة والقواعد التي تخصها، ويتحقق من صحة البيانات وما ينقصها قبل الحكم.","o":"تعريف قياس واضح"},{"id":"3-2-1-5-B01-A02","t":"يقرأ المختص مظاهر الالتزام والتعثر في سياقاتها، ويميز تسجيل الواقعة عن تفسير سببها أو الحكم على جميع المتعلمين.","o":"نتيجة التزام قابلة للتتبع"},{"id":"3-2-1-5-B01-A03","t":"يتعاون المعنيون في دعم المتعثر ومراجعة الاستجابة، وتعود النتيجة إلى الإجراءات والبرامج المناسبة ضمن الصلاحية.","o":"دعم وتغير التزام"},{"id":"3-2-1-5-B02-A01","t":"يقوم صاحب متابعة المواظبة بالرجوع إلى مصدر الحضور الصحيح وتحديد الفترة والفئة وطريقة تفسير الحالات.","o":"تعريف حضور وفترة"},{"id":"3-2-1-5-B02-A02","t":"يراجع المعنيون الانتظام وأثر العوائق والاستجابة، ويصحح صاحب المصدر ما يتعارض من وقائع قبل بناء الحكم.","o":"نتيجة حضور وحالات متكررة"},{"id":"3-2-1-5-B02-A03","t":"تتابع المدرسة الاتجاه اللاحق والدعم المتبقي، وتحفظ بيانات الحالات في نطاقها مع استقلال حكم الحضور عن السلوك.","o":"دعم وتحسن حضور"}]},"ADM-05":{"1-2-1-3":[{"id":"1-2-1-3-B01-A01","t":"يراجع المدير والموجه الطلابي قواعد السلوك والمواظبة التي تخص مرحلة المدرسة، ويوضحان للطلاب والأسر ما يطلب منهم ومن يجيب عن استفساراتهم.","o":"مرجع محدد وشرح مناسب للمرحلة وقناة استفسار."},{"id":"1-2-1-3-B01-A02","t":"يشرح المعلمون والموجه الطلابي توقعات الحضور والسلوك بمواقف وتواصل مناسب، ويستمعون إلى أسئلة الطلاب والأسر.","o":"تفسير الطالب أو الأسرة لما يتوقع ولطريقة طلب المساعدة."},{"id":"1-2-1-3-B01-A03","t":"ينظم المدير والموجه الطلابي استمرار التعريف في العام؛ ويحفظان عبارة مرتين سنويًا من المرجع غير المثبت دون ترقيتها إلى إلزام رسمي.","o":"تنظيم توعية ومراجعة فهم مع وسم حد المصدر."}],"1-2-1-4":[{"id":"1-2-1-4-B03-A01","t":"يحدد الموجه والمعلمون السلوك الذي سيشجعونه وكيف يلاحظونه، ويشرحون للطلاب علاقة التعزيز به.","o":"خطة تعزيز بمعايير مفهومة وفرص منصفة."},{"id":"1-2-1-4-B03-A02","t":"يتيح المعلمون ورائد النشاط فرصًا متنوعة لإظهار السلوك الإيجابي، ويشجعون الجهد والتقدم دون استبعاد من يحتاج دعمًا.","o":"أعمال ومشاركة وتشجيع مرتبط بسلوك محدد."},{"id":"1-2-1-4-B03-A03","t":"يراجع الموجه والمعلمون أثر أسلوب التعزيز وتقبله واستمرار السلوك، ويعدلون ما لم يخدم الغرض.","o":"نتيجة متابعة وقرار بشأن وسيلة التعزيز."}],"1-5-1-1":[{"id":"1-5-1-1-B01-A01","t":"يراجع المدير والموجه تعليمات حقوق المتعلم وحمايته التي تعمل بها المدرسة، ويحددان الجهات المسؤولة عن الاستقبال والاستجابة. ولا تضيف هذه الصياغة موعد إبلاغ أو صلاحية جديدة إلى التفاصيل التي ما زالت تنتظر التحقق من مصدرها.","o":"مرجع بإصداره وجهات اختصاص وما لم يحسم منه."},{"id":"1-5-1-1-B02-A01","t":"يتحقق المدير والموجه من طريقة الرصد والإبلاغ وطلب الخدمة التي تعتمدها المدرسة، ويستخدمان التعليمات نفسها عند متابعة التنمر بدل إنشاء إجراء مواز لا تعتمده الجهة المختصة.","o":"مسار مصدره وجهته واضحان مع حفظ PEND-D01."}],"1-5-1-2":[{"id":"1-5-1-2-B02-A01","t":"يوفر المدير والموجه قنوات وصول آمنة ومفهومة، ويراجعان ما قد يمنع الطالب من استخدامها وييسران بديلًا مناسبًا.","o":"قناة يعرفها الطلاب ويستطيعون استخدامها دون اختبار واقعة حقيقية في العرض."},{"id":"1-5-1-2-B02-A02","t":"يتولى المختص التحقق والاستجابة وفق المسار المشترك مع
