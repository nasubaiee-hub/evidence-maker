<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png" type="image/png"><meta name="theme-color" content="#31514F"></head><body><title>صانع الشواهد</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* التخطيط: شريط علوي ثابت + عمود عمل واحد للجوال (حتى 760px) يتسع إلى عمودين على الحاسب؛ صفحة الشاهد A4 بخط نسخ وترويسة المدرسة */
:root{
  --teal:#245F5E; --teal-deep:#31514F; --line:#A9C2C0; --wash:#EEF4F3;
  --bg:#F6F8F7; --surface:#FFFFFF; --fg:#1D2B2A; --muted:#5B6E6C; --soft:#E3EBEA;
  --accent:#245F5E; --on-accent:#FFFFFF;
  --lv-ref:#5A6B86; --lv-exe:#245F5E; --lv-pra:#9A6A16; --lv-imp:#2F6B2F;
  --warn:#9A4A16; --warn-bg:#FBF0E6; --ok:#2F6B2F; --ok-bg:#E9F3E8;
  --ui:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  --doc:"Noto Naskh Arabic","Sakkal Majalla","Traditional Arabic","Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111817; --surface:#18211F; --fg:#E4ECEA; --muted:#9DB1AE; --soft:#26332F; --wash:#1E2A28; --line:#3B4F4C;
  --accent:#6FB8B5; --on-accent:#0E1615; --lv-ref:#9AABC6; --lv-exe:#6FB8B5; --lv-pra:#D9A64B; --lv-imp:#86C486;
  --warn:#E5A36F; --warn-bg:#2E2118; --ok:#86C486; --ok-bg:#1B2A1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#18211F; --fg:#E4ECEA; --muted:#9DB1AE; --soft:#26332F; --wash:#1E2A28; --line:#3B4F4C;
  --accent:#6FB8B5; --on-accent:#0E1615; --lv-ref:#9AABC6; --lv-exe:#6FB8B5; --lv-pra:#D9A64B; --lv-imp:#86C486;
  --warn:#E5A36F; --warn-bg:#2E2118; --ok:#86C486; --ok-bg:#1B2A1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.7;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--teal-deep);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.brand b{font-size:17px;font-weight:600}
.brand span{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px}
.rolebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.rolebar label{font-size:13px;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.7}
.rolebar select{width:auto}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{margin-bottom:14px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
h1{font-size:21px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.group-h{font-size:12px;letter-spacing:.02em;color:var(--muted);margin:18px 2px 8px;font-weight:600}
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--soft);border-radius:var(--r);padding:12px 14px;text-align:right;width:100%}
.row:hover{border-color:var(--line)}
.code{font-size:12px;font-weight:600;color:var(--accent);background:var(--wash);border-radius:6px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
.row .body{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{font-size:13px;color:var(--muted)}
.row .n{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.back{border:0;background:transparent;color:var(--accent);padding:4px 0;margin-bottom:8px;font-weight:500}
.head{display:grid;gap:6px;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{unicode-bidi:plaintext;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--fg)}
button.chip{cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lv{font-size:11px;font-weight:600;border-radius:6px;padding:1px 8px;white-space:nowrap;color:var(--surface)}
.lv-مرجع{background:var(--lv-ref)}.lv-تنفيذ{background:var(--lv-exe)}.lv-ممارسة{background:var(--lv-pra)}.lv-أثر{background:var(--lv-imp)}
.panel{background:var(--surface);border:1px solid var(--soft);border-radius:var(--r);padding:14px}
details.panel summary{cursor:pointer;font-weight:600}
details.panel[open] summary{margin-bottom:8px}
.guide{background:var(--wash);border-radius:var(--r);padding:12px 14px;font-size:14px}
.guide ul{margin:6px 0 0;padding-inline-start:20px}
.dom{margin-top:16px}
.dom-h{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.card{display:grid;gap:4px;background:var(--surface);border:1px solid var(--soft);border-radius:var(--r);padding:12px 14px;text-align:right;width:100%}
.card:hover{border-color:var(--accent)}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.card .go{font-size:13px;color:var(--accent);font-weight:600}
.cols{display:grid;gap:16px}
@media (min-width:860px){.cols{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.sticky{position:sticky;top:76px}}
form .f{display:grid;gap:4px;margin-bottom:12px}
form .f>label{font-size:13px;font-weight:500}
form .f .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph{border:1px dashed var(--line);border-radius:var(--r);overflow:hidden;background:var(--wash);display:grid}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph .act{display:flex;gap:4px;padding:6px;flex-wrap:wrap}
.ph .act button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;padding:4px}
.ph input{border-radius:0;border-width:1px 0 0}
.addph{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;color:var(--accent);font-weight:500;cursor:pointer;padding:10px}
.check{display:grid;gap:6px;font-size:14px}
.check div{display:flex;gap:8px;align-items:flex-start}
.check .i{flex:0 0 18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:3px;color:#fff;background:var(--line)}
.check .ok .i{background:var(--ok)}
.check .no{color:var(--muted)}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:10px 16px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{font-size:13px;border-radius:8px;padding:8px 10px;background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--teal-deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px;color:var(--muted)}
.steps{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:8px;font-size:14px}
.steps li::before{content:counter(s);flex:0 0 22px;height:22px;border-radius:50%;background:var(--wash);color:var(--accent);font-size:12px;display:grid;place-items:center;font-weight:600}
.board{display:grid;gap:12px;overflow-wrap:anywhere}
.board .row .chips{margin-top:6px}
.board-min{display:flex;align-items:center;gap:8px}
.board-min input{max-width:90px}
@media (max-width:480px){.top-in{flex-wrap:wrap;gap:8px}.top-in .brand{flex-basis:100%}.top-in button{flex:1;padding-inline:6px}}


/* سهولة اللمس دون تغيير صفحة الشاهد */
#app input,#app select,#app textarea{font-size:16px!important}
button,#app select,#app input:not([type=checkbox]),summary{min-height:44px}
button,summary{min-width:44px}
#app input[type=checkbox]{width:44px;height:44px;vertical-align:middle}
#app summary{display:list-item;padding-block:8px}
#app .cols>*,#app .grid2>*{min-width:0}
.welcome{margin-bottom:16px}
.welcome h2{margin-bottom:12px}
.extra{margin-bottom:12px}
.mobile-action{display:none}
.gallery{display:block;background:none;border:0;color:var(--accent);text-decoration:underline;font-size:13px;padding:8px}
@media screen and (max-width:859px){
  #app[data-view=home] .tabs{position:sticky;top:calc(var(--top-height,110px) + env(safe-area-inset-top,0px));z-index:4}
  #app[data-view=make]{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  #app[data-view=make] aside{display:none}
  .mobile-action{display:flex;align-items:center;justify-content:space-between;gap:12px;position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mobile-action span{font-size:13px}
}


/* متابعة المتطلبات */
.coverage-summary{display:grid;gap:8px;margin-bottom:14px}
.coverage-list{display:grid;gap:10px}
.requirement-card{display:grid;gap:8px;text-align:right;width:100%;overflow-wrap:anywhere}
.requirement-card.next{border:2px solid var(--accent)}
.requirement-card progress{display:block;width:100%;height:12px;accent-color:var(--accent)}
.requirement-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.requirement-detail{display:grid;gap:14px}
.requirement-detail p{margin:4px 0}
.requirement-detail .bar{margin-top:8px}
.requirement-target{display:flex;align-items:end;gap:10px;flex-wrap:wrap}
.requirement-target label{display:grid;gap:4px}
.requirement-target input{max-width:140px}
.requirement-picker{margin-bottom:12px}
.requirement-picks{display:grid;gap:6px;max-height:300px;overflow-y:auto}
.requirement-picks label{display:flex;gap:8px;align-items:center;min-height:44px;font-size:14px}
.requirement-picks input{flex:0 0 44px}
.requirement-context{margin-bottom:12px}

/* ===== صفحة الشاهد A4 ===== */
.sheet-scroll{overflow-x:auto;background:var(--soft);border-radius:var(--r);padding:12px}
.sheet-fit{transform-origin:top right}
.sheet{width:794px;min-height:1123px;background:#fff;color:#1b1b1b;font-family:var(--doc);font-size:15px;line-height:1.75;
  padding:34px 40px 28px;display:flex;flex-direction:column;gap:12px;direction:rtl;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sh-head{display:grid;grid-template-columns:1fr 124px 1fr;align-items:center;border-bottom:2.5px solid #245F5E;padding-bottom:10px;font-family:var(--ui)}
.sh-head .r{font-size:12.5px;line-height:1.6;font-weight:500}
.sh-head .l{font-size:12.5px;line-height:1.6;text-align:left}
.sh-head .c{display:grid;place-items:center;height:72px}
.sh-head .c img{max-height:78px;max-width:118px}
.sh-head .seal{width:64px;height:64px;border:1.5px solid #A9C2C0;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#5B6E6C;text-align:center;line-height:1.3}
.sh-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sh-title .k{font-family:var(--ui);font-size:12px;color:#245F5E;font-weight:600}
.sh-title h2{font-family:var(--doc);font-size:21px;font-weight:700;color:#1b1b1b;margin-top:2px}
.sh-no{font-family:var(--ui);font-size:11.5px;color:#31514F;border:1px solid #A9C2C0;border-radius:6px;padding:4px 8px;text-align:center;white-space:nowrap}
.sh-no b{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sh-meta{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #A9C2C0;border-radius:6px;overflow:hidden;font-family:var(--ui);font-size:12px}
.sh-meta div{padding:5px 9px;border-left:1px solid #D5E2E0;border-bottom:1px solid #D5E2E0;min-width:0}
.sh-meta div:nth-child(3n){border-left:0}
.sh-meta b{display:block;font-size:10.5px;color:#5B6E6C;font-weight:500}
.sh-sec h4{font-family:var(--ui);font-size:13px;color:#245F5E;margin:0 0 4px;font-weight:600;border-right:3px solid #245F5E;padding-right:8px}
.sh-sec p{margin:0 0 4px;text-align:justify}
.sh-tbl{width:100%;border-collapse:collapse;font-size:13px}
.sh-tbl th,.sh-tbl td{border:1px solid #A9C2C0;padding:4px 8px;text-align:right;vertical-align:top}
.sh-tbl th{background:#EEF4F3;font-family:var(--ui);font-weight:500;font-size:12px;width:34%}
.sh-ph{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sh-ph.one{grid-template-columns:1fr}
.sh-ph figure{margin:0;border:1px solid #D5E2E0;border-radius:4px;overflow:hidden}
.sh-ph img{width:100%;height:205px;object-fit:cover;display:block}
.sh-ph.one img{height:330px}
.sheet.dense{font-size:14px;line-height:1.6;gap:9px}.sheet.dense .sh-ph img{height:150px}.sheet.dense .sh-ph.one img{height:240px}
.sheet.dense2 .sh-ph img{height:118px}.sheet.dense2 .sh-tbl td,.sheet.dense2 .sh-tbl th{padding:2px 6px}
.sh-appr,.sh-ph figure{break-inside:avoid}
.sh-ph figcaption{font-size:12px;padding:3px 8px;background:#F4F8F7;text-align:center}
.sh-level{display:flex;gap:10px;align-items:center;font-size:13.5px;background:#F4F8F7;border-radius:6px;padding:6px 10px}
.sh-level .lvb{font-family:var(--ui);color:#fff;font-size:12px;font-weight:600;border-radius:5px;padding:1px 10px;white-space:nowrap}
.sh-appr{margin-top:auto;border:1.5px solid #31514F;border-radius:6px;font-family:var(--ui);font-size:11.5px;overflow:hidden}
.sh-appr .h{background:#31514F;color:#fff;padding:4px 10px;font-weight:600;font-size:12px;display:flex;justify-content:space-between}
.sh-appr .g{display:grid;grid-template-columns:1.1fr 1fr}
.sh-appr .g>div{padding:6px 10px;border-left:1px solid #D5E2E0}
.sh-appr .g>div:last-child{border-left:0}
.box{display:inline-block;width:11px;height:11px;border:1.2px solid #31514F;border-radius:2px;vertical-align:-1px;margin-left:4px;position:relative}
.box.x::after{content:"";position:absolute;inset:1.5px;background:#245F5E;border-radius:1px}
.sh-appr .q{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted #D5E2E0;padding:1.5px 0}
.sh-appr .q:last-child{border-bottom:0}
.sh-appr .line{border-bottom:1px solid #A9C2C0;min-height:20px;padding:0 2px;font-family:var(--doc);font-size:13px}
.sh-appr .sig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 10px;border-top:1px solid #D5E2E0}
.sh-foot{display:flex;justify-content:space-between;gap:12px;font-family:var(--ui);font-size:10.5px;color:#5B6E6C;border-top:1px solid #D5E2E0;padding-top:6px}

/* محرر الطمس */
.modal{position:fixed;inset:0;background:rgba(10,20,19,.72);z-index:40;display:grid;place-items:center;padding:16px}
.modal .in{background:var(--surface);border-radius:12px;padding:12px;max-width:min(720px,100%);width:100%;display:grid;gap:10px}
.modal canvas{width:100%;height:auto;touch-action:none;border-radius:8px;background:#000;cursor:crosshair}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body::before,.top,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet-scroll{padding:0;background:none;overflow:visible}
  .sheet-fit{transform:none!important;width:auto!important;height:auto!important}
  .sheet{box-shadow:none;margin:0}
  .cols{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top noprint">
  <div class="top-in">
    <div class="brand"><b>صانع الشواهد</b><span id="schoolLine"></span></div>
    <button type="button" id="btnBoard">لوحة المساهمة</button>
    <button type="button" id="btnReview">مراجعة شاهد</button>
    <button type="button" id="btnSettings">المدرسة</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileCoverage" accept=".json,application/json" multiple hidden>

 ما يرفع جودة التنفيذ","o":"أساليب عمل محسنة ونتيجة مقارنتها","c":"هل أدى تغيير الأسلوب إلى تحسن ملحوظ في جودة التنفيذ مقارنة بالأسلوب السابق؟"},{"id":"1-1-1-1-B04-A01","b":"المشاركة وتجميع الخطة واعتمادها","a":"أشرك الكادر التعليمي منذ تحليل الاحتياج وصياغة الأهداف، ثم في اختيار البرامج والإسناد","o":"مساهمات موثقة في كل مرحلة إعداد","c":"هل تظهر مساهمات الكادر في الأهداف والبرامج والإسناد لا في المراجعة الأخيرة فقط؟"},{"id":"1-1-1-1-B04-A02","b":"المشاركة وتجميع الخطة واعتمادها","a":"اجمع عناصر الخطة وراجع اتساقها ثم ارفعها لصاحب صلاحية الاعتماد","o":"إصدار خطة مكتمل ومرجع اعتماد","c":"هل تتطابق العناصر المعتمدة مع آخر إصدار؟"},{"id":"1-1-1-1-B04-A03","b":"المشاركة وتجميع الخطة واعتمادها","a":"فسّر النسخة المعتمدة للمنفذين وثبّت مرجعًا واحدًا لتداولها","o":"فهم مشترك ومرجع خطة واحد","c":"هل يستخدم المنفذون الإصدار المعتمد نفسه ويعرف كل منفذ دوره فيه؟"},{"id":"1-1-1-1-B04-A04","b":"المشاركة وتجميع الخطة واعتمادها","a":"أسند للكادر التعليمي أدوارًا في تنفيذ الخطة تتصل بما شارك في إعداده","o":"مشاركة فعلية للكادر في التنفيذ","c":"هل يظهر إسهام الكادر في أعمال التنفيذ لا في الإعداد وحده؟"}]},{"ref":"1-1-1-2","text":"تتابع المدرسة تنفيذ خطتها التشغيلية، وتطورها بما يضمن تحقيق أهدافها.","standard":"التخطيط","standard_ref":"1-1","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["متابعة التنفيذ ومعالجة العوائق","تقويم الخطة وفاعلية برامجها","تطوير الخطة بالمشاركة"],"actions":[{"id":"1-1-1-2-B01-A01","b":"متابعة التنفيذ ومعالجة العوائق","a":"ضع خطة متابعة مزمنة بإجراءات وأدوار واضحة","o":"جدول متابعة ومسؤوليات","c":"هل تحدد الخطة من يفحص أي مخرج ومتى؟"},{"id":"1-1-1-2-B01-A02","b":"متابعة التنفيذ ومعالجة العوائق","a":"قارن تقدم البرامج والأنشطة بالجدول وسجل المشكلات والتحديات","o":"موقف تنفيذ وسجل عوائق","c":"هل الانحرافات محددة بأسباب وأعمال متأثرة؟"},{"id":"1-1-1-2-B01-A03","b":"متابعة التنفيذ ومعالجة العوائق","a":"اختر حلولًا وبدائل لكل عائق وتابع تنفيذها","o":"معالجة مرتبطة بالعائق","c":"هل أزالت المعالجة سبب التعطل؟"},{"id":"1-1-1-2-B02-A01","b":"تقويم الخطة وفاعلية برامجها","a":"حدد أدوات تقويم متنوعة مرتبطة بأهداف الخطة","o":"أدوات مناسبة ومصادر نتائج","c":"هل تقيس الأدوات النتائج المقصودة؟"},{"id":"1-1-1-2-B02-A02","b":"تقويم الخطة وفاعلية برامجها","a":"راجع الأهداف والأولويات وفاعلية البرامج ومؤشرات التقدم بانتظام","o":"نتائج تقويم لكل عنصر","c":"هل تحقق البرنامج هدفه وهل ما زال الهدف أولوية؟"},{"id":"1-1-1-2-B02-A03","b":"تقويم الخطة وفاعلية برامجها","a":"راجع كفاية الموارد البشرية والمالية والمادية","o":"فجوات موارد محددة","c":"هل الموارد تدعم التنفيذ والنتيجة؟"},{"id":"1-1-1-2-B03-A01","b":"تطوير الخطة بالمشاركة","a":"حلل نتائج التقويم وحدد جوانب التطوير وأهدافه","o":"أولويات تطوير ذات أسباب","c":"هل لكل أولوية نتيجة تقويم تبررها؟"},{"id":"1-1-1-2-B03-A02","b":"تطوير الخطة بالمشاركة","a":"صمم برامج وإجراءات تطوير واشرك المجتمع المدرسي","o":"تعديل متفق عليه قابل للتنفيذ","c":"هل يعالج التعديل السبب ويشرك المنفذين؟"},{"id":"1-1-1-2-B03-A03","b":"تطوير الخطة بالمشاركة","a":"احفظ إصدار الخطة المعدل مع سبب كل تعديل ومرجعه في نتائج التقويم","o":"سجل إصدارات مسبب","c":"هل يمكن تتبع كل تعديل إلى نتيجة تقويم محددة؟"},{"id":"1-1-1-2-B03-A04","b":"تطوير الخطة بالمشاركة","a":"افحص في الدورة التالية أثر التعديل على العنصر الذي استهدفه","o":"نتيجة تحقق لاحقة لكل تعديل","c":"هل تحسن العنصر الذي استهدفه التعديل؟"}]},{"ref":"1-2-1-1","text":"تعزز المدرسة القيم الإسلامية، والهوية الوطنية.","standard":"قيادة العملية التعليمية","standard_ref":"1-2","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["تعزيز القيم الإسلامية","تعزيز الهوية الوطنية وتفعيل المناسبات"],"actions":[{"id":"1-2-1-1-B01-A01","b":"تعزيز القيم الإسلامية","a":"حدد القيم المراد تعزيزها وأدرجها في أهداف البرامج","o":"أهداف قيمية مرتبطة بالخطة","c":"هل لكل برنامج قيمة محددة؟"},{"id":"1-2-1-1-B01-A02","b":"تعزيز القيم الإسلامية","a":"نفذ أنشطة تعلم وبرامج تعزز القيم الإسلامية لدى المتعلمين","o":"أنشطة ومخرجات مشاركة طلابية","c":"هل يتاح للمتعلم شرح القيمة وممارستها في موقف؟"},{"id":"1-2-1-1-B01-A04","b":"تعزيز القيم الإسلامية","a":"وجّه برامج توعوية للمجتمع المحلي تعزز القيم الإسلامية والهوية الوطنية","o":"برامج توعية مجتمعية ووصول موثق","c":"هل وصلت البرامج إلى المجتمع المحلي المستهدف بمحتوى يخدم القيم والهوية معًا؟"},{"id":"1-2-1-1-B01-A03","b":"تعزيز القيم الإسلامية","a":"راجع فهم القيم وتطبيقها لتطوير النشاط اللاحق","o":"ملاحظات فهم وممارسة","c":"هل ظهر فهم يتجاوز ترديد الشعار؟"},{"id":"1-2-1-1-B02-A01","b":"تعزيز الهوية الوطنية وتفعيل المناسبات","a":"حدد معاني الانتماء والهوية المستهدفة في برامج المدرسة","o":"أهداف ومحتوى مناسب للمرحلة","c":"هل يرتبط المحتوى بمعنى واضح للطلاب؟"},{"id":"1-2-1-1-B02-A02","b":"تعزيز الهوية الوطنية وتفعيل المناسبات","a":"فعّل المناسبات الوطنية بمشاركة الطلاب واربطها بهدف تعلم","o":"أعمال طلاب مرتبطة بالمناسبة","c":"هل تنتج المناسبة تعلمًا أو ممارسة مفهومة لدى الطلاب؟"},{"id":"1-2-1-1-B02-A03","b":"تعزيز الهوية الوطنية وتفعيل المناسبات","a":"راجع ما فهمه الطلاب وما يمكن تحسينه","o":"نتائج مراجعة للبرنامج","c":"هل يفسر الطلاب دلالة مشاركتهم؟"}]},{"ref":"1-2-1-2","text":"تطبق المدرسة قيم مهنة التعليم وأخلاقياتها، وتتابع الالتزام بها.","standard":"قيادة العملية التعليمية","standard_ref":"1-2","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["نشر الوعي المهني","تطبيق القيم في التعامل المهني","متابعة الالتزام والحوافز"],"actions":[{"id":"1-2-1-2-B01-A01","b":"نشر الوعي المهني","a":"ثبت المرجع المنطبق واكتب إجراءات واضحة للتعريف بالقيم وقواعد السلوك","o":"مادة وإجراءات تعريف","c":"هل يمكن للمنسوب معرفة السلوك المتوقع؟"},{"id":"1-2-1-2-B01-A02","b":"نشر الوعي المهني","a":"نفذ برامج متنوعة وشاملة بالقيم والأخلاقيات","o":"لقاءات وورش ومواقف تطبيقية","c":"هل تصل البرامج لكل الفئات المهنية؟"},{"id":"1-2-1-2-B01-A03","b":"نشر الوعي المهني","a":"نفذ استمرار برامج القيم والأخلاقيات بالتكرار الوارد في الملف (مرتين في السنة على الأقل)","o":"سجل تنفيذ مستمر","c":"هل تحقق التكرار الوارد في الصف خلال العام؟"},{"id":"1-2-1-2-B01-A04","b":"نشر الوعي المهني","a":"افحص فهم المنسوبين للسلوك المهني المتوقع بعد البرامج وعدّل الأسلوب","o":"ملاحظات فهم وتعديل أسلوب","c":"هل يستطيع المنسوب تفسير السلوك المتوقع في موقف عملي؟"},{"id":"1-2-1-2-B02-A01","b":"تطبيق القيم في التعامل المهني","a":"حدد إجراءات تطبيق القواعد عبر صاحب الصلاحية","o":"إجراءات تطبيق منطبقة","c":"هل الإجراء والجهة المخولة واضحان؟"},{"id":"1-2-1-2-B02-A02","b":"تطبيق القيم في التعامل المهني","a":"نفذ أنشطة وممارسات تعزز الاحترام والتعاون والثقة","o":"مواقف عمل ومنتجات تعاون","c":"هل تظهر العلاقات الإيجابية في العمل اليومي؟"},{"id":"1-2-1-2-B02-A03","b":"تطبيق القيم في التعامل المهني","a":"راجع شمول التطبيق وتنوع وسائله","o":"مراجعة اتساق التطبيق","c":"هل تطبق الإجراءات بعدل على الفئات المعنية؟"},{"id":"1-2-1-2-B03-A01","b":"متابعة الالتزام والحوافز","a":"أعلن معايير حوافز تشجع الالتزام ضمن الصلاحيات","o":"معايير واضحة للحوافز","c":"هل ترتبط الحوافز بممارسة محددة؟"},{"id":"1-2-1-2-B03-A02","b":"متابعة الالتزام والحوافز","a":"تابع الالتزام بالملاحظة والمراجعة المناسبة","o":"ملاحظات مهنية مقيدة","c":"هل ترتبط الملاحظة بسلوك معلوم؟"},{"id":"1-2-1-2-B03-A03","b":"متابعة الالتزام والحوافز","a":"قدم التشجيع والدعم وعدل التوعية وفق الملاحظات","o":"دعم ومتابعة لاحقة","c":"هل تغيرت الممارسة المستهدفة؟"}]},{"ref":"1-2-1-3","text":"تطبق المدرسة إجراءات محددة؛ لدعم الانضباط المدرسي، وتتابع الالتزام بها.","standard":"قيادة العملية التعليمية","standard_ref":"1-2","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["التوعية بالسلوك والمواظبة","متابعة الانضباط ومعالجة التعثر"],"actions":[{"id":"1-2-1-3-B01-A01","b":"التوعية بالسلوك والمواظبة","a":"ثبت قواعد السلوك والمواظبة المنطبقة وحدد إجراءات نشرها","o":"محتوى وإجراء توعية","c":"هل المرجع مناسب للفئة والفترة؟"},{"id":"1-2-1-3-B01-A02","b":"التوعية بالسلوك والمواظبة","a":"نفذ توعية متنوعة للطلاب والأسر والمنسوبين","o":"مواد ولقاءات مناسبة للفئات","c":"هل يستطيع المستفيد تفسير الإجراء؟"},{"id":"1-2-1-3-B01-A03","b":"التوعية بالسلوك والمواظبة","a":"استمر بالتوعية مرتين في السنة على الأقل كما ورد في الملف","o":"سجل توعية مستمر يغطي الفئات","c":"هل التوعية مستمرة وتصل للفئات؟"},{"id":"1-2-1-3-B02-A01","b":"متابعة الانضباط ومعالجة التعثر","a":"اجمع بيانات الحضور والسلوك بوسائل متابعة متنوعة","o":"رصد فعلي للحضور والسلوك","c":"هل البيانات مكتملة ومتسقة مع المصدر؟"},{"id":"1-2-1-3-B02-A02","b":"متابعة الانضباط ومعالجة التعثر","a":"حدد الحالات المتكررة وافحص الأسباب مع أصحاب العلاقة","o":"أسباب وحاجات دعم محددة","c":"هل يستند السبب إلى أدلة كافية لطبيعة الحالة، لا إلى افتراض؟"},{"id":"1-2-1-3-B02-A03","b":"متابعة الانضباط ومعالجة التعثر","a":"طبّق الدعم أو الإجراء المخول المناسب للسبب المثبت","o":"معالجة مطبقة ضمن الصلاحية","c":"هل الإجراء ضمن الصلاحية ويتصل بالسبب المثبت؟"},{"id":"1-2-1-3-B02-A04","b":"متابعة الانضباط ومعالجة التعثر","a":"راجع استجابة الطالب بعد المعالجة وقرر الاستمرار أو التعديل أو الرفع","o":"نتيجة متابعة وقرار لاحق","c":"هل تحسن الالتزام بعد المعالجة؟"}]},{"ref":"1-2-1-4","text":"تنفذ المدرسة برامج وأنشطة تربوية داعمة للسلوك الإيجابي لدى المتعلمين، ومنهم ذوو الإعاقة والموهوبون، وتتابعها.","standard":"قيادة العملية التعليمية","standard_ref":"1-2","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["تشخيص الاحتياجات والوقاية","الدعم العلاجي للمشكلات","تعزيز السلوك الإيجابي ومتابعته"],"actions":[{"id":"1-2-1-4-B01-A01","b":"تشخيص الاحتياجات والوقاية","a":"اكشف الأنماط السلوكية بأدوات مدرسية مناسبة وحدد الفئات المحتاجة","o":"تشخيص تربوي واحتياجات","c":"هل توجد بيانات تبرر السلوك المستهدف؟"},{"id":"1-2-1-4-B01-A02","b":"تشخيص الاحتياجات والوقاية","a":"صمم برامج وقائية متنوعة تستند للتشخيص وتشمل ذوي الإعاقة والموهوبين","o":"تصميم وقائي مكيّف","c":"هل تعالج الوقاية نمطًا محددًا وتتيح المشاركة؟"},{"id":"1-2-1-4-B01-A03","b":"تشخيص الاحتياجات والوقاية","a":"نفذ الوقاية وافحص وصولها واستجابة الطلاب","o":"نتائج تنفيذ وملاحظة","c":"هل وصل البرنامج للفئات المقصودة؟"},{"id":"1-2-1-4-B02-A01","b":"الدعم العلاجي للمشكلات","a":"حدد حاجة كل حالة إلى دعم تربوي أو إحالة مخولة","o":"قرار دعم أو إحالة","c":"هل التدخل ضمن اختصاص المدرسة؟"},{"id":"1-2-1-4-B02-A02","b":"الدعم العلاجي للمشكلات","a":"نفذ خطة دعم ملائمة للسبب بالتنسيق مع المعنيين","o":"إجراءات دعم ومتابعة مقيدة","c":"هل الخطة تعالج السبب المشخص؟"},{"id":"1-2-1-4-B02-A03","b":"الدعم العلاجي للمشكلات","a":"راجع تغير السلوك بعد التدخل","o":"نتيجة مقارنة ومراجعة","c":"هل انخفض تكرار السلوك المستهدف؟"},{"id":"1-2-1-4-B03-A01","b":"تعزيز السلوك الإيجابي ومتابعته","a":"ضع خطة تعزيز تحدد السلوكيات والمشاركة ووسائل المتابعة","o":"خطة تعزيز سلوكي","c":"هل السلوك المتوقع واضح وقابل للملاحظة؟"},{"id":"1-2-1-4-B03-A02","b":"تعزيز السلوك الإيجابي ومتابعته","a":"نفذ برامج متنوعة وتوعية وتعزيزًا متاحًا لجميع الطلاب","o":"أنشطة ومشاركة وتعزيز","c":"هل يتيح التنفيذ فرصًا منصفة للفئات؟"},{"id":"1-2-1-4-B03-A03","b":"تعزيز السلوك الإيجابي ومتابعته","a":"تابع التنفيذ بأدوات متنوعة وحسن أساليب التعزيز","o":"مراجعة تنفيذ واستجابة","c":"هل يستمر السلوك خارج وقت النشاط؟"}]},{"ref":"1-2-1-5","text":"تنفذ المدرسة برامج وأنشطة إثرائية؛ لتطوير مواهب المتعلمين، وتهيئهم للمستقبل، وتتابعها.","standard":"قيادة العملية التعليمية","standard_ref":"1-2","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["الإثراء غير الصفي","اكتشاف المواهب وتطويرها","المسابقات الوطنية والدولية","الإرشاد الأكاديمي والمهني"],"actions":[{"id":"1-2-1-5-B01-A01","b":"الإثراء غير الصفي","a":"أعد خطة إثراء مكتملة العناصر وتغطي الفئات المستهدفة","o":"خطة إثراء وإتاحة","c":"هل تشمل الخطة ذوي الإعاقة والموهوبين وبقية الطلاب؟"},{"id":"1-2-1-5-B01-A02","b":"الإثراء غير الصفي","a":"نفذ أنشطة متنوعة خارج الصف","o":"مشروعات وأندية وأعمال طلاب","c":"هل توجد مهارة أو خبرة تعلم واضحة في النشاط؟"},{"id":"1-2-1-5-B01-A03","b":"الإثراء غير الصفي","a":"نوّع الحوافز العينية والمعنوية للمشاركة في الأنشطة الإثرائية","o":"حوافز متنوعة معلنة","c":"هل تتنوع الحوافز وترتبط بالمشاركة في الإثراء؟"},{"id":"1-2-1-5-B01-A04","b":"الإثراء غير الصفي","a":"راجع مشاركة الفئات في الأنشطة الإثرائية وأزل عوائق من لم يشارك","o":"مراجعة مشاركة وإجراءات إتاحة","c":"هل تشارك الفئات المستهدفة جميعها، ومنهم ذوو الإعاقة والموهوبون؟"},{"id":"1-2-1-5-B02-A01","b":"اكتشاف المواهب وتطويرها","a":"اكشف المواهب والقدرات بوسائل مناسبة","o":"وصف قدرات واحتياجات تطوير","c":"هل تشخيص الموهبة يستند إلى أعمال أو أداة مناسبة؟"},{"id":"1-2-1-5-B02-A02","b":"اكتشاف المواهب وتطويرها","a":"صمم ونفذ برامج متنوعة مرتبطة بنتائج التشخيص","o":"مسارات تطوير ومخرجات أداء","c":"هل يختلف الدعم بحسب حاجة الموهبة؟"},{"id":"1-2-1-5-B02-A03","b":"اكتشاف المواهب وتطويرها","a":"استخدم أساليب متنوعة لتحفيز الطلاب على المشاركة في مقاييس الموهبة","o":"مشاركة في مقاييس الموهبة","c":"هل وصلت معلومات المقاييس والتحفيز إلى الطلاب المرشحين وأسرهم؟"},{"id":"1-2-1-5-B02-A04","b":"اكتشاف المواهب وتطويرها","a":"قدّم حوافز تشجع الطلاب على إبراز مواهبهم والتميز فيها مع التحقق من المنجز","o":"منجزات موهبة مثبتة ومعززة","c":"هل المنجز المعزز مثبت بدليل أداء أو نتيجة صادرة عن جهتها؟"},{"id":"1-2-1-5-B03-A01","b":"المسابقات الوطنية والدولية","a":"تحقق من معلومات المسابقات الوطنية والدولية وشروطها من جهاتها المنظمة","o":"معلومات مسابقات موثقة","c":"هل المعلومة صادرة عن الجهة المنظمة وسارية؟"},{"id":"1-2-1-5-B03-A04","b":"المسابقات الوطنية والدولية","a":"انشر الوعي بالمسابقات وطرق المشاركة فيها في المجتمع المدرسي","o":"وعي بطرق المشاركة ومواعيدها","c":"هل يعرف الطلاب والأسر كيف يشاركون ومتى؟"},{"id":"1-2-1-5-B03-A02","b":"المسابقات الوطنية والدولية","a":"أعدّ المشاركين في المسابقات وتابع مشاركتهم","o":"استعداد ومشاركة فعلية","c":"هل حصل المشارك على إعداد ودعم مناسبين وتمت مشاركته فعلًا؟"},{"id":"1-2-1-5-B03-A03","b":"المسابقات الوطنية والدولية","a":"وثّق النتائج الوطنية والدولية كما صدرت عن الجهات المنظمة","o":"نتائج وجوائز فعلية أو عدم تحققها","c":"هل النتيجة صادرة عن الجهة المنظمة وموثقة كما هي؟"},{"id":"1-2-1-5-B03-A05","b":"المسابقات الوطنية والدولية","a":"قدّم حوافز منضبطة تشجع التميز في المسابقات واحتفِ بالمنجز المثبت","o":"حوافز واحتفاء بمنجز مثبت","c":"هل ترتبط الحوافز بجهد أو منجز مثبت صادر عن الجهة المنظمة؟"},{"id":"1-2-1-5-B04-A01","b":"الإرشاد الأكاديمي والمهني","a":"ضع خطة إرشاد تناسب المرحلة وتوضح احتياجات المستقبل","o":"خطة وأهداف إرشاد","c":"هل الخيارات المعروضة مناسبة للمرحلة؟"},{"id":"1-2-1-5-B04-A02","b":"الإرشاد الأكاديمي والمهني","a":"نفذ برامج إرشاد وإثراء أكاديمي ومهني متنوعة تشمل جميع الفئات ومنهم ذوو الإعاقة","o":"خبرات إرشاد ومشاركة مكيّفة","c":"هل يتاح للطلاب فهم الخيارات عمليًا، وتشمل البرامج الفئات؟"},{"id":"1-2-1-5-B04-A04","b":"الإرشاد الأكاديمي والمهني","a":"استثمر مؤسسات المجتمع ذات العلاقة في برامج الإرشاد بعد تحديد نوع التعاون وصلاحيته","o":"إسهام مؤسسات مخول في البرامج","c":"هل حُدد نوع التعاون؟ وإن كان اتفاقًا رسميًا فهل صدر حكم ما قبل التوقيع؟ وإن كان تعاونًا غير تعاقدي فهل تحقق الإذن المنطبق على نوع النشاط؟"},{"id":"1-2-1-5-B04-A03","b":"الإرشاد الأكاديمي والمهني","a":"قدّم حوافز تشجع المشاركة في برامج الإرشاد الأكاديمي والمهني","o":"حوافز مشاركة","c":"هل ترتبط الحوافز بالمشاركة وتصل للفئات؟"},{"id":"1-2-1-5-B04-A05","b":"الإرشاد الأكاديمي والمهني","a":"افحص ما تعلمه الطلاب عن خياراتهم الأكاديمية والمهنية","o":"مخرجات فهم وخيارات مبررة","c":"هل يستطيع الطالب تفسير خيار مناسب له؟"}]},{"ref":"1-3-1-1","text":"تعزز المدرسة بناء العلاقات الإيجابية والتعاون في المجتمع المدرسي.","standard":"المجتمع المدرسي","standard_ref":"1-3","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["بناء التعاون والعلاقات الإيجابية"],"actions":[{"id":"1-3-1-1-B01-A01","b":"بناء التعاون والعلاقات الإيجابية","a":"ضع خطة العمل التعاوني في المجتمع المدرسي: أعمال مشتركة تشمل جميع المنسوبين حسب اختصاصهم، وتضم الطلاب والأسر حيث يتصل العمل بهم، مع ربط الأعمال القائمة بدل تكرارها","o":"خطة تعاون بفئات ذات صلة وإحالات إلى الأعمال القائمة","c":"هل لكل عمل تعاوني فئاته ذات الصلة؟ وهل أُحيل ما يخص الطلاب والأسر والمناخ إلى أعماله القائمة دون نسخ أو تكليف جديد؟"},{"id":"1-3-1-1-B01-A02","b":"بناء التعاون والعلاقات الإيجابية","a":"نفذ أنشطة ومهام متنوعة وإبداعية بروح الفريق","o":"منتجات مشتركة وإسهامات معلومة","c":"هل يتضح إسهام المشاركين في المنتج؟"},{"id":"1-3-1-1-B01-A03","b":"بناء التعاون والعلاقات الإيجابية","a":"قدّم حوافز منصفة تشجع المشاركة في أنشطة العمل التعاوني","o":"حوافز معلنة المعايير","c":"هل الحوافز منصفة ومعلنة المعايير ومرتبطة بالمشاركة؟"},{"id":"1-3-1-1-B01-A04","b":"بناء التعاون والعلاقات الإيجابية","a":"راجع جودة التعاون والعلاقات وشمولها للفئات ذات الصلة","o":"مراجعة تعاون وقرارات تحسين","c":"هل أنتج التعاون قيمة للعمل، وشمل الفئات ذات الصلة دون استبعاد؟"}]},{"ref":"1-3-1-2","text":"تعزز المدرسة مشاركة الأسرة في تعلم أبنائهم، والتحضير لمستقبلهم.","standard":"المجتمع المدرسي","standard_ref":"1-3","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["تمكين الأسرة لدعم التعلم والمستقبل","التواصل ومتابعة تعلم الطالب","مشاركة الأسرة وتقويم الخدمة"],"actions":[{"id":"1-3-1-2-B01-A01","b":"تمكين الأسرة لدعم التعلم والمستقبل","a":"حدد موضوعات توعية مرتبطة بتعلم الطلاب ومستقبلهم","o":"احتياجات توعية وأهداف","c":"هل الموضوع يتصل بحاجة فعلية للأسرة؟"},{"id":"1-3-1-2-B01-A02","b":"تمكين الأسرة لدعم التعلم والمستقبل","a":"قدم ورشًا وندوات ونشرات متنوعة وشاملة على مدار العام","o":"برنامج توعية ومشاركة","c":"هل تصل التوعية للأسر والفئات المستهدفة؟"},{"id":"1-3-1-2-B01-A03","b":"تمكين الأسرة لدعم التعلم والمستقبل","a":"افحص فهم الأسرة لخطوات الدعم","o":"إرشادات دعم مفهومة","c":"هل تعرف الأسرة إجراءً عمليًا تستطيع تنفيذه؟"},{"id":"1-3-1-2-B02-A01","b":"التواصل ومتابعة تعلم الطالب","a":"نظم قنوات متنوعة لتواصل مستمر وآمن مع الأسرة","o":"قنوات وإجراءات تواصل","c":"هل توجد قناة بديلة عند تعذر الوصول؟"},{"id":"1-3-1-2-B02-A02","b":"التواصل ومتابعة تعلم الطالب","a":"زوّد الأسرة بمعلومات عن تعلم ابنها وكيفية دعمه عبر القنوات المعتمدة","o":"رسالة تعلم وخطوة دعم","c":"هل تتضمن المعلومة خطوة دعم واضحة دون كشف بيانات غيره؟"},{"id":"1-3-1-2-B02-A04","b":"التواصل ومتابعة تعلم الطالب","a":"أشرك الأسرة في تقويم تعلم ابنها ومتابعة أداء المهمات والواجبات","o":"مشاركة أسرية محددة في المتابعة","c":"هل للأسرة دور محدد في المتابعة تستطيع أداءه في ظروفها؟"},{"id":"1-3-1-2-B02-A03","b":"التواصل ومتابعة تعلم الطالب","a":"أشرك الأسرة في تحديد مشكلات تعلم ابنها واتفق معها على حل","o":"اتفاق دعم مشترك","c":"هل الحل المتفق عليه محدد وقابل للتنفيذ في ظروف الأسرة؟"},{"id":"1-3-1-2-B02-A05","b":"التواصل ومتابعة تعلم الطالب","a":"تابع أثر الحل المتفق عليه على تعلم الطالب وعدّله مع الأسرة","o":"نتيجة متابعة وتعديل","c":"هل أسهم الدعم في تقدم الطالب؟"},{"id":"1-3-1-2-B03-A01","b":"مشاركة الأسرة وتقويم الخدمة","a":"أتح مشاركة الأسرة وخبراتها التخصصية وفق الإجراءات المخولة","o":"فرص مشاركة وأعمال مفيدة","c":"هل الخبرة تخدم حاجة تعليمية؟"},{"id":"1-3-1-2-B03-A02","b":"مشاركة الأسرة وتقويم الخدمة","a":"اجمع رأي الأسرة في خدمات المدرسة بوسائل مناسبة","o":"ملاحظات خدمة مصنفة","c":"هل تصل أداة الرأي إلى أسر متنوعة؟"},{"id":"1-3-1-2-B03-A03","b":"مشاركة الأسرة وتقويم الخدمة","a":"حوّل ملاحظات الأسر إلى قرارات تحسين أو بيّن سبب تعذرها","o":"قرارات تحسين مسببة","c":"هل لكل ملاحظة متكررة استجابة أو سبب معلن لتعذرها؟"},{"id":"1-3-1-2-B03-A04","b":"مشاركة الأسرة وتقويم الخدمة","a":"أبلغ الأسر بما عولج من ملاحظاتها وما تعذر وسببه","o":"تغذية راجعة للأسر","c":"هل عرفت الأسر ما تغير بسبب ملاحظاتها؟"}]},{"ref":"1-3-1-3","text":"تعزز المدرسة الشراكة المجتمعية؛ لدعم التعلم والتأثير الإيجابي في المجتمع.","standard":"المجتمع المدرسي","standard_ref":"1-3","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["التعاون المؤسسي وتبادل المعرفة","خدمة الموهوبين وذوي الإعاقة","خدمة المجتمع وإتاحة الإمكانات"],"actions":[{"id":"1-3-1-3-B01-A01","b":"التعاون المؤسسي وتبادل المعرفة","a":"حدد حاجة التعلم والمؤسسات المناسبة ووسائل التواصل المستمر","o":"حاجة ومؤسسات وطرق تعاون","c":"هل التعاون المقترح يخدم حاجة محددة؟"},{"id":"1-3-1-3-B01-A05","b":"التعاون المؤسسي وتبادل المعرفة","a":"صنّف نوع التعاون المقترح وحدد الصلاحية والإذن المنطبقين عليه: شراكة أو اتفاق رسمي، أو تعاون غير تعاقدي يحتاج نشاطه إذنًا، أو تواصل عام","o":"تصنيف تعاون وجهة صلاحية لكل نوع","c":"هل لكل تعاون نوع محدد وصاحب صلاحية معلوم؟ وهل فُحص النشاط غير التعاقدي (زيارة، استضافة، تبادل بيانات) بدل منحه إعفاءً شاملًا؟"},{"id":"1-3-1-3-B01-A02","b":"التعاون المؤسسي وتبادل المعرفة","a":"للشراكة أو الاتفاق الرسمي: قيّم الشراكة قبل التوقيع وارفعها للحكم المخول","o":"تقييم ما قبل التوقيع وحكم مخول","c":"هل صدر حكم مخول قبل التوقيع أو التفعيل؟"},{"id":"1-3-1-3-B01-A03","b":"التعاون المؤسسي وتبادل المعرفة","a":"نفذ التعاون والتوعية وتبادل الخبرات مع المؤسسات والمدارس ضمن نطاق ما حُكم به أو أُذن به","o":"مخرجات تعاون موثقة","c":"هل نُفذ التعاون ضمن النطاق المحكوم أو المأذون، وهل أنتج مخرج تعلم محددًا؟"},{"id":"1-3-1-3-B01-A04","b":"التعاون المؤسسي وتبادل المعرفة","a":"قِس أثر الشراكة على الحاجة التعليمية بعد التنفيذ، وأصدر حكم الأثر مستقلًا عن حكم الاعتماد ومبنيًا على دليل يثبت النتيجة الفعلية","o":"حكم أثر لاحق مستقل مع دليل النتيجة الفعلية وغرض كل أصل مستعمل","c":"هل صدر حكم الأثر مستقلًا عن حكم الاعتماد، واستند إلى دليل يثبت تغيرًا فعليًا في الحاجة المستهدفة؟ وإن استُعمل أصل سبق تقديمه للاعتماد، فهل وُثّق غرضه الجديد وصلاحيته لإثبات الأثر؟"},{"id":"1-3-1-3-B02-A01","b":"خدمة الموهوبين وذوي الإعاقة","a":"حدد احتياجات الفئات وتحقق من خدمات المؤسسات المناسبة","o":"احتياجات وخدمات وانطباق","c":"هل الخدمة تلائم الحاجة وتتاح للفئة؟"},{"id":"1-3-1-3-B02-A02","b":"خدمة الموهوبين وذوي الإعاقة","a":"عرّف المجتمع المدرسي بخدمات المؤسسات ونظّم تعاونًا متنوعًا معها ضمن الصلاحية","o":"تعريف وإتاحة وخدمة منفذة","c":"هل وصل الطلاب المستهدفون للخدمة؟"},{"id":"1-3-1-3-B02-A03","b":"خدمة الموهوبين وذوي الإعاقة","a":"افحص أثر الاستفادة على تعلم الفئات","o":"نتيجة دعم مرتبطة بالخدمة","c":"هل تغيرت الحاجة التعليمية المستهدفة؟"},{"id":"1-3-1-3-B03-A01","b":"خدمة المجتمع وإتاحة الإمكانات","a":"حدد حاجات المجتمع وخدمات المدرسة الممكنة عبر الإذن المنطبق","o":"خدمات مقترحة ومرجع صلاحية","c":"هل الإتاحة مخولة ومناسبة؟"},{"id":"1-3-1-3-B03-A02","b":"خدمة المجتمع وإتاحة الإمكانات","a":"نفذ بعد حسم الإذن خدمات وأنشطة متنوعة على مدار العام تشمل الأطراف المعنية","o":"خدمات وأنشطة ومشاركة فعلية","c":"هل الخدمة تصل للمستفيد وتلبي حاجة؟"},{"id":"1-3-1-3-B03-A03","b":"خدمة المجتمع وإتاحة الإمكانات","a":"قوّم أثر الخدمة وحدد استمرارها أو تعديلها بمرجع عمل واحد","o":"حكم أثر وقرار لاحق","c":"هل القرار مبني على أثر وبلا نسخ بيانات رئيسية؟"}]},{"ref":"1-4-1-1","text":"توفر المدرسة كادرًا تعليميًا مكتملًا ومؤهلًا بما يتسق مع المهام الموكلة له.","standard":"التطوير المؤسسي","standard_ref":"1-4","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["اكتمال الكادر التعليمي","التأهيل واتساق الإسناد"],"actions":[{"id":"1-4-1-1-B01-A01","b":"اكتمال الكادر التعليمي","a":"احصر احتياجات التدريس حسب المرحلة والتخصص وقارنها بالكادر الفعلي","o":"فجوات تغطية محددة","c":"هل توجد مادة أو فئة بلا تغطية؟"},{"id":"1-4-1-1-B01-A02","b":"اكتمال الكادر التعليمي","a":"تابع المعالجة مع الجهة المخولة ونظم التغطية ضمن الصلاحيات","o":"تغطية ومعاملة معالجة","c":"هل استمرت فرص التعلم أثناء المعالجة؟"},{"id":"1-4-1-1-B01-A03","b":"اكتمال الكادر التعليمي","a":"راجع استمرار اكتمال الكادر عند تغير الجدول أو العاملين","o":"موقف تغطية محدث","c":"هل أعيدت مراجعة الفجوات بعد التغير؟"},{"id":"1-4-1-1-B02-A01","b":"التأهيل واتساق الإسناد","a":"تحقق من مؤهلات كل دور تعليمي ومرجع إسناده","o":"مصفوفة تأهيل وإسناد","c":"هل التأهيل والمرجع متاحان؟"},{"id":"1-4-1-1-B02-A02","b":"التأهيل واتساق الإسناد","a":"قارن المهام المسندة بالتخصص والاختصاص المنطبق","o":"حالات توافق أو تعارض","c":"هل توجد مهمة غير مناسبة للتأهيل؟"},{"id":"1-4-1-1-B02-A03","b":"التأهيل واتساق الإسناد","a":"تحقق من أثر تصحيح الإسناد على انتظام التعلم","o":"إسناد مصحح ونتيجة مراجعة","c":"هل زال التعارض واستمرت التغطية؟"}]},{"ref":"1-4-1-2","text":"توفر المدرسة كادرًا إداريًا مكتملًا ومؤهلًا بما يتسق مع المهام الموكلة له.","standard":"التطوير المؤسسي","standard_ref":"1-4","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["اكتمال الكادر الإداري","ملاءمة التأهيل والمهام الإدارية"],"actions":[{"id":"1-4-1-2-B01-A01","b":"اكتمال الكادر الإداري","a":"حدد الأعمال والأدوار الإدارية المنطبقة على المدرسة","o":"احتياج إداري مبرر","c":"هل الاحتياج مرتبط بنوع المدرسة وحجم عملها؟"},{"id":"1-4-1-2-B01-A02","b":"اكتمال الكادر الإداري","a":"قارن الاحتياج بالكادر الفعلي وحدد الأعمال غير المغطاة","o":"فجوات إدارية محددة","c":"هل توجد خدمة متعطلة بسبب نقص التغطية؟"},{"id":"1-4-1-2-B01-A03","b":"اكتمال الكادر الإداري","a":"تابع المعالجة ونظم استمرار الخدمة ضمن الصلاحيات","o":"معالجة وتغطية خدمة","c":"هل أغلقت الفجوة دون تضارب مهام؟"},{"id":"1-4-1-2-B02-A01","b":"ملاءمة التأهيل والمهام الإدارية","a":"تحقق من مؤهلات وخبرة العاملين ومرجع أدوارهم","o":"بيانات تأهيل ومرجع دور","c":"هل لكل إسناد بيانات موثقة؟"},{"id":"1-4-1-2-B02-A02","b":"ملاءمة التأهيل والمهام الإدارية","a":"راجع توافق المهام مع التأهيل وحدد احتياجات الدعم","o":"توافق ومهارات تحتاج دعمًا","c":"هل يستطيع المكلف تنفيذ المهمة ضمن اختصاصه؟"},{"id":"1-4-1-2-B02-A03","b":"ملاءمة التأهيل والمهام الإدارية","a":"راجع جودة الخدمة بعد المعالجة","o":"نتيجة مراجعة خدمة","c":"هل تحسنت الخدمة وزال تعارض الإسناد؟"}]},{"ref":"1-4-1-3","text":"تظهر المدرسة الملاءة والاستدامة المالية.","standard":"التطوير المؤسسي","standard_ref":"1-4","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["الملاءة وتغطية الالتزامات","الاستدامة المالية"],"actions":[{"id":"1-4-1-3-B01-A01","b":"الملاءة وتغطية الالتزامات","a":"حدد البيانات المالية التي يملك صاحب الاختصاص تقديمها وجهة مراجعتها","o":"نطاق مراجعة وبيانات متاحة","c":"هل الجهة المالكة للمراجعة والبيانات المطلوبة واضحتان؟"},{"id":"1-4-1-3-B01-A02","b":"الملاءة وتغطية الالتزامات","a":"قارن الموارد المتاحة بالالتزامات ذات الفترة نفسها","o":"فجوات قدرة حالية","c":"هل المقارنة تشمل التزامات فعلية وموارد موثقة؟"},{"id":"1-4-1-3-B01-A03","b":"الملاءة وتغطية الالتزامات","a":"ارفع الفجوات لخطة معالجة مخولة","o":"قرار معالجة ومسؤولية","c":"هل عولج أثر الفجوة على استمرار التعليم؟"},{"id":"1-4-1-3-B02-A01","b":"الاستدامة المالية","a":"اربط الخطة والتقرير المالي السنوي المعتمدين بتوزيع الموارد وفق أولويات العملية التعليمية","o":"خطة مالية مرتبطة بأولويات التعليم","c":"هل يتبع توزيع الموارد أولويات العملية التعليمية في الخطة المعتمدة؟"},{"id":"1-4-1-3-B02-A04","b":"الاستدامة المالية","a":"حلل استمرارية الموارد والالتزامات والمخاطر المالية للفترات القادمة","o":"افتراضات استدامة مبررة ومخاطر محددة","c":"هل تعتمد الاستدامة على موارد غير مؤكدة، وهل حُددت المخاطر ومن يملك معالجتها؟"},{"id":"1-4-1-3-B02-A02","b":"الاستدامة المالية","a":"ضع بدائل مخولة للحفاظ على الخدمات الأساسية","o":"بدائل استمرار قابلة للتطبيق","c":"هل لكل بديل مورد وصلاحية؟"},{"id":"1-4-1-3-B02-A03","b":"الاستدامة المالية","a":"راجع تغير الموارد والالتزامات وحدث المعالجة","o":"مراجعة استدامة محدثة","c":"هل بقيت البدائل صالحة بعد التغير؟"}]},{"ref":"1-4-1-4","text":"تدعم المدرسة منسوبيها للحصول على الرخصة المهنية، وتتابعها.","standard":"التطوير المؤسسي","standard_ref":"1-4","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["التوعية والدعم والحوافز","متابعة الرخص والنتائج"],"actions":[{"id":"1-4-1-4-B01-A01","b":"التوعية والدعم والحوافز","a":"حدد الاحتياجات حسب التخصص وتحقق من متطلبات الرخصة من مرجعها عند التطبيق","o":"احتياجات ومعلومات منطبقة","c":"هل المعلومة مناسبة للفئة والدورة؟"},{"id":"1-4-1-4-B01-A02","b":"التوعية والدعم والحوافز","a":"قدم برامج توعية متنوعة تشمل التخصصات","o":"توعية وفهم خطوات التقدم","c":"هل يعرف المعلم الخطوة التي يحتاجها؟"},{"id":"1-4-1-4-B01-A03","b":"التوعية والدعم والحوافز","a":"نوع الحوافز والدعم ضمن الصلاحيات","o":"وسائل تشجيع ودعم","c":"هل تعالج الوسيلة عائقًا فعليًا؟"},{"id":"1-4-1-4-B02-A01","b":"متابعة الرخص والنتائج","a":"تحقق من حالة الرخصة ومستواها عبر مستند أو مصدر مصرح","o":"حالات فعلية محدثة","c":"هل النتيجة مثبتة من مصدرها؟"},{"id":"1-4-1-4-B02-A02","b":"متابعة الرخص والنتائج","a":"حدد من يحتاج خطوة متابعة أو دعمًا إضافيًا","o":"خطوات فردية مناسبة","c":"هل تختلف المعالجة باختلاف سبب التعثر؟"},{"id":"1-4-1-4-B02-A03","b":"متابعة الرخص والنتائج","a":"راجع النتائج الفعلية ومنها المستويات المتقدمة","o":"نتائج ودعم لاحق","c":"هل يعرض التقرير النتيجة كما هي؟"}]},{"ref":"1-4-1-5","text":"تدعم المدرسة التطوير المهني لمنسوبيها وفقًا لنتائج التقويم وتحليل احتياجاتهم.","standard":"التطوير المؤسسي","standard_ref":"1-4","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["خطة التطوير المبنية على الاحتياج","تنفيذ التطوير ودعم المشاركة","مجتمعات التعلم والبحث الإجرائي"],"actions":[{"id":"1-4-1-5-B01-A01","b":"خطة التطوير المبنية على الاحتياج","a":"حلل احتياجات المنسوبين ونتائج تقويم الأداء وفق صلاحية الوصول","o":"احتياجات تطوير فعلية","c":"هل الحاجة مرتبطة بممارسة أو نتيجة تقويم؟"},{"id":"1-4-1-5-B01-A02","b":"خطة التطوير المبنية على الاحتياج","a":"أشرك المجتمع المدرسي في أهداف الخطة ونوع الأساليب لتشمل الإداريين والتعليميين","o":"خطة شاملة وأساليب متنوعة","c":"هل لكل فئة احتياج وفرصة تطوير؟"},{"id":"1-4-1-5-B01-A03","b":"خطة التطوير المبنية على الاحتياج","a":"راجع الخطة وارفعها للاعتماد المخول","o":"خطة ومرجع اعتماد","c":"هل البرامج تعالج الاحتياجات المعلنة؟"},{"id":"1-4-1-5-B02-A01","b":"تنفيذ التطوير ودعم المشاركة","a":"جدول برامج التطوير على مدار العام","o":"برنامج تنفيذ مستمر","c":"هل توزع الفرص وفق الاحتياج؟"},{"id":"1-4-1-5-B02-A02","b":"تنفيذ التطوير ودعم المشاركة","a":"نفذ أساليب متنوعة وادعم المشاركة الداخلية والخارجية","o":"مشاركة وأعمال تعلم مهني","c":"هل تمكن المنسوب من المشاركة فعليًا؟"},{"id":"1-4-1-5-B02-A03","b":"تنفيذ التطوير ودعم المشاركة","a":"راجع اكتمال التنفيذ وحاجة المشاركين لدعم لاحق","o":"مراجعة تنفيذ ودعم","c":"هل اكتسب المشاركون ما يحتاجونه؟"},{"id":"1-4-1-5-B03-A01","b":"مجتمعات التعلم والبحث الإجرائي","a":"حفز المشاركة في مجتمعات تعلم ذات مشكلة مهنية محددة","o":"فريق تعلم وسؤال تحسين","c":"هل يناقش الفريق حاجة فعلية؟"},{"id":"1-4-1-5-B03-A02","b":"مجتمعات التعلم والبحث الإجرائي","a":"نفذ بحثًا إجرائيًا وتجريبًا مناسبًا لتحسين التعليم","o":"تدخل وبيانات قبل وبعد","c":"هل يمكن تتبع التغيير إلى التدخل؟"},{"id":"1-4-1-5-B03-A03","b":"مجتمعات التعلم والبحث الإجرائي","a":"طبّق ما ثبت نجاحه من مجتمعات التعلم والبحث الإجرائي في الممارسة","o":"ممارسة محسنة مطبقة","c":"هل طُبق التحسين فعلًا في الصفوف أو الأعمال المستهدفة؟"},{"id":"1-4-1-5-B03-A04","b":"مجتمعات التعلم والبحث الإجرائي","a":"راجع أثر التطبيق على الممارسة وتعلم الطلاب","o":"نتيجة مراجعة أثر","c":"هل انتقل التعلم المهني إلى الصف وظهر أثره في أعمال الطلاب أو الممارسة؟"}]},{"ref":"1-4-1-6","text":"تطبق المدرسة التقويم الذاتي المبني على المعايير المعتمدة من الهيئة بشكل مستمر.","standard":"التطوير المؤسسي","standard_ref":"1-4","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["تنفيذ التقويم الذاتي ومراجعته","المشاركة ونشر النتائج"],"actions":[{"id":"1-4-1-6-B01-A01","b":"تنفيذ التقويم الذاتي ومراجعته","a":"ثبّت الإصدار النافذ من الدليل الإجرائي للتقويم المدرسي الذاتي ومعايير التقويم المعتمدة، والتزم بها في العمليات","o":"مرجع إجراءات ومعايير مثبت","c":"هل تطابق الإجراءات المطبقة الإصدار النافذ (الإصدار الثالث 1447هـ/2026م)؟"},{"id":"1-4-1-6-B01-A04","b":"تنفيذ التقويم الذاتي ومراجعته","a":"شكّل فريق التقويم الذاتي وفق معايير واضحة ومحددة","o":"فريق بمعايير اختيار ومهام","c":"هل معايير الاختيار ومهام الأعضاء معلنة؟ وهل يطابق التشكيل ما يحدده الدليل النافذ (ص11: مدير المدرسة رئيسًا، وأربعة معلمين من ذوي الخبرة والتميز، وفريق مستقل لكل مرحلة إن تعددت المراحل)؟"},{"id":"1-4-1-6-B01-A05","b":"تنفيذ التقويم الذاتي ومراجعته","a":"ضع خطة تطبيق التقويم الذاتي واعتمدها","o":"خطة تقويم ذاتي معتمدة","c":"هل تتضمن الخطة الأهداف وتوزيع الأدوار والمسؤوليات ومؤشرات تحققها وآليات متابعتها (الدليل النافذ ص11)، وهل اعتُمدت؟"},{"id":"1-4-1-6-B01-A02","b":"تنفيذ التقويم الذاتي ومراجعته","a":"طبّق جميع إجراءات التقويم الذاتي المعتمدة واجمع الأدلة لكل معيار","o":"أدلة وأحكام مبررة","c":"هل يرتبط كل حكم بدليل ومعيار، وطُبقت الإجراءات المعتمدة كاملة؟"},{"id":"1-4-1-6-B01-A06","b":"تنفيذ التقويم الذاتي ومراجعته","a":"اعقد لقاءات لتهيئة المجتمع المدرسي لتطبيق التقويم الذاتي","o":"مجتمع مدرسي مهيأ لدوره في التقويم","c":"هل يعرف المشاركون في التقويم دورهم وإجراءاته قبل بدء الجمع؟"},{"id":"1-4-1-6-B01-A03","b":"تنفيذ التقويم الذاتي ومراجعته","a":"تابع الخطة بانتظام وحسنها وفق المراجعة","o":"مراجعة وإجراء تحسين","c":"هل تستمر العملية بعد إصدار التقرير؟"},{"id":"1-4-1-6-B02-A01","b":"المشاركة ونشر النتائج","a":"انشر ثقافة التقويم بوسائل متنوعة طوال العام ولجميع المنسوبين","o":"تهيئة شاملة وفهم","c":"هل يفهم المشاركون دورهم؟"},{"id":"1-4-1-6-B02-A02","b":"المشاركة ونشر النتائج","a":"أشرك المنسوبين وأصحاب المصلحة في إجراءات التقويم","o":"مشاركات وأدلة متعددة","c":"هل أثرت المشاركة في تفسير النتائج؟"},{"id":"1-4-1-6-B02-A03","b":"المشاركة ونشر النتائج","a":"أطلع منسوبي المدرسة وأصحاب المصلحة على نتائج التقويم الذاتي المناسبة","o":"نتائج مفهومة لدى المعنيين","c":"هل اطلع المعنيون على النتائج بصيغة مفهومة دون كشف حالات فردية؟"}]},{"ref":"1-4-1-7","text":"تنفذ المدرسة خطة التحسين بناء على نتائج التقويم المدرسي، وتتابعها.","standard":"التطوير المؤسسي","standard_ref":"1-4","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["بناء خطة التحسين","تنفيذ التحسين وقياس الأثر"],"actions":[{"id":"1-4-1-7-B01-A01","b":"بناء خطة التحسين","a":"حلل نتائج التقويم وحدد جوانب الضعف وأسبابها المحتملة المتحققة","o":"فجوات وأسباب وأولويات","c":"هل يرتبط السبب ببيانات لا بالدرجة وحدها؟"},{"id":"1-4-1-7-B01-A02","b":"بناء خطة التحسين","a":"حدد البرامج والإجراءات والموارد والأدوار والجدول","o":"خطة تحسين مكتملة","c":"هل لكل فجوة تدخل ومخرج ومسؤول ووقت؟"},{"id":"1-4-1-7-B01-A03","b":"بناء خطة التحسين","a":"راجع اتساق المعالجة وارفع الخطة للاعتماد المخول","o":"خطة ومرجع اعتماد","c":"هل يعالج التدخل السبب لا العرض فقط؟"},{"id":"1-4-1-7-B02-A01","b":"تنفيذ التحسين وقياس الأثر","a":"نفذ البرامج بطرق متنوعة ومناسبة للمشكلة","o":"مخرجات تدخل فعلية","c":"هل نفذ التدخل للفئة وبالجودة المقصودتين؟"},{"id":"1-4-1-7-B02-A02","b":"تنفيذ التحسين وقياس الأثر","a":"تابع التنفيذ وحدد التحديات وعالجها","o":"موقف تنفيذ ومعالجة عوائق","c":"هل أزالت المعالجة سبب تعطل الخطة؟"},{"id":"1-4-1-7-B02-A03","b":"تنفيذ التحسين وقياس الأثر","a":"قوّم الأثر دوريًا وحسن أساليب التدخل","o":"مقارنة نتيجة وقرار تحسين","c":"هل انخفضت الفجوة المستهدفة؟"}]},{"ref":"1-5-1-1","text":"تلتزم المدرسة بالمحافظة على حقوق المتعلمين، وحمايتهم.","standard":"حقوق المتعلم وحمايته","standard_ref":"1-5","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["صون الحقوق والإتاحة","الحماية والاستجابة للحالات"],"actions":[{"id":"1-5-1-1-B01-A01","b":"صون الحقوق والإتاحة","a":"حدد الحقوق والمرجع المنطبق وقنوات المسؤولية","o":"مرجع حقوق وقنوات مخولة","c":"هل يعرف المسؤول ما يقع ضمن اختصاصه؟"},{"id":"1-5-1-1-B01-A02","b":"صون الحقوق والإتاحة","a":"راجع إتاحة فرص التعلم والخدمات وعدالة التعامل","o":"عوائق وحقوق تحتاج معالجة","c":"هل توجد فئة مستبعدة أو خدمة غير متاحة؟"},{"id":"1-5-1-1-B01-A03","b":"صون الحقوق والإتاحة","a":"وضح للطلاب كيفية طلب المساعدة بأمان","o":"قنوات مفهومة للمساعدة","c":"هل يستطيع الطالب استخدام القناة؟"},{"id":"1-5-1-1-B02-A01","b":"الحماية والاستجابة للحالات","a":"تحقق من إجراءات الرصد والإبلاغ والإحالة المعتمدة قبل تطبيقها، واعتمد مسارًا واحدًا يخدم أيضًا حالات التنمر في 1-5-1-2","o":"مسار استجابة متحقق","c":"هل المصدر والإجراء والجهة المخولة محددون، وهل يستخدم 1-5-1-2 المسار نفسه؟"},{"id":"1-5-1-1-B02-A02","b":"الحماية والاستجابة للحالات","a":"تعامل مع الحالة عبر المختص واحفظ الحد الضروري من البيانات","o":"إجراء حماية موثق ومقيد","c":"هل تمت الإحالة عبر القناة المخولة؟"},{"id":"1-5-1-1-B02-A03","b":"الحماية والاستجابة للحالات","a":"تابع تنفيذ المعالجة المخولة واستمرار أمان المتعلم","o":"متابعة حالة وفق الدور","c":"هل بقي خطر أو حاجة دعم؟"}]},{"ref":"1-5-1-2","text":"توفر المدرسة مناخًا آمنًا للتعلم والنمو نفسيًا واجتماعيًا.","standard":"حقوق المتعلم وحمايته","standard_ref":"1-5","domain":"الإدارة المدرسية","kind":"عمل مدرسي","branches":["الوقاية وبناء علاقات آمنة (ومنها مكافحة التنمر)","الكشف المبكر والتعامل المخول"],"actions":[{"id":"1-5-1-2-B01-A01","b":"الوقاية وبناء علاقات آمنة (ومنها مكافحة التنمر)","a":"صمم برامج وقائية متنوعة ومستمرة ضد التنمر","o":"خطة وقاية وأنشطة","c":"هل تستمر الوقاية وتشمل الفئات؟"},{"id":"1-5-1-2-B01-A02","b":"الوقاية وبناء علاقات آمنة (ومنها مكافحة التنمر)","a":"نفذ مواقف حوار وتقبل رأي وتعاون واحترام","o":"مواقف ممارسة وعلاقات إيجابية","c":"هل يشارك الطلاب دون خوف من السخرية؟"},{"id":"1-5-1-2-B01-A03","b":"الوقاية وبناء علاقات آمنة (ومنها مكافحة التنمر)","a":"راجع شعور الطلاب بالأمان وتطور العلاقات بأداة رأي أو مقابلة مناسبة للمرحلة، في مواقف اليوم المدرسي لا البرامج وحدها","o":"ملاحظات أمان وعلاقات","c":"هل تبين المراجعة تحسن البيئة اليومية؟"},{"id":"1-5-1-2-B02-A01","b":"الكشف المبكر والتعامل المخول","a":"أتح وسائل استباقية وآمنة للكشف عن التنمر","o":"رصد وقنوات مساعدة","c":"هل تتاح القناة لمن يخشى الإبلاغ؟"},{"id":"1-5-1-2-B02-A02","b":"الكشف المبكر والتعامل المخول","a":"تحقق من الملاحظات وفعّل الاستجابة عبر المسار المعتمد المشترك مع 1-5-1-1","o":"حالة متحققة واستجابة","c":"هل جرى التحقق والحماية ضمن الصلاحية؟"},{"id":"1-5-1-2-B02-A03","b":"الكشف المبكر والتعامل المخول","a":"تابع تكرار الحالة واستمرار أمان الطالب المتأثر بعد الاستجابة","o":"متابعة حالة وحاجات دعم","c":"هل زال التعثر أم انتقل إلى موقف آخر؟"}]},{"ref":"2-1-1-1","text":"توفر المدرسة فرصًا متكافئة للتعلم تلبي احتياجات المتعلمين، ومنهم ذوو الإعاقة والموهوبون.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["إتاحة التعلم بحسب الاحتياج"],"actions":[{"id":"2-1-1-1-B01-A01","b":"إتاحة التعلم بحسب الاحتياج","a":"حدد احتياجات التعلم وعوائق المشاركة ومنها احتياجات ذوي الإعاقة والموهوبين","o":"احتياجات وعوائق محددة","c":"هل تستند الحاجة إلى أداء وملاحظة مناسبة؟"},{"id":"2-1-1-1-B01-A02","b":"إتاحة التعلم بحسب الاحتياج","a":"كيّف المهمة والمصدر والوقت أو الدعم بحسب الحاجة","o":"تصميم تعلم مكيّف","c":"هل يبقى هدف التعلم واضحًا مع التكييف؟"},{"id":"2-1-1-1-B01-A03","b":"إتاحة التعلم بحسب الاحتياج","a":"نفذ فرص التعلم ووزّع فرص المناقشة واستخدام مصادر التعلم بإنصاف، وراقب مشاركة الفئات","o":"أعمال ومشاركة فعلية موزعة","c":"هل ينجز كل متعلم عملًا مناسبًا له، وتتوزع فرص المناقشة والمصادر على الفئات؟"},{"id":"2-1-1-1-B01-A05","b":"إتاحة التعلم بحسب الاحتياج","a":"أدر وقت التعلم لصالح المهمة وتلبية احتياجات الفئات","o":"زمن تعلم موزع على المهمة","c":"هل يذهب معظم وقت الموقف إلى التعلم، وتحصل الفئات على وقت مناسب لحاجتها؟"},{"id":"2-1-1-1-B01-A04","b":"إتاحة التعلم بحسب الاحتياج","a":"راجع تقدم الفئات وعدل الدعم","o":"تقدم ومراجعة تكييف","c":"هل تحققت فرصة تعلم ونتيجة قابلة للفحص؟"}]},{"ref":"2-1-1-2","text":"تدعم المدرسة تنفيذ المناهج بما يحقق نواتج التعلم المستهدفة.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["دعم محتوى المنهج","متابعة تنفيذ المناهج"],"actions":[{"id":"2-1-1-2-B01-A01","b":"دعم محتوى المنهج","a":"اربط موضوعات المنهج بنواتج المعرفة والمهارة والقيمة","o":"خريطة تغطية النواتج","c":"هل توجد موضوعات أو نواتج بلا دعم؟"},{"id":"2-1-1-2-B01-A02","b":"دعم محتوى المنهج","a":"وفر أنشطة ومصادر متنوعة ومحفزة لكل ناتج","o":"مصادر ومهام تعلم مرتبطة","c":"هل النشاط ينمي الناتج المقصود؟"},{"id":"2-1-1-2-B01-A03","b":"دعم محتوى المنهج","a":"افحص أعمال الطلاب للتحقق من اكتساب المعرفة والمهارة والقيم","o":"أعمال ونتائج تعلم","c":"هل يظهر التعلم في أداء الطالب؟"},{"id":"2-1-1-2-B02-A01","b":"متابعة تنفيذ المناهج","a":"تابع تنفيذ المنهج وفق الخطط الدراسية المعتمدة وبوسائل متنوعة","o":"موقف تنفيذ منهج","c":"هل البيانات تعكس التنفيذ لا إعداد الدرس فقط؟"},{"id":"2-1-1-2-B02-A02","b":"متابعة تنفيذ المناهج","a":"حدد تحديات التنفيذ وصمم بدائل للحالات الطارئة","o":"تحديات وبدائل مخولة","c":"هل البديل يحافظ على نواتج التعلم؟"},{"id":"2-1-1-2-B02-A03","b":"متابعة تنفيذ المناهج","a":"عالج عدم الالتزام عبر الإجراء المخول وراجع استعادة المسار","o":"معالجة وموقف محدث","c":"هل استعيد تنفيذ المنهج؟"}]},{"ref":"2-1-1-3","text":"تنوع المدرسة في إستراتيجيات التعليم والتعلم؛ لتلبية احتياجات المتعلمين، ودعم تعلمهم.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["تنويع التعليم وفق الحاجة"],"actions":[{"id":"2-1-1-3-B01-A01","b":"تنويع التعليم وفق الحاجة","a":"حلل ناتج التعلم ومستويات الطلاب والعائق في التعلم","o":"حاجة تعليمية محددة","c":"هل تعرف ما الذي يحتاج الطالب تعلمه ولماذا تعثر؟"},{"id":"2-1-1-3-B01-A02","b":"تنويع التعليم وفق الحاجة","a":"اختر استراتيجيات متنوعة تلائم الحاجة وصمم مشاركة الطلاب","o":"تصميم درس واستراتيجية مبررة","c":"هل اختيار الطريقة مبرر بالناتج والفئة؟"},{"id":"2-1-1-3-B01-A03","b":"تنويع التعليم وفق الحاجة","a":"نفذ الاستراتيجيات وافحص أعمال الطلاب والمشاركة","o":"أعمال وملاحظة تنفيذ","c":"هل تعلمت الفئات المستهدفة؟"},{"id":"2-1-1-3-B01-A04","b":"تنويع التعليم وفق الحاجة","a":"قارن النتائج وحسن اختيار الطريقة","o":"مراجعة فاعلية","c":"هل ظهرت فائدة يمكن تفسيرها؟"}]},{"ref":"2-1-1-4","text":"تفعل المدرسة التقنية الرقمية؛ لدعم تعلم المتعلمين وتلبية احتياجاتهم.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["توظيف التقنية الرقمية في التعلم مع المهارات اللازمة لها"],"actions":[{"id":"2-1-1-4-B01-A01","b":"توظيف التقنية الرقمية في التعلم مع المهارات اللازمة لها","a":"حدد حاجة تعلم تستفيد من التقنية الرقمية، وافحص وصول الطلاب إليها، وحدد المهارات الرقمية التي تتطلبها المهمة ومن يُعرف مسبقًا أنه يحتاجها","o":"حاجة وخطة إتاحة ومهارات لازمة","c":"هل تحل التقنية عائقًا أو تحسن التعلم؟ وهل حُددت المهارات الرقمية اللازمة والحاجة المعروفة مسبقًا؟"},{"id":"2-1-1-4-B01-A05","b":"توظيف التقنية الرقمية في التعلم مع المهارات اللازمة لها","a":"درّب الطلاب الذين عُرفت حاجتهم على المهارة الرقمية اللازمة قبل بدء المهمة","o":"استعداد مهاري قبل المهمة","c":"هل يملك الطلاب المحتاجون المهارة اللازمة عند بدء المهمة؟"},{"id":"2-1-1-4-B01-A02","b":"توظيف التقنية الرقمية في التعلم مع المهارات اللازمة لها","a":"صمم ونفذ مهمة تعلم توظف التقنية الرقمية لخدمة الحاجة المحددة، مع بديل للفئة المتعذر وصولها، وادمج التعلم الصفي والإلكتروني بحسب ما يتطلبه الموقف التعليمي","o":"مهمة وأعمال متعلمين","c":"هل يستطيع المستهدف إتمام المهمة؟ وهل خدمت التقنية الموقف التعليمي بدل أن تنفصل عنه؟"},{"id":"2-1-1-4-B01-A04","b":"توظيف التقنية الرقمية في التعلم مع المهارات اللازمة لها","a":"إن ظهرت أثناء المهمة فجوة مهارة رقمية تعطلها فقدّم دعمًا أو تدريبًا قصيرًا عند ظهورها داخل الموقف نفسه","o":"مهارة لازمة يمارسها الطالب بنفسه","c":"هل أتم الطالب المهمة مستخدمًا المهارة بنفسه بعد الدعم؟"},{"id":"2-1-1-4-B01-A03","b":"توظيف التقنية الرقمية في التعلم مع المهارات اللازمة لها","a":"افحص أثر المهمة على الناتج المستهدف","o":"نتيجة تعلم ومراجعة","c":"هل الدليل أداء تعلم لا مجرد استخدام؟"}]},{"ref":"2-1-1-5","text":"تنفذ المدرسة أنشطة تعلم تطبيقية ترتبط بحياة المتعلمين.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["التطبيق في سياق حياتي"],"actions":[{"id":"2-1-1-5-B01-A01","b":"التطبيق في سياق حياتي","a":"حدد ناتج تعلم وسياقًا حياتيًا مناسبًا للطلاب","o":"ناتج وسياق تطبيق","c":"هل يتطلب السياق استعمال المعرفة فعلًا؟"},{"id":"2-1-1-5-B01-A02","b":"التطبيق في سياق حياتي","a":"صمم مهمة تتطلب أداءً وتفسيرًا وجهز الموارد والإتاحة","o":"مهمة ومحكات فحص مناسبة","c":"هل المهمة ملائمة للعمر والاحتياج؟"},{"id":"2-1-1-5-B01-A03","b":"التطبيق في سياق حياتي","a":"نفذ التطبيق واجمع أداء الطلاب وتفسيراتهم","o":"منتج وتفسير متعلم","c":"هل يستطيع الطالب شرح لماذا اختار هذا الحل؟"},{"id":"2-1-1-5-B01-A04","b":"التطبيق في سياق حياتي","a":"راجع نقل التعلم إلى موقف مشابه","o":"تطبيق لاحق ونتيجة","c":"هل ينتقل الأداء إلى موقف جديد؟"}]},{"ref":"2-1-1-6","text":"تنمي المدرسة المهارات القرائية والعددية الأساسية لدى المتعلمين.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["القراءة والكتابة","المهارات العددية"],"actions":[{"id":"2-1-1-6-B01-A01","b":"القراءة والكتابة","a":"افحص مهارات القراءة والكتابة وحدد الحاجة العلاجية والإثرائية","o":"ملف مهارات وأداء بداية","c":"هل يحدد التشخيص المهارة لا الدرجة العامة فقط؟"},{"id":"2-1-1-6-B01-A02","b":"القراءة والكتابة","a":"وفر أنشطة ومصادر لتنمية المهارات الأساسية","o":"مهمات قراءة وكتابة وأعمال","c":"هل يمارس الطلاب المهارة المقصودة؟"},{"id":"2-1-1-6-B01-A03","b":"القراءة والكتابة","a":"نفذ خطة علاجية للمتعثرين وإثراء للمتقدمين","o":"تدخلات بحسب المستوى","c":"هل لكل فئة مهمة تناسب حاجتها؟"},{"id":"2-1-1-6-B01-A04","b":"القراءة والكتابة","a":"افحص تقدم المهارة وعدل المسار","o":"مقارنة أداء مهاري","c":"هل تحسنت المهارة بعد التدخل؟"},{"id":"2-1-1-6-B02-A01","b":"المهارات العددية","a":"افحص المفاهيم والعمليات العددية وحدد أنماط الخطأ","o":"تشخيص عددي محدد","c":"هل تستطيع تفسير الخطأ المتكرر؟"},{"id":"2-1-1-6-B02-A02","b":"المهارات العددية","a":"وفر أنشطة ومصادر تنمي المهارات العددية","o":"تمثيلات ومهمات عددية","c":"هل يظهر فهم المفهوم في الأداء؟"},{"id":"2-1-1-6-B02-A03","b":"المهارات العددية","a":"نفذ علاجًا للأخطاء وإثراءً للمهارات المتقدمة","o":"تدخل وعدد من أعمال الطلاب","c":"هل يتصل التدخل بالمهارة المشخصة؟"},{"id":"2-1-1-6-B02-A04","b":"المهارات العددية","a":"أعد فحص المهارة وراجع الاستجابة","o":"تقدم عددي وقرار لاحق","c":"هل انتقل الفهم لمهمة جديدة؟"}]},{"ref":"2-1-1-7","text":"تنمي المدرسة مهارات التفكير والبحث والابتكار لدى المتعلمين.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["التفكير الناقد وحل المشكلات","الإبداع والابتكار","البحث المنظم"],"actions":[{"id":"2-1-1-7-B01-A01","b":"التفكير الناقد وحل المشكلات","a":"صمم مهمات للتحليل والاستنتاج والتقويم وحل مشكلة","o":"مهمات ومحكات تفسير","c":"هل تحتاج المهمة تعليلًا لا استرجاعًا فقط؟"},{"id":"2-1-1-7-B01-A02","b":"التفكير الناقد وحل المشكلات","a":"نفذ مصادر وأنشطة متنوعة واطلب تبرير الحل بالأدلة","o":"حلول وتفسيرات طلاب","c":"هل يميز الطالب الدليل من الرأي؟"},{"id":"2-1-1-7-B01-A03","b":"التفكير الناقد وحل المشكلات","a":"راجع جودة التفكير وتابع تقدمه","o":"مراجعة استدلال وحل","c":"هل يتحسن التعليل في موقف جديد؟"},{"id":"2-1-1-7-B02-A01","b":"الإبداع والابتكار","a":"صمم أنشطة لتنمية الطلاقة والمرونة والأصالة","o":"مهمات توليد وتطوير أفكار","c":"هل تتاح بدائل متعددة للطالب؟"},{"id":"2-1-1-7-B02-A02","b":"الإبداع والابتكار","a":"نفذ إثراء صفيًا وغير صفي وجرب الأفكار وطورها","o":"أفكار ونماذج ومحاولات","c":"هل يفسر الطالب ما طوره ولماذا؟"},{"id":"2-1-1-7-B02-A03","b":"الإبداع والابتكار","a":"تابع التنفيذ وراجع جودة الفكرة وفائدتها","o":"مراجعة فكرة وتعديل","c":"هل يتجاوز الادعاء بالإبداع شكل المنتج؟"},{"id":"2-1-1-7-B03-A01","b":"البحث المنظم","a":"حدد سؤال بحث مناسبًا ونوع المعلومات اللازمة","o":"سؤال وخطة بحث","c":"هل السؤال قابل للبحث في نطاق الطالب؟"},{"id":"2-1-1-7-B03-A02","b":"البحث المنظم","a":"درب الطلاب على اختيار مصادر وفحصها وتنظيم ما وجدوه","o":"مصادر وملاحظات بحث","c":"هل تميز المصادر المناسبة من غيرها؟"},{"id":"2-1-1-7-B03-A03","b":"البحث المنظم","a":"اطلب نتيجة مبررة وراجع طريقة الوصول إليها","o":"تفسير مستند إلى البحث","c":"هل تتصل النتيجة بالسؤال والأدلة؟"}]},{"ref":"2-1-1-8","text":"تنمي المدرسة المهارات العاطفية والاجتماعية لدى المتعلمين.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["فهم المشاعر وتنظيم الاستجابة","التواصل والتعاون الاجتماعي"],"actions":[{"id":"2-1-1-8-B01-A01","b":"فهم المشاعر وتنظيم الاستجابة","a":"حدد مواقف تعلم تحتاج تسمية المشاعر وتنظيم الاستجابة","o":"احتياجات ومواقف تربوية","c":"هل الوصف سلوك ملاحظ دون تشخيص؟"},{"id":"2-1-1-8-B01-A02","b":"فهم المشاعر وتنظيم الاستجابة","a":"نفذ تدريبًا عمليًا على التعبير والاستجابة المناسبة","o":"مواقف تدريب وممارسة","c":"هل يستطيع الطالب اختيار استجابة مناسبة؟"},{"id":"2-1-1-8-B01-A03","b":"فهم المشاعر وتنظيم الاستجابة","a":"راجع انتقال الممارسة إلى اليوم المدرسي","o":"ملاحظات ممارسة لاحقة","c":"هل تظهر المهارة خارج التدريب؟"},{"id":"2-1-1-8-B02-A01","b":"التواصل والتعاون الاجتماعي","a":"حدد مهارات الإصغاء والحوار والتعاون المناسبة للمرحلة","o":"أهداف اجتماعية محددة","c":"هل الهدف قابل للملاحظة في الصف؟"},{"id":"2-1-1-8-B02-A02","b":"التواصل والتعاون الاجتماعي","a":"نفذ مواقف جماعية تتطلب ممارسة المهارات","o":"مشاركات وأعمال تعاونية","c":"هل يشارك الطلاب ويتبادلون الأدوار؟"},{"id":"2-1-1-8-B02-A03","b":"التواصل والتعاون الاجتماعي","a":"راجع الممارسة مع الطلاب وقدم تغذية راجعة","o":"تحسين تواصل وتعاون","c":"هل يستفيد الطالب من الملاحظة في موقف تال؟"}]},{"ref":"2-1-1-9","text":"تعزز المدرسة دافعية المتعلمين للتعلم، والاستمتاع به.","standard":"بناء خبرات التعلم","standard_ref":"2-1","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["الدافعية والاستمتاع بالتعلم"],"actions":[{"id":"2-1-1-9-B01-A01","b":"الدافعية والاستمتاع بالتعلم","a":"افحص أسباب ضعف المشاركة من الطلاب وأعمالهم وملاحظات التعلم","o":"عوائق دافعية محددة","c":"هل السبب فهم المهمة أم صعوبتها أم ضعف المعنى؟"},{"id":"2-1-1-9-B01-A02","b":"الدافعية والاستمتاع بالتعلم","a":"صمم مهمات ذات معنى وتحد مناسب وفرص اختيار ودعم","o":"مهمة ملائمة ومحفزة","c":"هل يستطيع الطالب النجاح مع جهد مناسب؟"},{"id":"2-1-1-9-B01-A03","b":"الدافعية والاستمتاع بالتعلم","a":"نفذ المهمة وقدم تغذية راجعة تشجع التقدم","o":"مشاركة وأعمال تعلم","c":"هل تستمر المشاركة بعد الحافز المباشر؟"},{"id":"2-1-1-9-B01-A04","b":"الدافعية والاستمتاع بالتعلم","a":"راجع استجابة الفئات وعدل التجربة","o":"مراجعة مشاركة ودافعية","c":"هل زادت المشاركة مع تعلم فعلي؟"}]},{"ref":"2-2-1-1","text":"تطبق المدرسة أساليب وأدوات تقويم متنوعة؛ للكشف عن مستويات أداء المتعلمين المختلفة.","standard":"تقويم التعلم","standard_ref":"2-2","domain":"التعليم والتعلم","kind":"عمل مدرسي","branches":["التقويم التشخيصي","التقويم البنائي والتمايز","التقويم الختامي"],"actions":[{"id":"2-2-1-1-B01-A01","b":"التقويم التشخيصي","a":"حدد مهارات البداية واستخدم أداة تشخيص مناسبة","o":"أداة ونتائج بداية","c":"هل تكشف الأداة مستويات مختلفة؟"},{"id":"2-2-1-1-B01-A02","b":"التقويم التشخيصي","a":"فسر الأداء وحدد حاجة كل فئة","o":"مجموعات احتياج مرنة","c":"هل التصنيف ناتج عن أداء حقيقي؟"},{"id":"2-2-1-1-B01-A03","b":"التقويم التشخيصي","a":"استخدم النتائج في تصميم الدعم","o":"تعديلات خطة تعلم","c":"هل تغير التدريس بحسب التشخيص؟"},{"id":"2-2-1-1-B02-A01","b":"التقويم البنائي والتمايز","a":"درّب المعلمين على أدوات التقويم المتنوعة وفق احتياجهم، بما يخدم التشخيص والبناء والختام","o":"أدوات ومحكات مفهومة","c":"هل يستطيع المعلم اختيار أداة مناسبة للناتج والفئة وتطبيقها؟"},{"id":"2-2-1-1-B02-A02","b":"التقويم البنائي والتمايز","a":"طبق حسب الحاجة تقويمًا ذاتيًا وأقرانًا ومهمات مفتوحة وأدائية ومشروعات وملفات إنجاز","o":"أداء متنوع وملاحظات","c":"هل تكشف الأدوات ما يعرفه الطالب وما يحتاجه؟"},{"id":"2-2-1-1-B02-A03","b":"التقويم البنائي والتمايز","a":"قدم دعمًا وعدل التدريس أثناء التعلم","o":"استجابة تدريسية ونتيجة لاحقة","c":"هل استُخدمت النتيجة قبل نهاية التعلم؟"},{"id":"2-2-1-1-B03-A01","b":"التقويم الختامي","a":"صمم أداة ختامية مرتبطة بالنواتج ومحكاتها","o":"أداة ختامية مناسبة","c":"هل تغطي النواتج المستهدفة؟"},{"id":"2-2-1-1-B03-A02","b":"التقويم الختامي","a":"طبق الأداة وافحص الأداء وفق المحكات","o":"نتائج ختامية مفسرة","c":"هل تطبيق المحك متسق؟"},{"id":"2-2-1-1-B03-A03","b":"التقويم الختامي","a":"حدد ما تحقق وما يحتاج دعمًا في الدورة التالية","o":"نتيجة وتوصية تعلم لاحقة","c":"هل التوصية مرتبطة بمهارة محددة؟"}]},{"ref":"2-2-1-2","text":"تطبق المدرسة أساليب وأدوات متنوعة؛ لتقويم نواتج ال
